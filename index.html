ゃい。","おかえりなさい。"],"Jawaban untuk rekan yang pulang duluan."],["ここで たばこを 吸っても いいですか。",["すみません、ここは 禁煙なんです。","はい、吸わないで ください。","いいえ、どうぞ。"],"Menolak sopan karena dilarang merokok."],["田中さん、来週の 会議に 出られますか。",["はい、出られます。","はい、出かけます。","はい、出しました。"],"出られる = bisa hadir."],["窓、開けましょうか。",["あ、お願いします。","いいえ、開けて ください。","はい、開けました。"],"Menerima tawaran: お願いします."],["この ケーキ、手作りなんですよ。",["へえ、上手ですね。","ええ、いただきました。","じゃ、作って ください。"],"Memuji kue buatan sendiri."],["もう 晩ご飯 食べた？",["ううん、まだ。","うん、食べよう。","ううん、食べたよ。"],"Belum makan: ううん、まだ。"],["道が 込んでて、少し 遅れそうです。",["わかりました。気を つけて 来て ください。","はい、早く 来ました。","いいえ、込んで いません。"],"Menanggapi kabar terlambat."]]}]},{"id":"n3","title":"JLPT N3","pass_":95,"groups":[{"key":"lang","label":"Pengetahuan Bahasa (huruf, kosakata, tata bahasa)","max":60,"min":19},{"key":"read","label":"Membaca","max":60,"min":19},{"key":"listen","label":"Mendengarkan","max":60,"min":19}],"secs":[{"key":"moji","jp":"言語知識（文字・語彙）","id":"Huruf & Kosakata","min":30},{"key":"bunpo","jp":"言語知識（文法）・読解","id":"Tata Bahasa & Membaca","min":70},{"key":"choukai","jp":"聴解","id":"Mendengarkan","min":40}],"parts":[{"key":"kr","kind":"kr","sec":"moji","group":"lang","n":6,"jp":"＿＿のことばの読み方として最もよいものを、1・2・3・4から一つえらびなさい。","id":"Cara baca kanji (漢字読み)","bank":[["部屋の【温度】を下げてください。","おんど","Tolong turunkan suhu kamar."],["来月から新しい【規則】ができる。","きそく","Bulan depan ada peraturan baru."],["私はその計画には【反対】です。","はんたい","Saya menentang rencana itu."],["会議の時間を【確認】しました。","かくにん","Saya sudah mengonfirmasi waktu rapat."],["彼は【責任】のある仕事をしている。","せきにん","Dia melakukan pekerjaan yang penuh tanggung jawab."],["【現在】の状況を説明します。","げんざい","Saya jelaskan situasi saat ini."],["道で財布を【拾った】。","ひろった","Saya memungut dompet di jalan."],["大切なところに【線】を引いてください。","せん","Tarik garis di bagian penting."],["アルバイトの【募集】は来週までです。","ぼしゅう","Rekrutmen kerja paruh waktu sampai minggu depan."],["年を取ると【記憶】が弱くなる。","きおく","Saat menua, ingatan melemah."],["申込書に名前を【記入】してください。","きにゅう","Isi nama di formulir pendaftaran."],["【栄養】のある物を食べなさい。","えいよう","Makanlah makanan bergizi."],["私は彼の意見に【賛成】です。","さんせい","Saya setuju dengan pendapatnya."],["毎朝、新聞を【配達】している。","はいたつ","Setiap pagi saya mengantar koran."],["この島は【自然】が豊かだ。","しぜん","Pulau ini kaya akan alam."],["雨で試合が【延期】された。","えんき","Pertandingan ditunda karena hujan."]]},{"key":"hym","kind":"mc","sec":"moji","group":"lang","n":4,"jp":"＿＿のことばを漢字で書くとき、最もよいものを、1・2・3・4から一つえらびなさい。","id":"Penulisan kanji/katakana (表記)","bank":[["電車の中で【さいふ】をなくした。",["財布","才布","財希","材布"],"さいふ = 財布."],["昨日、大きな【じしん】があった。",["地震","地振","池震","地辰"],"じしん = 地震."],["試験の結果を家族に【しらせる】。",["知らせる","報らせる","知せる","印らせる"],"しらせる = 知らせる."],["旅行の【けいかく】を立てる。",["計画","計絵","計回","軽画"],"けいかく = 計画."],["机の上を【かたづけ】なさい。",["片付け","方付け","片村け","方村け"],"かたづける = 片付ける."],["自分の気持ちを【つたえる】。",["伝える","云える","転える","仁える"],"つたえる = 伝える."],["レジで料金を【はらう】。",["払う","仏う","抜う","拡う"],"はらう = 払う."],["悪い【しゅうかん】を変える。",["習慣","週間","習貫","集慣"],"しゅうかん (kebiasaan) = 習慣; 週間 = minggu (lain arti)."]]},{"key":"ctx","kind":"mc","sec":"moji","group":"lang","n":5,"jp":"（　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","id":"Kata yang sesuai konteks (文脈規定)","bank":[["天気予報によると、明日は雨が降る（　）が高いそうだ。",["可能性","予定","準備","状況"],"可能性が高い = kemungkinan besar."],["疲れたので、少し（　）を取ろう。",["休憩","安心","用意","我慢"],"休憩を取る = beristirahat sejenak."],["この薬はよく（　）ので、すぐに治った。",["効いた","治った","直した","助けた"],"薬が効く = obat manjur."],["彼女はいつも（　）笑っていて、感じがいい。",["にこにこ","いらいら","どきどき","ぐっすり"],"にこにこ = tersenyum ramah."],["会議が長引いて、約束の時間に（　）しまった。",["遅れて","過ぎて","離れて","外れて"],"時間に遅れる = terlambat."],["子どものころの写真を見て、（　）気持ちになった。",["なつかしい","くわしい","あやしい","まずしい"],"なつかしい = rindu masa lalu."],["先輩に仕事のやり方を（　）してもらった。",["アドバイス","キャンセル","スタート","サイン"],"アドバイスしてもらう = mendapat saran."],["彼は一度した約束を必ず（　）人だ。",["守る","決める","預ける","届ける"],"約束を守る = menepati janji."],["事故で電車が（　）している。",["ストップ","スピード","セット","サイン"],"電車がストップする = kereta berhenti."],["引っ越しの荷物を段ボール箱に（　）。",["詰めた","締めた","閉めた","詰まった"],"箱に詰める = memasukkan ke kotak."],["約束の時間に（　）ように、早めに家を出た。",["間に合う","間違う","似合う","話し合う"],"間に合う = keburu/tepat waktu."],["来週の旅行が楽しみで、（　）している。",["わくわく","がっかり","いらいら","ぐったり"],"わくわく = tidak sabar/bersemangat."]]},{"key":"para","kind":"mc","sec":"moji","group":"lang","n":3,"jp":"＿＿のことばに意味が最も近いものを、1・2・3・4から一つえらびなさい。","id":"Makna sepadan (言い換え類義)","bank":[["【あらゆる】方法を試してみた。",["すべての","いくつかの","新しい","簡単な"],"あらゆる = segala/semua."],["彼は横になると【たちまち】寝てしまった。",["すぐに","ゆっくり","やっと","しばらく"],"たちまち = seketika."],["この仕事は【きつい】。",["大変だ","楽だ","楽しい","つまらない"],"きつい = berat/melelahkan."],["【ようやく】作品が完成した。",["やっと","すぐに","もう","また"],"ようやく = akhirnya."],["試験の結果に【がっかりした】。",["残念に思った","うれしく思った","驚いた","安心した"],"がっかりする = kecewa."],["【さっそく】始めましょう。",["すぐに","ゆっくり","明日","いっしょに"],"さっそく = segera."],["彼は【だまって】部屋を出て行った。",["何も言わずに","急いで","泣きながら","笑いながら"],"だまって = tanpa bicara."],["この店は【いつも】込んでいる。",["常に","たまに","最近","ときどき"],"いつも = 常に."]]},{"key":"use","kind":"use","sec":"moji","group":"lang","n":3,"jp":"つぎのことばの使い方として最もよいものを、1・2・3・4から一つえらびなさい。","id":"Penggunaan kata yang benar (用法)","bank":[["中止",["雨のため、運動会は中止になった。","彼は中止して走った。","信号が赤なので車が中止した。","時計が中止している。"],"中止 = pembatalan acara."],["片付ける",["食事のあと、テーブルを片付けた。","部屋に新しい机を片付けた。","友だちに手紙を片付けた。","毎朝ジョギングを片付けている。"],"片付ける = membereskan."],["夢中",["弟はゲームに夢中で、話しかけても返事をしない。","この店のケーキは夢中だ。","昨日は夢中な天気だった。","彼は夢中に背が高い。"],"〜に夢中 = asyik/terlalu tenggelam dalam ..."],["余る",["パーティーの料理がたくさん余った。","雨が余って道がぬれている。","彼は毎日余って勉強している。","電車が余って遅れた。"],"余る = tersisa."],["慌てる",["寝坊して、慌てて家を出た。","この料理は慌てておいしい。","慌てた天気が続いている。","静かに慌ててください。"],"慌てる = terburu-buru panik."],["通り過ぎる",["話に夢中になって、降りる駅を通り過ぎてしまった。","試験に通り過ぎた。","毎日学校に通り過ぎている。","彼の話を通り過ぎて聞いた。"],"通り過ぎる = terlewat."]]},{"key":"gram","kind":"mc","sec":"bunpo","group":"lang","n":8,"jp":"つぎの文の（　）に入れるのに最もよいものを、1・2・3・4から一つえらびなさい。","id":"Bentuk tata bahasa (文法形式の判断)","bank":[["こんな問題は子ども（　）できる。",["でも","しか","まで","ほど"],"〜でも = bahkan ... pun."],["彼が来る（　）、パーティーは始められない。",["まで","までに","うちに","あいだに"],"〜まで = sampai (keadaan berlanjut)."],["雨が降りそうな（　）、かさを持って行こう。",["ので","のに","けれど","ても"],"〜ので = karena."],["日本に来た（　）は、日本語が全然わからなかった。",["ばかりのころ","ばかりで","あいだ","たびに"],"〜たばかりのころ = saat baru saja ..."],["練習すればする（　）、上手になる。",["ほど","まで","だけ","しか"],"〜ば〜ほど = semakin ..., semakin ..."],["母に頼まれて、買い物に行く（　）。",["ことになった","ようになった","ところだった","はずだった"],"〜ことになる = jadi harus ... (keputusan dari luar)."],["この映画は子ども（　）大人まで楽しめる。",["から","より","ほど","だけ"],"〜から〜まで = dari ... sampai ..."],["彼は忙しい（　）、毎日ジムに通っている。",["のに","ので","から","ため"],"〜のに = padahal."],["先生の（　）、試験に合格できました。",["おかげで","せいで","ために","くせに"],"〜おかげで = berkat ..."],["寝る前に歯をみがく（　）している。",["ように","ために","ところ","はず"],"〜ようにする = membiasakan ..."],["電話をかけよう（　）したら、ちょうど電話が鳴った。",["と","に","で","を"],"〜ようとする = hendak ..."],["新しいスマホを買った（　）、すぐに壊れてしまった。",["ばかりなのに","ところで","うちに","ように"],"〜たばかりなのに = padahal baru saja ..."],["部長によろしくお伝え（　）。",["ください","なさい","いただきます","させます"],"おVください = tolong (hormat)."],["明日晴れればいい（　）。",["のに","のだ","からだ","ためだ"],"〜ばいいのに = semoga saja/seandainya."],["このまま雨が降り（　）、川の水があふれるかもしれない。",["続けると","続けたが","続けるのに","続けても"],"〜と = jika (akibat alami)."],["彼の話によると、山田さんは来月結婚する（　）。",["らしい","みたいな","ような","そうな"],"〜らしい = katanya/sepertinya (dari info)."]]},{"key":"star","kind":"star","sec":"bunpo","group":"lang","n":4,"jp":"つぎの文の ★ に入る最もよいものを、1・2・3・4から一つえらびなさい。","id":"Menyusun kalimat (文の組み立て)","bank":[["彼は",["何を言われても","気に","しない","ような"],"人だ。","Dia orang yang tidak peduli apa pun yang dikatakan orang."],["駅前に",["できた","新しい","レストランは","予約が"],"取れないほど人気がある。","Restoran baru di depan stasiun begitu populer sampai sulit reservasi."],["日本へ",["来て","から","一度も","国に"],"帰っていない。","Sejak datang ke Jepang, saya belum sekali pun pulang ke negara asal."],["母は",["私が","小さい","ころから","ずっと"],"同じ店で働いている。","Ibu bekerja di toko yang sama sejak saya kecil."],["雨が",["降って","いる","のに","彼は"],"かさを持たずに出かけた。","Meski hujan, dia pergi tanpa payung."],["この問題は",["難しすぎて","私には","とても","解けそうに"],"ない。","Soal ini terlalu sulit, sepertinya saya tidak bisa memecahkannya."],["試験に",["合格する","ために","毎日3時間","勉強して"],"いる。","Saya belajar 3 jam setiap hari untuk lulus ujian."],["彼女が",["作った","ケーキは","店で","売って"],"いるものよりおいしい。","Kue buatannya lebih enak daripada yang dijual di toko."]]},{"key":"cloze","kind":"cloze","sec":"bunpo","group":"lang","n":1,"jp":"つぎの文章を読んで、文章全体の内容を考えて、（1）から（3）の中に入る最もよいものを、1・2・3・4から一つえらびなさい。","id":"Tata bahasa dalam teks (文章の文法)","bank":[["私は毎朝、目が覚めるとすぐにスマートフォンを見る。ニュースや天気を確認する（1）、友だちからのメッセージに返事をする。便利だが、気がつくと一時間以上使っていることも（2）。そこで先月から、朝は30分（3）使わないことにした。最初は不安だったが、今は朝の時間に余裕ができて、本を読むようになった。",[["ほか","ため","だけ","うち"],["ある","いる","する","なる"],["しか","さえ","こそ","ばかり"]],"(1) 〜ほか = selain itu. (2) ことがある/もある = kadang terjadi. (3) 〜しか〜ない = hanya ..."],["私の町の図書館は、去年新しくなった。建物が大きくなった（1）、カフェもできた。休みの日には、多くの人が本を読み（2）コーヒーを飲んでいる。私も週末になると、つい足が図書館へ向かってしまう。図書館がこんなに楽しい場所になる（3）、思っていなかった。",[["だけでなく","ばかりに","かわりに","ために"],["ながら","ても","ために","うちに"],["とは","には","のは","ので"]],"(1) 〜だけでなく = tidak hanya. (2) 〜ながら = sambil. (3) 〜とは思わなかった = tidak menyangka."]]},{"key":"short","kind":"read","sec":"bunpo","group":"read","n":2,"jp":"つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","id":"Pemahaman teks pendek (内容理解・短文)","bank":[["社員のみなさんへ\n来月から、会社の食堂の営業時間が変わります。これまでは11時から14時まででしたが、11時半から14時半までになります。また、毎週水曜日は食堂の掃除のため、休みになります。ご協力をお願いします。\n総務部",[["このお知らせで一番伝えたいことは何か。",["食堂が開いている時間が変わること","食堂の料理が変わること","水曜日に食堂を掃除してほしいこと","社員に食堂をもっと使ってほしいこと"],"Inti pengumuman: jam operasional kantin berubah."]]],["最近、「何でもすぐに調べられる」ことが当たり前になった。わからない言葉があれば、スマートフォンで数秒で答えがわかる。しかし、すぐに答えがわかると、自分で考える時間がなくなってしまう。わからないことをしばらく考えてみることも大切なのではないだろうか。",[["筆者が言いたいことは何か。",["すぐに調べないで、自分で考えることも大切だ。","スマートフォンで調べるのはよくない。","わからない言葉はすぐに調べたほうがいい。","考える時間を短くしたほうがいい。"],"Penulis menekankan pentingnya berpikir sendiri dulu."]]],["山本さん\n先日は会議の資料を送っていただき、ありがとうございました。内容を確認しましたが、3ページのグラフの数字が去年のものになっているようです。お手数ですが、今年の数字に直して、金曜日までにもう一度送っていただけますか。\n林",[["林さんが山本さんに頼んでいることは何か。",["グラフの数字を直して送ること","会議の資料を確認すること","去年の資料を送ること","金曜日に会議を開くこと"],"Hayashi meminta angka grafik diperbaiki lalu dikirim ulang."]]],["私は毎日日記を書いている。特別なことがない日でも、その日食べたものや天気だけを書く。何年かたって読み返すと、忘れていた小さな出来事を思い出すことができて楽しい。日記は未来の自分への手紙のようなものだと思う。",[["筆者は日記をどのようなものだと考えているか。",["未来の自分への手紙のようなもの","特別なことを書くためのもの","毎日書かなければならないもの","天気を記録するためのもの"],"日記は未来の自分への手紙."]]]]},{"key":"mid","kind":"read","sec":"bunpo","group":"read","n":1,"jp":"つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","id":"Pemahaman teks sedang (内容理解・中文)","bank":[["日本では、電車の中で電話で話す人はほとんどいない。私が初めて日本に来たとき、電車の中がとても静かなので驚いた。国では、電車の中で大きな声で話すのは普通のことだったからだ。\nある日、国の友だちから電話がかかってきたので、電車の中で小さな声で話した。すると、周りの人が私を見ていることに気がついた。そのとき初めて、日本では電車の中で電話をしないのがマナーだと知った。\n今では私も、電車の中ではメッセージだけを使うようにしている。国に帰ったとき、電車の中がうるさく感じるかもしれない。",[["筆者は日本に来たとき、何に驚いたか。",["電車の中が静かなこと","電車の中で電話をする人が多いこと","電車が時間どおりに来ること","電車の中で寝る人が多いこと"],"Ia terkejut kereta sangat tenang."],["周りの人が筆者を見ていたのはなぜか。",["電車の中で電話で話していたから","大きな声で歌っていたから","外国人だったから","電話が何度も鳴ったから"],"Karena ia menelepon di kereta (melanggar etika)."],["今、筆者は電車の中でどうしているか。",["電話をしないで、メッセージを使っている。","小さな声で電話をしている。","電話をかけてきた人に謝っている。","国の友だちと話している。"],"Sekarang hanya memakai pesan."]]],["私の祖母は80歳だが、去年からスマートフォンを使い始めた。最初は電話をかけることしかできなかったが、孫の私が何度も教えた結果、今では写真をとって家族に送れるようになった。\n祖母が送ってくる写真は、庭の花や近所の猫など、何でもないものが多い。しかし、その写真を見ると、祖母が毎日元気に過ごしていることがわかって安心する。離れて住んでいる家族にとって、スマートフォンは便利な道具というだけでなく、心をつなぐものになっているのだ。",[["祖母は今、スマートフォンで何ができるか。",["写真をとって家族に送ること","電話をかけることだけ","孫に使い方を教えること","近所の人と話すこと"],"Sekarang bisa memotret dan mengirim ke keluarga."],["筆者が祖母の写真を見て安心するのはなぜか。",["祖母が元気に過ごしていることがわかるから","祖母が写真を上手にとれるから","庭の花がきれいだから","祖母がスマートフォンを買ったから"],"Foto menunjukkan nenek sehat dan aktif."]]]]},{"key":"long","kind":"read","sec":"bunpo","group":"read","n":1,"jp":"つぎの文章を読んで、質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","id":"Pemahaman teks panjang (内容理解・長文)","bank":[["最近、「ていねいな暮らし」という言葉をよく聞く。時間をかけて料理を作ったり、季節の花を飾ったりする生活のことだ。忙しい毎日の中で、このような暮らしにあこがれる人が増えているらしい。\n私も以前は、仕事から帰ると疲れてしまい、夕食はコンビニの弁当で済ませることが多かった。しかしあるとき、自分が何を食べたのか思い出せない日が続いていることに気がついた。毎日が同じように過ぎていき、何も残っていないように感じたのだ。\nそこで、週に一度だけ、自分で料理をする日を作ることにした。最初は簡単なみそ汁とご飯だけだったが、作ってみると意外に楽しかった。野菜を切る音や、だしの香りが心を落ち着かせてくれた。\nもちろん、毎日ていねいに暮らすのは難しい。しかし、すべてを完ぺきにしなくてもいいのだと思う。一週間に一度でも、自分のために時間を使えば、生活は少し変わる。大切なのは、無理をしないことではないだろうか。",[["筆者が自分で料理をする日を作ったのはなぜか。",["毎日が同じように過ぎて、何も残らないと感じたから","コンビニの弁当が高くなったから","ていねいな暮らしが流行していたから","料理が上手になりたかったから"],"Hari-hari terasa sama dan tidak berbekas."],["料理をしてみて、筆者はどう感じたか。",["思っていたより楽しく、心が落ち着いた。","時間がかかって疲れた。","毎日作りたいと思った。","簡単な料理はつまらなかった。"],"意外に楽しかった、心を落ち着かせてくれた."],["筆者の考えに合うものはどれか。",["毎日でなくても、自分のための時間を作ることが大切だ。","ていねいな暮らしは毎日続けなければ意味がない。","忙しい人はていねいに暮らすことができない。","料理をすれば生活が完ぺきになる。"],"Tidak perlu sempurna; seminggu sekali pun cukup."]]],["電車で本を読む人が減ったと言われる。確かに、周りを見回すと、ほとんどの人がスマートフォンを見ている。しかし、だからといって人々が文字を読まなくなったわけではない。スマートフォンでニュースを読んだり、友だちのメッセージを読んだりと、むしろ一日に読む文字の量は増えているという調査もある。\n問題は、読み方が変わったことだ。スマートフォンでは、次々に新しい情報が出てくるため、一つの文章をじっくり読むことが少なくなる。短い文を速く読む力はついても、長い文章を最後まで読み、内容を深く考える力は育ちにくい。\n私は、スマートフォンをやめるべきだとは思わない。ただ、一日に少しでも、紙の本や長い記事をゆっくり読む時間を作ってはどうだろうか。速く読む力とじっくり読む力、その両方を持つことが、これからの時代には必要だと思う。",[["筆者によると、スマートフォンの普及で何が変わったか。",["文字の読み方","読む文字の量が減ったこと","本の値段","ニュースの内容"],"Bukan jumlah bacaan, tetapi cara membaca yang berubah."],["筆者が心配していることは何か。",["長い文章を深く考えながら読む力が育ちにくいこと","短い文を速く読めなくなること","人々が電車で寝るようになったこと","ニュースを読む人が減ったこと"],"Kemampuan membaca panjang dan berpikir mendalam melemah."],["筆者の考えに合うものはどれか。",["速く読む力とじっくり読む力の両方が必要だ。","スマートフォンを使うのをやめるべきだ。","紙の本だけを読むべきだ。","長い文章は読まなくてもいい。"],"Keduanya diperlukan."]]]]},{"key":"info","kind":"read","sec":"bunpo","group":"read","n":1,"jp":"つぎのお知らせを読んで、下の質問に答えなさい。答えは、1・2・3・4から最もよいものを一つえらびなさい。","id":"Mencari informasi (情報検索)","bank":[["さくら市スポーツセンター 夏の教室\n① はじめての水泳 ／ 小学生 ／ 土 9:00〜10:00 ／ 2,000円\n② 大人の水泳 ／ 高校生以上 ／ 火・木 19:00〜20:00 ／ 4,000円\n③ ヨガ ／ 16歳以上 ／ 水 10:00〜11:00 ／ 3,000円\n④ テニス ／ 中学生以上 ／ 土 13:00〜15:00 ／ 5,000円\n（料金は1か月分）\n・申し込みは6月20日までに、受付で。\n・2つ以上の教室に申し込むと、合計から1,000円引き。",[["会社員のリーさんは、平日は夜7時半まで仕事がある。リーさんが参加できる教室はどれか。",["④","①","②","③"],"Hari kerja tidak bisa; ① khusus anak SD; tersisa ④ hari Sabtu."],["高校生の妹が②と④に申し込む。1か月にいくら払うか。",["8,000円","9,000円","10,000円","7,000円"],"4.000 + 5.000 − 1.000 = 8.000 yen."]]]]},{"key":"kadai","kind":"listen","sec":"choukai","group":"listen","n":3,"jp":"まず質問を聞いてください。それから話を聞いて、問題用紙の1から4の中から、最もよいものを一つ選んでください。","id":"Memahami tugas (課題理解)","bank":[["会社で女の人と男の人が話しています。男の人はこのあと何をしなければなりませんか。",[["f","田中さん、明日の出張の準備、終わった？"],["m","はい、新幹線の切符はもう買いました。ホテルも予約してあります。"],["f","そう。先方へのおみやげは？"],["m","あ、まだです。"],["f","じゃ、それは私が帰りに買っておくから、田中さんは明日の会議で使う資料を10部コピーしておいてくれる？"],["m","はい、わかりました。"]],"男の人はこのあと何をしなければなりませんか。",["資料をコピーする","おみやげを買う","ホテルを予約する","切符を買う"],"Oleh-oleh dibeli wanita; pria memfotokopi dokumen."],["大学で男の学生と女の学生が話しています。女の学生はこのあとまずどこへ行きますか。",[["m","奨学金の申し込み、もうした？"],["f","まだなの。申込書はどこでもらえるのかな。"],["m","学生課だよ。でも、申込書には先生のサインが必要だから、先に研究室へ行って先生に頼んだほうがいいよ。"],["f","でも、申込書がないとサインしてもらえないよね。"],["m","あ、そうか。"]],"女の学生はこのあとまずどこへ行きますか。",["学生課","研究室","図書館","先生の家"],"Formulir harus diambil dulu di 学生課."],["電話で男の人と女の人が話しています。女の人は何曜日に歯医者へ行きますか。",[["f","もしもし、予約をしたいんですが。"],["m","はい。今週ですと、水曜日の午後か、金曜日の午前中が空いています。"],["f","水曜日は仕事があるので…。金曜日の午前中は何時ですか。"],["m","10時と11時です。"],["f","じゃあ、10時で…あ、すみません、金曜日は会議がありました。来週の月曜日はどうですか。"],["m","月曜日は休みなんです。火曜日の午後3時なら大丈夫です。"],["f","では、それでお願いします。"]],"女の人は何曜日に歯医者へ行きますか。",["火曜日","水曜日","金曜日","月曜日"],"Akhirnya Selasa jam 3 sore."],["料理教室で先生が話しています。学生は手を洗ったあと、最初に何をしますか。",[["f","では、今日はカレーを作ります。まず、手をよく洗ってください。それから野菜を切りますが、その前に、お米を洗ってご飯を炊いておきましょう。ご飯が炊けるまで時間がかかりますからね。"]],"学生は手を洗ったあと、最初に何をしますか。",["お米を洗う","野菜を切る","カレーを作る","ご飯を食べる"],"Sebelum memotong sayur, cuci beras dulu."]]},{"key":"point","kind":"listen","sec":"choukai","group":"listen","n":3,"jp":"まず質問を聞いてください。そのあと、問題用紙のせんたくしを読んでください。それから話を聞いて、問題用紙の1から4の中から、最もよいものを一つ選んでください。","id":"Memahami poin (ポイント理解)","bank":[["男の人と女の人が話しています。女の人が新しい会社を選んだ一番の理由は何ですか。",[["m","新しい会社、どう？給料が上がったんでしょ？"],["f","うん、少しね。でも選んだのはそのためじゃないの。家から近くて、毎日2時間もかかっていた通勤が20分になったのが一番うれしくて。"],["m","それはいいね。"]],"女の人が新しい会社を選んだ一番の理由は何ですか。",["通勤時間が短くなるから","給料が上がるから","仕事が面白いから","休みが多いから"],"Alasan utama: waktu perjalanan jadi 20 menit."],["女の人と男の人が映画について話しています。男の人は映画のどこがよくなかったと言っていますか。",[["f","昨日の映画、どうだった？"],["m","俳優はよかったし、音楽もきれいだったよ。ただ、話が長すぎて、最後のほうはちょっと眠くなったな。"]],"男の人は映画のどこがよくなかったと言っていますか。",["話が長すぎること","俳優","音楽","映像"],"Ceritanya terlalu panjang."],["男の学生と女の学生が話しています。男の学生はどうしてアルバイトをやめましたか。",[["f","コンビニのアルバイト、やめたんだって？店長と合わなかったの？"],["m","いや、店長はいい人だったよ。ただ、来月から研究が忙しくなるから、時間がなくなると思って。"]],"男の学生はどうしてアルバイトをやめましたか。",["研究が忙しくなるから","店長と合わなかったから","給料が安かったから","店が遠かったから"],"Karena penelitian akan sibuk."]]},{"key":"gaiyo","kind":"gaiyo","sec":"choukai","group":"listen","n":2,"jp":"問題用紙に何もいんさつされていません。この問題は、全体としてどんな内容かを聞く問題です。話の前に質問はありません。まず話を聞いてください。それから、質問とせんたくしを聞いて、1から4の中から、最もよいものを一つ選んでください。","id":"Memahami garis besar (概要理解)","bank":[["ラジオで男の人が話しています。",[["m","みなさんは朝ご飯を食べていますか。最近、朝ご飯を食べない若い人が増えているそうです。でも、朝ご飯を食べると、体が温まって、頭もよく働くようになります。忙しい朝でも、バナナ一本や牛乳一杯だけでもいいので、何か口に入れるようにしましょう。"]],"男の人は何について話していますか。",["朝ご飯を食べることの大切さ","若い人の好きな食べ物","朝ご飯の作り方","バナナと牛乳の値段"],"Tema: pentingnya sarapan."],["テレビで女の人が話しています。",[["f","最近、この町では自転車を使う人が増えています。駅の近くに自転車を止める場所が足りなくて、道に止めてある自転車が問題になっています。そこで市は、来年までに駅の周りに新しい駐輪場を三つ作ることにしました。"]],"女の人は何について話していますか。",["駅の周りに駐輪場を作る計画","自転車の安全な乗り方","新しい駅の建物","町の道路工事"],"Tema: rencana membuat tempat parkir sepeda."],["講演会で男の人が話しています。",[["m","外国語を勉強するとき、多くの人は単語をたくさん覚えようとします。もちろん単語は大切です。でも、覚えた単語を実際に使わなければ、すぐに忘れてしまいます。ですから、覚えたらその日のうちに、その単語を使って短い文を作ってみてください。それが一番の近道です。"]],"男の人が一番言いたいことは何ですか。",["覚えた単語はすぐに使ってみるべきだ","単語はたくさん覚えるべきだ","外国語は話すより読むほうが大切だ","辞書を毎日使うべきだ"],"Inti: gunakan kosakata segera setelah dihafal."]]},{"key":"hatsuwa","kind":"hatsuwa","sec":"choukai","group":"listen","n":2,"jp":"えを見ながら質問を聞いてください。➡（やじるし）の人は何と言いますか。1から3の中から、最もよいものを一つ選んでください。","id":"Ungkapan yang tepat (発話表現)","bank":[["Rekan kerjamu terlihat sibuk dengan banyak dokumen.","同僚が忙しそうです。何と言いますか。",["何か手伝いましょうか。","何か手伝ってもらえませんか。","何か手伝っていただきました。"],"Menawarkan bantuan: 手伝いましょうか."],["Kamu ingin minta izin pulang lebih awal kepada atasan.","何と言いますか。",["すみません、今日は早めに帰らせていただけませんか。","すみません、今日は早めに帰っていただけませんか。","すみません、今日は早めに帰ってあげませんか。"],"Minta izin: 〜させていただけませんか."],["Seorang tamu datang ke kantormu.","何と言いますか。",["いらっしゃいませ。どうぞこちらへ。","おじゃまします。どうぞこちらへ。","お待たせしました。おじゃまします。"],"Menyambut tamu: いらっしゃいませ."],["Kamu ingin teman mengulangi ucapannya karena tidak terdengar.","何と言いますか。",["ごめん、もう一回言ってくれる？","ごめん、もう一回言ってあげる。","ごめん、もう言わないで。"],"Minta diulang: もう一回言ってくれる？"]]},{"key":"sokuji","kind":"sokuji","sec":"choukai","group":"listen","n":5,"jp":"問題用紙に何もいんさつされていません。まず文を聞いてください。それから、それに対する返事を聞いて、1から3の中から、最もよいものを一つ選んでください。","id":"Tanggapan cepat (即時応答)","bank":[["この書類、明日までに出してもらえる？",["はい、わかりました。","はい、出してもらいました。","いいえ、出しませんでした。"],"Menyanggupi permintaan."],["田中さん、顔色悪いね。",["うん、ちょっと熱っぽくて。","うん、とても元気だよ。","ありがとう、うれしい。"],"Menjawab bahwa merasa demam."],["せっかく来たのに、店が閉まってるね。",["残念だね。また来よう。","よかったね。入ろう。","早く来てよかった。"],"せっかく〜のに = sayang sekali."],["あれ、もう帰るの？",["うん、今日は用事があって。","うん、まだ帰らないよ。","ううん、もう帰ったよ。"],"Menjelaskan alasan pulang."],["会議の資料、もう少し早く送ってくれればよかったのに。",["すみません、次から気をつけます。","はい、送ってよかったです。","いいえ、どういたしまして。"],"Ditegur → minta maaf."],["このパソコン、使ってもかまいませんか。",["ええ、どうぞ。","はい、使ってくださいません。","いいえ、使いました。"],"Mengizinkan: どうぞ."],["傘、貸してあげようか。",["ありがとう、助かる。","うん、貸してあげる。","じゃあ、借りてあげる。"],"Menerima tawaran: 助かる."],["来週の飲み会、来られそう？",["うーん、まだわからないな。","うん、来たよ。","ううん、飲まないよ。"],"Belum pasti bisa datang."]]}]},{"id":"n2","title":"JLPT N2","pass_":90,"groups":[{"key":"lang","label":"Pengetahuan Bahasa (huruf, kosakata, tata bahasa)","max":60,"min":19},{"key":"read","label":"Membaca","max":60,"min":19},{"key":"listen","label":"Mendengarkan","max":60,"min":19}],"secs":[{"key":"gengo","jp":"言語知識（文字・語彙・文法）・読解","id":"Pengetahuan Bahasa & Membaca","min":105},{"key":"choukai","jp":"聴解","id":"Mendengarkan","min":50}],"parts":[{"key":"kr","kind":"kr","sec":"gengo","group":"lang","n":5,"jp":"＿＿の言葉の読み方として最もよいものを、1・2・3・4から一つ選びなさい。","id":"Cara baca kanji (漢字読み)","bank":[["事故の【原因】を詳しく調べる。","げんいん","Menyelidiki penyebab kecelakaan secara rinci."],["会社は新しい制度を【導入】した。","どうにゅう","Perusahaan menerapkan sistem baru."],["書類に【誤り】が見つかった。","あやまり","Ditemukan kesalahan pada dokumen."],["その計画を【検討】する必要がある。","けんとう","Rencana itu perlu dipertimbangkan."],["交通費は会社が【負担】する。","ふたん","Biaya transportasi ditanggung perusahaan."],["留学は【貴重】な経験になった。","きちょう","Belajar di luar negeri menjadi pengalaman berharga."],["来年度の予算を【削減】する。","さくげん","Memangkas anggaran tahun depan."],["彼の【主張】には説得力がある。","しゅちょう","Klaimnya meyakinkan."],["【穏やか】な天気が続いている。","おだやか","Cuaca tenang terus berlanjut."],["新製品の【評判】がいい。","ひょうばん","Reputasi produk baru itu bagus."],["まず現状を【把握】することが大切だ。","はあく","Pertama-tama penting memahami kondisi saat ini."],["客の要望に【柔軟】に対応する。","じゅうなん","Menanggapi permintaan pelanggan secara fleksibel."],["交渉はついに【成立】した。","せいりつ","Negosiasi akhirnya berhasil."],["人口の【減少】が続いている。","げんしょう","Penurunan jumlah penduduk terus berlanjut."]]},{"key":"hym","kind":"mc","sec":"gengo","group":"lang","n":4,"jp":"＿＿の言葉を漢字で書くとき、最もよいものを、1・2・3・4から一つ選びなさい。","id":"Penulisan kanji/katakana (表記)","bank":[["会議の日程を【へんこう】する。",["変更","変史","返更","変硬"],"へんこう = 変更."],["部屋をいつも【せいけつ】に保つ。",["清潔","晴潔","清結","精潔"],"せいけつ = 清潔."],["自分の意見を【のべる】。",["述べる","延べる","術べる","迷べる"],"のべる (menyatakan) = 述べる; 延べる = memperpanjang."],["データをパソコンに【ほぞん】する。",["保存","保在","補存","歩存"],"ほぞん = 保存."],["失敗の責任を【おう】。",["負う","追う","覆う","扶う"],"責任をおう = 負う."],["機械の【こしょう】で工場が止まった。",["故障","古障","故症","個障"],"こしょう = 故障."],["日本の人口は年々【へって】いる。",["減って","経って","滅って","咸って"],"へる (berkurang) = 減る."],["新しい会社を【せつりつ】する。",["設立","説立","設律","接立"],"せつりつ = 設立."]]},{"key":"gk","kind":"mc","sec":"gengo","group":"lang","n":3,"jp":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","id":"Pembentukan kata (語形成)","bank":[["社会の高齢（　）が進んでいる。",["化","性","的","式"],"高齢化 = penuaan penduduk."],["彼の説明には説得（　）がある。",["力","性","化","感"],"説得力 = daya bujuk."],["（　）成年はお酒を飲んではいけない。",["未","不","無","非"],"未成年 = di bawah umur."],["これは社会（　）な問題だ。",["的","化","性","式"],"社会的 = bersifat sosial."],["申し込みの締め切りは今月（　）だ。",["末","終","後","尾"],"今月末 = akhir bulan ini."],["そんな（　）常識な行動は困る。",["非","不","無","未"],"非常識 = tidak masuk akal/kurang sopan."],["手続きはまだ（　）完了だ。",["未","不","無","非"],"未完了 = belum selesai."],["来年（　）から新しい制度が始まる。",["度","期","間","次"],"来年度 = tahun fiskal depan."]]},{"key":"ctx","kind":"mc","sec":"gengo","group":"lang","n":5,"jp":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","id":"Kata yang sesuai konteks (文脈規定)","bank":[["新しい企画の（　）がようやく決まった。",["方針","方角","方面","方言"],"方針 = arah kebijakan."],["この会社は若い社員の意見を積極的に（　）いる。",["取り入れて","取り消して","取り替えて","取り出して"],"取り入れる = mengadopsi."],["締め切りまで時間がないので、（　）作業を進めてください。",["速やかに","穏やかに","和やかに","鮮やかに"],"速やかに = segera."],["彼女の発表は内容が（　）していて、わかりやすかった。",["はっきり","うっかり","ぐったり","ぼんやり"],"はっきり = jelas."],["長い交渉の末、ついに契約が（　）した。",["成立","設立","確立","独立"],"契約が成立する = kontrak tercapai."],["雨の日は道が滑りやすいので、（　）運転してください。",["慎重に","正直に","素直に","率直に"],"慎重に = hati-hati."],["部長は部下のミスを厳しく（　）。",["注意した","注目した","注文した","注射した"],"注意する = menegur."],["新商品の売り上げが予想を大きく（　）。",["上回った","上がった","上げた","上った"],"予想を上回る = melampaui perkiraan."],["計画を実行する前に、（　）準備をしておく。",["十分な","余分な","多分な","自分な"],"十分な準備 = persiapan matang."],["彼は仕事が早く、上司からの（　）も厚い。",["信頼","信号","信用金","信者"],"信頼が厚い = sangat dipercaya."]]},{"key":"para","kind":"mc","sec":"gengo","group":"lang","n":3,"jp":"＿＿の言葉に意味が最も近いものを、1・2・3・4から一つ選びなさい。","id":"Makna sepadan (言い換え類義)","bank":[["彼の説明は【あいまい】だった。",["はっきりしなかった","長かった","面白かった","正しかった"],"あいまい = tidak jelas."],["彼は【たびたび】遅刻して注意された。",["何度も","一度","突然","わざと"],"たびたび = sering."],["悪天候のため、出発を【見合わせる】ことになった。",["やめて様子を見る","急いで進める","新しく計画する","他の人に任せる"],"見合わせる = menunda sambil menunggu."],["映画館は【がらがら】だった。",["ほとんど人がいなかった","人が多かった","汚かった","暗かった"],"がらがら = kosong melompong."],["この料理は【手間】がかかる。",["時間と労力","お金","人数","道具"],"手間 = waktu dan tenaga."],["その仕事なら【とっくに】終わっている。",["ずっと前に","ちょうど今","もうすぐ","少しずつ"],"とっくに = sudah lama."],["彼の自慢話に【うんざりした】。",["いやになった","感動した","驚いた","安心した"],"うんざり = muak."],["結果は【およそ】予想どおりだった。",["だいたい","まったく","少しも","かならず"],"およそ = kira-kira."]]},{"key":"use","kind":"use","sec":"gengo","group":"lang","n":3,"jp":"次の言葉の使い方として最もよいものを、1・2・3・4から一つ選びなさい。","id":"Penggunaan kata yang benar (用法)","bank":[["手軽",["この料理は材料が少なくて、手軽に作れる。","彼は手軽な性格で友だちが多い。","雨が手軽に降ってきた。","この問題は手軽すぎて誰も解けない。"],"手軽 = mudah/praktis."],["打ち明ける",["友だちに長年の悩みを打ち明けた。","窓を打ち明けて空気を入れた。","箱を打ち明けて中を見た。","会議を打ち明けて始めた。"],"打ち明ける = mencurahkan/mengakui rahasia."],["解消",["話し合いで二人の誤解が解消した。","雪が解消して春になった。","店を解消して新しい店を開いた。","薬を飲んで熱が解消した。"],"解消 = terselesaikan (salah paham, stres)."],["素直",["あの子は素直で、人の意見をよく聞く。","この道は素直なので走りやすい。","素直な料理を注文した。","素直な天気が続いている。"],"素直 = penurut/jujur hatinya."],["取り組む",["環境問題に真剣に取り組んでいる。","電車に取り組んで会社へ行った。","友だちと公園で取り組んだ。","新しい服に取り組んだ。"],"取り組む = menangani dengan serius."],["目安",["一日の運動時間は30分を目安にしてください。","目安が悪くて字が読めない。","彼は目安な人だ。","この店は目安が安い。"],"目安 = patokan."]]},{"key":"gram","kind":"mc","sec":"gengo","group":"lang","n":8,"jp":"次の文の（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","id":"Bentuk tata bahasa (文法形式の判断)","bank":[["彼の協力（　）、この仕事は成功しなかっただろう。",["なしには","ながらも","にしては","に対して"],"〜なしには = tanpa ..."],["子どもに（　）、この本は難しすぎる。",["とって","ついて","対して","よって"],"〜にとって = bagi ..."],["彼は医者（　）、患者の気持ちがわかっていない。",["のくせに","のおかげで","のついでに","のかわりに"],"〜のくせに = padahal (nada kritik)."],["雨が降る（　）、試合は予定どおり行われる。",["かどうかにかかわらず","かと思うと","ばかりか","からには"],"〜かどうかにかかわらず = terlepas dari ... atau tidak."],["引っ越した（　）、まだ近所の人にあいさつしていない。",["ものの","からには","うえで","とたん"],"〜ものの = meskipun."],["社長の許可を得た（　）、計画を進める。",["うえで","ところで","ばかりに","くせに"],"〜たうえで = setelah ... baru ..."],["試験に合格す（　）、毎日努力している。",["べく","ものの","あげく","しだい"],"〜べく = demi/agar bisa ..."],["調査の結果（　）、計画を変更するかもしれない。",["次第では","ばかりか","ものの","かと思うと"],"〜次第では = tergantung ..."],["彼の話を聞いて、笑わ（　）。",["ずにはいられなかった","ずにすんだ","ないでほしかった","ないわけだった"],"〜ずにはいられない = tak bisa menahan diri untuk ..."],["お忙しい（　）、手伝ってくださってありがとうございます。",["ところ","ものの","うちに","あげく"],"お忙しいところ = di tengah kesibukan."],["一度約束した（　）、守らなければならない。",["以上","次第","最中","末"],"〜以上 = karena sudah ..."],["さんざん悩んだ（　）、留学をあきらめた。",["あげく","うちに","からには","とおりに"],"〜たあげく = setelah (lama) ... akhirnya."],["この店の料理は値段の（　）おいしい。",["わりに","せいで","ために","ように"],"〜わりに = dibanding ..., cukup ..."],["彼女は歌手（　）、女優としても活躍している。",["としてだけでなく","にしては","にとって","によって"],"〜としてだけでなく = tidak hanya sebagai ..."]]},{"key":"star","kind":"star","sec":"gengo","group":"lang","n":4,"jp":"次の文の ★ に入る最もよいものを、1・2・3・4から一つ選びなさい。","id":"Menyusun kalimat (文の組み立て)","bank":[["この映画は",["子ども","だけでなく","大人も","楽しめる"],"作品だ。","Film ini bisa dinikmati tidak hanya anak-anak tapi juga dewasa."],["彼は",["会議の","最中に","居眠りを","して"],"部長に注意された。","Dia ditegur karena tertidur saat rapat."],["社員の",["意見を","聞いた","うえで","新しい"],"制度を決める。","Sistem baru diputuskan setelah mendengar pendapat karyawan."],["経験が",["ない","からといって","あきらめる","必要は"],"ない。","Tidak perlu menyerah hanya karena belum berpengalaman."],["駅に",["着くか","着かないかの","うちに","電車が"],"出てしまった。","Begitu tiba di stasiun, kereta sudah berangkat."],["説明書を",["読んだ","ものの","使い方が","よく"],"わからない。","Meski sudah membaca petunjuk, saya kurang paham cara pakainya."],["この町は",["交通が","便利な","わりに","家賃が"],"安い。","Kota ini transportasinya praktis, tapi sewanya murah."],["彼女は",["努力した","かいが","あって","試験に"],"合格した。","Usahanya membuahkan hasil; ia lulus ujian."]]},{"key":"cloze","kind":"cloze","sec":"gengo","group":"lang","n":1,"jp":"次の文章を読んで、文章全体の趣旨を踏まえて、（1）から（3）の中に入る最もよいものを、1・2・3・4から一つ選びなさい。","id":"Tata bahasa dalam teks (文章の文法)","bank":[["社会人になってから、時間が足りないと感じることが増えた。学生のころは一日が長く感じられた（1）、今はあっという間に夜になってしまう。\n（2）、時間がないのは本当に忙しいからだろうか。先日、一日の行動を記録してみたところ、スマートフォンを見ている時間が三時間以上あった。何となく使っている時間を減らせば、自分のために使える時間は（3）増えるはずだ。",[["のに","ので","ため","から"],["しかし","そのうえ","つまり","したがって"],["かなり","ほとんど","めったに","ちっとも"]],"(1) のに = padahal (kontras). (2) しかし = namun (mempertanyakan). (3) かなり = cukup banyak."],["メールが普及した今、手書きの手紙を書く人は少なくなった。（1）、先日祖母から届いた手紙を読んで、手書きのよさを改めて感じた。それは、字の形や書き方から、書いた人の気持ちが伝わってくる（2）。メールは便利だが、手紙にはメールでは伝えきれない温かさがある。たまには手紙を書いてみるのもいい（3）。",[["だが","そこで","なぜなら","すると"],["からだ","ためだ","ようだ","はずだ"],["のではないだろうか","のではなかった","わけがない","はずがない"]],"(1) だが = namun. (2) それは〜からだ = karena. (3) のではないだろうか = bukankah ... (usulan halus)."]]},{"key":"short","kind":"read","sec":"gengo","group":"read","n":2,"jp":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1・2・3・4から一つ選びなさい。","id":"Pemahaman teks pendek (内容理解・短文)","bank":[["件名：会議室の利用について\n来月より、会議室の予約は社内システムからのみ受け付けます。これまでのように総務部へ電話で予約することはできなくなりますので、ご注意ください。なお、システムの使い方がわからない場合は、総務部の佐藤までお問い合わせください。",[["このメールで伝えたいことは何か。",["会議室はシステムでしか予約できなくなること","会議室の数が減ること","総務部に電話で予約してほしいこと","システムの説明会を開くこと"],"Reservasi hanya lewat sistem internal."]]],["失敗を恐れて何もしない人は多い。しかし、失敗から学べることは少なくない。むしろ、一度も失敗したことがない人は、新しいことに挑戦してこなかった人だと言えるかもしれない。大切なのは失敗しないことではなく、失敗したあとどうするかである。",[["筆者の考えに合うものはどれか。",["失敗したあとの行動が大切だ。","失敗しないように慎重に行動するべきだ。","失敗したことがない人は優秀だ。","新しいことに挑戦するのは危険だ。"],"大切なのは失敗したあとどうするか."]]],["最近、レジで店員と会話をせずに買い物ができる店が増えている。便利ではあるが、近所の小さな店で店員と天気の話をするような、ちょっとしたやりとりがなくなるのは少しさびしい。そうした会話が、一人暮らしの高齢者にとっては大切な人とのつながりである場合もあるのだ。",[["筆者は店員と会話をしない買い物についてどう考えているか。",["便利だが、人とのつながりが失われる面もある。","便利なので、もっと増やすべきだ。","高齢者には使いにくいので、やめるべきだ。","店員の仕事が減るので問題だ。"],"Praktis, tapi interaksi kecil antar manusia hilang."]]]]},{"key":"mid","kind":"read","sec":"gengo","group":"read","n":1,"jp":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1・2・3・4から一つ選びなさい。","id":"Pemahaman teks sedang (内容理解・中文)","bank":[["「おいしい」とは何だろうか。同じ料理でも、一人で急いで食べるときと、親しい人と話しながらゆっくり食べるときでは、感じるおいしさがまったく違う。料理の味そのものは変わらないのに、だ。\nある研究によると、人は食べ物の味を舌だけで感じているわけではないらしい。目で見た色や形、においはもちろん、そのときの気分や周りの雰囲気も、おいしさに大きく影響するという。\nそう考えると、毎日の食事をおいしくする方法は、高い食材を買うことだけではない。食卓に花を一輪飾る、テレビを消して家族と話す。そんな小さな工夫が、料理を何倍もおいしくしてくれるのかもしれない。",[["筆者によると、同じ料理でもおいしさが違うのはなぜか。",["食べるときの状況や気分が違うから","料理の味が変わるから","料理を作る人が違うから","食べる量が違うから"],"Suasana dan perasaan memengaruhi rasa."],["筆者が考える、食事をおいしくする方法はどれか。",["食事のときの雰囲気を工夫する。","高い食材を使う。","一人でゆっくり食べる。","研究の結果を参考に料理を作る。"],"Usaha kecil pada suasana makan."]]],["在宅勤務が広がり、通勤時間がなくなった人が増えた。朝の時間に余裕ができた、家族と過ごす時間が増えたなどの声が聞かれる一方で、「仕事と生活の区別がつかなくなった」という悩みも多い。\n家では、仕事の道具がいつも目に入るため、夜や休日もついメールを確認してしまう。また、同僚と雑談する機会が減り、ちょっとした相談がしにくくなったと感じる人もいる。\nこうした問題を防ぐために、仕事をする部屋を決める、勤務時間が終わったらパソコンをしまうなど、自分なりのルールを作ることが大切だと専門家は言う。",[["在宅勤務の悩みとして挙げられているものはどれか。",["仕事と生活の区別がつきにくいこと","通勤に時間がかかること","家族と過ごす時間が減ること","朝早く起きなければならないこと"],"Batas kerja dan kehidupan jadi kabur."],["専門家はどうすることが大切だと言っているか。",["自分で仕事のルールを決めること","会社に行く日を増やすこと","同僚と毎日電話すること","休日にメールを確認すること"],"Membuat aturan sendiri."]]]]},{"key":"togo","kind":"read","sec":"gengo","group":"read","n":1,"jp":"次のAとBの文章を読んで、後の問いに対する答えとして最もよいものを、1・2・3・4から一つ選びなさい。","id":"Pemahaman terpadu A & B (統合理解)","bank":[["A\n子どもにスマートフォンを持たせることには賛成だ。共働きの家庭が増え、子どもが一人で過ごす時間も長くなっている。何かあったときにすぐ連絡がとれるのは、親にとっても子どもにとっても安心だ。もちろん、使う時間やアプリにはルールが必要だが、それは家庭で話し合って決めればいい。\n\nB\n小学生にスマートフォンはまだ早いと思う。連絡がとれる便利さはわかるが、子どもは一度ゲームや動画に夢中になると、自分でやめることが難しい。連絡だけが目的なら、通話機能だけの簡単な携帯電話でも十分ではないか。",[["AとBのどちらの文章でも触れられていることは何か。",["すぐに連絡がとれる便利さ","ゲームの危険性","家庭でのルール作り","携帯電話の値段"],"Keduanya menyebut kemudahan menghubungi anak."],["AとBの筆者は、子どもがスマートフォンを持つことについてどう考えているか。",["Aは賛成で、Bは反対している。","AもBも賛成している。","Aは反対で、Bは賛成している。","AもBもルールがあれば賛成だと言っている。"],"A setuju, B menilai terlalu dini."]]]]},{"key":"shucho","kind":"read","sec":"gengo","group":"read","n":1,"jp":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1・2・3・4から一つ選びなさい。","id":"Memahami pendapat penulis (主張理解・長文)","bank":[["「わかりやすさ」が何よりも求められる時代になった。テレビのニュースは難しい話題を短くまとめ、本のタイトルには「3分でわかる」「図解」といった言葉が並ぶ。忙しい現代人にとって、短い時間で要点をつかめるのはありがたいことだ。\nしかし、私はこの風潮に少し不安を感じている。世の中の問題の多くは、本来簡単には説明できないものだ。それを無理にわかりやすくすると、大切な部分が切り捨てられてしまうことがある。わかったつもりになって、実は何もわかっていない、ということも起こりうる。\nわかりにくいものに向き合い、時間をかけて考えることには、それ自体に価値がある。すぐには答えが出ない問題を前にして、あれこれ考える経験が、考える力を育てるのではないだろうか。わかりやすさを求めるだけでなく、わかりにくさに耐える力も、私たちには必要なのである。",[["筆者は「わかりやすさ」が求められる理由を何だと考えているか。",["人々が忙しく、短い時間で要点を知りたいから","難しい本が売れなくなったから","テレビのニュースが長すぎるから","世の中の問題が簡単になったから"],"Karena orang sibuk ingin cepat paham."],["筆者が不安を感じているのはなぜか。",["わかりやすくすることで、大切な部分が失われることがあるから","わかりやすい説明が増えすぎたから","人々が本を読まなくなったから","説明が長くなっているから"],"Bagian penting bisa terpotong."],["筆者が最も言いたいことは何か。",["わかりにくいことに時間をかけて向き合う力も必要だ。","難しい問題は専門家に任せるべきだ。","わかりやすい説明をもっと増やすべきだ。","忙しい人は要点だけ知ればよい。"],"Perlu daya tahan menghadapi yang sulit dipahami."]]]]},{"key":"info","kind":"read","sec":"gengo","group":"read","n":1,"jp":"次の資料を読んで、下の問いに対する答えとして最もよいものを、1・2・3・4から一つ選びなさい。","id":"Mencari informasi (情報検索)","bank":[["市民講座 秋の受講生募集\nA パソコン入門 ／ 毎週月曜 10:00〜12:00（全8回） ／ 定員20名 ／ 8,000円\nB 英会話（初級） ／ 毎週水曜 19:00〜20:30（全10回） ／ 定員15名 ／ 12,000円\nC 料理教室 ／ 毎週土曜 10:00〜13:00（全5回） ／ 定員12名 ／ 10,000円（材料費 別途2,000円）\nD 写真講座 ／ 毎週日曜 14:00〜16:00（全6回） ／ 定員15名 ／ 9,000円\n・申し込みは9月15日まで。定員を超えた場合は抽選。\n・対象：市内に住んでいる人、または市内の会社で働いている人。\n・65歳以上の方は受講料が半額（材料費は半額になりません）。",[["市内に住む70歳の山田さんは、Cの料理教室に参加したい。全部でいくら払うか。",["7,000円","6,000円","12,000円","5,000円"],"10.000 ÷ 2 = 5.000 + bahan 2.000 = 7.000 yen."],["隣の市に住み、市内の会社で働く林さん（35歳）は、平日の夜か週末に受講したい。受講できる講座はどれか。",["BとCとD","AとB","CとDだけ","どれも受講できない"],"Bekerja di dalam kota → memenuhi syarat; B (Rabu malam), C dan D (akhir pekan)."]]]]},{"key":"kadai","kind":"listen","sec":"choukai","group":"listen","n":3,"jp":"まず質問を聞いてください。それから話を聞いて、問題用紙の1から4の中から、最もよいものを一つ選んでください。","id":"Memahami tugas (課題理解)","bank":[["会社で女の人と男の人が話しています。男の人はこのあとまず何をしますか。",[["f","来週の新商品の発表会の件だけど、会場の予約は済んでる？"],["m","はい、先週済ませました。今は招待状の文面を考えているところです。"],["f","そう。でも招待状の前に、まず出席者のリストを作って部長に確認してもらわないと。人数が決まらないと席の配置も決められないし。"],["m","あ、そうですね。じゃあ、すぐ取りかかります。"]],"男の人はこのあとまず何をしますか。",["出席者のリストを作る","招待状の文面を考える","会場を予約する","席の配置を決める"],"Daftar peserta dulu sebelum undangan."],["市役所で男の人と職員が話しています。男の人は何を持ってもう一度来なければなりませんか。",[["m","住所変更の手続きをしたいんですが。"],["f","はい。本人確認のできるもの、免許証かパスポートはお持ちですか。"],["m","免許証ならあります。"],["f","それと、印鑑はお持ちですか。"],["m","あ、印鑑は忘れました。"],["f","でしたら、署名でも大丈夫ですよ。ただ、新しい住所の賃貸契約書のコピーが必要なんですが。"],["m","え、それは持ってきていません。"],["f","では、それだけお持ちください。"]],"男の人は何を持ってもう一度来なければなりませんか。",["賃貸契約書のコピー","印鑑","免許証","パスポート"],"Stempel bisa diganti tanda tangan; yang kurang fotokopi kontrak sewa."],["大学で先生と女の学生が話しています。女の学生はレポートをどう直しますか。",[["m","レポート読みましたよ。テーマもいいし、資料もよく集めてあります。ただ、最後の部分が資料のまとめになっていて、あなた自身の意見が書かれていないのが残念ですね。"],["f","はい。"],["m","そこを書き加えて、来週もう一度出してください。長さは今のままで大丈夫です。"]],"女の学生はレポートをどう直しますか。",["最後に自分の意見を書き加える","テーマを変える","資料を増やす","レポートを短くする"],"Tambahkan pendapat sendiri di bagian akhir."]]},{"key":"point","kind":"listen","sec":"choukai","group":"listen","n":3,"jp":"まず質問を聞いてください。そのあと、問題用紙のせんたくしを読んでください。それから話を聞いて、問題用紙の1から4の中から、最もよいものを一つ選んでください。","id":"Memahami poin (ポイント理解)","bank":[["男の人と女の人が話しています。女の人はどうしてマラソン大会に出るのをやめましたか。",[["m","来月のマラソン大会、出るんでしょう？毎朝練習してたし。"],["f","それが、やめたの。足をけがしたわけじゃないんだけど、大会の日がちょうど妹の結婚式と重なっちゃって。"],["m","それじゃ、仕方ないね。"]],"女の人はどうしてマラソン大会に出るのをやめましたか。",["妹の結婚式があるから","足をけがしたから","練習が足りないから","仕事が忙しいから"],"Bertepatan dengan pernikahan adiknya."],["女の人と男の人が新しいカフェについて話しています。男の人はカフェの何がいちばん気に入っていますか。",[["f","駅前の新しいカフェ、行った？"],["m","うん、何度か。コーヒーもおいしいけど、何より席と席の間が広くて、ゆっくり仕事ができるのがいいんだよね。"],["f","へえ。値段は？"],["m","ちょっと高めかな。"]],"男の人はカフェの何がいちばん気に入っていますか。",["席がゆったりしていること","コーヒーがおいしいこと","値段が安いこと","駅から近いこと"],"何より = yang paling: kursinya lapang."],["会社で男の人と女の人が話しています。女の人は会議が延期になった理由は何だと言っていますか。",[["m","あれ、明日の会議、延期？部長の出張？"],["f","いえ、部長は出張から戻っていらっしゃるんですけど、会議で使うデータがまだそろっていなくて。"],["m","ああ、なるほど。"]],"女の人は会議が延期になった理由は何だと言っていますか。",["データがそろっていないから","部長が出張中だから","会議室が使えないから","参加者が少ないから"],"Data belum lengkap."]]},{"key":"gaiyo","kind":"gaiyo","sec":"choukai","group":"listen","n":2,"jp":"問題用紙に何もいんさつされていません。この問題は、全体としてどんな内容かを聞く問題です。話の前に質問はありません。まず話を聞いてください。それから、質問とせんたくしを聞いて、1から4の中から、最もよいものを一つ選んでください。","id":"Memahami garis besar (概要理解)","bank":[["講演会で女の人が話しています。",[["f","最近、植物を育てる人が増えています。特に若い世代では、部屋に小さな植物を置く人が多いようです。植物を育てると、毎日水をやるという小さな習慣ができ、生活にリズムが生まれます。また、成長していく様子を見ることで、気持ちが落ち着くという人もいます。手間がかかるのではと心配する方もいますが、最近は世話が簡単な種類も多く売られています。"]],"女の人は何について話していますか。",["植物を育てることのよさ","植物の正しい育て方","若い世代の生活習慣の問題","植物の値段の変化"],"Tema: manfaat merawat tanaman."],["ラジオで男の人が話しています。",[["m","旅行のとき、ガイドブックを見ずに歩いてみてはどうでしょうか。有名な観光地を回るのもいいですが、ふと入った路地で地元の人と話したり、小さな店を見つけたりすることが、旅の一番の思い出になることも少なくありません。計画どおりに進まないことを楽しむのも、旅の楽しみ方の一つです。"]],"男の人は何について話していますか。",["計画にしばられない旅の楽しみ方","ガイドブックの選び方","有名な観光地の紹介","旅行の費用を安くする方法"],"Tema: menikmati perjalanan tanpa terpaku rencana."]]},{"key":"sokuji","kind":"sokuji","sec":"choukai","group":"listen","n":5,"jp":"問題用紙に何もいんさつされていません。まず文を聞いてください。それから、それに対する返事を聞いて、1から3の中から、最もよいものを一つ選んでください。","id":"Tanggapan cepat (即時応答)","bank":[["この企画書、ちょっと目を通してもらえない？",["ええ、拝見します。","ええ、ご覧ください。","ええ、目を閉じます。"],"目を通す = membaca sekilas → 拝見します."],["せっかく準備したのに、雨で中止なんて。",["本当に残念ですね。","中止でよかったですね。","じゃあ、準備しましょう。"],"Bersimpati: 残念ですね."],["田中さん、明日の会議、出席していただけますか。",["はい、うかがいます。","はい、いらっしゃいます。","はい、出席していただきます。"],"Merendah untuk diri sendiri: うかがいます."],["この書類、今日中に片付けておいて。",["承知しました。","かしこまってください。","お片付けになります。"],"Menerima perintah: 承知しました."],["あの二人、最近よく一緒にいるね。",["うん、仲がいいみたいだね。","うん、一緒にいなかったね。","ううん、二人で行ったよ。"],"Menanggapi pengamatan."],["もう少しで遅刻するところだったよ。",["間に合ってよかったね。","遅刻して大変だったね。","じゃあ、急いで行こう。"],"〜ところだった = hampir (tapi tidak) terlambat."],["お忙しいところ申し訳ありませんが……。",["いえ、どうされましたか。","いえ、忙しくてすみません。","はい、申し訳ありません。"],"Menanggapi permintaan waktu."],["このプロジェクト、君に任せようと思うんだけど。",["ありがとうございます。がんばります。","はい、お任せします。","いいえ、任せてくださいません。"],"Menerima tanggung jawab."]]},{"key":"togoL","kind":"listen","sec":"choukai","group":"listen","n":1,"jp":"長めの話を聞きます。問題用紙にメモをとってもいいです。まず話を聞いてください。それから、質問と選択肢を聞いて、最もよいものを一つ選んでください。","id":"Pemahaman terpadu (統合理解)","bank":[["家族三人が夏休みの旅行について話しています。",[["f","夏休みの旅行、どこにしようか。海と山と温泉の候補があるけど。"],["m","海は人が多いだろう。去年行って疲れたよ。"],["g","私は山がいいな。でも、お母さん、足が痛いって言ってたよね。"],["f","そうなの。長く歩くのはちょっと…。"],["m","じゃあ、ゆっくりできるところにしよう。"],["g","うん、それがいいね。"]],"家族はどこへ旅行に行きますか。",["温泉","海","山","まだ決まっていない"],"Laut ramai, gunung butuh jalan jauh → tempat santai: onsen."],["会社で三人が新しい社員研修について話しています。",[["f","新人研修、今年はどうしましょう。毎年講義形式だと、眠そうな人もいますし。"],["m","グループで課題に取り組む形はどうかな。実践的だし。"],["g","いいと思います。でも全部そうすると、基礎知識がないまま進んでしまう心配があります。"],["f","じゃあ、午前中に短い講義で基礎を押さえて、午後はグループ作業にしましょうか。"],["m","それが一番バランスがいいね。"]],"研修はどのような形になりましたか。",["午前は講義、午後はグループ作業","すべて講義形式","すべてグループ作業","午前はグループ作業、午後は講義"],"Pagi kuliah singkat, siang kerja kelompok."]]}]},{"id":"n1","title":"JLPT N1","pass_":100,"groups":[{"key":"lang","label":"Pengetahuan Bahasa (huruf, kosakata, tata bahasa)","max":60,"min":19},{"key":"read","label":"Membaca","max":60,"min":19},{"key":"listen","label":"Mendengarkan","max":60,"min":19}],"secs":[{"key":"gengo","jp":"言語知識（文字・語彙・文法）・読解","id":"Pengetahuan Bahasa & Membaca","min":110},{"key":"choukai","jp":"聴解","id":"Mendengarkan","min":60}],"parts":[{"key":"kr","kind":"kr","sec":"gengo","group":"lang","n":6,"jp":"＿＿の言葉の読み方として最もよいものを、1・2・3・4から一つ選びなさい。","id":"Cara baca kanji (漢字読み)","bank":[["両国の交渉は【円滑】に進んでいる。","えんかつ","Negosiasi kedua negara berjalan lancar."],["政府は事態の【収拾】を図った。","しゅうしゅう","Pemerintah berupaya mengendalikan situasi."],["彼の発言は前回の説明と【矛盾】している。","むじゅん","Ucapannya bertentangan dengan penjelasan sebelumnya."],["社員は規則を【遵守】しなければならない。","じゅんしゅ","Karyawan harus mematuhi peraturan."],["景気の悪化に対する【懸念】が広がっている。","けねん","Kekhawatiran akan memburuknya ekonomi meluas."],["活動費は会費で【賄って】いる。","まかなって","Biaya kegiatan ditutup dari iuran."],["この十年で【著しい】成長を遂げた。","いちじるしい","Dalam sepuluh tahun ini terjadi pertumbuhan yang mencolok."],["資源の【乏しい】国だ。","とぼしい","Negara yang miskin sumber daya."],["彼は責任を【免れる】ことはできない。","まぬがれる","Dia tidak bisa lepas dari tanggung jawab."],["業務の一部を外部に【委託】する。","いたく","Sebagian pekerjaan dialihdayakan ke pihak luar."],["担当者と【頻繁】に連絡を取り合う。","ひんぱん","Sering berkomunikasi dengan penanggung jawab."],["事実を【歪曲】して伝えてはいけない。","わいきょく","Jangan menyampaikan fakta secara terdistorsi."],["資金不足で計画が【頓挫】した。","とんざ","Rencana terhenti karena kekurangan dana."],["彼は【潔く】負けを認めた。","いさぎよく","Dia mengakui kekalahan dengan lapang dada."],["新しい技術が業界に大きな【衝撃】を与えた。","しょうげき","Teknologi baru mengguncang industri."],["過去の失敗を【踏まえて】計画を立てる。","ふまえて","Menyusun rencana dengan mempertimbangkan kegagalan lalu."]]},{"key":"ctx","kind":"mc","sec":"gengo","group":"lang","n":5,"jp":"（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","id":"Kata yang sesuai konteks (文脈規定)","bank":[["新しい法律の（　）をめぐって、議論が続いている。",["是非","是正","是認","正否"],"是非 = baik-buruknya/pantas tidaknya."],["彼は会議で自分の意見を（　）主張し続けた。",["頑なに","健やかに","和やかに","速やかに"],"頑なに = dengan keras kepala."],["長年の研究が（　）、ついに新薬の開発に成功した。",["実を結び","手を結び","口を結び","縁を結び"],"実を結ぶ = membuahkan hasil."],["不祥事が相次ぎ、会社の信用は（　）した。",["失墜","墜落","失脚","脱落"],"信用が失墜する = kepercayaan runtuh."],["両社の交渉は（　）に乗り上げている。",["暗礁","岩礁","座礁","環礁"],"暗礁に乗り上げる = menemui jalan buntu."],["彼の説明は（　）で、要点がなかなかつかめない。",["冗長","冗談","簡潔","明快"],"冗長 = bertele-tele."],["予想外の事態に、担当者は対応に（　）いる。",["追われて","逃れて","守られて","恵まれて"],"対応に追われる = kewalahan menangani."],["計画の細部まで（　）検討する必要がある。",["綿密に","緊密に","濃密に","親密に"],"綿密に = secara cermat dan teliti."],["彼女の演技は観客を（　）した。",["魅了","魅力","満了","終了"],"魅了する = memikat."],["この地域では人口減少に（　）がかからない。",["歯止め","足止め","口止め","手止め"],"歯止めがかからない = tak terbendung."]]},{"key":"para","kind":"mc","sec":"gengo","group":"lang","n":3,"jp":"＿＿の言葉に意味が最も近いものを、1・2・3・4から一つ選びなさい。","id":"Makna sepadan (言い換え類義)","bank":[["新しい試みは【ことごとく】失敗した。",["すべて","ほとんど","何度か","意外にも"],"ことごとく = semuanya."],["彼は【おもむろに】立ち上がった。",["ゆっくりと","急に","元気よく","怒って"],"おもむろに = perlahan-lahan."],["【かねがね】お会いしたいと思っておりました。",["以前から","今回","突然","心から"],"かねがね = sejak lama."],["事態は【ひっ迫】している。",["余裕がなく苦しい","落ち着いている","回復している","はっきりしていない"],"ひっ迫 = genting."],["現場の状況を【つぶさに】調べた。",["詳しく","急いで","簡単に","何度も"],"つぶさに = secara rinci."],["同じ話ばかりで【うんざり】だ。",["あきあき","わくわく","どきどき","はらはら"],"うんざり ≈ あきあき (bosan/muak)."],["結論を【先送り】にした。",["後回し","発表","変更","撤回"],"先送り = menunda."],["【あっけない】幕切れだった。",["予想より簡単で物足りない","感動的な","予想どおりの","悲しい"],"あっけない = terlalu cepat/mengecewakan."]]},{"key":"use","kind":"use","sec":"gengo","group":"lang","n":3,"jp":"次の言葉の使い方として最もよいものを、1・2・3・4から一つ選びなさい。","id":"Penggunaan kata yang benar (用法)","bank":[["踏まえる",["前回の反省を踏まえて、計画を立て直した。","階段を踏まえて二階へ上がった。","彼の足を踏まえてしまった。","雪を踏まえて歩いた。"],"踏まえる = berdasarkan/mempertimbangkan."],["打開",["話し合いによって現状を打開する。","箱を打開して中身を出した。","店を打開して新装開店した。","窓を打開して換気した。"],"打開 = mencari jalan keluar dari kebuntuan."],["ありきたり",["ありきたりの言葉では気持ちを伝えられない。","ありきたりの雨で試合は中止になった。","ありきたりに遅刻して叱られた。","彼はありきたりに背が高い。"],"ありきたり = biasa/klise."],["手分け",["みんなで手分けして資料を探した。","料理を手分けして一人で全部食べた。","彼は手分けが器用だ。","手分けを洗ってから食事をした。"],"手分けする = membagi tugas."],["一様",["参加者は一様に驚いた顔をした。","この店は一様に開店した。","彼女は一様な声で歌った。","一様に一度だけ会った。"],"一様に = sama-sama/serempak."],["見落とす",["書類の誤りを見落としてしまった。","友だちを駅まで見落とした。","高いビルから町を見落とした。","彼の実力を見落として尊敬した。"],"見落とす = terlewat/tidak melihat."]]},{"key":"gram","kind":"mc","sec":"gengo","group":"lang","n":8,"jp":"次の文の（　）に入れるのに最もよいものを、1・2・3・4から一つ選びなさい。","id":"Bentuk tata bahasa (文法形式の判断)","bank":[["彼の才能（　）、この成功はありえなかった。",["なくして","をもって","ともなると","いかんでは"],"〜なくして = tanpa ..."],["社長（　）、そんな初歩的なミスは許されない。",["ともなれば","ならでは","たりとも","なりに"],"〜ともなれば = kalau sudah sebagai ..."],["予算が限られているので、一円（　）無駄にできない。",["たりとも","ばかりか","ながらも","ずくめ"],"〜たりとも = sedikit pun."],["この景色は、この季節（　）の美しさだ。",["ならでは","ながら","ごとき","めく"],"〜ならでは = khas ..."],["結果の（　）、責任は私が取る。",["いかんにかかわらず","ことなしに","かたわら","そばから"],"〜いかんにかかわらず = apa pun ..."],["彼は会社勤めの（　）、小説を書いている。",["かたわら","あまり","はずみに","そばから"],"〜かたわら = sambil (kegiatan lain)."],["雨が降ろうが風が吹こう（　）、毎朝走る。",["が","も","ても","とも"],"〜ようが〜ようが = baik ... maupun ..."],["大切な人を失い、彼は泣く（　）泣けない思いだった。",["に","と","が","で"],"泣くに泣けない = ingin menangis pun tak bisa."],["ベルが鳴る（　）、子どもたちは教室を飛び出した。",["が早いか","ところを","にあたって","ばこそ"],"〜が早いか = begitu ..., langsung."],["締め切りは明日だ。今さら計画を変える（　）。",["わけにはいかない","にほかならない","までもない","にかたくない"],"〜わけにはいかない = tidak mungkin ..."],["彼の苦労は想像（　）。",["にかたくない","にたえない","を禁じえない","におよばない"],"想像にかたくない = mudah dibayangkan."],["被害者の話を聞いて、涙を（　）。",["禁じえなかった","かたくなかった","およばなかった","たえなかった"],"〜を禁じえない = tak bisa menahan ..."],["専門家（　）この問題は解決できない。",["でさえ","ならでは","とあって","ともなく"],"〜でさえ = bahkan ..."],["講師の体調不良（　）、本日の講演は中止とさせていただきます。",["につき","ときたら","ながら","なりに"],"〜につき = karena (pemberitahuan resmi)."]]},{"key":"star","kind":"star","sec":"gengo","group":"lang","n":4,"jp":"次の文の ★ に入る最もよいものを、1・2・3・4から一つ選びなさい。","id":"Menyusun kalimat (文の組み立て)","bank":[["この計画は",["予算の","問題を","抜きにしては","語れない"],"。","Rencana ini tidak bisa dibicarakan tanpa masalah anggaran."],["彼は",["社長の","意見に","反対する","どころか"],"積極的に賛成した。","Alih-alih menentang, dia justru aktif mendukung pendapat direktur."],["一度",["始めた","からには","最後まで","やり抜く"],"つもりだ。","Sekali sudah mulai, saya berniat menuntaskannya."],["子どもの",["ころから","あこがれて","いた","舞台に"],"ついに立つことができた。","Akhirnya bisa berdiri di panggung yang diimpikan sejak kecil."],["彼女の",["努力は","称賛に","値する","ものだ"],"。","Usahanya layak dipuji."],["経験が",["浅い","とはいえ","彼の","判断は"],"的確だった。","Meski pengalamannya sedikit, keputusannya tepat."],["この問題は",["専門家で","なければ","解決し","えない"],"だろう。","Masalah ini mungkin hanya bisa dipecahkan oleh ahli."],["彼は",["忙しい","にもかかわらず","毎週欠かさず","母に"],"電話をしている。","Meski sibuk, dia selalu menelepon ibunya setiap minggu."]]},{"key":"cloze","kind":"cloze","sec":"gengo","group":"lang","n":1,"jp":"次の文章を読んで、文章全体の趣旨を踏まえて、（1）から（3）の中に入る最もよいものを、1・2・3・4から一つ選びなさい。","id":"Tata bahasa dalam teks (文章の文法)","bank":[["私たちは予定表を埋めることに安心感を覚える。空いた時間があると、何かしなければならないような気がして（1）。しかし、本当に大切な考えが生まれるのは、むしろ何もしていない時間（2）ではないだろうか。散歩の途中や入浴中に、ふといいアイデアが浮かぶ経験は誰にでもあるはずだ。予定を詰め込むことは、そうした偶然の機会を自ら手放すこと（3）。あえて余白を残すことこそ、創造的な生き方への第一歩なのである。",[["ならない","おかない","やまない","すまない"],["のほう","によって","にとって","として"],["にほかならない","と言うまでもない","にかぎらない","を禁じえない"]],"(1) 気がしてならない = sangat merasa. (2) むしろ〜のほう = justru ... (3) 〜にほかならない = tidak lain adalah."]]},{"key":"short","kind":"read","sec":"gengo","group":"read","n":2,"jp":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1・2・3・4から一つ選びなさい。","id":"Pemahaman teks pendek (内容理解・短文)","bank":[["各部署 責任者各位\n来年度より、出張費の精算方法を変更いたします。これまで紙の申請書に領収書を添付していただいておりましたが、来年度からは精算システムへの入力と領収書の画像の提出のみとなります。なお、原本は精算完了後3か月間、各部署で保管してください。",[["この文書で求められていることは何か。",["システムに入力し、領収書の原本は一定期間保管すること","紙の申請書に領収書を添付すること","領収書の原本を経理部に送ること","出張の回数を減らすこと"],"Input ke sistem + kirim gambar; simpan asli 3 bulan."]]],["「早く答えを出せ」と急かされる場面は多い。だが、すぐに結論を出せない問いを抱え続けることにも意味はある。答えの出ない状態に耐えている間に、問いそのものが深まり、思いもよらない視点が見えてくることがあるからだ。性急な結論は、時にその可能性を閉ざしてしまう。",[["筆者の考えに合うものはどれか。",["すぐに答えを出さず考え続けることにも価値がある。","問題にはできるだけ早く結論を出すべきだ。","答えの出ない問いは考えても意味がない。","他人に急かされたら結論を出すべきだ。"],"Bertahan dengan pertanyaan juga bernilai."]]],["近年、商品の「物語」を売りにする企業が増えている。原料の産地や職人のこだわりを丁寧に伝えることで、消費者は単に物を買うのではなく、その背景にある価値に共感して購入するのだ。価格競争に巻き込まれず、長く支持される商品を生み出すには、品質に加え、こうした共感を得る工夫が欠かせない。",[["筆者によると、長く支持される商品を作るには何が必要か。",["品質に加えて、消費者の共感を得る工夫","価格をできるだけ下げること","原料を海外から輸入すること","職人の数を増やすこと"],"品質に加え、共感を得る工夫."]]]]},{"key":"mid","kind":"read","sec":"gengo","group":"read","n":1,"jp":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1・2・3・4から一つ選びなさい。","id":"Pemahaman teks sedang (内容理解・中文)","bank":[["近年、「効率」という言葉があらゆる場面で重視されている。仕事では無駄を省くことが求められ、家事や買い物にも時間を節約するための道具があふれている。確かに、効率化によって生まれた時間は、私たちの生活を豊かにする可能性を持っている。\nしかし、効率を追い求めるあまり、私たちは回り道の価値を忘れていないだろうか。目的地まで最短の道を選べば、途中の景色に目を留める余裕はない。遠回りしたからこそ出会えた人や発見した店が、のちに大きな意味を持つこともある。\nすべてを効率で測ることは、予想外の出会いを排除することでもある。時にはあえて無駄を楽しむ姿勢が、人生に深みを与えるのだと思う。",[["筆者は効率化についてどう述べているか。",["生活を豊かにする可能性がある。","生活を必ず豊かにする。","仕事でのみ必要だ。","家事には向いていない。"],"可能性を持っている = punya potensi."],["筆者が最も言いたいことは何か。",["無駄をあえて楽しむことが、人生を豊かにする。","最短の道を選ぶことが大切だ。","効率化はやめるべきだ。","新しい店を探すために遠回りすべきだ。"],"あえて無駄を楽しむ姿勢."]]]]},{"key":"long","kind":"read","sec":"gengo","group":"read","n":1,"jp":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1・2・3・4から一つ選びなさい。","id":"Pemahaman teks panjang (内容理解・長文)","bank":[["「好きなことを仕事にしなさい」という言葉をよく耳にする。好きなことなら苦労も苦にならず、長く続けられるというのがその理由だ。確かに、情熱を持てる仕事に就ける人は幸運だろう。\nだが、この言葉が若い人を苦しめている面もあるのではないか。「好きなこと」がはっきりしない人は多い。そうした人は、自分には情熱がないのだと思い込み、進路を決められずに悩む。また、好きなことを仕事にした結果、それが義務に変わり、かえって楽しめなくなったという話も珍しくない。\n私自身、今の仕事を始めたときには特に興味があったわけではなかった。しかし、続けていくうちに少しずつ技術が身につき、人から頼られるようになると、仕事が面白くなってきた。好きだから続けたのではなく、続けたから好きになったのである。\n「好き」は最初からそこにあるものとは限らない。何かに真剣に取り組む中で、後から育っていくものでもあるのだ。そう考えれば、今好きなことが見つからない人も、焦る必要はないだろう。",[["筆者は「好きなことを仕事にしなさい」という言葉の問題点を何だと言っているか。",["好きなことがわからない人を悩ませること","仕事の給料が低くなること","若者が仕事をすぐにやめること","好きなことしかしなくなること"],"Membuat bingung orang yang belum tahu apa yang disukai."],["筆者の仕事に対する気持ちはどう変わったか。",["続けていくうちに面白くなった。","最初は好きだったが、義務に変わった。","最初から好きで、今も変わらない。","人に頼られて、負担に感じるようになった。"],"続けたから好きになった."],["筆者が最も伝えたいことは何か。",["「好き」は取り組む中で後から育つこともある。","好きなことは早く見つけるべきだ。","好きなことは仕事にしないほうがいい。","情熱がない人は仕事を選ぶべきではない。"],"「好き」は後から育つ."]]]]},{"key":"togo","kind":"read","sec":"gengo","group":"read","n":1,"jp":"次のAとBの文章を読んで、後の問いに対する答えとして最もよいものを、1・2・3・4から一つ選びなさい。","id":"Pemahaman terpadu A & B (統合理解)","bank":[["A\n大学の授業はすべてオンラインで行うべきだ。移動の時間が省けるし、録画を見返すことで理解も深まる。遠方に住む人や働きながら学ぶ人にも学びの機会が広がる。教室に集まることにこだわる必要はもうないだろう。\n\nB\nオンライン授業の利便性は否定しない。だが、大学で得られるのは知識だけではない。授業の前後に交わす何気ない会話や、議論の中で生まれる緊張感こそ、人を成長させる。すべてをオンラインにすれば、そうした経験の場が失われてしまう。",[["AとBが共通して認めていることは何か。",["オンライン授業には便利さがある。","大学では知識だけが大切だ。","教室での議論は不要だ。","録画授業は理解を妨げる。"],"Keduanya mengakui kepraktisan kuliah online."],["AとBの主張はどう違うか。",["Aはすべてオンラインにすべきだと言い、Bは対面の価値を重視している。","Aは対面を重視し、Bはオンラインを勧めている。","AもBもすべてオンラインにすべきだと言っている。","AもBも録画授業に反対している。"],"A: semua online; B: menekankan nilai tatap muka."]]]]},{"key":"shucho","kind":"read","sec":"gengo","group":"read","n":1,"jp":"次の文章を読んで、後の問いに対する答えとして最もよいものを、1・2・3・4から一つ選びなさい。","id":"Memahami pendapat penulis (主張理解・長文)","bank":[["科学の進歩は、私たちの「わからない」を次々に「わかる」に変えてきた。雷の正体も、病気の原因も、かつては神の仕業と考えられていたものが、今では合理的に説明できる。こうした知の積み重ねが、人類の生活を飛躍的に向上させたことは疑いようがない。\nだが、何でも説明できるという感覚は、ある種の傲慢さを生み出しもする。説明できないものを「存在しない」と切り捨てたり、わずかなデータから安易に結論を導いたりする態度は、むしろ科学の精神に反するものだ。科学とは本来、「まだわかっていないこと」の大きさを自覚する営みであるはずだ。\n優れた科学者ほど、自分の知識の限界に敏感だという。一つの問いに答えると、その先に新たな問いがいくつも現れる。知れば知るほど、知らないことの広さに気づく。この謙虚さこそが、科学を前に進めてきた原動力なのではないだろうか。\n私たちに必要なのは、すべてをわかったつもりになることではなく、わからないことをわからないと認める勇気である。",[["筆者は科学の進歩についてどう評価しているか。",["人類の生活を大きく向上させた。","人間を傲慢にしただけだ。","まだ何も説明できていない。","神の存在を証明した。"],"飛躍的に向上させた."],["筆者が「科学の精神に反する」と考えているのはどのような態度か。",["説明できないものを安易に否定する態度","新たな問いを立て続ける態度","自分の知識の限界を認める態度","データを慎重に集める態度"],"切り捨てたり、安易に結論を導いたりする態度."],["筆者の主張に最も近いものはどれか。",["わからないことを認める謙虚さが大切だ。","科学ですべてを説明するべきだ。","科学者はもっと自信を持つべきだ。","説明できないことは考えないほうがよい。"],"わからないことを認める勇気."]]]]},{"key":"info","kind":"read","sec":"gengo","group":"read","n":1,"jp":"次の資料を読んで、下の問いに対する答えとして最もよいものを、1・2・3・4から一つ選びなさい。","id":"Mencari informasi (情報検索)","bank":[["国際交流奨学金 募集要項\n・対象：本学に在籍する2年生以上の留学生（大学院生を含む）\n・支給額：月額50,000円（大学院生は月額70,000円）\n・期間：1年間（4月〜翌年3月）\n・応募条件：前年度の成績評価平均（GPA）が3.0以上であること。他の奨学金を受けていないこと。\n・提出書類：申請書、成績証明書、指導教員の推薦書（大学院生のみ）\n・締め切り：2月28日（必着）",[["次のうち、応募できるのは誰か。",["GPA3.2で、他の奨学金を受けていない大学院1年の留学生","1年生でGPA3.5の留学生","GPA2.8で3年生の留学生","GPA3.4で、他の奨学金を受けている4年生の留学生"],"Mahasiswa pascasarjana termasuk; syarat GPA dan tanpa beasiswa lain terpenuhi."],["大学院生が応募する場合、提出が必要な書類はどれか。",["申請書、成績証明書、推薦書","申請書と成績証明書","申請書と推薦書","成績証明書と推薦書"],"Surat rekomendasi wajib khusus pascasarjana."]]]]},{"key":"kadai","kind":"listen","sec":"choukai","group":"listen","n":3,"jp":"まず質問を聞いてください。それから話を聞いて、問題用紙の1から4の中から、最もよいものを一つ選んでください。","id":"Memahami tugas (課題理解)","bank":[["会社で男の人と女の人が話しています。女の人はこのあと何をしますか。",[["m","例の取引先への提案書、目を通したよ。内容はいいんだけど、競合他社との比較が少し弱いかな。"],["f","そうですか。比較のデータを追加しましょうか。"],["m","いや、データは十分あるんだ。それを表にまとめて、ひと目で違いがわかるようにしてほしい。"],["f","わかりました。あと、価格のページはどうでしょう。"],["m","そこは部長の確認待ちだから、今は触らなくていいよ。"]],"女の人はこのあと何をしますか。",["比較データを表にまとめる","比較データを追加する","価格のページを直す","部長に確認を取る"],"Data cukup; rangkum dalam tabel."],["大学で女の学生と男の職員が話しています。女の学生はこのあとまず何をしますか。",[["f","来年度の交換留学に応募したいんですが。"],["m","締め切りは来月末ですね。語学試験のスコアはもうありますか。"],["f","先月受けて、結果待ちです。"],["m","結果は応募の後からでも出せます。それより、志望理由書を指導教員に見てもらう必要があるので、早めに書き始めたほうがいいですよ。先生もお忙しいでしょうから。"],["f","そうですね。じゃあ、まずそれから。"]],"女の学生はこのあとまず何をしますか。",["志望理由書を書く","語学試験を受ける","試験の結果を提出する","指導教員に会いに行く"],"Mulai menulis surat motivasi dulu."],["会社で部長と男の人が話しています。男の人は何をしなければなりませんか。",[["f","来週の研修の件、講師の先生への連絡は済んだ？"],["m","はい、日時はご了承いただきました。"],["f","会場の備品は？プロジェクターとか。"],["m","総務に確認済みです。あとは参加者への案内メールですね。"],["f","それは人事が出すことになったから、大丈夫。それより、先生の交通費の精算書類を用意しておいてくれる？当日書いていただくから。"],["m","承知しました。"]],"男の人は何をしなければなりませんか。",["講師の交通費の書類を準備する","参加者に案内メールを送る","講師に日時を連絡する","会場の備品を確認する"],"Email diurus HR; ia menyiapkan dokumen biaya transport."]]},{"key":"point","kind":"listen","sec":"choukai","group":"listen","n":3,"jp":"まず質問を聞いてください。そのあと、問題用紙のせんたくしを読んでください。それから話を聞いて、問題用紙の1から4の中から、最もよいものを一つ選んでください。","id":"Memahami poin (ポイント理解)","bank":[["男の人と女の人が話しています。女の人が転職を決めた一番の理由は何ですか。",[["m","転職するんだって？給料の面？"],["f","待遇は今とそんなに変わらないの。前から海外の案件に関わりたいと思ってて、今度の会社ならそれができるから。"],["m","なるほどね。通勤は遠くなるんじゃない？"],["f","うん、それは覚悟のうえ。"]],"女の人が転職を決めた一番の理由は何ですか。",["海外の仕事に関われるから","給料が上がるから","通勤が楽になるから","今の会社に不満があるから"],"Ingin terlibat proyek luar negeri."],["女の人と男の人が新しい図書館について話しています。男の人は何が問題だと言っていますか。",[["f","新しい図書館、すごくきれいになったよね。"],["m","うん、建物はね。蔵書も増えたし。ただ、閉館時間が早くなっちゃって、仕事帰りに寄れなくなったのが痛いんだよ。"]],"男の人は何が問題だと言っていますか。",["閉館時間が早くなったこと","建物が古いこと","蔵書が少ないこと","場所が遠いこと"],"Jam tutup lebih awal."],["ラジオで男の人が話しています。男の人は語学を身につけるために何が一番大切だと言っていますか。",[["m","語学を身につける秘訣をよく聞かれますが、教材選びや学習時間より、何より間違いを恐れずに使ってみることだと思います。完璧に話そうとすると、口が動かなくなりますから。"]],"男の人は何が一番大切だと言っていますか。",["間違いを恐れずに使うこと","よい教材を選ぶこと","学習時間を増やすこと","完璧に話すこと"],"何より = yang terpenting: berani salah."]]},{"key":"gaiyo","kind":"gaiyo","sec":"choukai","group":"listen","n":2,"jp":"問題用紙に何もいんさつされていません。この問題は、全体としてどんな内容かを聞く問題です。話の前に質問はありません。まず話を聞いてください。それから、質問とせんたくしを聞いて、1から4の中から、最もよいものを一つ選んでください。","id":"Memahami garis besar (概要理解)","bank":[["講演会で女の人が話しています。",[["f","都市部で一人暮らしをする高齢者が増える中、地域のつながりをどう保つかが課題になっています。ある町では、空き店舗を利用して、誰でも立ち寄れる『縁側カフェ』を開きました。お茶を飲みながら世間話をするだけですが、そこで顔見知りができ、体調の変化に周りが気づくきっかけにもなっています。行政の大きな制度だけでなく、こうした小さな場づくりが、孤立を防ぐ鍵になるのではないでしょうか。"]],"話のテーマは何ですか。",["地域で高齢者の孤立を防ぐ取り組み","空き店舗を減らす方法","カフェの経営の工夫","行政の新しい福祉制度"],"Tema: mencegah isolasi lansia lewat ruang kecil di komunitas."],["テレビで男の人が話しています。",[["m","最近、修理して長く使うことが見直されています。壊れたらすぐ買い替えるのが当たり前だった家電や衣類も、直して使う人 す『お直しサービス』。三つ目は、古い家具を引き取る『回収サービス』です。"],["f","うちのソファ、もう古いから、新しいのを買うなら引き取ってもらえると助かるね。"],["m","そうだね。僕はこの前買ったズボンが長すぎて困ってたんだ。"],["f","じゃあ、それも持って行こうよ。"]],"男の人はどのサービスを使いますか。",["お直しサービス","即日配達","回収サービス","どれも使わない"],"Celana pria terlalu panjang → layanan permak."]]}]}]};
const XL = Object.fromEntries(EXD.levels.map(l=>[l.id,l]));
const JNUM = ['１','２','３','４'];
const pick = (arr,n) => shuffle(arr).slice(0,n);
const brk = s => esc(s).replace(/\n/g,'<br>');
const lvKana = L => L.id==='n5'||L.id==='n4';
EXD.levels.forEach(L=>{ const c={}; L.parts.forEach(p=>{ c[p.sec]=(c[p.sec]||0)+1; p._no=c[p.sec]; }); });

function buildItems(L, pi){
  const p=L.parts[pi], out=[], base={pi, sec:p.sec, group:p.group, kind:p.kind, key:p.key};
  const add = (o, correct) => { const order=shuffle(o.opts); o.ans=order.indexOf(correct); o.opts=order; const it={...base,...o}; out.push(it); return it; };
  const sets = pick(p.bank, p.n);
  for(const x of sets){
    if(p.kind==='kr'){
      const [s,r,tr]=x, k=(s.match(/【(.+?)】/)||[])[1]||'';
      add({prompt:`<p class="exs">${uline(s)}</p>`, opts:[r,...uniq3(r, kanaVariants(r), p.bank.map(y=>y[1]))], expl:`${k} dibaca ${r}. ${tr}`}, r);
    } else if(p.kind==='hy'){
      if(x.length===4){ const [s,k,arti,tr]=x; add({prompt:`<p class="exs">${hideU(s,toHira(k))}</p>`, opts:[k,...uniq3(k,kataVariants(k),EXB_KATA)], expl:`${toHira(k)} ditulis ${k} (${arti}). ${tr}`}, k); }
      else { const [s,k,r,arti,tr]=x; add({prompt:`<p class="exs">${hideU(s,r)}</p>`, opts:[k,...uniq3(k,kanjiVariants(k),p.bank.filter(y=>y.length===5).map(y=>y[1]))], expl:`${r} ditulis ${k} (${arti}). ${tr}`}, k); }
    } else if(p.kind==='mc'){
      const [s,o,e]=x; add({prompt:`<p class="exs">${uline(s)}</p>`, opts:o.slice(), expl:e}, o[0]);
    } else if(p.kind==='use'){
      const [w,o,e]=x; add({prompt:`<p class="exs exword">${esc(w)}</p>`, opts:o.slice(), expl:e, long:true}, o[0]);
    } else if(p.kind==='star'){
      const [pre,pcs,suf,tr]=x, st=Math.random()<.5?1:2;
      const blanks=pcs.map((_,i)=>i===st?'<span class="bl st">★</span>':'<span class="bl"></span>').join('');
      add({prompt:`<p class="exs">${esc(pre)} ${blanks} ${esc(suf)}</p>`, opts:pcs.slice(), expl:`Urutan benar: ${pre} ${pcs.join(' ')} ${suf} — ${tr}`}, pcs[st]);
    } else if(p.kind==='cloze'){
      const [t,arr,e]=x;
      arr.forEach((o,k)=>{ const psg=brk(t).replace(/（(\d)）/g,(m,d)=>+d===k+1?`<mark>（${d}）</mark>`:`<b>（${d}）</b>`);
        add({passage:psg, prompt:`<p class="exs">（${k+1}）</p>`, opts:o.slice(), expl:e}, o[0]); });
    } else if(p.kind==='read'){
      const [t,qs]=x;
      qs.forEach(([q,o,e])=>add({passage:brk(t), prompt:`<p class="exs">${esc(q)}</p>`, opts:o.slice(), expl:e, long:true}, o[0]));
    } else if(p.kind==='listen' || p.kind==='gaiyo'){
      const [intro,lines,q,o,e]=x, o2=add({opts:o.slice(), expl:e, script:[intro,...lines.map(([s,t])=>spk(s)+t),'Q: '+q].join('\n'), qtext:q}, o[0]);
      o2.audio = p.kind==='gaiyo' ? [['n',intro],...lines,['n',q],...optAudio(o2.opts)]
               : p.key==='togoL' ? [['n',intro],...lines,['n',q]] : [['n',intro],['n',q],...lines,['n',q]];
      o2.audioOpts = p.kind==='gaiyo';
      o2.prompt = p.kind==='gaiyo' ? `<p class="exs">🎧</p>` : `<p class="exs">🎧 <span class="qhid">${esc(q)}</span></p>`;
    } else if(p.kind==='hatsuwa'){
      const [sit,q,o,e]=x, o2=add({opts:o.slice(), expl:e, script:q, qtext:q}, o[0]);
      o2.audio=[['n',q],...optAudio(o2.opts)]; o2.audioOpts=true;
      o2.prompt=`<div class="expic">🖼 <b>Gambar:</b> ${esc(sit)}</div>`;
    } else if(p.kind==='sokuji'){
      const [line,o,e]=x, o2=add({opts:o.slice(), expl:e, script:line, qtext:line}, o[0]);
      o2.audio=[[Math.random()<.5?'m':'f',line],...optAudio(o2.opts)]; o2.audioOpts=true; o2.prompt=`<p class="exs">🎧</p>`;
    }
  }
  return out;
}
const spk = s => s==='m'?'男：':s==='f'?'女：':s==='g'?'女2：':'';
const optAudio = opts => opts.map((o,i)=>['n',`${i+1}。${o}`]);
const EXB_KATA = (XL.n5.parts.find(p=>p.kind==='hy')||{bank:[]}).bank.filter(y=>y.length===4).map(y=>y[1]);

function makeExam(L, only){
  const items=[];
  L.parts.forEach((p,pi)=>{ if(!only || p.sec===only) items.push(...buildItems(L,pi)); });
  return items;
}
const partLabel = (L,p) => (lvKana(L)?'もんだい':'問題')+p._no;

function exStart(L, only){
  EX={L, items:makeExam(L,only), answers:[], idx:0, start:Date.now(), only, help:store.get('exhelp',false), practice:store.get('exmode','latihan')==='latihan'};
  VIEW='examq'; exQ();
  clearInterval(exTimer); exTimer=setInterval(()=>{ const t=document.getElementById('extime'); if(t) t.textContent=fmtTime(Date.now()-EX.start); },1000);
}
function exQ(){
  const L=EX.L, q=EX.items[EX.idx], p=L.parts[q.pi], n=EX.items.length, sec=L.secs.find(s=>s.key===q.sec);
  const done = EX.practice && EX.answers[EX.idx]!=null, my=EX.answers[EX.idx];
  const showOptText = !q.audioOpts || EX.help || done;
  const okCount = EX.practice ? EX.items.reduce((a,x,i)=>a+(EX.answers[i]===x.ans?1:0),0) : 0;
  app.innerHTML = `
    <div class="top"><button class="x" id="exquit" aria-label="Keluar">✕</button><div class="bar"><i style="width:${EX.answers.filter(a=>a!=null).length/n*100}%"></i></div><span class="num" id="extime">${fmtTime(Date.now()-EX.start)}</span></div>
    ${EX.practice?`<span class="num">Mode latihan · benar ${okCount} dari ${EX.answers.filter(a=>a!=null).length} dijawab</span>`:''}
    <div class="exhead"><span class="tag">${L.title} · ${esc(sec.jp)}</span><b>${partLabel(L,p)}</b> <span class="exinstr">${esc(p.jp)}</span><span class="num">${esc(p.id)}</span></div>
    ${q.passage?`<div class="expass">${q.passage}</div>`:''}
    <div class="card exq ${EX.help?'help':''}"><span class="num exn">${EX.idx+1} / ${n}</span>
      ${q.audio?`<button class="bigplay" id="play" aria-label="Putar audio">▶</button>`:''}
      ${q.prompt}${q.audio&&EX.help&&q.qtext&&q.kind!=='listen'?`<p class="exs qshow">${esc(q.qtext)}</p>`:''}</div>
    <div class="exopts">${q.opts.map((o,i)=>`<button type="button" class="exopt ${q.long?'long':''} ${!done&&my===i?'sel':''} ${done&&i===q.ans?'good':''} ${done&&my===i&&i!==q.ans?'bad':''}" data-i="${i}" ${done?'disabled':''}><span class="exnum">${i+1}</span><span>${showOptText?esc(o):'<span class="num">(dibacakan)</span>'}</span></button>`).join('')}</div>
    ${done?`<div class="exfeed ${my===q.ans?'good':'bad'}"><div class="verdict"><div class="stamp">${my===q.ans?'正解':'残念'}</div><div><b>${my===q.ans?'Benar!':'Kurang tepat'}</b><span>Jawaban: ${q.ans+1}. ${esc(q.opts[q.ans])}</span></div></div>
      ${q.script?`<div class="expass">${brk(q.script)}</div>`:''}<p class="sub">${esc(q.expl)}</p></div>`:''}
    <div class="exconfirm" id="exconfirm" hidden></div>`;
  exfoot.hidden=false;
  exfoot.className='foot'; exfoot.innerHTML=`<div class="in exnav"><button class="btn ghost" id="exprev" ${EX.idx===0?'disabled':''}>‹ Sebelumnya</button>${EX.idx<n-1?`<button class="btn" id="exnext">Berikutnya ›</button>`:`<button class="btn" id="exfin">Selesai</button>`}</div>`;
  app.querySelectorAll('.exopt').forEach(b=>b.onclick=()=>{ if(EX.practice){ if(EX.answers[EX.idx]!=null) return; EX.answers[EX.idx]=+b.dataset.i; try{speechSynthesis.cancel()}catch(e){} exQ(); const fb=app.querySelector('.exfeed'); if(fb) fb.scrollIntoView({block:'nearest'}); return; } EX.answers[EX.idx]=+b.dataset.i; app.querySelectorAll('.exopt').forEach(x=>x.classList.toggle('sel',x===b)); app.querySelector('.top .bar>i').style.width=EX.answers.filter(a=>a!=null).length/n*100+'%'; });
  const pl=app.querySelector('#play'); if(pl){ pl.onclick=()=>playAudio(q.audio); if(!done) playAudio(q.audio); } else { try{speechSynthesis.cancel()}catch(e){} }
  app.querySelector('#exquit').onclick=()=>exConfirm('quit');
  exfoot.querySelector('#exprev').onclick=()=>{ if(EX.idx>0){EX.idx--; exQ();} };
  const nx=exfoot.querySelector('#exnext'); if(nx) nx.onclick=()=>{ EX.idx++; exQ(); };
  const fn=exfoot.querySelector('#exfin'); if(fn) fn.onclick=()=>exConfirm('finish');
  window.scrollTo(0,0);
}
function exResult(){
  clearInterval(exTimer); exfoot.hidden=true; try{speechSynthesis.cancel()}catch(e){}
  const L=EX.L, items=EX.items, ok=i=>EX.answers[i]===items[i].ans;
  const grp={}; items.forEach((q,i)=>{ const g=grp[q.group]||(grp[q.group]={c:0,n:0}); g.n++; if(ok(i)) g.c++; });
  const tot=items.filter((_,i)=>ok(i)).length, percent=Math.round(tot/items.length*100);
  let score=null, pass=null; const gs=[];
  if(!EX.only){
    score=0; pass=true;
    for(const g of L.groups){ const r=grp[g.key]||{c:0,n:1}; const s=Math.round(r.c/r.n*g.max); gs.push({...g,s}); score+=s; if(s<g.min) pass=false; }
    if(score<L.pass_) pass=false;
  }
  const label = EX.only ? L.secs.find(s=>s.key===EX.only).id : 'Simulasi lengkap';
  const hist=store.get('exhist',[]); const d=new Date();
  hist.unshift({lv:L.id, date:d.toLocaleDateString('id-ID',{day:'numeric',month:'short'})+' '+d.toTimeString().slice(0,5), label, pct:percent, score, pass}); store.set('exhist',hist.slice(0,40));
  VIEW='examr';
  const byPart={}; items.forEach((q,i)=>{ const b=byPart[q.pi]||(byPart[q.pi]={c:0,n:0}); b.n++; if(ok(i)) b.c++; });
  app.innerHTML = `
    <div><div class="eyebrow">Simulasi ${L.title} · ${esc(label)}</div>
      <h1>${score!=null?(pass?'Perkiraan: LULUS 🎉':'Perkiraan: belum lulus'):`${tot} / ${items.length} benar`}</h1>
      <span class="num">Waktu ${fmtTime(Date.now()-EX.start)} · ${tot}/${items.length} benar (${percent}%)</span></div>
    ${score!=null?`<div class="score" style="grid-template-columns:repeat(${gs.length+1},1fr)"><div><b>${score}</b><span>Total / 180</span></div>${gs.map(g=>`<div><b class="${g.s<g.min?'lo':''}">${g.s}</b><span>${esc(g.label)} / ${g.max}</span></div>`).join('')}</div>
      <p class="sub">Syarat lulus ${L.title}: total minimal ${L.pass_}, dan setiap bagian minimal ${gs.map(g=>g.min).join('/')}. Angka ini perkiraan kasar dari persentase benar; skor JLPT asli memakai skala khusus.</p>`:''}
    <div class="panel">${L.parts.map((p,pi)=>byPart[pi]?`<div class="statrow" style="--c:var(--${L.id})"><b>${partLabel(L,p)} · ${esc(p.id)}</b><span class="num">${byPart[pi].c} / ${byPart[pi].n}</span><span class="bar"><i style="width:${pct(byPart[pi].c,byPart[pi].n)}%"></i></span></div>`:'').join('')}</div>
    <div class="row" style="gap:8px"><button class="btn ghost sm" data-f="wrong" aria-pressed="true">Yang salah (${items.length-tot})</button><button class="btn ghost sm" data-f="all" aria-pressed="false">Semua soal</button></div>
    <div id="exrev"></div>
    <button class="btn" id="exagain">Simulasi baru (soal diacak)</button>
    <button class="btn ghost" id="exhome">Kembali</button>`;
  const render=f=>{
    app.querySelector('#exrev').innerHTML = items.map((q,i)=>({q,i})).filter(({i})=>f==='all'||!ok(i)).map(({q,i})=>`
      <div class="panel exrv ${ok(i)?'good':'bad'}">
        <span class="num">${i+1}. ${partLabel(L,L.parts[q.pi])} · ${esc(L.parts[q.pi].id)}</span>
        ${q.passage?`<details><summary>Lihat teks</summary><div class="expass">${q.passage}</div></details>`:''}
        ${q.prompt.replace(/class="qhid"/g,'')}
        ${q.script?`<div class="expass">${brk(q.script)}</div><button class="btn ghost sm" data-replay="${i}">▶ Putar lagi</button>`:''}
        <ol class="exans">${q.opts.map((o,j)=>`<li class="${j===q.ans?'c':''} ${EX.answers[i]===j&&j!==q.ans?'w':''}">${esc(o)}${j===q.ans?' ✓':''}${EX.answers[i]===j&&j!==q.ans?' ✗ (jawabanmu)':''}</li>`).join('')}</ol>
        ${EX.answers[i]==null?'<span class="num">Tidak dijawab</span>':''}
        <p class="sub">${esc(q.expl)}</p>
      </div>`).join('') || '<p class="empty">Tidak ada soal yang salah. すごい！</p>';
    app.querySelectorAll('[data-replay]').forEach(b=>b.onclick=()=>playAudio(items[+b.dataset.replay].audio));
  };
  render('wrong');
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ app.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x===b)); render(b.dataset.f); });
  app.querySelector('#exagain').onclick=()=>exStart(L,EX.only);
  app.querySelector('#exhome').onclick=()=>exHome();
  window.scrollTo(0,0);
}
