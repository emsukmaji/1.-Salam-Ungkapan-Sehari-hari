かくにん して みます。","Baik. Saya akan cek ke restoran apakah bisa disediakan minuman ringan dan makanan halal juga.",[["はい。お酒を 飲まない 人にも、無理に 飲ませる ように します。","Baik. Yang tidak minum alkohol pun akan saya usahakan paksa minum."],["はい。飲まない 人は 招待しない ことに します。","Baik. Yang tidak minum tidak akan saya undang."]]],["p","さすが。じゃあ、よろしく 頼むよ。","さすが。じゃあ、よろしく たのむ よ。","Hebat. Kalau begitu, saya serahkan padamu."]]},{"t":"Lapor kebocoran ke pemilik apartemen","s":"Langit-langit kamarmu bocor, kamu mendatangi pemilik apartemen.","p":"田村さん","e":"👵","l":[["u","田村さん、こんにちは。203号室の {N}です。ちょっと ご相談が あるんですが。","たむら さん、こんにちは。にまるさん ごうしつ の {N} です。ちょっと ごそうだん が ある ん です が。","Bu Tamura, selamat siang. Saya {N} dari kamar 203. Ada yang ingin saya bicarakan.",[["田村さん、こんにちは。今日から 203号室に 住んで あげます。","Bu Tamura, selamat siang. Mulai hari ini saya mau tinggal di kamar 203 demi Ibu."],["田村さん、おやすみなさい。203号室の {N}です。","Bu Tamura, selamat tidur. Saya {N} dari kamar 203."]]],["p","あら、{N}さん。どうしたの？","あら、{N} さん。どう した の？","Oh, {N}-san. Ada apa?"],["u","実は、昨日の 夜から 天井から 水が 漏れて いるんです。","じつ は、きのう の よる から てんじょう から みず が もれて いる ん です。","Sebenarnya, sejak tadi malam ada air yang bocor dari langit-langit.",[["実は、昨日の 夜から 天井で 水を 飲んで いるんです。","Sebenarnya, sejak tadi malam saya minum air di langit-langit."],["実は、天井から 水が 漏れて ほしいんです。","Sebenarnya, saya ingin air bocor dari langit-langit."]]],["p","まあ、大変！ 上の 部屋の 人が 何か こぼしたのかしら。","まあ、たいへん！ うえ の へや の ひと が なに か こぼした の かしら。","Wah, gawat! Apa penghuni kamar atas menumpahkan sesuatu, ya."],["u","わかりませんが、雨の 日に ひどく なる ようです。床が ぬれて しまって、困って います。","わかりません が、あめ の ひ に ひどく なる よう です。ゆか が ぬれて しまって、こまって います。","Saya tidak tahu, tapi sepertinya makin parah saat hujan. Lantainya jadi basah, saya kerepotan.",[["わかりませんが、晴れて いるので、床が 乾いて 助かって います。","Saya tidak tahu, tapi karena cerah, lantainya kering jadi terbantu."],["わかりませんが、水が 漏れて いるので、とても 満足して います。","Saya tidak tahu, tapi karena airnya bocor, saya sangat puas."]]],["p","それは 申し訳ないわね。すぐ 業者に 連絡するわ。","それ は もうしわけない わ ね。すぐ ぎょうしゃ に れんらく する わ。","Wah, maaf sekali ya. Saya segera hubungi tukang."],["u","ありがとうございます。修理の 費用は どなたが 負担する ことに なりますか。","ありがとう ございます。しゅうり の ひよう は どなた が ふたん する こと に なります か。","Terima kasih. Biaya perbaikannya nanti ditanggung siapa?",[["ありがとうございます。修理は しなくても 構いません。水が 好きなので。","Terima kasih. Tidak diperbaiki pun tidak apa-apa. Saya suka air."],["ありがとうございます。業者は どなたが 召し上がりますか。","Terima kasih. Tukangnya siapa yang akan menyantap?"]]],["p","建物の 問題だから、もちろん こちらで 払うわよ。","たてもの の もんだい だ から、もちろん こちら で はらう わ よ。","Karena itu masalah bangunan, tentu saja saya yang bayar."],["u","安心しました。業者の 方が 来る 日が 決まったら、教えて いただけますか。","あんしん しました。ぎょうしゃ の かた が くる ひ が きまったら、おしえて いただけます か。","Lega rasanya. Kalau hari kedatangan tukangnya sudah pasti, bisa tolong kabari saya?",[["安心しました。業者の 方が 来ない ように して ください。","Lega rasanya. Tolong usahakan supaya tukangnya tidak datang."],["安心しました。業者の 方に 来られると 迷惑です。","Lega rasanya. Kalau tukangnya datang, saya terganggu."]]],["p","ええ、決まったら すぐ 連絡するわね。","ええ、きまったら すぐ れんらく する わ ね。","Ya, begitu pasti langsung saya kabari, ya."]]},{"t":"Menukar barang rusak di toko","s":"Mouse yang kamu beli minggu lalu rusak, kamu kembali ke toko elektronik.","p":"店員","e":"👨","l":[["u","すみません、先週 ここで 買った マウスなんですが、ボタンが 反応しないんです。","すみません、せんしゅう ここ で かった マウス な ん です が、ボタン が はんのう しない ん です。","Permisi, ini mouse yang saya beli di sini minggu lalu, tombolnya tidak merespons.",[["すみません、先週 ここで 売った マウスなんですが、とても 調子が いいんです。","Permisi, ini mouse yang saya jual di sini minggu lalu, kondisinya bagus sekali."],["すみません、来週 ここで 買う マウスが 壊れて いました。","Permisi, mouse yang akan saya beli di sini minggu depan sudah rusak."]]],["p","大変 申し訳ございません。レシートは お持ちでしょうか。","たいへん もうしわけ ございません。レシート は おもち でしょう か。","Mohon maaf sekali. Apakah Anda membawa struknya?"],["u","はい、こちらです。新しい ものと 交換して いただけますか。","はい、こちら です。あたらしい もの と こうかん して いただけます か。","Ya, ini. Bisakah ditukar dengan yang baru?",[["はい、こちらです。レシートと 交換して あげます。","Ya, ini. Saya tukarkan dengan struk untuk Anda."],["いいえ、レシートは 食べて しまいました。","Tidak, struknya sudah telanjur saya makan."]]],["p","確認いたします。…保証期間内ですので、交換させて いただきます。","かくにん いたします。…ほしょう きかんない です ので、こうかん させて いただきます。","Saya periksa dulu. ...Masih dalam masa garansi, jadi akan kami tukar."],["u","よかった。同じ 商品は 在庫が ありますか。","よかった。おなじ しょうひん は ざいこ が あります か。","Syukurlah. Apakah barang yang sama ada stoknya?",[["残念です。同じ 商品は 二度と 見たく ありません。","Sayang sekali. Saya tidak mau melihat barang yang sama lagi."],["よかった。同じ 商品の 在庫を 削除して ください。","Syukurlah. Tolong hapus stok barang yang sama."]]],["p","申し訳ございません。ただいま 在庫を 切らして おりまして、取り寄せに 三日ほど かかります。","もうしわけ ございません。ただいま ざいこ を きらして おりまして、とりよせ に みっか ほど かかります。","Mohon maaf. Saat ini stoknya sedang habis, pemesanannya butuh sekitar tiga hari."],["u","仕事で 毎日 使うので、なるべく 早い ほうが いいんですが…。ほかの 種類でも 構いません。","しごと で まいにち つかう ので、なるべく はやい ほう が いい ん です が…。ほか の しゅるい でも かまいません。","Saya memakainya setiap hari untuk kerja, jadi lebih cepat lebih baik... Jenis lain pun tidak apa-apa.",[["三日も 待つなら、この 店を 訴えます。","Kalau harus menunggu tiga hari, saya akan menuntut toko ini."],["仕事で 毎日 使うので、なるべく 遅い ほうが いいです。","Karena saya pakai setiap hari untuk kerja, lebih lambat lebih baik."]]],["p","それでしたら、こちらの 機種は いかがでしょうか。価格は 少し 高いですが、差額は いただきません。","それ でしたら、こちら の きしゅ は いかが でしょう か。かかく は すこし たかい です が、さがく は いただきません。","Kalau begitu, bagaimana dengan model ini? Harganya sedikit lebih mahal, tapi selisihnya tidak kami tagih."],["u","本当ですか。じゃあ、それで お願いします。対応して くださって、ありがとうございます。","ほんとう です か。じゃあ、それ で おねがい します。たいおう して くださって、ありがとう ございます。","Benarkah? Kalau begitu, yang itu saja. Terima kasih sudah menangani.",[["本当ですか。じゃあ、差額を 二倍 払わせて ください。","Benarkah? Kalau begitu, izinkan saya membayar selisihnya dua kali lipat."],["本当ですか。対応して さしあげて、ありがとうございます。","Benarkah? Terima kasih sudah saya layani."]]],["p","とんでもございません。ご迷惑を おかけしました。","とんでも ございません。ごめいわく を おかけ しました。","Sama sekali tidak. Mohon maaf atas ketidaknyamanannya."]]},{"t":"Melaporkan insiden phishing","s":"Seorang karyawan terkena email phishing, kamu segera melapor ke atasanmu.","p":"高橋部長","e":"👩‍💼","l":[["u","高橋部長、至急 ご報告したい ことが あります。","たかはし ぶちょう、しきゅう ごほうこく したい こと が あります。","Bu Takahashi, ada yang ingin segera saya laporkan.",[["高橋部長、至急 報告して いただきたいです。","Bu Takahashi, saya ingin Ibu segera melapor kepada saya."],["高橋部長、急ぎでは ないので、また 来年 話します。","Bu Takahashi, tidak mendesak, jadi nanti tahun depan saja saya bicarakan."]]],["p","どうしたの？","どう した の？","Ada apa?"],["u","経理部の 社員が 怪しい メールの リンクを クリックして しまったそうです。","けいりぶ の しゃいん が あやしい メール の リンク を クリック して しまった そう です。","Katanya seorang karyawan bagian akuntansi telanjur mengklik link di email yang mencurigakan.",[["経理部の 社員に 怪しい メールを 送らせました。","Saya menyuruh karyawan bagian akuntansi mengirim email mencurigakan."],["経理部の 社員が 怪しい メールを 削除したので、何も 問題 ありません。","Karyawan bagian akuntansi sudah menghapus email mencurigakannya, jadi tidak ada masalah apa-apa."]]],["p","いつ？ パスワードは 入力されたの？","いつ？ パスワード は にゅうりょく された の？","Kapan? Apakah kata sandinya sudah dimasukkan?"],["u","三十分ほど 前です。本人に よると、ログイン画面に パスワードを 入れて しまった らしいです。","さんじゅっぷん ほど まえ です。ほんにん に よる と、ログイン がめん に パスワード を いれて しまった らしい です。","Sekitar 30 menit lalu. Menurut yang bersangkutan, sepertinya dia telanjur memasukkan kata sandi di layar login.",[["三十分ほど 後に クリックする 予定です。","Rencananya akan diklik sekitar 30 menit lagi."],["パスワードは 私が 本人の 代わりに 入れて あげました。","Kata sandinya saya yang masukkan menggantikan dia."]]],["p","すぐ その アカウントの パスワードを 変更させて。","すぐ その アカウント の パスワード を へんこう させて。","Segera suruh dia ganti kata sandi akun itu."],["u","はい、もう 変更させました。それから、パソコンも ネットワークから 切り離しました。","はい、もう へんこう させました。それ から、パソコン も ネットワーク から きりはなしました。","Ya, sudah saya suruh ganti. Lalu PC-nya juga sudah saya putuskan dari jaringan.",[["はい、パスワードは そのままに して おきました。","Ya, kata sandinya saya biarkan saja seperti itu."],["はい、その パソコンを ほかの 社員に 貸して あげました。","Ya, PC itu sudah saya pinjamkan ke karyawan lain."]]],["p","適切な 対応ね。ほかの 社員にも 同じ メールが 届いて いる 可能性は？","てきせつ な たいおう ね。ほか の しゃいん に も おなじ メール が とどいて いる かのうせい は？","Penanganan yang tepat. Ada kemungkinan karyawan lain juga menerima email yang sama?"],["u","今 調べて いる ところですが、少なくとも 五人に 届いて いる ようです。","いま しらべて いる ところ です が、すくなくとも ごにん に とどいて いる よう です。","Sedang saya selidiki, tapi sepertinya email itu sampai ke setidaknya lima orang.",[["調べる 必要は ないので、何も して いません。","Tidak perlu diselidiki, jadi saya tidak melakukan apa-apa."],["少なくとも 五人に 同じ メールを 送って おきました。","Saya sudah mengirim email yang sama ke setidaknya lima orang."]]],["p","じゃあ、全社員に 注意を 呼びかける メールを 出して。","じゃあ、ぜんしゃいん に ちゅうい を よびかける メール を だして。","Kalau begitu, kirim email peringatan ke seluruh karyawan."],["u","かしこまりました。文面を 作成したら、送る 前に 一度 確認して いただけますか。","かしこまりました。ぶんめん を さくせい したら、おくる まえ に いちど かくにん して いただけます か。","Baik. Setelah drafnya saya buat, bisakah Ibu memeriksanya sekali sebelum dikirim?",[["かしこまりました。文面は 部長が 作成して ください。私は 帰ります。","Baik. Drafnya Ibu saja yang buat. Saya pulang."],["かしこまりました。確認しないで、来週 送る ことに します。","Baik. Tanpa diperiksa, saya putuskan kirim minggu depan saja."]]],["p","ええ、10分以内に お願い。報告書も 今日中に まとめてね。","ええ、じゅっぷん いない に おねがい。ほうこくしょ も きょうじゅう に まとめて ね。","Ya, tolong dalam 10 menit. Laporannya juga dirangkum hari ini, ya."]]},{"t":"Menolak ajakan minum dengan sopan","s":"Seniormu mengajak minum sepulang kerja, tapi kamu sedang fokus belajar.","p":"伊藤先輩","e":"🧑‍💼","l":[["p","{N}さん、今夜 みんなで 飲みに 行くんだけど、一緒に どう？","{N} さん、こんや みんな で のみ に いく ん だ けど、いっしょ に どう？","{N}-san, malam ini kami semua mau pergi minum, ikut yuk?"],["u","誘って いただいて ありがとうございます。せっかくですが、今日は ちょっと 用事が ありまして…。","さそって いただいて ありがとう ございます。せっかく です が、きょう は ちょっと ようじ が ありまして…。","Terima kasih sudah mengajak. Sayang sekali, hari ini saya ada sedikit urusan...",[["誘って あげて ありがとうございます。今日は 行きません。","Terima kasih sudah saya ajak. Hari ini saya tidak pergi."],["せっかくですが、伊藤さんと 飲むのは 嫌です。","Sayang sekali, saya tidak suka minum bersama Ito-san."]]],["p","そっか、残念。何か あるの？","そっか、ざんねん。なに か ある の？","Oh, sayang sekali. Ada acara apa?"],["u","日本語能力試験が 来月なので、今月は 夜 勉強する ように して いるんです。","にほんご のうりょく しけん が らいげつ な ので、こんげつ は よる べんきょう する よう に して いる ん です。","Ujian JLPT-nya bulan depan, jadi bulan ini saya membiasakan belajar tiap malam.",[["日本語能力試験が 先月 終わったので、毎晩 勉強しなければ なりません。","Ujian JLPT sudah selesai bulan lalu, jadi saya harus belajar tiap malam."],["毎晩 飲み会ばかり なので、今日も 行きたいんです。","Tiap malam acara minum terus, jadi hari ini pun saya ingin ikut."]]],["p","そうなんだ。えらいね。何級を 受けるの？","そう な ん だ。えらい ね。なんきゅう を うける の？","Oh begitu. Hebat. Ambil level berapa?"],["u","N3です。読解が 苦手なので、毎日 記事を 読む 練習を して います。","エヌさん です。どっかい が にがて な ので、まいにち きじ を よむ れんしゅう を して います。","N3. Saya lemah di bagian membaca, jadi setiap hari latihan membaca artikel.",[["N3です。読解が 得意なので、本は 一度も 読んだ ことが ありません。","N3. Saya jago membaca, jadi belum pernah membaca buku sekali pun."],["N3を 受けさせて あげます。","Saya akan membiarkan Anda ikut ujian N3."]]],["p","頑張って。試験が 終わったら、お祝いに 飲みに 行こう。","がんばって。しけん が おわったら、おいわい に のみ に いこう。","Semangat. Setelah ujiannya selesai, ayo minum untuk merayakan."],["u","はい、ぜひ。その 時は 誘って ください。","はい、ぜひ。その とき は さそって ください。","Ya, tentu. Nanti tolong ajak saya, ya.",[["はい、ぜひ。その 時は 誘わないで ください。","Ya, tentu. Nanti jangan ajak saya."],["いいえ、試験が 終わっても、絶対に 行きません。","Tidak, meskipun ujian selesai, saya tidak akan pergi."]]],["p","もちろん。じゃあ、お疲れさま。","もちろん。じゃあ、おつかれさま。","Tentu. Kalau begitu, sampai besok."]]}],"n2":[{"t":"Melaporkan gangguan jaringan","s":"Pagi ini jaringan kantor bermasalah. Kamu melapor kepada atasan.","p":"部長","e":"👔","l":[["u","部長、ご報告が ございます。今朝 9時ごろから 社内ネットワークに 障害が 発生して おります。","ぶちょう、ごほうこく が ございます。けさ くじ ごろ から しゃない ネットワーク に しょうがい が はっせい して おります。","Pak, ada yang perlu saya laporkan. Sejak sekitar jam 9 pagi ini terjadi gangguan pada jaringan internal.",[["部長、ご報告を いただきます。ネットワークは 順調です。","Pak, saya terima laporannya. Jaringan lancar."],["部長、ネットワークが 壊れたのは 部長の せいです。","Pak, jaringan rusak itu salah Bapak."]]],["p","影響の 範囲は どのくらいですか。","えいきょう の はんい は どの くらい です か。","Seberapa luas dampaknya?"],["u","3階の 営業部のみ 接続できない 状況です。原因は スイッチの 故障と 考えられます。","さんがい の えいぎょうぶ のみ せつぞく できない じょうきょう です。げんいん は スイッチ の こしょう と かんがえられます。","Hanya divisi sales di lantai 3 yang tidak bisa terhubung. Penyebabnya diduga kerusakan switch.",[["全社の 電気が 止まりましたが、原因は 調べる 必要は ありません。","Listrik seluruh kantor mati, tapi penyebabnya tidak perlu diselidiki."],["3階の 営業部は 接続しすぎて います。","Divisi sales di lantai 3 terlalu banyak terhubung."]]],["p","復旧の 見込みは？","ふっきゅう の みこみ は？","Perkiraan pulihnya kapan?"],["u","予備の 機器と 交換すれば、1時間 以内に 復旧できる 見込みです。","よび の きき と こうかん すれば、いちじかん いない に ふっきゅう できる みこみ です。","Jika diganti dengan perangkat cadangan, diperkirakan pulih dalam satu jam.",[["予備の 機器が ないので、復旧しない ことに しました。","Karena tidak ada perangkat cadangan, saya putuskan tidak memulihkannya."],["1時間 以内に 復旧しました ので、交換する 見込みです。","Sudah pulih dalam satu jam, jadi diperkirakan akan diganti."]]],["p","わかった。お客様に 影響が 出ないよう、迅速に 対応して ください。","わかった。おきゃくさま に えいきょう が でない よう、じんそく に たいおう して ください。","Oke. Tangani dengan cepat agar tidak berdampak ke pelanggan."],["u","承知いたしました。復旧しだい、改めて ご報告いたします。","しょうち いたしました。ふっきゅう しだい、あらためて ごほうこく いたします。","Baik, Pak. Begitu pulih, saya akan melapor kembali.",[["承知しました。復旧しても、報告は しません。","Baik. Meski pulih, saya tidak akan melapor."],["かしこまりました。お客様に 謝って ください。","Baik. Tolong minta maaf ke pelanggan."]]]]},{"t":"Mengatur ulang jadwal dengan klien","s":"Klien menelepon untuk mengubah jadwal pertemuan.","p":"山本さん（取引先）","e":"📞","l":[["p","お世話に なっております。ABC商事の 山本です。","おせわ に なって おります。エービーシー しょうじ の やまもと です。","Selamat siang, saya Yamamoto dari ABC Trading."],["u","お世話に なっております。{N}でございます。","おせわ に なって おります。{N} で ございます。","Selamat siang, dengan {N}.",[["はじめまして。{N}だよ。","Salam kenal. Aku {N}.","terlalu santai"],["お世話を して おります。{N}さまです。","Saya sedang merawat. Ini Bapak {N}.","salah"]]],["p","来週の 打ち合わせの 件ですが、日程を 変更させて いただけないでしょうか。","らいしゅう の うちあわせ の けん です が、にってい を へんこう させて いただけない でしょう か。","Mengenai rapat minggu depan, bolehkah kami mengubah jadwalnya?"],["u","かしこまりました。ご都合の よい 日時を 教えて いただけますか。","かしこまりました。ごつごう の よい にちじ を おしえて いただけます か。","Baik. Boleh diberi tahu tanggal dan jam yang cocok untuk Anda?",[["いいえ、変更は 絶対に 認めません。","Tidak, perubahan sama sekali tidak kami terima."],["かしこまりました。では、打ち合わせは 中止に しましょう。","Baik. Kalau begitu rapatnya kita batalkan saja."]]],["p","木曜日の 午後は いかがでしょうか。","もくようび の ごご は いかが でしょう か。","Bagaimana kalau Kamis siang?"],["u","木曜日の 午後でしたら、2時以降であれば 大丈夫です。","もくようび の ごご でしたら、にじ いこう で あれば だいじょうぶ です。","Kalau Kamis siang, setelah jam 2 kami bisa.",[["木曜日の 午後は 2時以前に 終わって しまいました。","Kamis siang sudah selesai sebelum jam 2."],["木曜日は 午後ですので、大丈夫では ありません。","Karena Kamis itu siang, jadi tidak bisa."]]],["p","では、3時で お願いいたします。","では、さんじ で おねがい いたします。","Kalau begitu, jam 3, ya."],["u","承知いたしました。木曜日 3時に お待ちして おります。","しょうち いたしました。もくようび さんじ に おまち して おります。","Baik. Kami tunggu hari Kamis jam 3.",[["承知しました。3時に お待たせします。","Baik. Saya akan membuat Anda menunggu jam 3."],["じゃあ、3時ね。よろしく。","Oke, jam 3 ya.","terlalu santai"]]]]},{"t":"Membahas usulan sistem baru","s":"Rekan kerjamu meminta pendapat tentang sistem absensi baru.","p":"同僚","e":"🧑‍💻","l":[["p","新しい 勤怠システムの 導入について、どう 思いますか。","あたらしい きんたい システム の どうにゅう に ついて、どう おもいます か。","Bagaimana pendapatmu tentang penerapan sistem absensi baru?"],["u","業務の 効率化に つながるので、導入には 賛成です。ただ、費用が 気に なります。","ぎょうむ の こうりつか に つながる ので、どうにゅう に は さんせい です。ただ、ひよう が き に なります。","Karena meningkatkan efisiensi kerja, saya setuju diterapkan. Hanya saja, saya khawatir soal biayanya.",[["効率が 悪く なるので、導入に 賛成です。費用は 気に しません。","Karena efisiensi menurun, saya setuju diterapkan. Biaya tidak masalah."],["システムは 嫌いなので、意見は ありません。","Saya tidak suka sistem, jadi tidak ada pendapat."]]],["p","確かに。初期費用は かなり かかりそうですね。","たしか に。しょき ひよう は かなり かかり そう です ね。","Betul. Biaya awalnya sepertinya cukup besar."],["u","長期的に 見れば、人件費の 削減に なるので、十分 回収できると 思います。","ちょうきてき に みれば、じんけんひ の さくげん に なる ので、じゅうぶん かいしゅう できる と おもいます。","Kalau dilihat jangka panjang, biaya tenaga kerja berkurang, jadi menurut saya biayanya bisa kembali.",[["短期的に 見れば、費用は 増える 一方なので、絶対に 無理です。","Dalam jangka pendek biaya terus naik, jadi mustahil."],["人件費を 増やせば、費用は かからないと 思います。","Kalau biaya tenaga kerja dinaikkan, menurut saya tidak ada biaya."]]],["p","なるほど。では、具体的な 数字を まとめて、部長に 提案しましょう。","なるほど。では、ぐたいてき な すうじ を まとめて、ぶちょう に ていあん しましょう。","Masuk akal. Kalau begitu, ayo rangkum angka konkretnya dan usulkan ke manajer."],["u","そうですね。比較の 資料は 私が 作成します。","そう です ね。ひかく の しりょう は わたし が さくせい します。","Setuju. Dokumen perbandingannya akan saya buat.",[["そうですね。資料は 部長に 作って もらいましょう。","Setuju. Kita minta manajer yang membuat dokumennya."],["いいえ、提案は しない ほうが いいです。","Tidak, sebaiknya tidak diusulkan."]]]]},{"t":"Negosiasi harga dengan vendor","s":"Kamu bernegosiasi dengan sales vendor soal harga lisensi dan pemeliharaan firewall.","p":"山本さん","e":"👨‍💼","l":[["p","本日は お時間を いただき、ありがとうございます。早速ですが、お見積もりを ご確認 いただけましたでしょうか。","ほんじつ は おじかん を いただき、ありがとう ございます。さっそく です が、おみつもり を ごかくにん いただけました でしょう か。","Terima kasih atas waktunya hari ini. Langsung saja, apakah Anda sudah sempat memeriksa penawaran harga kami?"],["u","はい、拝見しました。ただ、予算の 関係で この 金額では 承認が 難しいと 存じます。","はい、はいけん しました。ただ、よさん の かんけい で この きんがく で は しょうにん が むずかしい と ぞんじます。","Ya, sudah saya lihat. Hanya saja, karena keterbatasan anggaran, saya rasa dengan nominal ini sulit mendapat persetujuan.",[["はい、ご覧に なりました。予算の 関係で 難しいと おっしゃいます。","Ya, (saya) sudah \"berkenan melihat\"...","salah: sonkeigo dipakai untuk diri sendiri"],["いいえ、まだ 拝見して いませんが、高すぎます。","Belum saya lihat, tapi harganya terlalu mahal.","tidak logis"]]],["p","そうですか。どの 程度でしたら ご検討 いただけますか。","そう です か。どの ていど でしたら ごけんとう いただけます か。","Begitu. Kira-kira di angka berapa Anda bisa mempertimbangkannya?"],["u","他社とも 比較した 上で、二割ほど 削減して いただけると 助かります。","たしゃ と も ひかく した うえ で、にわり ほど さくげん して いただける と たすかります。","Setelah kami bandingkan dengan perusahaan lain, akan sangat membantu kalau bisa dikurangi sekitar 20%.",[["他社とも 比較した 上で、二割ほど 追加して いただけると 助かります。","Setelah dibandingkan, akan membantu kalau harganya ditambah 20%."],["他社とは 比較せずに、全部 無料に して ください。","Tanpa membandingkan, tolong gratiskan semuanya."]]],["p","二割ですか…。正直 厳しいですが、三年契約に して いただけるなら 検討の 余地は あります。","にわり です か…。しょうじき きびしい です が、さんねん けいやく に して いただける なら けんとう の よち は あります。","20%... Terus terang berat, tapi kalau dijadikan kontrak tiga tahun, masih ada ruang untuk dipertimbangkan."],["u","三年契約に 関しては、社内で 相談させて いただけますか。","さんねん けいやく に かんして は、しゃない で そうだん させて いただけます か。","Soal kontrak tiga tahun, bolehkah saya diskusikan dulu di internal?",[["三年契約に 関しては、そちらで 相談させて あげます。","Soal kontrak tiga tahun, saya izinkan Anda berdiskusi.","tidak sopan"],["三年契約に 関しては、もう 解約いたしました。","Soal kontrak tiga tahun, sudah saya batalkan.","tidak nyambung"]]],["p","もちろんです。あわせて 保守サポートの 範囲も ご説明しましょうか。","もちろん です。あわせて ほしゅ サポート の はんい も ごせつめい しましょう か。","Tentu. Sekalian, perlukah saya jelaskan cakupan dukungan pemeliharaannya?"],["u","お願いします。障害が 発生した 場合、どの くらい 迅速に 対応して いただけますか。","おねがい します。しょうがい が はっせい した ばあい、どの くらい じんそく に たいおう して いただけます か。","Silakan. Kalau terjadi gangguan, seberapa cepat Anda bisa menanganinya?",[["お願いします。障害が 発生した 場合、どの くらい ゆっくり 対応して いただけますか。","Silakan. Kalau terjadi gangguan, seberapa lambat Anda bisa menanganinya?"],["いえ、保守の 範囲は 私が ご説明いたします。","Tidak, cakupan pemeliharaannya biar saya yang jelaskan.","terbalik, vendor yang tahu"]]],["p","二十四時間 受け付けて おり、四時間以内に 技術者が 伺います。","にじゅうよじかん うけつけて おり、よじかん いない に ぎじゅつしゃ が うかがいます。","Kami menerima laporan 24 jam, dan teknisi akan datang dalam 4 jam."],["u","承知しました。本日の 内容を 上司に 報告した 上で、改めて ご連絡いたします。","しょうち しました。ほんじつ の ないよう を じょうし に ほうこく した うえ で、あらためて ごれんらく いたします。","Baik. Setelah saya laporkan isi pertemuan hari ini ke atasan, saya akan menghubungi Anda kembali.",[["承知しました。本日の 内容は 上司には 内緒に して おきます。","Baik. Isi hari ini akan saya rahasiakan dari atasan."],["承知しました。では、今すぐ 五年契約に サインします。","Baik. Kalau begitu saya tanda tangani kontrak lima tahun sekarang juga."]]],["p","ありがとうございます。良い お返事を お待ちして おります。","ありがとう ございます。よい おへんじ を おまち して おります。","Terima kasih. Kami menantikan kabar baik dari Anda."]]},{"t":"Laporan insiden keamanan","s":"Sistem monitoring mendeteksi percobaan login mencurigakan. Kamu melapor ke atasan.","p":"鈴木課長","e":"🧑‍💼","l":[["u","鈴木課長、至急 ご報告したい ことが ございます。","すずき かちょう、しきゅう ごほうこく したい こと が ございます。","Pak Suzuki, ada hal yang perlu saya laporkan segera.",[["鈴木課長、至急 ご報告して いただきたい ことが ございます。","Pak Suzuki, ada hal yang saya ingin Bapak laporkan segera.","terbalik"],["鈴木課長、お暇でしたら 雑談しませんか。","Pak Suzuki, kalau senggang, ngobrol santai yuk?"]]],["p","どうしたの。何か あった？","どう した の。なに か あった？","Ada apa? Terjadi sesuatu?"],["u","今朝 三時ごろ、海外の IPアドレスから 管理画面への ログイン試行が 数百回 ありました。","けさ さんじ ごろ、かいがい の アイピー アドレス から かんり がめん へ の ログイン しこう が すうひゃっかい ありました。","Sekitar jam 3 pagi tadi, ada ratusan percobaan login ke halaman admin dari IP luar negeri.",[["今朝 三時ごろ、管理画面への ログインは 一回も ありませんでした。","Sekitar jam 3 pagi tadi, tidak ada satu pun login ke halaman admin.","bukan hal mendesak"],["今朝 三時ごろ、私が 管理画面に 攻撃を いたしました。","Sekitar jam 3 pagi tadi, saya yang menyerang halaman admin."]]],["p","侵入は されたの？","しんにゅう は された の？","Apakah sampai berhasil disusupi?"],["u","ログを 分析した 限りでは、侵入の 形跡は ございません。ただ、試行回数は 現在も 増えつつ あります。","ログ を ぶんせき した かぎり で は、しんにゅう の けいせき は ございません。ただ、しこう かいすう は げんざい も ふえ つつ あります。","Sejauh hasil analisis log, tidak ada jejak penyusupan. Namun jumlah percobaannya terus bertambah sampai sekarang.",[["ログは 分析せずに、侵入されたと 判断いたしました。","Tanpa menganalisis log, saya menyimpulkan sudah disusupi."],["ログを 削除して しまったので、何も わかりません。","Lognya sudah terhapus oleh saya, jadi saya tidak tahu apa-apa."]]],["p","そうか。じゃあ、すぐに 何か 対策を 打たないと。","そう か。じゃあ、すぐ に なに か たいさく を うたない と。","Begitu. Kalau begitu kita harus segera mengambil tindakan."],["u","はい。ファイアウォールで 該当する IPを 遮断し、外部からの 接続を 制限する ことを 提案いたします。","はい。ファイアウォール で がいとう する アイピー を しゃだん し、がいぶ から の せつぞく を せいげん する こと を ていあん いたします。","Ya. Saya usulkan memblokir IP terkait di firewall dan membatasi koneksi dari luar.",[["はい。ファイアウォールを 停止して、すべての 接続を 許可する ことを 提案いたします。","Ya. Saya usulkan mematikan firewall dan mengizinkan semua koneksi."],["はい。相手に メールで やめて くださいと お願いする ことを 提案いたします。","Ya. Saya usulkan mengirim email ke penyerang untuk minta berhenti."]]],["p","いいね。ただ、業務に 影響が 出ないように 気を つけて。","いい ね。ただ、ぎょうむ に えいきょう が でない よう に き を つけて。","Bagus. Tapi hati-hati jangan sampai mengganggu operasional."],["u","承知いたしました。このまま 放置すれば 被害が 拡大しかねませんので、すぐに 実施いたします。","しょうち いたしました。この まま ほうち すれば ひがい が かくだい しかねません ので、すぐ に じっし いたします。","Baik. Kalau dibiarkan, kerusakannya bisa meluas, jadi akan segera saya laksanakan.",[["承知いたしました。被害が 拡大しかねませんので、来月 実施いたします。","Baik. Karena kerusakan bisa meluas, akan saya laksanakan bulan depan."],["承知いたしました。被害は 絶対に 出ませんので、何も いたしません。","Baik. Pasti tidak akan ada kerugian, jadi saya tidak akan melakukan apa-apa."]]],["p","頼んだよ。対応が 終わったら、報告書に まとめて おいて。","たのんだ よ。たいおう が おわったら、ほうこくしょ に まとめて おいて。","Saya serahkan padamu. Setelah selesai, rangkum dalam laporan ya."],["u","かしこまりました。原因と 再発防止策に 関しても 報告書に 記載いたします。","かしこまりました。げんいん と さいはつ ぼうしさく に かんして も ほうこくしょ に きさい いたします。","Baik. Penyebab dan langkah pencegahannya juga akan saya cantumkan di laporan.",[["かしこまりました。報告書は 課長が 書いて くださいませんか。","Baik. Bisakah Bapak saja yang menulis laporannya?"],["かしこまりました。報告書は 書かずに、口頭で 申し上げるだけに いたします。","Baik. Saya tidak akan menulis laporan, cukup saya sampaikan secara lisan."]]],["p","よろしく。早めに 気づいて くれて 助かったよ。","よろしく。はやめ に きづいて くれて たすかった よ。","Tolong ya. Untung kamu cepat menyadarinya."]]},{"t":"Perencanaan migrasi server","s":"Rapat tim membahas pemindahan server lama yang masa pemeliharaannya akan habis.","p":"中村さん","e":"👩‍💼","l":[["p","来年三月で 今の サーバーの 保守期間が 切れるので、移行計画を 立てたいと 思います。","らいねん さんがつ で いま の サーバー の ほしゅ きかん が きれる ので、いこう けいかく を たてたい と おもいます。","Masa pemeliharaan server yang sekarang habis Maret tahun depan, jadi saya ingin menyusun rencana migrasi."],["u","移行先に 関しては、クラウドと オンプレミスの どちらで 検討する 予定ですか。","いこうさき に かんして は、クラウド と オンプレミス の どちら で けんとう する よてい です か。","Terkait tujuan migrasinya, rencananya mempertimbangkan cloud atau on-premise?",[["保守期間に 関しては、もう 先月 切れて しまいました。","Soal masa pemeliharaan, sudah habis bulan lalu.","bertentangan"],["移行先に 関しては、私が 決めて さしあげます。","Soal tujuan migrasi, biar saya yang putuskan untuk Anda.","tidak sopan"]]],["p","費用を 比較した 結果、クラウドが 有力です。{N}さんは どう 思いますか。","ひよう を ひかく した けっか、クラウド が ゆうりょく です。{N} さん は どう おもいます か。","Dari perbandingan biaya, cloud paling kuat. Bagaimana menurut {N}-san?"],["u","賛成です。初期費用を 削減できる うえ、規模の 拡大にも 柔軟に 対応できます。","さんせい です。しょき ひよう を さくげん できる うえ、きぼ の かくだい に も じゅうなん に たいおう できます。","Saya setuju. Selain bisa menekan biaya awal, juga fleksibel saat skala perlu diperluas.",[["反対です。初期費用を 削減できる うえ、規模の 拡大にも 対応できますから。","Saya tidak setuju, karena bisa menekan biaya awal dan fleksibel.","kontradiktif"],["賛成です。初期費用が 大幅に 増える うえ、拡大も できませんから。","Saya setuju, karena biaya awalnya naik drastis dan tidak bisa diperluas.","kontradiktif"]]],["p","ただ、移行中に サービスが 止まるのは 避けたいですね。","ただ、いこう ちゅう に サービス が とまる の は さけたい です ね。","Tapi kita ingin menghindari layanan berhenti selama migrasi, ya."],["u","では、利用者の 少ない 週末の 夜間に 段階的に 移行しては いかがでしょうか。","では、りようしゃ の すくない しゅうまつ の やかん に だんかいてき に いこう して は いかが でしょう か。","Kalau begitu, bagaimana kalau migrasinya bertahap di malam akhir pekan saat pengguna sedikit?",[["では、利用者の 多い 月曜日の 朝に 一度に 移行しては いかがでしょうか。","Kalau begitu, bagaimana kalau dimigrasi sekaligus Senin pagi saat pengguna ramai?"],["では、サービスを 一か月 止めて、ゆっくり 移行しましょう。","Kalau begitu, hentikan layanan sebulan dan migrasi pelan-pelan saja."]]],["p","いいですね。データの 移行で 気を つける 点は ありますか。","いい です ね。データ の いこう で き を つける てん は あります か。","Bagus. Ada hal yang perlu diperhatikan dalam migrasi data?"],["u","移行前に 必ず バックアップを 取り、移行後に データの 整合性を 確認する 必要が あります。","いこう まえ に かならず バックアップ を とり、いこう ご に データ の せいごうせい を かくにん する ひつよう が あります。","Sebelum migrasi wajib backup, dan setelahnya perlu memeriksa konsistensi data.",[["移行前に バックアップを 削除して、容量を 空ける 必要が あります。","Sebelum migrasi, backup perlu dihapus supaya kapasitasnya lega."],["確認は 時間が かかるので、省略しましょう。","Pengecekan makan waktu, jadi kita lewati saja."]]],["p","わかりました。では、スケジュール案を 作って もらえますか。","わかりました。では、スケジュール あん を つくって もらえます か。","Baik. Kalau begitu, bisa tolong buatkan draf jadwalnya?"],["u","承知しました。過去の 移行作業の 記録を 参考に した 上で、金曜日までに 作成いたします。","しょうち しました。かこ の いこう さぎょう の きろく を さんこう に した うえ で、きんようび まで に さくせい いたします。","Baik. Dengan merujuk catatan migrasi sebelumnya, akan saya buat paling lambat hari Jumat.",[["承知しました。過去の 記録は 見ないで、来年 作成いたします。","Baik. Tanpa melihat catatan lama, akan saya buat tahun depan."],["承知しました。では、中村さんが 作って くださいますか。","Baik. Kalau begitu, apakah Nakamura-san yang akan membuatnya?","melempar balik tugas"]]],["p","助かります。よろしく お願いします。","たすかります。よろしく おねがい します。","Sangat membantu. Mohon bantuannya."]]},{"t":"Evaluasi kinerja dengan atasan","s":"Akhir tahun fiskal, kamu menjalani wawancara evaluasi kinerja dengan atasan.","p":"森部長","e":"👔","l":[["p","では、今年度の 評価面談を 始めましょう。まず、自分では どう 評価して いますか。","では、こんねんど の ひょうか めんだん を はじめましょう。まず、じぶん で は どう ひょうか して います か。","Mari kita mulai wawancara evaluasi tahun ini. Pertama, bagaimana kamu menilai dirimu sendiri?"],["u","監視システムの 導入を 通じて、障害対応の 時間を 短縮できた 点では 貢献できたと 存じます。","かんし システム の どうにゅう を つうじて、しょうがい たいおう の じかん を たんしゅく できた てん で は こうけん できた と ぞんじます。","Melalui penerapan sistem monitoring, saya rasa saya berkontribusi dalam memperpendek waktu penanganan gangguan.",[["特に 何も して おりませんので、評価は 結構です。","Saya tidak melakukan apa-apa, jadi tidak perlu dievaluasi."],["監視システムの 導入は、部長が お一人で なさいました。","Penerapan sistem monitoring dilakukan Bapak sendirian.","tidak menjawab soal diri sendiri"]]],["p","そうですね。その 点は 私も 高く 評価して います。一方で、課題は 何だと 思いますか。","そう です ね。その てん は わたし も たかく ひょうか して います。いっぽう で、かだい は なん だ と おもいます か。","Benar. Poin itu juga saya nilai tinggi. Di sisi lain, menurutmu apa kekuranganmu?"],["u","仕事を 一人で 抱え込んで しまい、報告が 遅れる ことが ありました。","しごと を ひとり で かかえこんで しまい、ほうこく が おくれる こと が ありました。","Saya kadang memikul pekerjaan sendirian sehingga laporan jadi terlambat.",[["仕事を 一人で 抱え込んで しまい、報告が 早すぎる ことが ありました。","Saya memikul pekerjaan sendiri sehingga laporannya terlalu cepat."],["部長の 報告が 遅れる ことが ありました。","Laporan Bapak kadang terlambat.","menyalahkan atasan"]]],["p","そうだね。忙しいにもかかわらず 頑張って くれたのは わかるけど、早めに 相談して ほしいな。","そう だ ね。いそがしい に も かかわらず がんばって くれた の は わかる けど、はやめ に そうだん して ほしい な。","Iya. Saya tahu kamu sudah berusaha keras walaupun sibuk, tapi saya ingin kamu berkonsultasi lebih awal."],["u","ご指摘 ありがとうございます。来年度は 進捗を 毎週 共有する よう 改めます。","ごしてき ありがとう ございます。らいねんど は しんちょく を まいしゅう きょうゆう する よう あらためます。","Terima kasih atas masukannya. Tahun depan saya akan memperbaikinya dengan membagikan progres setiap minggu.",[["ご指摘 ありがとうございます。来年度は 相談を やめる よう 改めます。","Terima kasih atas masukannya. Tahun depan saya akan berhenti berkonsultasi."],["ご指摘には 納得できません。相談は 必要ないと 存じます。","Saya tidak bisa menerima masukan itu. Menurut saya konsultasi tidak perlu."]]],["p","期待して いるよ。来年度の 目標は 何か 考えて いる？","きたい して いる よ。らいねんど の もくひょう は なに か かんがえて いる？","Saya berharap banyak. Sudah memikirkan target untuk tahun depan?"],["u","セキュリティの 専門知識を 深める ため、資格を 取得したいと 考えて おります。","セキュリティ の せんもん ちしき を ふかめる ため、しかく を しゅとく したい と かんがえて おります。","Untuk memperdalam keahlian keamanan, saya ingin mengambil sertifikasi.",[["専門知識は もう 十分なので、来年度は 休暇を 増やしたいと 考えて おります。","Keahlian saya sudah cukup, jadi tahun depan saya ingin menambah cuti."],["部長に 資格を 取得して いただきたいと 考えて おります。","Saya ingin Bapak yang mengambil sertifikasi."]]],["p","いいね。研修費用の 援助も あるから、申請して みて。","いい ね。けんしゅう ひよう の えんじょ も ある から、しんせい して みて。","Bagus. Ada bantuan biaya pelatihan juga, coba ajukan."],["u","ありがとうございます。ぜひ 申請させて いただきます。","ありがとう ございます。ぜひ しんせい させて いただきます。","Terima kasih. Akan saya ajukan.",[["ありがとうございます。ぜひ 申請して さしあげます。","Terima kasih. Akan saya ajukan untuk Bapak.","keigo salah arah"],["いえ、結構です。勉強は 嫌いなので。","Tidak usah. Saya tidak suka belajar."]]],["p","うん。来年も 期待して いるよ。","うん。らいねん も きたい して いる よ。","Ya. Tahun depan juga saya andalkan."]]},{"t":"Rapat perdana dengan klien","s":"Kamu mengunjungi kantor klien untuk membahas masalah jaringan mereka.","p":"高橋様","e":"👩‍💼","l":[["u","本日は お忙しい ところ、お時間を いただき ありがとうございます。","ほんじつ は おいそがしい ところ、おじかん を いただき ありがとう ございます。","Terima kasih telah meluangkan waktu di tengah kesibukan Anda hari ini.",[["本日は お暇な ところ、お時間を いただき ありがとうございます。","Terima kasih telah meluangkan waktu saat Anda sedang senggang.","tidak sopan"],["本日は お忙しい ところ、お時間を さしあげて ありがとうございます。","Terima kasih karena saya memberi Anda waktu.","terbalik"]]],["p","いえいえ、こちらこそ わざわざ お越し いただき ありがとうございます。","いえいえ、こちら こそ わざわざ おこし いただき ありがとう ございます。","Tidak, justru kami berterima kasih Anda sudah repot-repot datang."],["u","早速ですが、現在の ネットワーク環境に 関して いくつか 伺っても よろしいでしょうか。","さっそく です が、げんざい の ネットワーク かんきょう に かんして いくつ か うかがって も よろしい でしょう か。","Langsung saja, bolehkah saya menanyakan beberapa hal tentang kondisi jaringan saat ini?",[["早速ですが、現在の ネットワーク環境に 関して いくつか お聞きに なっても よろしいでしょうか。","Langsung saja, bolehkah saya \"berkenan bertanya\"...","salah: sonkeigo untuk diri sendiri"],["早速ですが、弊社の 社員旅行に 関して お話しします。","Langsung saja, saya akan bercerita tentang wisata karyawan kantor kami."]]],["p","はい、どうぞ。","はい、どうぞ。","Ya, silakan."],["u","現在、主に どのような 問題で お困りでしょうか。","げんざい、おもに どの よう な もんだい で おこまり でしょう か。","Saat ini, masalah apa yang terutama menyulitkan Anda?",[["現在、主に どんな 問題で 困って いるんだ。","Sekarang kalian lagi bermasalah soal apa sih?","kasar"],["現在、弊社は 主に お困りで いらっしゃいます。","Saat ini, perusahaan kami \"berkenan kesulitan\".","keigo kacau"]]],["p","拠点が 増えつつ あるにもかかわらず、回線が 古いままで、通信が よく 途切れるんです。","きょてん が ふえ つつ ある に も かかわらず、かいせん が ふるい まま で、つうしん が よく とぎれる ん です。","Meski jumlah kantor cabang terus bertambah, jalurnya masih yang lama, jadi koneksi sering putus."],["u","承知いたしました。では、各拠点の 通信状況を 調査した 上で、改善案を ご提案させて いただきます。","しょうち いたしました。では、かく きょてん の つうしん じょうきょう を ちょうさ した うえ で、かいぜんあん を ごていあん させて いただきます。","Baik. Kalau begitu, setelah kami survei kondisi koneksi tiap cabang, kami akan mengajukan usulan perbaikan.",[["承知いたしました。では、調査は せずに、すぐ 全部の 回線を 解約いたします。","Baik. Tanpa survei, semua jalur akan langsung kami putus kontraknya."],["承知いたしました。では、改善案を ご提案して いただけますか。","Baik. Kalau begitu, bisakah Anda yang mengajukan usulan perbaikannya?"]]],["p","ありがとうございます。ただ、予算は あまり 多くないのですが…。","ありがとう ございます。ただ、よさん は あまり おおくない の です が…。","Terima kasih. Hanya saja, anggaran kami tidak terlalu besar..."],["u","ご予算の 範囲内で、優先順位を つけて ご提案いたします。","ごよさん の はんい ない で、ゆうせん じゅんい を つけて ごていあん いたします。","Kami akan mengusulkan dengan skala prioritas, dalam batas anggaran Anda.",[["ご予算の 範囲を 超えても、全部 入れて ご提案いたします。","Walau melebihi anggaran, semua akan kami masukkan dalam usulan."],["ご予算が 少ないなら、ご提案は いたしかねます。","Kalau anggarannya kecil, kami tidak bisa mengajukan usulan."]]],["p","助かります。いつ頃 いただけますか。","たすかります。いつごろ いただけます か。","Sangat membantu. Kira-kira kapan bisa kami terima?"],["u","来週の 金曜日までに、資料を お送りいたします。","らいしゅう の きんようび まで に、しりょう を おおくり いたします。","Kami akan mengirimkan dokumennya paling lambat Jumat minggu depan.",[["来週の 金曜日までに、資料を 送って くださいませ。","Tolong kirimkan dokumennya paling lambat Jumat minggu depan.","minta klien yang mengirim"],["来年の いつか、資料を お送りするかも しれません。","Mungkin suatu saat tahun depan kami kirim dokumennya."]]],["p","承知しました。お待ちして おります。","しょうち しました。おまち して おります。","Baik. Kami tunggu."]]},{"t":"Minta maaf atas kesalahan konfigurasi","s":"Kesalahan pengaturan server dari pihakmu membuat email klien tidak terkirim. Kamu menelepon klien.","p":"小林様","e":"🧑‍💼","l":[["u","お世話に なって おります。さくら情報の {N}で ございます。","おせわ に なって おります。さくら じょうほう の {N} で ございます。","Terima kasih atas kerja samanya selama ini. Saya {N} dari Sakura Joho.",[["お世話に なって おります。さくら情報の {N}様で いらっしゃいます。","... Ini \"Bapak/Ibu {N} yang terhormat\" dari Sakura Joho.","salah: sonkeigo untuk diri sendiri"],["おはよう。さくら情報の {N}だよ。","Pagi. Ini {N} dari Sakura Joho nih.","terlalu santai"]]],["p","ああ、{N}さん。昨日から メールが 届かないんですが、何か ご存じですか。","ああ、{N} さん。きのう から メール が とどかない ん です が、なに か ごぞんじ です か。","Oh, {N}-san. Sejak kemarin email kami tidak sampai. Anda tahu sesuatu?"],["u","その 件で お電話いたしました。弊社の 設定の 誤りが 原因でした。誠に 申し訳ございません。","その けん で おでんわ いたしました。へいしゃ の せってい の あやまり が げんいん でした。まこと に もうしわけ ございません。","Saya menelepon justru soal itu. Penyebabnya kesalahan pengaturan di pihak kami. Kami sungguh mohon maaf.",[["その 件で お電話いたしました。御社の 設定の 誤りが 原因でした。","Saya menelepon soal itu. Penyebabnya kesalahan pengaturan di perusahaan Anda.","menyalahkan klien"],["その 件は 存じません。","Soal itu saya tidak tahu.","padahal menelepon karena itu"]]],["p","そうでしたか。それで、今は もう 直ったんですか。","そう でした か。それ で、いま は もう なおった ん です か。","Oh begitu. Lalu, sekarang sudah beres?"],["u","はい、今朝 九時に 修正を 完了し、現在は 正常に 送受信できて おります。","はい、けさ くじ に しゅうせい を かんりょう し、げんざい は せいじょう に そうじゅしん できて おります。","Ya, perbaikannya selesai jam 9 pagi tadi, dan sekarang email sudah bisa dikirim dan diterima dengan normal.",[["はい、今朝 九時に 修正を 完了しましたが、まだ 一通も 届いて おりません。","Ya, perbaikan selesai jam 9 pagi, tapi belum ada satu email pun yang sampai.","kontradiktif"],["いいえ、修正は 来月 させて いただきます。","Belum, perbaikannya akan kami lakukan bulan depan."]]],["p","届かなかった メールは どう なるんですか。","とどかなかった メール は どう なる ん です か。","Lalu email yang tidak sampai bagaimana?"],["u","サーバーに 保存されて おりますので、順次 配信されます。データが 失われる ことは ございません。","サーバー に ほぞん されて おります ので、じゅんじ はいしん されます。データ が うしなわれる こと は ございません。","Semuanya tersimpan di server, jadi akan dikirim secara bertahap. Tidak ada data yang hilang.",[["サーバーから 削除されて おりますので、もう 届きません。","Semuanya sudah terhapus dari server, jadi tidak akan sampai lagi."],["サーバーに 保存されて おりますので、ご自分で 取りに 来て ください。","Tersimpan di server, jadi silakan ambil sendiri ke tempat kami."]]],["p","わかりました。でも、取引先から 苦情が 来て いて 困って いるんですよ。","わかりました。でも、とりひきさき から くじょう が きて いて こまって いる ん です よ。","Baik. Tapi kami kerepotan karena ada keluhan dari mitra bisnis kami."],["u","ご迷惑を おかけし、大変 申し訳ございません。今後は 設定変更の 際に 二重チェックを 徹底いたします。","ごめいわく を おかけ し、たいへん もうしわけ ございません。こんご は せってい へんこう の さい に にじゅう チェック を てってい いたします。","Mohon maaf sebesar-besarnya atas ketidaknyamanannya. Ke depannya kami akan selalu melakukan pengecekan ganda saat mengubah pengaturan.",[["ご迷惑を おかけしましたが、苦情は 弊社とは 関係ございません。","Mohon maaf, tapi keluhan itu tidak ada hubungannya dengan kami."],["ご迷惑を いただき、大変 ありがとうございます。","Terima kasih banyak atas \"kerepotan\" yang Anda berikan.","tidak masuk akal"]]],["p","わかりました。再発しないよう お願いしますね。","わかりました。さいはつ しない よう おねがい します ね。","Baik. Tolong jangan sampai terulang, ya."],["u","かしこまりました。後ほど 経緯を まとめた 報告書を お送りいたします。","かしこまりました。のちほど けいい を まとめた ほうこくしょ を おおくり いたします。","Baik. Nanti akan kami kirimkan laporan yang merangkum kronologinya.",[["かしこまりました。後ほど 報告書を 書いて いただけますか。","Baik. Nanti bisakah Anda yang menulis laporannya?"],["かしこまりました。では、また 同じ 誤りが ございましたら よろしく。","Baik. Kalau nanti ada kesalahan yang sama lagi, mohon dimaklumi ya."]]],["p","よろしく お願いします。","よろしく おねがい します。","Mohon bantuannya."]]},{"t":"Menolak permintaan dengan sopan","s":"Manajer divisi lain memintamu ikut proyek tambahan, padahal jadwalmu sudah penuh.","p":"伊藤部長","e":"🧔","l":[["p","{N}さん、来月から 始まる 新しい プロジェクトに 参加して もらえないかな。","{N} さん、らいげつ から はじまる あたらしい プロジェクト に さんか して もらえない か な。","{N}-san, bisakah kamu ikut proyek baru yang mulai bulan depan?"],["u","お声がけ いただき、ありがとうございます。ただ、大変 申し上げにくいのですが…。","おこえがけ いただき、ありがとう ございます。ただ、たいへん もうしあげにくい の です が…。","Terima kasih sudah mengajak saya. Hanya saja, agak sulit bagi saya untuk mengatakannya...",[["いやだよ。忙しいんだから。","Ogah. Aku lagi sibuk.","kasar ke atasan"],["お声がけ して さしあげて、ありがとうございます。","Terima kasih karena saya sudah mengajak Bapak.","keigo terbalik"]]],["p","うん、何かな。","うん、なに か な。","Ya, ada apa?"],["u","現在 担当して いる サーバー移行の 作業が 三月まで 続く ため、お引き受けするのは 難しい 状況です。","げんざい たんとう して いる サーバー いこう の さぎょう が さんがつ まで つづく ため、おひきうけ する の は むずかしい じょうきょう です。","Pekerjaan migrasi server yang saya tangani berlangsung sampai Maret, jadi saya sulit menerimanya.",[["現在 担当して いる 作業が 何も ない ため、お引き受けするのは 難しい 状況です。","Karena saya sedang tidak menangani apa-apa, saya sulit menerimanya.","alasan tidak logis"],["現在の 作業が 三月まで 続く ため、部長が お引き受け ください。","Pekerjaan saya berlangsung sampai Maret, jadi Bapak saja yang menerimanya."]]],["p","そうか…。でも、どうしても 人が 足りなくてね。","そう か…。でも、どうしても ひと が たりなくて ね。","Begitu ya... Tapi kami benar-benar kekurangan orang."],["u","お力に なれず 申し訳ございません。四月以降でしたら、お手伝いできるかと 存じます。","おちから に なれず もうしわけ ございません。しがつ いこう でしたら、おてつだい できる か と ぞんじます。","Mohon maaf tidak bisa membantu. Kalau mulai April, saya rasa saya bisa membantu.",[["お力に なれず 申し訳ございません。四月以降も 絶対に お手伝いしません。","Mohon maaf. Mulai April pun saya pasti tidak akan membantu."],["お力に なって いただき、申し訳ございません。","Maaf karena Bapak sudah membantu saya.","tidak nyambung"]]],["p","四月か。それまでの 間、少しだけでも 協力して もらう ことは できない？","しがつ か。それ まで の あいだ、すこし だけ で も きょうりょく して もらう こと は できない？","April ya. Sampai saat itu, tidak bisakah kamu membantu sedikit saja?"],["u","週に 一回の 定例会議への 参加程度でしたら 可能です。ただし、上司の 承認を 得る 必要が ございます。","しゅう に いっかい の ていれい かいぎ へ の さんか ていど でしたら かのう です。ただし、じょうし の しょうにん を える ひつよう が ございます。","Kalau sekadar ikut rapat rutin seminggu sekali, bisa. Tapi saya perlu persetujuan atasan saya.",[["週に 七回の 会議に 参加できますので、承認は 不要です。","Saya bisa ikut rapat tujuh kali seminggu, jadi tidak perlu persetujuan."],["週に 一回でしたら、部長が 私の 仕事を 代わりに やって ください。","Kalau seminggu sekali, Bapak yang gantikan pekerjaan saya ya."]]],["p","わかった。じゃあ、森部長には 私から 話して おくよ。","わかった。じゃあ、もり ぶちょう に は わたし から はなして おく よ。","Oke. Kalau begitu biar saya yang bicara ke Pak Mori."],["u","ご配慮 いただき、ありがとうございます。よろしく お願いいたします。","ごはいりょ いただき、ありがとう ございます。よろしく おねがい いたします。","Terima kasih atas pengertiannya. Mohon bantuannya.",[["ご配慮 いただき、ありがとう。じゃあね。","Makasih atas pengertiannya. Dah.","terlalu santai"],["どういたしまして。お気を つけて。","Sama-sama. Hati-hati di jalan."]]],["p","こちらこそ、無理を 言って 悪かったね。","こちら こそ、むり を いって わるかった ね。","Saya juga minta maaf sudah memaksa."]]},{"t":"Memberi umpan balik ke junior","s":"Juniormu, Kenji, baru selesai membuat dokumen prosedur kerja dan minta kamu memeriksanya.","p":"健二くん","e":"🧑","l":[["p","先輩、手順書が できたので、確認して いただけますか。","せんぱい、てじゅんしょ が できた ので、かくにん して いただけます か。","Senpai, dokumen prosedurnya sudah jadi. Bisa tolong dicek?"],["u","お疲れさま。全体の 構成が わかりやすくて、よく まとまって いるね。","おつかれさま。ぜんたい の こうせい が わかりやすくて、よく まとまって いる ね。","Kerja bagus. Susunan keseluruhannya mudah dipahami dan rapi, ya.",[["お疲れさま。まだ 読んで ないけど、全部 だめだね。","Kerja bagus. Belum kubaca, tapi semuanya jelek ya."],["ごちそうさま。全体の 構成が よく まとまって いるね。","Terima kasih atas makanannya. Susunannya rapi ya.","salam salah"]]],["p","ありがとうございます！何か 直した ほうが いい 点は ありますか。","ありがとう ございます！なに か なおした ほう が いい てん は あります か。","Terima kasih! Ada bagian yang sebaiknya diperbaiki?"],["u","三ページ目の 手順が 少し 曖昧だから、画面の 写真を 追加すると いいと 思う。","さんページめ の てじゅん が すこし あいまい だ から、がめん の しゃしん を ついか する と いい と おもう。","Langkah di halaman tiga agak ambigu, jadi sebaiknya tambahkan tangkapan layar.",[["三ページ目の 手順が とても 明確だから、直した ほうが いいと 思う。","Langkah di halaman tiga sangat jelas, jadi sebaiknya diperbaiki.","tidak logis"],["三ページ目の 手順が 少し 曖昧だから、全部 削除して いいと 思う。","Langkah di halaman tiga agak ambigu, jadi hapus saja semuanya."]]],["p","なるほど。ほかには ありますか。","なるほど。ほか に は あります か。","Begitu. Ada lagi?"],["u","あと、専門用語は 略さずに 書いた ほうが いいよ。新人にも 読める ように。","あと、せんもん ようご は りゃくさず に かいた ほう が いい よ。しんじん に も よめる よう に。","Lalu, istilah teknis sebaiknya ditulis tanpa disingkat. Supaya karyawan baru juga bisa membacanya.",[["あと、専門用語は もっと 略した ほうが いいよ。新人にも 読める ように。","Lalu, istilah teknis sebaiknya lebih banyak disingkat, supaya karyawan baru bisa membacanya.","kontradiktif"],["あと、新人には 読ませない ように 書いた ほうが いいよ。","Lalu, sebaiknya ditulis supaya karyawan baru tidak bisa membacanya."]]],["p","分かりました。でも、締め切りが 明日なので、間に合うか 心配です。","わかりました。でも、しめきり が あした な ので、まにあう か しんぱい です。","Mengerti. Tapi tenggatnya besok, saya khawatir tidak keburu."],["u","締め切りは 守らざるを 得ないから、優先度の 高い 修正から 進めて いこう。","しめきり は まもらざる を えない から、ゆうせんど の たかい しゅうせい から すすめて いこう。","Tenggat mau tidak mau harus ditepati, jadi kerjakan dulu perbaikan yang prioritasnya tinggi.",[["締め切りは 守らざるを 得ないから、修正は 全部 やめて 帰ろう。","Tenggat harus ditepati, jadi berhenti saja memperbaiki dan pulang."],["締め切りは 守らなくても かまわないから、一年後に 出して。","Tenggatnya tidak usah ditepati, serahkan setahun lagi saja."]]],["p","はい、そうします。わからない ところが あったら、また 聞いても いいですか。","はい、そう します。わからない ところ が あったら、また きいて も いい です か。","Baik, akan saya lakukan. Kalau ada yang tidak saya mengerti, boleh tanya lagi?"],["u","もちろん。遠慮しないで、いつでも 声を かけてね。","もちろん。えんりょ しないで、いつ で も こえ を かけて ね。","Tentu. Jangan sungkan, panggil saja kapan pun.",[["もちろん。でも、二度と 聞かないでね。","Tentu. Tapi jangan pernah tanya lagi ya.","kontradiktif"],["申し訳ございません。お答えいたしかねます。","Mohon maaf, saya tidak dapat menjawab.","terlalu formal dan menolak"]]],["p","ありがとうございます！頑張ります。","ありがとう ございます！がんばります。","Terima kasih! Saya akan berusaha."]]},{"t":"Menerima telepon bisnis","s":"Telepon dari mitra bisnis masuk, sementara atasanmu sedang rapat.","p":"松本様","e":"👨","l":[["u","お電話 ありがとうございます。さくら情報、システム部の {N}で ございます。","おでんわ ありがとう ございます。さくら じょうほう、システム ぶ の {N} で ございます。","Terima kasih telah menelepon. Sakura Joho, divisi sistem, dengan {N}.",[["もしもし、{N}だけど、誰？","Halo, ini {N}, siapa nih?","terlalu santai"],["お電話 ありがとうございます。さくら情報の {N}様で いらっしゃいます。","Terima kasih telah menelepon. Ini \"Yang Terhormat {N}\".","sonkeigo untuk diri sendiri"]]],["p","東和電機の 松本と 申します。いつも お世話に なって おります。森部長は いらっしゃいますか。","とうわ でんき の まつもと と もうします。いつも おせわ に なって おります。もり ぶちょう は いらっしゃいます か。","Saya Matsumoto dari Towa Denki. Terima kasih atas kerja samanya. Apakah Pak Mori ada?"],["u","いつも お世話に なって おります。申し訳ございません、森は ただ今 会議中で ございます。","いつも おせわ に なって おります。もうしわけ ございません、もり は ただいま かいぎ ちゅう で ございます。","Terima kasih atas kerja samanya. Mohon maaf, Mori sedang rapat saat ini.",[["申し訳ございません、森部長は ただ今 会議中で いらっしゃいます。","Mohon maaf, Bapak Mori yang terhormat sedang rapat.","salah: sonkeigo untuk atasan sendiri di depan pihak luar"],["申し訳ございません、森は ただ今 お昼寝中で ございます。","Mohon maaf, Mori sedang tidur siang."]]],["p","そうですか。何時ごろ お戻りに なりますか。","そう です か。なんじ ごろ おもどり に なります か。","Begitu. Kira-kira jam berapa beliau kembali?"],["u","三時ごろには 戻る 予定です。戻りましたら、こちらから 折り返し お電話いたしましょうか。","さんじ ごろ に は もどる よてい です。もどりましたら、こちら から おりかえし おでんわ いたしましょう か。","Rencananya kembali sekitar jam tiga. Setelah kembali, perlukah kami yang menelepon balik?",[["三時ごろには お戻りに なる 予定で いらっしゃいます。","Beliau yang terhormat dijadwalkan kembali sekitar jam tiga.","sonkeigo untuk atasan sendiri"],["戻る 時間は 存じませんし、伝言も 承れません。","Saya tidak tahu kapan kembali, dan tidak bisa menerima pesan."]]],["p","では、お願いできますか。念のため、番号を 申し上げます。03の 1234の 5678です。","では、おねがい できます か。ねん の ため、ばんごう を もうしあげます。ぜろ さん の いち に さん よん の ご ろく なな はち です。","Kalau begitu, boleh minta tolong? Untuk berjaga-jaga, saya sebutkan nomornya. 03-1234-5678."],["u","復唱いたします。03の 1234の 5678、東和電機の 松本様で いらっしゃいますね。","ふくしょう いたします。ぜろ さん の いち に さん よん の ご ろく なな はち、とうわ でんき の まつもと さま で いらっしゃいます ね。","Saya ulangi. 03-1234-5678, Bapak Matsumoto dari Towa Denki, benar?",[["復唱いたします。03の 8765の 4321、東和電機の 松本様で いらっしゃいますね。","Saya ulangi. 03-8765-4321, Bapak Matsumoto dari Towa Denki, benar?","nomor salah"],["復唱いたします。東和電機の 松本で ございますね。","Saya ulangi. Ini Matsumoto dari Towa Denki, ya.","bahasa merendah untuk tamu, salah"]]],["p","はい、そうです。ご用件は、来月の 納品の 件だと お伝え ください。","はい、そう です。ごようけん は、らいげつ の のうひん の けん だ と おつたえ ください。","Ya, benar. Tolong sampaikan bahwa urusannya soal pengiriman barang bulan depan."],["u","承知いたしました。来月の 納品の 件で ございますね。森に 申し伝えます。","しょうち いたしました。らいげつ の のうひん の けん で ございます ね。もり に もうしつたえます。","Baik. Soal pengiriman barang bulan depan, ya. Akan saya sampaikan ke Mori.",[["承知いたしました。先月の 返品の 件で ございますね。","Baik. Soal pengembalian barang bulan lalu, ya.","isi salah"],["承知いたしました。森に 申し上げて いただけますか。","Baik. Bisakah Anda yang menyampaikannya ke Mori?"]]],["p","よろしく お願いします。では、失礼いたします。","よろしく おねがい します。では、しつれい いたします。","Mohon bantuannya. Kalau begitu, permisi."],["u","お電話 ありがとうございました。失礼いたします。","おでんわ ありがとう ございました。しつれい いたします。","Terima kasih atas teleponnya. Permisi.",[["お電話 ありがとうございました。いってらっしゃい。","Terima kasih atas teleponnya. Hati-hati di jalan."],["どういたしまして。また 遊ぼうね。","Sama-sama. Main lagi ya."]]]]},{"t":"Mengajukan anggaran keamanan","s":"Kamu menjelaskan usulan anggaran keamanan siber kepada direktur yang ragu soal biayanya.","p":"木村専務","e":"👴","l":[["p","セキュリティ投資の 件だね。正直、費用が かかりすぎるんじゃないか。","セキュリティ とうし の けん だ ね。しょうじき、ひよう が かかりすぎる ん じゃ ない か。","Soal investasi keamanan, ya. Terus terang, bukankah biayanya terlalu besar?"],["u","ご懸念は ごもっともです。ただ、同業他社で 被害が 増えつつ ある 以上、対策は 避けて 通れないと 存じます。","ごけねん は ごもっとも です。ただ、どうぎょう たしゃ で ひがい が ふえ つつ ある いじょう、たいさく は さけて とおれない と ぞんじます。","Kekhawatiran Bapak sangat wajar. Namun, karena kerugian di perusahaan sejenis terus bertambah, saya rasa langkah pengamanan tidak bisa dihindari.",[["ご懸念は ごもっともです。被害は 減りつつ あるので、対策は 不要と 存じます。","Kekhawatiran Bapak wajar. Kerugian makin berkurang, jadi menurut saya pengamanan tidak perlu.","bertentangan dengan usulan sendiri"],["ご懸念は 間違って いらっしゃいます。","Kekhawatiran Bapak \"yang terhormat\" itu keliru.","kasar"]]],["p","具体的な 根拠は あるのかね。","ぐたいてき な こんきょ は ある の か ね。","Ada dasar yang konkret?"],["u","はい。過去一年間で 弊社への 不審な アクセスは 三倍に 増加して おります。こちらの 資料を ご覧ください。","はい。かこ いちねんかん で へいしゃ へ の ふしん な アクセス は さんばい に ぞうか して おります。こちら の しりょう を ごらん ください。","Ada. Dalam setahun terakhir, akses mencurigakan ke perusahaan kita meningkat tiga kali lipat. Silakan lihat dokumen ini.",[["はい。不審な アクセスは 三倍に 増加して おります。こちらの 資料を 拝見して ください。","Ada. Akses mencurigakan naik tiga kali lipat. Silakan Bapak \"melihat dengan rendah hati\" dokumen ini.","salah: kenjougo untuk atasan"],["いいえ、根拠は ございませんが、なんとなく 必要だと 思います。","Tidak ada dasarnya, tapi rasanya perlu saja."]]],["p","なるほど。もし 対策を しなかったら、どう なる？","なるほど。もし たいさく を しなかったら、どう なる？","Begitu. Kalau kita tidak melakukan apa-apa, apa yang terjadi?"],["u","情報漏えいが 起きた 場合、顧客の 信頼を 失い、多額の 損害が 生じかねません。","じょうほう ろうえい が おきた ばあい、こきゃく の しんらい を うしない、たがく の そんがい が しょうじかねません。","Kalau terjadi kebocoran data, kita bisa kehilangan kepercayaan pelanggan dan menderita kerugian besar.",[["情報漏えいが 起きた 場合でも、損害は まったく 生じません。","Kalaupun terjadi kebocoran data, sama sekali tidak ada kerugian."],["情報漏えいが 起きた 場合、顧客の 信頼を 獲得し、利益が 増えます。","Kalau terjadi kebocoran data, kita mendapat kepercayaan pelanggan dan keuntungan naik."]]],["p","ふむ。予算を 少し 削る ことは できないか。","ふむ。よさん を すこし けずる こと は できない か。","Hmm. Tidak bisakah anggarannya dipangkas sedikit?"],["u","優先度の 低い 項目を 来年度に 回せば、二割ほど 削減する ことが 可能です。","ゆうせんど の ひくい こうもく を らいねんど に まわせば、にわり ほど さくげん する こと が かのう です。","Kalau item yang prioritasnya rendah dipindah ke tahun fiskal depan, bisa dikurangi sekitar 20%.",[["優先度の 高い 項目から 削れば、予算は 倍に なります。","Kalau dipangkas dari item prioritas tinggi, anggarannya jadi dua kali lipat."],["予算を 削るなら、私は 会社を 辞めざるを 得ません。","Kalau anggarannya dipangkas, saya terpaksa keluar dari perusahaan.","mengancam"]]],["p","わかった。その 内容で 承認しよう。","わかった。その ないよう で しょうにん しよう。","Baik. Saya setujui dengan isi itu."],["u","ありがとうございます。ご期待に 沿えるよう、全力で 取り組みます。","ありがとう ございます。ごきたい に そえる よう、ぜんりょく で とりくみます。","Terima kasih. Saya akan bekerja sekuat tenaga agar sesuai harapan Bapak.",[["ありがとうございます。ご期待には 沿いかねます。","Terima kasih. Saya tidak bisa memenuhi harapan Bapak."],["承認して さしあげて、ありがとうございます。","Terima kasih karena saya sudah menyetujuinya untuk Bapak.","keigo terbalik"]]],["p","頼んだよ。結果を 楽しみに して いる。","たのんだ よ。けっか を たのしみ に して いる。","Saya andalkan kamu. Saya tunggu hasilnya."]]},{"t":"Koordinasi setelah gempa","s":"Setelah gempa besar, kamu berkoordinasi dengan rekan kerja soal kondisi sistem kantor.","p":"渡辺さん","e":"👩","l":[["p","{N}さん、大丈夫でしたか。データセンターの 状況は どうですか。","{N} さん、だいじょうぶ でした か。データ センター の じょうきょう は どう です か。","{N}-san, Anda baik-baik saja? Bagaimana kondisi data center?"],["u","はい、無事です。停電は ありましたが、非常用電源で 主要な サーバーは 稼働を 維持して います。","はい、ぶじ です。ていでん は ありました が、ひじょうよう でんげん で しゅよう な サーバー は かどう を いじ して います。","Ya, saya selamat. Sempat mati listrik, tapi server utama tetap berjalan dengan daya darurat.",[["はい、無事です。地震の 前に 非常用電源を 止めて おきました。","Ya, saya selamat. Sebelum gempa, daya daruratnya sudah saya matikan.","tidak masuk akal"],["おかげさまで、データセンターは 休暇中です。","Syukurlah, data center sedang cuti."]]],["p","よかった。ただ、余震が 続いて いるので 油断できませんね。","よかった。ただ、よしん が つづいて いる ので ゆだん できません ね。","Syukurlah. Tapi gempa susulan masih terus terjadi, jadi tidak boleh lengah."],["u","ええ。燃料が 明日の 朝までしか もたないので、追加の 供給を 手配せざるを 得ません。","ええ。ねんりょう が あした の あさ まで しか もたない ので、ついか の きょうきゅう を てはい せざる を えません。","Iya. Bahan bakarnya hanya cukup sampai besok pagi, jadi mau tidak mau kita harus mengatur pasokan tambahan.",[["ええ。燃料は 十分に あるので、追加の 供給を 手配せざるを 得ません。","Iya. Bahan bakarnya cukup, jadi kita terpaksa memesan tambahan.","tidak logis"],["ええ。燃料が 足りないので、サーバーを 増やしましょう。","Iya. Bahan bakarnya kurang, jadi mari tambah server."]]],["p","業者には 私が 連絡します。ほかに 何か 問題は？","ぎょうしゃ に は わたし が れんらく します。ほか に なに か もんだい は？","Biar saya yang menghubungi pemasoknya. Ada masalah lain?"],["u","一部の 拠点との 接続が 切れて います。回線業者に 問い合わせた ところ、復旧の 見込みは 未定だそうです。","いちぶ の きょてん と の せつぞく が きれて います。かいせん ぎょうしゃ に といあわせた ところ、ふっきゅう の みこみ は みてい だ そう です。","Koneksi ke beberapa cabang terputus. Saya sudah tanya ke penyedia jalur, katanya perkiraan pemulihannya belum pasti.",[["一部の 拠点との 接続が 切れて いますが、私が わざと 切りました。","Koneksi ke beberapa cabang terputus, tapi saya yang sengaja memutusnya."],["一部の 拠点に 遊びに 行って いるので、問題は ありません。","Saya sedang main ke beberapa cabang, jadi tidak ada masalah."]]],["p","それは 困りましたね。業務への 影響を 最小限に するには、どう しましょうか。","それ は こまりました ね。ぎょうむ へ の えいきょう を さいしょうげん に する に は、どう しましょう か。","Repot juga ya. Bagaimana caranya agar dampak ke operasional seminimal mungkin?"],["u","復旧するまでは、VPN経由の 接続に 切り替える ことを 優先すべきだと 思います。","ふっきゅう する まで は、ブイピーエヌ けいゆ の せつぞく に きりかえる こと を ゆうせん すべき だ と おもいます。","Sampai pulih, menurut saya kita harus memprioritaskan beralih ke koneksi lewat VPN.",[["復旧したら、VPNに 切り替える ことを 優先すべきだと 思います。","Setelah pulih, kita prioritaskan beralih ke VPN.","terlambat, tidak berguna"],["復旧するまでは、VPNも 止めて、接続を すべて 遮断すべきだと 思います。","Sampai pulih, VPN juga dihentikan dan semua koneksi diputus."]]],["p","賛成です。じゃあ、各拠点に 連絡して おきますね。","さんせい です。じゃあ、かく きょてん に れんらく して おきます ね。","Setuju. Kalau begitu, saya hubungi setiap cabang."],["u","お願いします。私は 状況を 部長に 報告した 上で、対応記録を 残して おきます。","おねがい します。わたし は じょうきょう を ぶちょう に ほうこく した うえ で、たいおう きろく を のこして おきます。","Tolong ya. Saya akan melaporkan situasinya ke manajer, lalu mencatat semua penanganannya.",[["お願いします。私は 誰にも 報告せずに、記録も 削除して おきます。","Tolong ya. Saya tidak akan melapor ke siapa pun dan akan menghapus catatannya."],["お願いします。私は 余震が 怖いので、もう 寝ます。","Tolong ya. Saya takut gempa susulan, jadi saya tidur saja."]]],["p","了解です。お互い、気を つけましょう。","りょうかい です。おたがい、き を つけましょう。","Siap. Kita sama-sama hati-hati, ya."]]},{"t":"Sosialisasi aturan password baru","s":"Kamu menjelaskan kebijakan password baru kepada staf keuangan yang keberatan.","p":"加藤さん","e":"👵","l":[["p","また パスワードを 変えるんですか。覚えるのが 負担なんですよ。","また パスワード を かえる ん です か。おぼえる の が ふたん な ん です よ。","Ganti password lagi? Mengingatnya itu memberatkan, lho."],["u","ご負担を おかけして 申し訳ありません。最近、他社で 不正アクセスの 被害が 相次いで おりまして。","ごふたん を おかけ して もうしわけ ありません。さいきん、たしゃ で ふせい アクセス の ひがい が あいついで おりまして。","Maaf sudah merepotkan. Belakangan ini, kasus akses ilegal di perusahaan lain terus bermunculan.",[["ご負担を おかけして、ありがとうございます。","Terima kasih karena sudah saya repotkan.","tidak nyambung"],["負担でしたら、パスワードは なくしましょう。","Kalau memberatkan, hapus saja passwordnya."]]],["p","でも、今の パスワードでも 問題ないと 思いますけど。","でも、いま の パスワード で も もんだい ない と おもいます けど。","Tapi menurut saya password yang sekarang pun tidak masalah."],["u","お気持ちは わかります。ただ、短い パスワードは 数分で 解読されかねないんです。","おきもち は わかります。ただ、みじかい パスワード は すうふん で かいどく されかねない ん です。","Saya mengerti perasaan Anda. Tapi password yang pendek bisa saja dibobol dalam beberapa menit.",[["お気持ちは わかります。ただ、短い パスワードほど 安全なんです。","Saya mengerti. Tapi justru makin pendek password makin aman.","salah"],["お気持ちは わかりません。黙って 変えて ください。","Saya tidak peduli perasaan Anda. Ganti saja tanpa banyak bicara."]]],["p","そうなんですか。じゃあ、どう すれば いいんですか。","そう な ん です か。じゃあ、どう すれば いい ん です か。","Oh begitu. Lalu, sebaiknya bagaimana?"],["u","十二文字以上で、文章のように 覚えやすい ものを お勧めします。","じゅうに もじ いじょう で、ぶんしょう の よう に おぼえやすい もの を おすすめ します。","Saya sarankan minimal 12 karakter, dan yang mudah diingat seperti sebuah kalimat.",[["三文字以内で、誕生日など 推測しやすい ものを お勧めします。","Saya sarankan maksimal 3 karakter, yang mudah ditebak seperti tanggal lahir."],["パスワードは 紙に 書いて、パソコンに 貼って おいて ください。","Tulis saja passwordnya di kertas dan tempel di komputer."]]],["p","なるほど。それなら できそうです。いつまでに 変更すれば いいですか。","なるほど。それ なら できそう です。いつ まで に へんこう すれば いい です か。","Begitu. Kalau begitu sepertinya bisa. Paling lambat kapan harus diganti?"],["u","今月末までに お願いします。期限を 過ぎると ログインが 制限されますので、ご注意ください。","こんげつまつ まで に おねがい します。きげん を すぎる と ログイン が せいげん されます ので、ごちゅうい ください。","Paling lambat akhir bulan ini. Kalau lewat tenggat, login akan dibatasi, jadi mohon diperhatikan.",[["期限は 昨日まででした。もう 間に合いません。","Tenggatnya sampai kemarin. Sudah tidak keburu.","tidak nyambung"],["今月末までに、私が 加藤さんの パスワードを 決めて 皆に 教えて おきます。","Paling lambat akhir bulan, saya akan menentukan password Kato-san dan memberitahukannya ke semua orang."]]],["p","わかりました。丁寧に 説明して くれて、納得できました。","わかりました。ていねい に せつめい して くれて、なっとく できました。","Baik. Terima kasih sudah menjelaskan dengan teliti, saya jadi paham."],["u","ご理解 いただき、ありがとうございます。何か ございましたら、いつでも ヘルプデスクまで ご連絡ください。","ごりかい いただき、ありがとう ございます。なに か ございましたら、いつ で も ヘルプデスク まで ごれんらく ください。","Terima kasih atas pengertiannya. Kalau ada apa-apa, silakan hubungi helpdesk kapan saja.",[["ご理解 いただき、ありがとうございます。何か あっても、連絡しないで ください。","Terima kasih atas pengertiannya. Kalau ada apa-apa pun, jangan hubungi kami."],["納得して さしあげて、ありがとうございます。","Terima kasih karena saya sudah \"berkenan\" paham.","keigo terbalik"]]],["p","はい、その 時は よろしく お願いしますね。","はい、その とき は よろしく おねがい します ね。","Ya, nanti kalau ada apa-apa mohon bantuannya ya."]]}],"n1":[{"t":"Melaporkan keterlambatan proyek","s":"Kamu harus menjelaskan kepada klien bahwa proyek akan terlambat.","p":"クライアント","e":"🏢","l":[["p","納期まで あと 2週間ですが、進捗は いかがでしょうか。","のうき まで あと にしゅうかん です が、しんちょく は いかが でしょう か。","Tinggal dua minggu sampai tenggat, bagaimana progresnya?"],["u","誠に 申し上げにくいのですが、仕様変更の 影響で、1週間ほど 遅延する 見込みでございます。","まこと に もうしあげにくい の です が、しよう へんこう の えいきょう で、いっしゅうかん ほど ちえん する みこみ で ございます。","Mohon maaf, sebenarnya sulit disampaikan, namun karena perubahan spesifikasi, diperkirakan terlambat sekitar satu minggu.",[["順調ですので、1週間 早く 納品させて いただきます。遅延は ございます。","Lancar, jadi kami kirim seminggu lebih awal. Ada keterlambatan.","bertentangan"],["遅れるのは 御社の せいですので、仕方ないですね。","Terlambatnya karena perusahaan Anda, jadi apa boleh buat."]]],["p","それは 困りますね。こちらの 予定にも 支障が 出ますので。","それ は こまります ね。こちら の よてい に も ししょう が でます ので。","Itu menyulitkan. Jadwal kami juga akan terganggu."],["u","ご迷惑を おかけし、大変 申し訳ございません。人員を 増やすなど、あらゆる 措置を 講じて おります。","ごめいわく を おかけ し、たいへん もうしわけ ございません。じんいん を ふやす など、あらゆる そち を こうじて おります。","Mohon maaf atas ketidaknyamanannya. Kami telah mengambil segala langkah, termasuk menambah personel.",[["ご迷惑を おかけしますが、特に 何も しない 予定です。","Maaf merepotkan, tapi kami tidak berencana melakukan apa pun."],["人員を 減らしたので、さらに 遅れる 見込みです。","Kami mengurangi personel, jadi diperkirakan makin terlambat."]]],["p","部分的にでも、期日までに 納品して いただく ことは 可能ですか。","ぶぶんてき に でも、きじつ まで に のうひん して いただく こと は かのう です か。","Apakah mungkin setidaknya sebagian dikirim sebelum tenggat?"],["u","主要な 機能に 限ってであれば、期日までに 納品する ことは 可能かと 存じます。","しゅよう な きのう に かぎって で あれば、きじつ まで に のうひん する こと は かのう か と ぞんじます。","Jika terbatas pada fungsi utama, saya rasa bisa dikirim sebelum tenggat.",[["主要な 機能は 不可欠では ないので、期日を 過ぎても 存じません。","Fungsi utama tidak penting, jadi kalau lewat tenggat saya tidak tahu."],["部分的な 納品は 一切 お断り申し上げます。期日も 守れません。","Kami menolak pengiriman sebagian sama sekali. Tenggat juga tidak bisa dipenuhi."]]],["p","では、その 方向で お願いします。","では、その ほうこう で おねがい します。","Kalau begitu, tolong lanjutkan dengan cara itu."],["u","かしこまりました。詳細な スケジュールを 本日中に ご提出いたします。","かしこまりました。しょうさい な スケジュール を ほんじつちゅう に ごていしゅつ いたします。","Baik. Jadwal rinciannya akan kami serahkan hari ini juga.",[["かしこまりました。スケジュールは 後日 気が 向いたら お送りします。","Baik. Jadwalnya kapan-kapan kalau sedang ingin saya kirim."],["はい、わかった。じゃ、よろしく。","Ya, oke. Ya sudah ya.","terlalu santai"]]]]},{"t":"Tanya jawab setelah presentasi","s":"Kamu baru selesai presentasi tentang AI. Seorang peserta bertanya.","p":"参加者","e":"🎤","l":[["p","本日の ご講演、大変 興味深く 拝聴いたしました。一点 質問させて いただけますか。","ほんじつ の ごこうえん、たいへん きょうみぶかく はいちょう いたしました。いってん しつもん させて いただけます か。","Presentasi Anda hari ini sangat menarik. Bolehkah saya mengajukan satu pertanyaan?"],["u","はい、どうぞ。","はい、どうぞ。","Ya, silakan.",[["いいえ、質問は 禁じ得ません。","Tidak, saya tak bisa menahan pertanyaan.","tidak nyambung"],["はい、拝聴して ください。","Ya, silakan dengarkan (dengan merendah).","salah keigo"]]],["p","AIの 導入によって 雇用が 失われる という 懸念も ありますが、どう お考えですか。","エーアイ の どうにゅう に よって こよう が うしなわれる と いう けねん も あります が、どう おかんがえ です か。","Ada kekhawatiran bahwa penerapan AI akan menghilangkan lapangan kerja. Bagaimana pendapat Anda?"],["u","ご指摘の とおり、一部の 業務は 代替されると 思います。しかし、新たな 職種が 生まれる ことも 見逃せません。","ごしてき の とおり、いちぶ の ぎょうむ は だいたい される と おもいます。しかし、あらた な しょくしゅ が うまれる こと も みのがせません。","Seperti yang Anda tunjukkan, sebagian pekerjaan akan tergantikan. Namun, munculnya jenis pekerjaan baru juga tidak bisa diabaikan.",[["ご指摘は 些細な ことですので、考える までも ありません。","Yang Anda tunjukkan hal sepele, tidak perlu dipikirkan."],["AIは 雇用を 一切 生まないので、懸念は 不要です。","AI sama sekali tidak menciptakan lapangan kerja, jadi kekhawatiran tidak perlu."]]],["p","具体的には、どのような 職種でしょうか。","ぐたいてき に は、どの よう な しょくしゅ でしょう か。","Secara konkret, jenis pekerjaan seperti apa?"],["u","例えば、AIを 管理・運用する 人材の 需要は、今後 著しく 高まると 考えております。","たとえば、エーアイ を かんり・うんよう する じんざい の じゅよう は、こんご いちじるしく たかまる と かんがえて おります。","Misalnya, kebutuhan akan SDM yang mengelola dan mengoperasikan AI menurut saya akan meningkat tajam ke depannya.",[["例えば、AIを 使わない 人材は 著しく 不可欠です。","Misalnya, SDM yang tidak memakai AI sangat amat diperlukan.","tidak logis"],["具体的には 存じ上げませんので、お答えしかねます。でも 増えます。","Secara konkret saya tidak tahu, jadi sulit menjawab. Tapi bertambah."]]],["p","なるほど。ありがとうございました。","なるほど。ありがとう ございました。","Begitu. Terima kasih."],["u","貴重な ご質問、ありがとうございました。","きちょう な ごしつもん、ありがとう ございました。","Terima kasih atas pertanyaannya yang berharga.",[["陳腐な ご質問、ありがとうございました。","Terima kasih atas pertanyaan yang basi.","tidak sopan"],["こちらこそ、拝聴いたしました。","Saya juga sudah mendengarkan (dengan hormat).","tidak tepat"]]]]},{"t":"Laporan di rapat direksi","s":"Kamu melaporkan perkembangan proyek integrasi sistem di rapat direksi.","p":"高橋専務","e":"👨‍💼","l":[["p","では、システム統合プロジェクトの進捗について報告をお願いします。","では、しすてむ とうごう ぷろじぇくと の しんちょく に ついて ほうこく を おねがい します。","Baiklah, silakan laporkan perkembangan proyek integrasi sistem."],["u","はい。お手元の資料に概要を記載しておりますので、大筋からご説明いたします。","はい。おてもと の しりょう に がいよう を きさい して おります ので、おおすじ から ごせつめい いたします。","Baik. Ringkasannya tercantum di dokumen di depan Bapak-Ibu, jadi saya jelaskan garis besarnya dulu.",[["はい。お手元の資料に概要を記載しておりますので、どうぞお召し上がりください。","Baik. Ringkasannya ada di dokumen, jadi silakan dinikmati (dimakan)."],["はい。資料なんか、別に見なくてもいいっすよ。","Iya. Dokumennya sih nggak usah dilihat juga nggak apa-apa."]]],["p","先月、スケジュールに著しい遅れがあると聞きましたが。","せんげつ、すけじゅーる に いちじるしい おくれ が ある と ききました が。","Bulan lalu saya dengar ada keterlambatan jadwal yang cukup parah."],["u","ご指摘のとおりです。要因は外部ベンダーとの連携不足にございました。","ごしてき の とおり です。よういん は がいぶ べんだー と の れんけい ぶそく に ございました。","Benar seperti yang Bapak sampaikan. Penyebabnya adalah kurangnya koordinasi dengan vendor eksternal.",[["ご指摘のとおりです。要因は外部ベンダーとの連携が円滑すぎたことにございました。","Benar. Penyebabnya adalah koordinasi dengan vendor yang terlalu lancar."],["おっしゃるとおりです。ですので、本プロジェクトは本日をもって完了いたしました。","Benar. Karena itu, proyek ini selesai per hari ini."]]],["p","現在の状況は？","げんざい の じょうきょう は？","Bagaimana kondisinya sekarang?"],["u","是正措置を講じた結果、先週の時点で遅れはほぼ解消いたしました。","ぜせい そち を こうじた けっか、せんしゅう の じてん で おくれ は ほぼ かいしょう いたしました。","Setelah kami mengambil tindakan korektif, per minggu lalu keterlambatannya hampir teratasi.",[["是正措置を講じた結果、遅れがさらに著しくなったので、大成功です。","Setelah tindakan korektif, keterlambatannya makin parah, jadi ini sukses besar."],["是正措置なんて、面倒なのでやめておきました。","Tindakan korektif itu merepotkan, jadi tidak kami lakukan."]]],["p","予算のほうは大丈夫ですか。","よさん の ほう は だいじょうぶ です か。","Bagaimana dengan anggarannya, aman?"],["u","はい、追加費用は予備費で賄える見込みです。","はい、ついか ひよう は よびひ で まかなえる みこみ です。","Ya, biaya tambahan diperkirakan bisa ditutup dari dana cadangan.",[["はい、予算はもう破綻しておりますので、大丈夫です。","Ya, anggarannya sudah jebol, jadi aman."],["はい、追加費用は社員の給料を全額カットして賄う予定です。","Ya, biaya tambahan rencananya ditutup dengan memotong seluruh gaji karyawan."]]],["p","分かりました。リリースはいつになりますか。","わかりました。りりーす は いつ に なります か。","Baik. Kapan rilisnya?"],["u","来月末をもって旧システムを停止し、新システムへ全面的に移行する予定です。","らいげつまつ を もって きゅう しすてむ を ていし し、しん しすてむ へ ぜんめんてき に いこう する よてい です。","Per akhir bulan depan sistem lama akan dihentikan dan kami beralih sepenuhnya ke sistem baru.",[["来月末をもって新システムを停止し、旧システムに戻す予定です。","Per akhir bulan depan sistem baru akan dihentikan dan kami kembali ke sistem lama."],["昨日をもって移行する予定です。","Rencananya migrasi per kemarin."]]],["p","了解しました。引き続き、徹底した管理をお願いします。","りょうかい しました。ひきつづき、てってい した かんり を おねがい します。","Baik. Mohon terus lakukan pengelolaan yang menyeluruh."]]},{"t":"Mengajukan proposal ke manajemen","s":"Kamu mempresentasikan usulan otomatisasi monitoring jaringan kepada kepala divisi.","p":"木村部長","e":"👩‍💼","l":[["p","今日はどんな提案ですか。手短にお願いします。","きょう は どんな ていあん です か。てみじか に おねがい します。","Usulan apa hari ini? Tolong singkat saja."],["u","監視業務の自動化についてご提案いたします。作業時間を大幅に減らすべく、新ツールの導入を検討しております。","かんし ぎょうむ の じどうか に ついて ごていあん いたします。さぎょう じかん を おおはば に へらす べく、しん つーる の どうにゅう を けんとう して おります。","Saya ingin mengusulkan otomatisasi pekerjaan monitoring. Untuk memangkas waktu kerja secara drastis, kami sedang mempertimbangkan penerapan tool baru.",[["監視業務の自動化についてご提案いたします。作業時間を大幅に増やすべく、新ツールの導入を検討しております。","Saya mengusulkan otomatisasi monitoring. Untuk menambah waktu kerja secara drastis, kami mempertimbangkan tool baru."],["監視業務の自動化については、特に提案はございません。","Soal otomatisasi monitoring, saya tidak punya usulan apa-apa."]]],["p","画期的なのは分かりますが、費用対効果は？","かっきてき なの は わかります が、ひよう たい こうか は？","Saya paham ini terobosan, tapi bagaimana efektivitas biayanya?"],["u","初期費用はかかりますが、二年以内に回収できると試算しております。","しょき ひよう は かかります が、にねん いない に かいしゅう できる と しさん して おります。","Memang ada biaya awal, tapi menurut perhitungan kami bisa balik modal dalam dua tahun.",[["費用については、まったく計算しておりません。","Soal biaya, saya sama sekali belum menghitungnya."],["費用対効果とはいえ、お金の話は苦手でして。","Meski soal efektivitas biaya, saya kurang suka bicara soal uang."]]],["p","現場の負担は増えませんか。","げんば の ふたん は ふえません か。","Beban staf lapangan tidak bertambah?"],["u","移行期間中は多少増えますが、マニュアルを整備し、円滑に進められるよう尽力いたします。","いこう きかん ちゅう は たしょう ふえます が、まにゅある を せいび し、えんかつ に すすめられる よう じんりょく いたします。","Selama masa transisi memang sedikit bertambah, tapi kami akan menyiapkan manual dan berupaya agar semuanya berjalan lancar.",[["移行期間中は多少増えますが、現場の皆さんが何とかするでしょう。","Selama transisi memang bertambah, tapi orang lapangan pasti bisa mengatasinya sendiri."],["負担が増えるとはいえ、マニュアルは作らないつもりです。","Meski bebannya bertambah, saya tidak berniat membuat manual."]]],["p","セキュリティ面の懸念は？","せきゅりてぃ めん の けねん は？","Bagaimana dengan kekhawatiran dari sisi keamanan?"],["u","他社の導入事例を吟味したうえで、権限管理を厳密に設定いたします。","たしゃ の どうにゅう じれい を ぎんみ した うえ で、けんげん かんり を げんみつ に せってい いたします。","Setelah meneliti dengan saksama contoh penerapan di perusahaan lain, kami akan mengatur manajemen hak akses secara ketat.",[["他社の導入事例を吟味したうえで、全員に管理者権限を付与いたします。","Setelah meneliti contoh perusahaan lain, kami akan memberi hak admin kepada semua orang."],["セキュリティについては、考慮する必要はないかと存じます。","Saya rasa soal keamanan tidak perlu dipertimbangkan."]]],["p","なるほど。ほかに選択肢は検討しましたか。","なるほど。ほか に せんたくし は けんとう しました か。","Begitu. Apakah sudah mempertimbangkan pilihan lain?"],["u","はい、三つの案を比較いたしました。本ツールならではの拡張性を考慮し、こちらを推薦いたします。","はい、みっつ の あん を ひかく いたしました。ほん つーる ならでは の かくちょうせい を こうりょ し、こちら を すいせん いたします。","Ya, kami sudah membandingkan tiga opsi. Dengan mempertimbangkan skalabilitas yang hanya dimiliki tool ini, kami merekomendasikannya.",[["いいえ、ほかの案は面倒なので一切見ておりません。","Tidak, opsi lain merepotkan jadi sama sekali tidak saya lihat."],["はい、三つの案を比較いたしました。最も高価だという理由で、こちらを推薦いたします。","Ya, kami membandingkan tiga opsi. Kami merekomendasikan ini karena paling mahal."]]],["p","分かりました。来週の経営会議で、正式に上げてください。","わかりました。らいしゅう の けいえい かいぎ で、せいしき に あげて ください。","Baik. Ajukan secara resmi di rapat manajemen minggu depan."],["u","ありがとうございます。それまでに資料を練り直してまいります。","ありがとう ございます。それ まで に しりょう を ねりなおして まいります。","Terima kasih. Sebelum itu saya akan menyempurnakan materinya.",[["ありがとうございます。それまでに資料を捨ててまいります。","Terima kasih. Sebelum itu saya akan membuang materinya."],["ありがとうございます。では、経営会議は欠席いたします。","Terima kasih. Kalau begitu, saya tidak akan hadir di rapat manajemen."]]],["p","期待していますよ。","きたい して います よ。","Saya menantikannya."]]},{"t":"Mediasi konflik tim","s":"Dua anggota tim berselisih soal pembagian tugas. Sebagai pimpinan proyek, kamu bicara dengan salah satunya.","p":"佐藤さん","e":"👨","l":[["p","もう我慢できません。山田さんは自分の作業を全部こっちに押しつけてくるんです。","もう がまん できません。やまだ さん は じぶん の さぎょう を ぜんぶ こっち に おしつけて くる ん です。","Saya sudah tidak tahan. Yamada-san melempar semua pekerjaannya ke saya."],["u","お気持ちはお察しします。まずは具体的に何があったのか、聞かせてもらえますか。","おきもち は おさっし します。まず は ぐたいてき に なに が あった の か、きかせて もらえます か。","Saya paham perasaanmu. Pertama, boleh ceritakan secara konkret apa yang terjadi?",[["お気持ちはお察ししますが、私には関係ないことですね。","Saya paham perasaanmu, tapi itu bukan urusan saya, ya."],["それは佐藤さんが臆病だからじゃないですか。","Itu karena Sato-san penakut, kan?"]]],["p","先週も、テストを頻繁に頼まれて、自分の作業が全然進まなかったんです。","せんしゅう も、てすと を ひんぱん に たのまれて、じぶん の さぎょう が ぜんぜん すすまなかった ん です。","Minggu lalu juga saya terus-terusan dimintai tolong testing, sampai pekerjaan saya sendiri tidak maju sama sekali."],["u","それは大変でしたね。佐藤さんの負担が過剰になっていたことに、気づけず申し訳ありません。","それ は たいへん でした ね。さとう さん の ふたん が かじょう に なって いた こと に、きづけず もうしわけ ありません。","Itu pasti berat. Maaf saya tidak menyadari bebanmu sudah berlebihan.",[["それは大変でしたね。でも、テストは佐藤さんの趣味でしょう？","Itu berat ya. Tapi testing kan memang hobi Sato-san?"],["それはよかったですね。もっと頼まれるといいですね。","Bagus dong. Semoga makin sering dimintai tolong."]]],["p","山田さんにも言い分はあると思いますけど……。","やまだ さん に も いいぶん は ある と おもいます けど……。","Yamada-san mungkin juga punya alasannya sendiri, sih..."],["u","ええ、山田さんからも話を聞いたうえで、偏見なく判断したいと思います。","ええ、やまだ さん から も はなし を きいた うえ で、へんけん なく はんだん したい と おもいます。","Ya, saya akan mendengar cerita dari Yamada-san juga, lalu menilai tanpa prasangka.",[["いいえ、山田さんの話は聞かずに、山田さんが悪いと決めます。","Tidak, saya akan memutuskan Yamada-san yang salah tanpa mendengar ceritanya."],["ええ、山田さんの言い分だけを聞いて判断します。","Ya, saya akan memutuskan hanya dengan mendengar alasan Yamada-san."]]],["p","ありがとうございます。正直、このままだとチームを抜けたいくらいでした。","ありがとう ございます。しょうじき、この まま だ と ちーむ を ぬけたい くらい でした。","Terima kasih. Jujur, kalau begini terus saya sampai ingin keluar dari tim."],["u","そこまで追い詰められていたとは……。役割分担を明確にして、二度と同じことが起きないようにします。","そこ まで おいつめられて いた とは……。やくわり ぶんたん を めいかく に して、にど と おなじ こと が おきない よう に します。","Saya tidak menyangka kamu sampai sebegitu tertekan... Saya akan memperjelas pembagian peran supaya hal yang sama tidak terulang.",[["そうですか。では、明日からチームを脱退してください。","Begitu. Kalau begitu, silakan keluar dari tim mulai besok."],["そこまで追い詰められていたとは……。役割分担はあいまいなままにしておきます。","Tidak menyangka sampai segitunya... Pembagian peran akan saya biarkan tetap kabur."]]],["p","助かります。お互いに少し妥協も必要かもしれませんね。","たすかります。おたがい に すこし だきょう も ひつよう かも しれません ね。","Terima kasih. Mungkin kami berdua juga perlu sedikit berkompromi."],["u","そうですね。明日、三人で話し合う場を設けましょう。","そう です ね。あした、さんにん で はなしあう ば を もうけましょう。","Betul. Besok kita adakan pertemuan bertiga untuk membicarakannya.",[["そうですね。明日、三人で喧嘩する場を設けましょう。","Betul. Besok kita adakan ajang untuk bertengkar bertiga."],["いいえ、妥協など絶対にしてはいけません。","Tidak, kompromi sama sekali tidak boleh."]]],["p","はい、よろしくお願いします。","はい、よろしく おねがい します。","Baik, mohon bantuannya."]]},{"t":"Wawancara dengan media","s":"Seorang wartawan majalah IT mewawancaraimu tentang keberhasilan proyek keamanan perusahaan.","p":"中村記者","e":"👩","l":[["p","本日はお時間をいただき、ありがとうございます。","ほんじつ は おじかん を いただき、ありがとう ございます。","Terima kasih sudah meluangkan waktu hari ini."],["u","こちらこそ、このような機会をいただき、光栄に存じます。","こちらこそ、この よう な きかい を いただき、こうえい に ぞんじます。","Saya yang berterima kasih. Suatu kehormatan mendapat kesempatan seperti ini.",[["こちらこそ、このような機会をいただき、残念に存じます。","Saya juga. Sayang sekali mendapat kesempatan seperti ini."],["こちらこそ、お時間をいただき、ご苦労さまです。","Saya juga. Terima kasih atas jerih payahmu (ungkapan untuk bawahan)."]]],["p","今回のプロジェクトは業界でも画期的だと評判ですが、成功の要因は何でしょうか。","こんかい の ぷろじぇくと は ぎょうかい で も かっきてき だ と ひょうばん です が、せいこう の よういん は なん でしょう か。","Proyek ini disebut-sebut sebagai terobosan di industri. Apa faktor keberhasilannya?"],["u","部署の垣根を越えた連携に尽きると存じます。","ぶしょ の かきね を こえた れんけい に つきる と ぞんじます。","Menurut saya, intinya adalah kerja sama yang melampaui sekat antardepartemen.",[["部署同士の紛争に尽きると存じます。","Menurut saya, intinya adalah konflik antardepartemen."],["成功したかどうか、私にはさっぱり分かりません。","Berhasil atau tidak, saya sama sekali tidak tahu."]]],["p","外国人エンジニアとして、苦労されたことはありますか。","がいこくじん えんじにあ と して、くろう された こと は あります か。","Sebagai engineer asing, apakah ada kesulitan yang Anda alami?"],["u","言葉の壁はありましたが、周囲が寛容に受け入れてくださったおかげで、乗り越えられました。","ことば の かべ は ありました が、しゅうい が かんよう に うけいれて くださった おかげ で、のりこえられました。","Ada kendala bahasa, tapi berkat orang-orang di sekitar yang menerima saya dengan lapang hati, saya bisa melewatinya.",[["言葉の壁はありましたが、周囲が寛容に受け入れてくださったせいで、乗り越えられませんでした。","Ada kendala bahasa, dan gara-gara orang sekitar menerima saya dengan lapang hati, saya tidak bisa melewatinya."],["苦労なんて、日本人の偏見のせいで毎日ですよ。","Kesulitan? Tiap hari, gara-gara prasangka orang Jepang."]]],["p","最近はサイバー攻撃が企業の経営を脅かしていますね。","さいきん は さいばー こうげき が きぎょう の けいえい を おびやかして います ね。","Belakangan serangan siber mengancam bisnis perusahaan, ya."],["u","ええ。だからこそ、一人一人がルールの遵守を怠らないことが不可欠だと考えております。","ええ。だからこそ、ひとりひとり が るーる の じゅんしゅ を おこたらない こと が ふかけつ だ と かんがえて おります。","Ya. Justru karena itu, menurut saya setiap orang wajib tidak lalai mematuhi aturan.",[["ええ。だからこそ、一人一人がルールの遵守を怠ることが不可欠だと考えております。","Ya. Justru karena itu, setiap orang wajib lalai mematuhi aturan."],["ええ。でも、うちの会社には関係のない話です。","Ya. Tapi itu tidak ada hubungannya dengan perusahaan kami."]]],["p","最後に、今後の目標をお聞かせください。","さいご に、こんご の もくひょう を おきかせ ください。","Terakhir, tolong ceritakan target Anda ke depan."],["u","日本ならではのきめ細かさと、海外の柔軟な発想を融合させたいと思っております。","にほん ならでは の きめこまかさ と、かいがい の じゅうなん な はっそう を ゆうごう させたい と おもって おります。","Saya ingin memadukan ketelitian khas Jepang dengan cara berpikir luar negeri yang fleksibel.",[["日本ならではのきめ細かさを、すべて捨てたいと思っております。","Saya ingin membuang semua ketelitian khas Jepang."],["目標は特にございませんので、これで失礼いたします。","Tidak ada target khusus, jadi saya permisi dulu."]]],["p","素敵なお話、ありがとうございました。記事は来月号に掲載予定です。","すてき な おはなし、ありがとう ございました。きじ は らいげつごう に けいさい よてい です。","Terima kasih atas ceritanya yang menarik. Artikelnya dijadwalkan terbit di edisi bulan depan."],["u","掲載を楽しみにしております。本日はありがとうございました。","けいさい を たのしみ に して おります。ほんじつ は ありがとう ございました。","Saya menantikan terbitnya. Terima kasih untuk hari ini.",[["掲載は結構ですので、記事は破棄してください。","Tidak usah dimuat, buang saja artikelnya."],["掲載を楽しみにしております。では、いただきます。","Saya menantikan terbitnya. Baiklah, selamat makan."]]],["p","こちらこそ、ありがとうございました。","こちらこそ、ありがとう ございました。","Saya juga berterima kasih."]]},{"t":"Diskusi kebijakan kerja jarak jauh","s":"Kepala HR meminta pendapatmu tentang revisi kebijakan kerja dari rumah.","p":"松本部長","e":"🧔","l":[["p","在宅勤務制度の見直しについて、現場の意見を聞かせてください。","ざいたく きんむ せいど の みなおし に ついて、げんば の いけん を きかせて ください。","Tolong sampaikan pendapat dari lapangan soal peninjauan ulang sistem kerja dari rumah."],["u","はい。全面的に廃止するのではなく、業務の実態に即して柔軟に運用すべきだと考えます。","はい。ぜんめんてき に はいし する の で は なく、ぎょうむ の じったい に そくして じゅうなん に うんよう すべき だ と かんがえます。","Baik. Menurut saya, bukannya dihapus total, tapi sebaiknya diterapkan secara fleksibel sesuai kondisi nyata pekerjaan.",[["はい。在宅勤務の制度については、まったく存じ上げません。","Baik. Saya sama sekali tidak tahu-menahu soal sistem kerja dari rumah."],["はい。私は人事部長ではございませんので、意見はございません。","Baik. Saya bukan kepala HR, jadi saya tidak punya pendapat."]]],["p","経営陣は、生産性の低下を懸念しているようですが。","けいえいじん は、せいさんせい の ていか を けねん して いる よう です が。","Sepertinya jajaran manajemen khawatir produktivitas akan turun."],["u","データを見る限り、むしろ生産性は上がっております。懸念は抽象的な印象にすぎないかと存じます。","でーた を みる かぎり、むしろ せいさんせい は あがって おります。けねん は ちゅうしょうてき な いんしょう に すぎない か と ぞんじます。","Kalau melihat datanya, produktivitas justru naik. Saya rasa kekhawatiran itu hanyalah kesan yang abstrak.",[["データを見る限り、むしろ生産性は上がっております。ですので、懸念はもっともでございます。","Kalau melihat data, produktivitas justru naik. Karena itu kekhawatirannya sangat beralasan."],["データなんか見なくても、在宅のほうが楽なのは明らかです。","Tanpa lihat data pun jelas kerja dari rumah lebih santai."]]],["p","一方で、制度の濫用も一部で問題になっています。","いっぽう で、せいど の らんよう も いちぶ で もんだい に なって います。","Di sisi lain, penyalahgunaan sistem ini juga jadi masalah di sebagian tempat."],["u","おっしゃるとおりです。勤怠管理を徹底し、違反には厳正な措置を取るべきでしょう。","おっしゃる とおり です。きんたい かんり を てってい し、いはん に は げんせい な そち を とる べき でしょう。","Betul sekali. Manajemen kehadiran harus dilakukan tuntas, dan pelanggaran perlu ditindak tegas.",[["おっしゃるとおりです。濫用は些細なことなので、放っておきましょう。","Betul. Penyalahgunaan itu hal sepele, biarkan saja."],["おっしゃるとおりです。ですので、勤怠管理は廃止しましょう。","Betul. Karena itu, mari hapus saja manajemen kehadiran."]]],["p","育児や介護をしている社員への配慮はどうでしょう。","いくじ や かいご を して いる しゃいん へ の はいりょ は どう でしょう。","Bagaimana dengan pertimbangan bagi karyawan yang mengasuh anak atau merawat keluarga?"],["u","そうした社員が働き続けられる環境こそ、人材確保に不可欠だと思います。","そうした しゃいん が はたらきつづけられる かんきょう こそ、じんざい かくほ に ふかけつ だ と おもいます。","Justru lingkungan yang memungkinkan mereka terus bekerja itulah yang mutlak diperlukan untuk mempertahankan SDM.",[["そうした社員には、退職をお勧めするのが賢明だと思います。","Menurut saya, yang bijak adalah menyarankan mereka mengundurkan diri."],["育児や介護は、会社とは何の関係もございません。","Mengasuh anak dan merawat keluarga sama sekali tidak ada hubungannya dengan perusahaan."]]],["p","参考になりました。最終案は来月の役員会で決定する予定です。","さんこう に なりました。さいしゅう あん は らいげつ の やくいんかい で けってい する よてい です。","Sangat membantu. Rancangan finalnya akan diputuskan di rapat direksi bulan depan."],["u","現場の声を汲んでいただき、ありがとうございます。決定次第、部内に周知いたします。","げんば の こえ を くんで いただき、ありがとう ございます。けってい しだい、ぶない に しゅうち いたします。","Terima kasih sudah menampung suara lapangan. Begitu diputuskan, akan saya sosialisasikan di divisi.",[["現場の声を無視していただき、ありがとうございます。","Terima kasih sudah mengabaikan suara lapangan."],["現場の声を汲んでいただき、ありがとうございます。決定しても、部内には秘密にいたします。","Terima kasih sudah menampung suara lapangan. Meski sudah diputuskan, akan saya rahasiakan dari divisi."]]],["p","よろしく頼みます。","よろしく たのみます。","Saya andalkan, ya."]]},{"t":"Menghadapi audit keamanan","s":"Auditor eksternal memeriksa pengelolaan keamanan informasi di departemen IT-mu.","p":"森さん","e":"🧑‍💼","l":[["p","それでは、アクセス権限の管理状況から確認させていただきます。","それ では、あくせす けんげん の かんり じょうきょう から かくにん させて いただきます。","Baik, saya akan mulai memeriksa kondisi pengelolaan hak akses."],["u","かしこまりました。権限一覧はこちらの台帳にまとめてございます。","かしこまりました。けんげん いちらん は こちら の だいちょう に まとめて ございます。","Baik. Daftar hak akses sudah kami rangkum di buku register ini.",[["かしこまりました。権限一覧は、特に作成しておりません。","Baik. Daftar hak akses tidak kami buat sama sekali."],["かしこまりました。権限一覧はお見せできませんので、お引き取りください。","Baik. Daftar hak akses tidak bisa diperlihatkan, jadi silakan pulang."]]],["p","退職者のアカウントが三件、まだ有効になっていますね。","たいしょくしゃ の あかうんと が さんけん、まだ ゆうこう に なって います ね。","Ada tiga akun milik karyawan yang sudah keluar masih aktif, ya."],["u","申し訳ございません。確認を怠っておりました。直ちに無効化いたします。","もうしわけ ございません。かくにん を おこたって おりました。ただちに むこうか いたします。","Mohon maaf. Kami lalai memeriksanya. Akan segera kami nonaktifkan.",[["申し訳ございません。確認を怠っておりました。直ちに有効期限を延長いたします。","Mohon maaf, kami lalai. Masa berlakunya akan segera kami perpanjang."],["たった三件なら、些細な問題ですよね。","Cuma tiga, itu masalah sepele, kan?"]]],["p","再発防止策も必要ですね。","さいはつ ぼうし さく も ひつよう です ね。","Langkah pencegahan agar tidak terulang juga diperlukan, ya."],["u","はい。人事システムと統合し、退職と同時に自動で削除される仕組みを構築いたします。","はい。じんじ しすてむ と とうごう し、たいしょく と どうじ に じどう で さくじょ される しくみ を こうちく いたします。","Ya. Kami akan mengintegrasikannya dengan sistem HR dan membangun mekanisme agar akun otomatis terhapus begitu karyawan keluar.",[["はい。人事システムと統合し、退職者にも管理者権限を付与する仕組みを構築いたします。","Ya. Kami akan membangun mekanisme yang memberi hak admin juga kepada mantan karyawan."],["はい。ですので、今後は退職者を出さないようにいたします。","Ya. Karena itu, ke depannya kami tidak akan membiarkan ada karyawan yang keluar."]]],["p","パスワードポリシーについてはいかがですか。","ぱすわーど ぽりしー に ついて は いかが です か。","Bagaimana dengan kebijakan kata sandi?"],["u","社内規程に即して、十二文字以上と多要素認証を義務づけております。","しゃない きてい に そくして、じゅうに もじ いじょう と たようそ にんしょう を ぎむづけて おります。","Sesuai peraturan internal, kami mewajibkan minimal dua belas karakter dan autentikasi multifaktor.",[["社内規程をよそに、全員同じパスワードを使っております。","Tanpa memedulikan peraturan internal, semua orang memakai kata sandi yang sama."],["社内規程に即して、パスワードは付箋に書いて画面に貼っております。","Sesuai peraturan internal, kata sandi ditulis di kertas tempel dan ditempel di layar."]]],["p","承知しました。指摘事項は後日、報告書にまとめてお送りします。","しょうち しました。してき じこう は ごじつ、ほうこくしょ に まとめて おおくり します。","Baik. Temuan-temuannya akan saya rangkum dalam laporan dan kirimkan di kemudian hari."],["u","ご指摘いただいた点は、期限を設けて是正いたします。本日はありがとうございました。","ごしてき いただいた てん は、きげん を もうけて ぜせい いたします。ほんじつ は ありがとう ございました。","Poin-poin temuan akan kami perbaiki dengan tenggat yang jelas. Terima kasih untuk hari ini.",[["ご指摘いただいた点は、できれば見なかったことにしていただけますか。","Untuk temuan tadi, bisakah dianggap tidak pernah dilihat saja?"],["ご指摘いただいた点は、期限を設けずに放置いたします。","Poin-poin temuan akan kami biarkan tanpa tenggat."]]],["p","お疲れさまでした。","おつかれさま でした。","Terima kasih atas kerja samanya."]]},{"t":"Negosiasi kontrak dengan vendor","s":"Kamu bernegosiasi soal perpanjangan kontrak pemeliharaan server dengan perusahaan vendor.","p":"山本様","e":"👴","l":[["p","来年度の保守契約ですが、料金を一割ほど上げさせていただきたく存じます。","らいねんど の ほしゅ けいやく です が、りょうきん を いちわり ほど あげさせて いただきたく ぞんじます。","Untuk kontrak pemeliharaan tahun depan, kami bermaksud menaikkan tarifnya sekitar sepuluh persen."],["u","ご事情はお察ししますが、一割というのは弊社としては厳しい数字でございます。","ごじじょう は おさっし します が、いちわり と いう の は へいしゃ と して は きびしい すうじ で ございます。","Kami memahami keadaan Bapak, tapi sepuluh persen adalah angka yang berat bagi kami.",[["ご事情はお察ししますので、二割上げていただいても構いません。","Kami memahami keadaan Bapak, jadi dinaikkan dua puluh persen pun tidak masalah."],["一割ですか。御社の陰謀ですね。","Sepuluh persen? Ini konspirasi perusahaan Bapak, ya."]]],["p","人件費の高騰もありまして……。","じんけんひ の こうとう も ありまして……。","Biaya tenaga kerja juga melonjak..."],["u","とはいえ、昨年度は障害対応の遅れも何度かございましたので。","とは いえ、さくねんど は しょうがい たいおう の おくれ も なんど か ございました ので。","Meski begitu, tahun lalu beberapa kali penanganan gangguan juga terlambat.",[["とはいえ、昨年度は障害対応が非常に迅速でしたので。","Meski begitu, tahun lalu penanganan gangguan sangat cepat."],["それでは、人件費は弊社がすべて負担いたします。","Kalau begitu, biaya tenaga kerja kami tanggung semuanya."]]],["p","その点は申し訳ございませんでした。では、どのような条件でしたらご検討いただけますか。","その てん は もうしわけ ございません でした。では、どの よう な じょうけん でしたら ごけんとう いただけます か。","Soal itu kami mohon maaf. Lalu, dengan syarat seperti apa Bapak bersedia mempertimbangkannya?"],["u","値上げを五パーセントに抑え、対応時間を契約書に明記していただけるのであれば、前向きに検討いたします。","ねあげ を ごぱーせんと に おさえ、たいおう じかん を けいやくしょ に めいき して いただける の で あれば、まえむき に けんとう いたします。","Jika kenaikannya ditekan jadi lima persen dan waktu respons dicantumkan jelas di kontrak, kami akan mempertimbangkannya secara positif.",[["値上げを五十パーセントにしていただけるのであれば、前向きに検討いたします。","Jika kenaikannya dibuat lima puluh persen, kami akan mempertimbangkannya secara positif."],["条件は特にございませんが、契約は打ち切らせていただきます。","Tidak ada syarat khusus, tapi kontraknya kami putus."]]],["p","社に持ち帰って検討させていただけますか。","しゃ に もちかえって けんとう させて いただけます か。","Bolehkah kami bawa dulu ke kantor untuk dibahas?"],["u","もちろんです。長年のお付き合いですので、相互にとって良い形を模索できればと存じます。","もちろん です。ながねん の おつきあい です ので、そうご に とって よい かたち を もさく できれば と ぞんじます。","Tentu saja. Kita sudah lama bekerja sama, jadi saya harap kita bisa mencari bentuk yang baik bagi kedua pihak.",[["もちろんです。弊社だけが得をする形を模索できればと存じます。","Tentu. Saya harap kita bisa mencari bentuk yang hanya menguntungkan kami."],["いいえ、持ち帰りは困ります。今すぐ社長に電話してください。","Tidak, jangan dibawa pulang. Telepon direktur Bapak sekarang juga."]]],["p","ありがとうございます。来週中には改めてご連絡いたします。","ありがとう ございます。らいしゅう ちゅう に は あらためて ごれんらく いたします。","Terima kasih. Kami akan menghubungi lagi paling lambat minggu depan."],["u","承知いたしました。お返事をお待ちしております。","しょうち
