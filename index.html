<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0"><title>Hafalan Nihongo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: satu kolom seperti aplikasi HP; navbar tetap di bawah, layar soal memakai bilah jawaban di bawah */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --ink:#1B2440; --muted:#5F6782; --line:#D5DAE6;
  --accent:#D9452B; --accent-ink:#FFFFFF; --good:#23895A; --good-bg:#DDF2E7; --bad:#C43A2A; --bad-bg:#FBE3DF;
  --chip:#E3E7F0;
  --n5:#2F9E62; --n4:#1E88B8; --n3:#7356C9; --n2:#C98A12; --n1:#C2364F;
  --f-ui:"M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
  --f-jp:"Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1320; --surface:#191F31; --ink:#E8EBF4; --muted:#9AA2BC; --line:#2B3350;
  --accent:#F0644A; --accent-ink:#1A0E0B; --good:#4CC48A; --good-bg:#14301F; --bad:#F07562; --bad-bg:#3A1A16; --chip:#242B42;
  --n5:#4CC48A; --n4:#4FB3E3; --n3:#A08BF0; --n2:#F0B43C; --n1:#F06A82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1320; --surface:#191F31; --ink:#E8EBF4; --muted:#9AA2BC; --line:#2B3350;
  --accent:#F0644A; --accent-ink:#1A0E0B; --good:#4CC48A; --good-bg:#14301F; --bad:#F07562; --bad-bg:#3A1A16; --chip:#242B42;
  --n5:#4CC48A; --n4:#4FB3E3; --n3:#A08BF0; --n2:#F0B43C; --n1:#F06A82; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 140px;display:flex;flex-direction:column;gap:16px;min-height:100%}
h1{font-size:1.6rem;margin:0;font-weight:800;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:.8rem;margin:6px 0 0;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.sub{color:var(--muted);margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
label.lbl{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.04em}
select{width:100%;font:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{font:inherit;font-size:.9rem;padding:12px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;text-align:left;line-height:1.3}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--surface);box-shadow:inset 0 0 0 1px var(--accent)}
.seg button small{display:block;color:var(--muted);font-size:.75rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toggle{display:flex;align-items:center;gap:8px;font-size:.9rem;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.btn{font:inherit;font-weight:800;font-size:1rem;letter-spacing:.04em;border:0;border-radius:14px;padding:15px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 65%,#000);width:100%;text-transform:uppercase}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 65%,#000)}
.btn.ghost{background:var(--chip);color:var(--ink);box-shadow:0 4px 0 var(--line)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{height:10px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .4s}
.num{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted)}
.back{font:inherit;font-weight:700;background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 0;align-self:flex-start}

/* beranda */
.hero{display:flex;flex-direction:column;gap:4px}
.decks{display:flex;flex-direction:column;gap:10px}
.deck{font:inherit;color:var(--ink);text-align:left;background:var(--surface);border:1.5px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:14px;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;cursor:pointer}
.deck:active{transform:translateY(2px);border-bottom-width:2px}
.badge{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:1.15rem;color:var(--surface);background:var(--c);box-shadow:0 3px 0 color-mix(in srgb,var(--c) 60%,#000)}
.badge.jp{font-family:var(--f-jp);font-size:1.6rem}
.deck b{display:block;font-size:1.02rem;line-height:1.25}
.deck .meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.deck .bar{height:8px}
.deck .bar>i{background:var(--c)}
.chev{color:var(--muted);font-size:1.3rem}

/* huruf */
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--line)}
.tabs button{font:inherit;font-weight:800;letter-spacing:.08em;background:none;border:0;color:var(--muted);padding:12px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--n4);border-color:var(--n4)}
.kgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.kgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kcell{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:0}
.kcell .k{font-family:var(--f-jp);font-size:1.5rem;font-weight:700;line-height:1.2}
.kcell .r{font-size:.75rem;color:var(--muted)}
.kcell .bar{height:6px;width:80%;margin-top:4px}
.kcell .bar>i{background:var(--n2)}
.kcell.empty{visibility:hidden}
.kcell.say{border-color:var(--n4)}

/* navbar */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1.5px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom, 0px));z-index:5}
.nav .in{max-width:528px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.nav button{font:inherit;background:none;border:2px solid transparent;border-radius:14px;padding:6px 4px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:700}
.nav button .ic{width:28px;height:28px;display:grid;place-items:center;font-family:var(--f-jp);font-size:1.35rem;font-weight:700;line-height:1}
.nav button svg{width:26px;height:26px}
.nav button[aria-current="page"]{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 8%,transparent)}

/* game */
.top{display:flex;align-items:center;gap:12px}
.x{font:inherit;font-size:1.4rem;line-height:1;background:none;border:0;color:var(--muted);cursor:pointer;padding:6px}
.top .bar{flex:1;height:16px}
.top .bar>i{background:var(--accent)}
.streak{font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent);min-width:3ch;text-align:right}
.prompt{font-size:1.15rem;font-weight:800;margin:0}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative;min-height:170px;justify-content:center}
.card .big{font-family:var(--f-jp);font-size:2.6rem;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.card .big.kana{font-size:4.2rem}
.card .big.id{font-family:var(--f-ui);font-size:1.9rem}
.card .big.sit{font-family:var(--f-ui);font-size:1.3rem;line-height:1.45}
.card .reading{font-family:var(--f-jp);font-size:1.15rem;color:var(--muted)}
.card .rom{font-size:.9rem;color:var(--muted);font-style:italic}
.speak{position:absolute;top:10px;right:10px;font:inherit;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:6px 10px;cursor:pointer;font-size:.8rem;font-weight:700}
.bigplay{font:inherit;font-weight:800;border:0;border-radius:50%;width:96px;height:96px;background:var(--n4);color:var(--surface);font-size:2rem;cursor:pointer;box-shadow:0 5px 0 color-mix(in srgb,var(--n4) 60%,#000)}
.tag{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{font:inherit;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:14px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:84px;justify-content:center;text-align:center;min-width:0}
.opt .j{font-family:var(--f-jp);font-size:1.35rem;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.opt .j.kana{font-size:2rem}
.opt .k{font-family:var(--f-jp);font-size:.85rem;color:var(--muted)}
.opt .r{font-size:.75rem;color:var(--muted);font-style:italic}
.opt .t{font-size:1rem;font-weight:500;overflow-wrap:anywhere}
.opt .t.rom{font-size:1.4rem;font-weight:700}
.opt.sel{border-color:var(--accent)}
.opt.good{border-color:var(--good);background:var(--good-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.typebox input{width:100%;font:inherit;font-size:1.2rem;padding:16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.typebox p{margin:6px 0 0;color:var(--muted);font-size:.8rem}
.mic{font:inherit;font-weight:800;font-size:1.05rem;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:22px;border-radius:20px;border:2px dashed var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface));color:var(--ink);cursor:pointer}
.mic .dot{width:22px;height:22px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 25%,transparent)}
.mic.on{border-style:solid}
.mic.on .dot{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--accent) 10%,transparent)}}
.heard{margin:0;font-family:var(--f-jp);color:var(--muted);text-align:center}

.foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1.5px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom, 0px));z-index:6}
.foot .in{max-width:528px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.foot.good{background:var(--good-bg);border-color:var(--good)}
.foot.bad{background:var(--bad-bg);border-color:var(--bad)}
.verdict{display:flex;gap:12px;align-items:center}
.stamp{flex:none;width:52px;height:52px;border-radius:50%;border:3px solid currentColor;display:grid;place-items:center;font-family:var(--f-jp);font-weight:700;font-size:1rem;transform:rotate(-12deg);animation:pop .35s ease-out}
.foot.good .verdict{color:var(--good)}
.foot.bad .verdict{color:var(--bad)}
.verdict b{display:block;font-size:1.1rem}
.verdict span{color:var(--ink);font-size:.95rem}
.verdict .jp{font-family:var(--f-jp);font-weight:700}
.foot.good .btn{background:var(--good);box-shadow:0 4px 0 color-mix(in srgb,var(--good) 60%,#000);color:var(--surface)}
.foot.bad .btn{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,#000);color:var(--surface)}
@keyframes pop{0%{transform:scale(.4) rotate(-30deg);opacity:0}70%{transform:scale(1.15) rotate(-8deg)}100%{transform:scale(1) rotate(-12deg)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s 2}

/* hasil & progres */
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.score div{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.score b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.score span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.review li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.review li:last-child{border-bottom:0}
.review .jp{font-family:var(--f-jp);font-weight:700}
.review .meta{color:var(--muted);font-size:.8rem}
.empty{color:var(--muted);margin:0}
.statrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.statrow .bar{grid-column:1/-1}
.statrow .bar>i{background:var(--c)}
.revcard{background:var(--surface);border:1.5px solid var(--accent);border-bottom-width:4px;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.revcard.done{border-color:var(--good)}
.revcard b{display:block;font-size:1.1rem}
.revcard span{color:var(--muted);font-size:.9rem}
.revcard .big{font-size:1.6rem;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.due{color:var(--accent);font-weight:800}
.revtag{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);padding:3px 8px;border-radius:99px}
.statrow .lv{grid-column:1/-1;font-size:.75rem}
.btn.sm{font-size:.8rem;padding:10px 12px;width:auto}
.btn:disabled{opacity:.45;cursor:default}
.exrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.exrow>div{display:flex;flex-direction:column;min-width:0}
.exhead{display:flex;flex-direction:column;gap:2px}
.exinstr{font-family:var(--f-jp);font-weight:700}
.exq{align-items:stretch;text-align:left;min-height:0;padding:20px 18px}
.exq .exn{align-self:flex-end}
.exq .bigplay{align-self:center}
.exs{font-family:var(--f-jp);font-size:1.25rem;line-height:1.9;margin:0}
.exs u{text-underline-offset:5px;text-decoration-thickness:2px}
.expass{font-family:var(--f-jp);font-size:1.05rem;line-height:1.9;background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:6px}
.bl{display:inline-block;width:3.2em;border-bottom:2px solid var(--ink);margin:0 4px;text-align:center;vertical-align:baseline}
.bl.st{color:var(--accent);font-weight:800;border-color:var(--accent)}
.exopts{display:flex;flex-direction:column;gap:10px}
.exopt{font:inherit;font-family:var(--f-jp);font-size:1.1rem;text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer}
.exopt.sel{border-color:var(--n4);background:color-mix(in srgb,var(--n4) 10%,var(--surface))}
.exnum{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-ui);font-weight:800;font-size:.85rem}
.exopt.sel .exnum{background:var(--n4);border-color:var(--n4);color:var(--surface)}
.exnav{flex-direction:row!important}
.exnav .btn{flex:1}
.exconfirm{background:var(--surface);border:1.5px solid var(--accent);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.exgrid button{font:inherit;font-weight:700;padding:8px 0;border-radius:10px;border:1.5px solid var(--bad);background:var(--bad-bg);color:var(--ink);cursor:pointer}
.exgrid button.ok{border-color:var(--line);background:var(--chip)}
.exrv.good{border-color:var(--good)}
.exrv.bad{border-color:var(--bad)}
.exans{margin:0;padding-left:1.4em;font-family:var(--f-jp);display:flex;flex-direction:column;gap:4px}
.exans li.c{color:var(--good);font-weight:700}
.exans li.w{color:var(--bad);text-decoration:line-through}
[data-f][aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.lvseg{grid-template-columns:repeat(5,1fr)}
.lvseg button{text-align:center;font-weight:800}
.exsec{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.exparts{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:.82rem;color:var(--muted)}
.exparts span{font-family:var(--f-jp);font-weight:700;color:var(--ink);display:inline-block;min-width:4.5em}
.exopt.long{font-size:1rem;line-height:1.6}
.exword{font-size:1.6rem;font-weight:700}
.expic{background:var(--bg);border:1.5px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:.95rem}
.qhid{display:none}
.exq.help .qhid{display:inline}
.qshow{font-size:1.05rem;color:var(--muted)}
.expass mark{background:color-mix(in srgb,var(--n2) 35%,transparent);color:inherit;padding:0 2px;border-radius:4px}
.score b.lo{color:var(--bad)}
details summary{cursor:pointer;color:var(--muted);font-size:.85rem}
.exopt.good{border-color:var(--good);background:var(--good-bg)}
.exopt.bad{border-color:var(--bad);background:var(--bad-bg)}
.exopt:disabled{cursor:default;color:var(--ink)}
.exfeed{border:1.5px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.exfeed.good{border-color:var(--good);background:var(--good-bg)}
.exfeed.bad{border-color:var(--bad);background:var(--bad-bg)}
.exfeed.good .verdict{color:var(--good)}
.exfeed.bad .verdict{color:var(--bad)}
.glist{display:flex;flex-direction:column;gap:8px}
.grow{font:inherit;color:var(--ink);text-align:left;background:var(--surface);border:1.5px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;cursor:pointer}
.grow .gp{font-family:var(--f-jp);font-weight:700;font-size:1.1rem;overflow-wrap:anywhere}
.grow .gmn{grid-column:1;color:var(--muted);font-size:.85rem}
.grow .gst{grid-column:2;grid-row:1/3;font-size:.75rem;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--chip);color:var(--muted)}
.grow .gst.ok{background:var(--good-bg);color:var(--good)}
.grow .gst.mid{background:color-mix(in srgb,var(--n2) 20%,transparent);color:var(--ink)}
.gtitle{font-family:var(--f-jp);font-size:2rem}
.gmean{font-size:1.15rem;font-weight:700;margin:4px 0 0;color:var(--accent)}
.gform{font-family:var(--f-jp);font-size:1.05rem;margin:0;background:var(--bg);border-radius:10px;padding:10px 12px;line-height:1.7}
.gx{margin:0;line-height:1.7}
.gnote{background:color-mix(in srgb,var(--n2) 10%,var(--surface))}
.gex{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.gex:last-child{border-bottom:0}
.gex>div{min-width:0}
.gplay{flex:none;font:inherit;width:36px;height:36px;border-radius:50%;border:0;background:var(--n4);color:var(--surface);cursor:pointer;font-size:.9rem}
.gplay.sm{width:28px;height:28px;font-size:.75rem}
.gjp{font-family:var(--f-jp);font-size:1.15rem;margin:0;line-height:1.7;overflow-wrap:anywhere}
.grd{font-family:var(--f-jp);font-size:.85rem;color:var(--muted);margin:2px 0 0}
.gid{margin:4px 0 0;color:var(--muted)}
em.gm{font-style:normal;color:var(--accent);font-weight:700;border-bottom:2px solid currentColor}
.gblank{color:var(--accent);font-weight:800}
.gline{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0}

const RAW = [{"id":"salam","title":"Kosakata Custom","short":"★","color":"accent","secs":["Salam & Ungkapan"],"words":[["","おはようございます","ohayou gozaimasu","selamat pagi",0,["Pagi hari, kamu bertemu atasan di kantor.","Jam 7 pagi kamu bertemu tetangga yang sedang menyiram tanaman.","Kamu masuk kelas pagi dan menyapa guru.","Pagi hari kamu berpapasan dengan satpam di lobi kantor."]],["","こんにちは","konnichiwa","selamat siang / halo",0,["Siang hari, kamu menyapa orang yang kamu temui.","Jam 2 siang kamu bertemu kenalan di supermarket.","Kamu menyapa kurir yang mengantar paket siang hari.","Kamu membuka siaran video siang hari dan menyapa penonton."]],["","こんばんは","konbanwa","selamat malam (sapaan)",0,["Malam hari, kamu bertemu tetangga di jalan.","Jam 8 malam kamu bertemu teman di depan minimarket.","Kamu datang ke rumah teman untuk makan malam dan menyapanya di pintu.","Malam hari kamu menyapa pemilik kos yang baru pulang."]],["","さようなら","sayounara","selamat tinggal",0,["Kamu berpisah dengan teman yang lama tidak akan kamu temui lagi.","Hari terakhir di Jepang, kamu berpamitan dengan keluarga angkat.","Teman sekelas pindah ke kota lain dan kalian berpisah.","Upacara kelulusan selesai dan kamu berpamitan dengan guru."]],["","おやすみなさい","oyasuminasai","selamat tidur",0,["Kamu mau tidur dan pamit ke keluarga.","Kamu menutup telepon dengan pacar sebelum tidur.","Adikmu masuk kamar untuk tidur, kamu berpamitan.","Jam 11 malam kamu bilang ke teman sekamar bahwa kamu mau tidur."]],["","ありがとうございます","arigatou gozaimasu","terima kasih",0,["Rekan kerja membantumu membawa barang.","Petugas stasiun menunjukkan jalan, kamu berterima kasih dengan sopan.","Atasan memberimu oleh-oleh dari perjalanan dinas.","Orang asing memungut dompetmu yang jatuh dan mengembalikannya."]],["","どういたしまして","dou itashimashite","sama-sama",0,["Seseorang berterima kasih karena kamu menolongnya.","Kamu membantu nenek menyeberang dan beliau berterima kasih.","Temanmu bilang terima kasih karena kamu meminjamkan payung.","Rekan kerja berterima kasih karena kamu membantu fotokopi."]],["","すみません","sumimasen","permisi / maaf",0,["Kamu mau memanggil pelayan di restoran.","Kamu ingin lewat di kereta yang penuh orang.","Kamu menyapa pegawai toko untuk bertanya harga.","Kamu tidak sengaja menyenggol orang di eskalator."]],["","ごめんなさい","gomennasai","maaf",0,["Kamu tidak sengaja menumpahkan minuman temanmu.","Kamu terlambat datang ke janji dengan teman.","Kamu lupa membalas pesan sahabatmu seharian.","Kamu memecahkan gelas di rumah teman."]],["","はじめまして","hajimemashite","salam kenal",0,["Kamu bertemu seseorang untuk pertama kalinya.","Di wawancara kerja, kamu memulai perkenalan diri.","Kamu bertemu orang tua teman untuk pertama kali.","Hari pertama di kelas bahasa, kamu memperkenalkan diri ke teman baru."]],["","よろしくおねがいします","yoroshiku onegai shimasu","mohon bantuannya / senang berkenalan",0,["Kamu baru selesai memperkenalkan diri di kantor baru.","Kamu bergabung dengan tim proyek baru dan memperkenalkan diri.","Kamu meminta guru les membantumu selama setahun ke depan.","Selesai mengirim email permintaan, kamu menutupnya dengan sopan."]],["","いただきます","itadakimasu","selamat makan (sebelum makan)",0,["Makanan sudah di meja dan kamu akan mulai makan.","Ibu menyajikan nasi kari di meja, kamu siap menyantap.","Kamu membuka bekal di kantor dan bersiap makan.","Teman membelikan ramen, kamu mengambil sumpit untuk mulai makan."]],["","ごちそうさまでした","gochisousama deshita","terima kasih atas makanannya",0,["Kamu baru selesai makan.","Kamu selesai makan malam di rumah keluarga angkat.","Setelah ditraktir atasan, kamu berterima kasih atas makanannya.","Kamu meletakkan sumpit setelah menghabiskan sushi."]],["","いってきます","ittekimasu","saya berangkat",0,["Kamu keluar rumah untuk berangkat kerja.","Kamu keluar rumah untuk berangkat sekolah dan pamit ke ibu.","Kamu pamit ke teman sekamar sebelum pergi belanja.","Kamu keluar kantor untuk rapat di luar dan pamit ke rekan."]],["","いってらっしゃい","itterasshai","hati-hati di jalan",0,["Keluargamu pamit berangkat kerja, kamu menjawab.","Ayahmu pamit berangkat kerja.","Teman sekamar pamit pergi ke kampus.","Rekan kerja pamit keluar kantor untuk menemui klien."]],["","ただいま","tadaima","saya pulang",0,["Kamu baru sampai di rumah sepulang kerja.","Kamu pulang dari sekolah dan membuka pintu rumah.","Kamu kembali ke kos setelah belanja.","Kamu kembali ke kantor setelah bertemu klien."]],["","おかえりなさい","okaerinasai","selamat datang kembali",0,["Keluargamu baru pulang ke rumah, kamu menyambutnya.","Adikmu baru pulang sekolah.","Teman sekamar baru pulang kerja.","Rekan kerja kembali ke kantor setelah rapat di luar."]],["","おねがいします","onegai shimasu","tolong / mohon",0,["Di restoran, kamu menunjuk menu dan memesan: \"Ini, ...\"","Kamu menyerahkan tiket ke petugas sambil meminta tolong.","Di kasir, kamu meminta kantong plastik.","Kamu minta tolong rekan mengecek dokumenmu."]],["","どうぞ","douzo","silakan",0,["Kamu mempersilakan tamu masuk dan duduk.","Kamu menyerahkan brosur kepada tamu.","Di kereta kamu memberikan kursimu kepada nenek.","Tamu bertanya boleh masuk, kamu mempersilakan."]],["","どうも","doumo","terima kasih (singkat)",0,["Kasir memberikan kembalian, kamu berterima kasih singkat.","Seseorang menahan pintu untukmu, kamu berterima kasih singkat.","Pelayan menaruh air di mejamu, kamu berterima kasih singkat.","Teman memberimu permen, kamu menjawab singkat."]],["","はい","hai","ya",0,["Gurumu memanggil namamu saat absen.","Atasan bertanya apakah kamu sudah membaca email, jawabannya ya.","Pelayan bertanya apakah pesananmu satu porsi, jawabannya ya.","Temanmu bertanya \"Kamu mau ikut?\", jawabannya ya (sopan)."]],["","いいえ","iie","tidak / bukan",0,["Temanmu bertanya \"Kamu orang Jepang?\" dan jawabannya tidak.","Ditanya \"Ini punyamu?\" padahal bukan.","Ditanya \"Sudah makan?\" padahal belum.","Ditawari tambahan nasi, kamu menolak dengan sopan."]],["","ええ","ee","ya (santai)",0,["Teman akrab bertanya sesuatu, kamu mengiyakan dengan santai.","Te ","shitsurei shimasu","permisi (masuk/pamit)",0,["Kamu mengetuk pintu ruangan atasan sebelum masuk.","Rapat selesai dan kamu pamit keluar ruangan dengan sopan.","Kamu mengetuk pintu ruang wawancara kerja sebelum masuk."]],["","もしもし","moshimoshi","halo (di telepon)",0,["Kamu mengangkat telepon dan menyapa penelepon.","Telepon rumah berdering, kamu mengangkatnya dan menyapa.","Suara di telepon putus-putus, kamu memastikan lawan bicara masih ada."]],["","では","dewa","baiklah / kalau begitu",0,["Rapat selesai dan kamu mau menutup pembicaraan dengan sopan.","Guru selesai menjelaskan dan berkata \"Baiklah, kita mulai latihan.\"","Kamu menutup obrolan dengan sopan: \"Kalau begitu, saya permisi.\""]],["","じゃあ","jaa","ya sudah / kalau begitu",0,["Ngobrol santai dengan teman lalu bilang \"Ya sudah, sampai nanti\".","Teman bilang tidak bisa datang, kamu menjawab santai \"Ya sudah, lain kali.\"","Selesai ngobrol di telepon, kamu bilang santai \"Ya sudah, sampai nanti.\""]],["","いらっしゃいませ","irasshaimase","selamat datang (di toko)",0,["Pegawai toko menyapa pelanggan yang baru masuk.","Pelayan restoran menyambut tamu yang baru masuk pintu.","Kasir minimarket berseru menyambut saat pintu otomatis terbuka."]],["","おめでとうございます","omedetou gozaimasu","selamat (ucapan)",0,["Temanmu lulus ujian, kamu memberi ucapan selamat.","Temanmu berulang tahun, kamu mengucapkan selamat dengan sopan.","Kakakmu baru menikah, kamu memberi ucapan selamat."]],["","どうもありがとう","doumo arigatou","terima kasih banyak",0,["Teman menolongmu cukup banyak, kamu berterima kasih agak santai.","Teman membantumu pindahan seharian, kamu berterima kasih banyak (santai).","Teman memberimu hadiah ulang tahun, kamu sangat berterima kasih."]],["","これ","kore","ini (benda)",1,["Kamu menunjuk benda di tanganmu sendiri.","Kamu memegang HP baru dan bertanya ke pegawai, \"___ berapa harganya?\"","Di toko kamu mengangkat barang di tanganmu: \"Saya mau yang ___.\""]],["","それ","sore","itu (dekat lawan bicara)",1,["Kamu menunjuk benda y dari beberapa bus.","\"Kamu suka warna ___?\" sambil menunjuk beberapa pilihan."]],["","どう","dou","bagaimana",2,["Kamu menanyakan pendapat teman soal makanan tadi.","Kamu bertanya kesan teman tentang tinggal di Jepang.","Kamu menawarkan, \"Kopi, ___?\" (bagaimana kalau kopi?)"]],["","どうして","doushite","kenapa",2,["Temanmu terlambat, kamu menanyakan alasannya.","Kamu bertanya alasan teman tidak datang ke pesta.","Anak kecil bertanya alasan langit berwarna biru."]],["","なぜ","naze","mengapa",2,["Kamu menanyakan alasan sesuatu dengan nada formal.","Wartawan bertanya alasan kebijakan itu dengan nada formal.","Guru bertanya alasan kamu memilih jawaban itu."]],["","いくら","ikura","berapa (harga)",2,["Di toko kamu menanyakan harga sebuah barang.","Di pasar kamu bertanya harga satu kilo jeruk.","Kamu bertanya ongkos taksi sampai bandara."]],["","いくつ","ikutsu","berapa buah / umur berapa",2,["Kamu menanyakan umur anak kecil.","Penjual bertanya kamu mau membeli apel berapa buah.","Kamu bertanya umur adik temanmu yang masih kecil."]],["","どのくらい","donokurai","berapa lama / banyak",2,["Kamu menanyakan lama perjalanan ke Tokyo.","Kamu bertanya berapa lama perjalanan dari rumah ke kantor.","Kamu bertanya kira-kira berapa banyak tamu yang datang."]],["","どんな","donna","seperti apa",2,["Kamu bertanya film itu ceritanya bagaimana.","Kamu bertanya pacar temanmu orangnya seperti apa.","Kamu bertanya Kyoto itu kota yang seperti apa."]],["何時","なんじ","nanji","jam berapa",2,["Kamu ingin tahu sekarang pukul berapa.","HP mati, kamu bertanya sekarang pukul berapa.","Kamu bertanya rapat dimulai pukul berapa."]],["何曜日","なんようび","nan'youbi","hari apa",2,["Kamu lupa hari ini Senin atau Selasa.","Kamu lupa tanggal 10 jatuh di hari apa.","Kamu bertanya les bahasa Jepang diadakan hari apa."]],["私","わたし","watashi","saya",3,["Kamu memperkenalkan diri dan menyebut dirimu.","Kamu memperkenalkan diri: \"___ wa Aji desu.\"","Kamu menunjuk diri sendiri saat ditanya siapa pemilik tas."]],["私たち","わたしたち","watashitach const H_BASIC = 'あa いi うu えe おo かka きki くku けke こko さsa しshi すsu せse そso たta ちchi つtsu てte とto なna にni ぬnu ねne のno はha ひhi ふfu へhe ほho まma みmi むmu めme もmo やya ゆyu よyo らra りri るru れre ろro わwa をwo んn';
const H_DAKU = 'がga ぎgi ぐgu げge ごgo ざza じji ずzu ぜze ぞzo だda ぢji づzu でde どdo ばba びbi ぶbu べbe ぼbo ぱpa ぴpi ぷpu ぺpe ぽpo';
const H_YOON = 'きゃkya きゅkyu きょkyo しゃsha しゅshu しょsho ちゃcha ちゅchu ちょcho にゃnya にゅnyu にょnyo ひゃhya ひゅhyu ひょhyo みゃmya みゅmyu みょmyo りゃrya りゅryu りょryo ぎゃgya ぎゅgyu ぎょgyo じゃja じゅju じょjo びゃbya びゅbyu びょbyo ぴゃpya ぴゅpyu ぴょpyo';
const toKata = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0)+0x60));
const KGROUPS = ['Dasar','Dakuten & Handakuten','Kombinasi (Yōon)'];
function kanaWords(kata){
  const out=[];
  [H_BASIC,H_DAKU,H_YOON].forEach((src,g)=>src.split(' ').forEach(t=>{
    const m=t.match(/^([^a-z]+)([a-z]+)$/); const k=kata?toKata(m[1]):m[1];
    out.push(['',k,m[2],m[2],g]);
  }));
  return out;
}
RAW.push({id:'hira',title:'Tebak Hiragana',short:'あ',color:'n4',kind:'kana',secs:KGROUPS,words:kanaWords(false)});
RAW.push({id:'kata',title:'Tebak Katakana',short:'ア',color:'n3',kind:'kana',secs:KGROUPS,words:kanaWords(true)});

const DECKS = RAW.map(d=>({...d, kind:d.kind||'vocab',
  items:d.words.map((w,i)=>({id:i,kanji:w[0],kana:w[1],rom:w[2],arti:w[3],sec:w[4]||0,sits:Array.isArray(w[5])?w[5]:(w[5]?[w[5]]:[]),get sit(){return this.sits[0]||''}}))}));
const DECK = Object.fromEntries(DECKS.map(d=>[d.id,d]));

const store = {
  get(k,d){try{const v=localStorage.getItem('aisatsu:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('aisatsu:'+k,JSON.stringify(v))}catch(e){}}
};
(function migrate(){ const old=store.get('mastery',null); if(old && !store.get('m:salam',null)) store.set('m:salam',old); })();
/* SRS: tiap kata punya level 0–8; level naik saat dijawab benar ketika jatuh tempo, jarak ulasan makin panjang */
const INT=[0,1,3,7,14,30,60,120,240];
const today=()=>{const n=new Date();return Math.floor((n.getTime()-n.getTimezoneOffset()*60000)/86400000)};
const SCACHE={};
function migrateSRS(id){ const old=store.get('m:'+id,{}), t=today(), s={}; for(const k in old){ if(old[k]>=1) s[k]={lv:old[k]>=2?2:1,due:t}; } store.set('s:'+id,s); return s; }
const SRS = id => SCACHE[id] || (SCACHE[id]=store.get('s:'+id,null)||migrateSRS(id));
const saveS = id => store.set('s:'+id, SRS(id));
const lvOf = (d,w) => (SRS(d.id)[w.id]||{lv:0}).lv;
const isDue = (d,w,t=today()) => { const r=SRS(d.id)[w.id]; return !!r && r.due<=t; };
const dueItems = (d,t=today()) => d.items.filter(w=>isDue(d,w,t));
const dueAll = (t=today()) => DECKS.reduce((a,d)=>a+dueItems(d,t).length,0);
const mastered = d => d.items.filter(w=>lvOf(d,w)>=3).length;
function grade(d,w,ok){
  const s=SRS(d.id), t=today(), r=s[w.id];
  if(ok){
    if(!r) s[w.id]={lv:1,due:t+1};
    else if(r.due<=t){ r.lv=Math.min(r.lv+1,INT.length-1); r.due=t+INT[r.lv]; }
  } else s[w.id]={lv:r?Math.max(1,r.lv-2):1, due:t+1};
  saveS(d.id);
}
const intText = lv => { const n=INT[Math.min(lv,INT.length-1)]; return n>=30? Math.round(n/30)+' bulan' : n+' hari'; };

const modesFor = d => d.kind==='kana' ? KANA_MODES : VOCAB_MODES.filter(m=>m[0]!=='sit' || d.items.some(w=>w.sit)).map(m=>m[0]==='sit'&&d.id!=='salam'?['sit','Situasi','pilih kata dari petunjuk']:m);
function settingsFor(d){
  const s = Object.assign({sec:'all', mode:modesFor(d)[0][0], len:20, romaji:true, voice:true}, store.get('set:'+d.id, d.id==='salam'?store.get('settings',{}):{}));
  if(![20,35,50].includes(s.len)) s.len=20;
  if(!modesFor(d).some(m=>m[0]===s.mode)) s.mode=modesFor(d)[0][0];
  return s;
}

ormulir ini."],["u","すみません、名前は ローマ字で 書いても いいですか。","すみません、なまえ は ローマじ で かいて も いい です か。","Maaf, bolehkah nama saya ditulis dengan huruf latin?",[["すみません、名前を 忘れても いいですか。","Maaf, bolehkah saya lupa nama saya?"],["すみません、ローマ字は 書いた ことが ありません。","Maaf, saya belum pernah menulis huruf latin."]]],["p","はい、大丈夫ですよ。書き終わったら、あちらの 受付に 出して ください。","はい、だいじょうぶ です よ。かきおわったら、あちら の うけつけ に だして ください。","Ya, tidak apa-apa. Setelah selesai, serahkan ke loket di sebelah sana."],["n","Kamu selesai mengisi formulir dan membawanya ke loket."],["u","書きました。これで いいですか。","かきました。これ で いい です か。","Sudah saya isi. Begini sudah benar?",[["書きませんでした。これで 結構です。","Saya tidak menulis apa-apa. Ini sudah cukup."],["書いて います。これは いくらですか。","Sedang saya tulis. Ini harganya berapa?"]]],["p","はい、確認します。あ、ここに 電話番号も 書いて ください。","はい、かくにん します。あ、ここ に でんわばんごう も かいて ください。","Baik, saya periksa. Oh, tolong tulis juga nomor telepon di sini."],["u","すみません、まだ 携帯を 持って いないんです。来週 契約する 予定です。","すみません、まだ けいたい を もって いない ん です。らいしゅう けいやく する よてい です。","Maaf, saya belum punya HP. Rencananya minggu depan saya buat kontrak.",[["すみません、携帯を なくしたので、電話して ください。","Maaf, HP saya hilang, jadi tolong telepon saya."],["すみません、電話番号は 先週 書いた ことが あります。","Maaf, nomor telepon pernah saya tulis minggu lalu."]]],["p","そうですか。では、決まったら 連絡して ください。今日の 手続きは これで 終わりです。","そう です か。では、きまったら れんらく して ください。きょう の てつづき は これ で おわり です。","Begitu ya. Kalau sudah ada, tolong kabari kami. Prosedur hari ini sudah selesai."],["u","わかりました。ありがとうございました。","わかりました。ありがとう ございました。","Baik. Terima kasih banyak.",[["わかりました。いただきます。","Baik. Selamat makan."],["わかりません。おかえりなさい。","Saya tidak mengerti. Selamat datang kembali."]]]]},{"t":"Membuka rekening bank","s":"Kamu datang ke bank untuk membuka rekening agar bisa menerima gaji.","p":"銀行員","e":"👨‍💼","l":[["p","いらっしゃいませ。本日は どのような ご用件でしょうか。","いらっしゃいませ。ほんじつ は どの よう な ごようけん でしょう か。","Selamat datang. Ada keperluan apa hari ini?"],["u","口座を 開きたいんですが、外国人でも 作れますか。","こうざ を ひらきたい ん です が、がいこくじん でも つくれます か。","Saya ingin membuka rekening. Apakah orang asing juga bisa membuatnya?",[["銀行で 働きたいんですが、外国人でも いいですか。","Saya ingin bekerja di bank, apakah orang asing juga boleh?"],["口座を 閉めたので、お金を 貸して ください。","Rekening saya sudah ditutup, jadi tolong pinjamkan uang."]]],["p","はい、作れますよ。在留カードと 印鑑は お持ちですか。","はい、つくれます よ。ざいりゅう カード と いんかん は おもち です か。","Ya, bisa. Apakah Anda membawa kartu izin tinggal dan stempel?"],["u","在留カードは ありますが、印鑑は まだ 持って いません。","ざいりゅう カード は あります が、いんかん は まだ もって いません。","Kartu izin tinggal ada, tapi stempel saya belum punya.",[["在留カードは 国に 送らなければ なりません。","Kartu izin tinggal harus saya kirim ke negara asal."],["印鑑を 作った ことが あるので、カードは いりません。","Karena pernah membuat stempel, kartunya tidak perlu."]]],["p","サインでも 大丈夫ですよ。では、こちらの 用紙に ご記入ください。","サイン でも だいじょうぶ です よ。では、こちら の ようし に ごきにゅう ください。","Tanda tangan juga tidak apa-apa. Silakan isi formulir ini."],["u","すみません、この 漢字が 読めないんですが、何と 読みますか。","すみません、この かんじ が よめない ん です が、なん と よみます か。","Maaf, saya tidak bisa membaca kanji ini. Dibaca apa?",[["すみません、この 漢字は 簡単すぎて 読みたくないです。","Maaf, kanji ini terlalu mudah, saya tidak mau membacanya."],["すみません、この 漢字で 名前を 呼んで ください。","Maaf, tolong panggil nama saya dengan kanji ini."]]],["p","勤務先ですね。お勤めの 会社の 名前を 書いて ください。","きんむさき です ね。おつとめ の かいしゃ の なまえ を かいて ください。","Itu \"tempat kerja\". Tulis nama perusahaan tempat Anda bekerja."],["u","わかりました。キャッシュカードは いつ もらえますか。","わかりました。キャッシュカード は いつ もらえます か。","Baik. Kapan saya bisa menerima kartu ATM-nya?",[["わかりました。キャッシュカードを 拾った ことが あります。","Baik. Saya pernah memungut kartu ATM."],["わかりました。キャッシュカードで 払っても いいですか。","Baik. Bolehkah saya bayar pakai kartu ATM?"]]],["p","一週間ぐらいで ご自宅に 届きます。","いっしゅうかん ぐらい で ごじたく に とどきます。","Sekitar seminggu lagi akan sampai di rumah Anda."],["u","そうですか。それまで ATMは 使えないんですね。","そう です か。それ まで エーティーエム は つかえない ん です ね。","Begitu. Jadi sampai saat itu saya belum bisa pakai ATM, ya.",[["そうですか。それまで 寝坊しても いいですね。","Begitu. Jadi sampai saat itu saya boleh kesiangan, ya."],["そうですか。一週間前に 届きましたね。","Begitu. Sudah sampai seminggu yang lalu, ya."]]],["p","はい、申し訳ございませんが、それまでは 通帳で 窓口を ご利用ください。","はい、もうしわけ ございません が、それ まで は つうちょう で まどぐち を ごりよう ください。","Ya, mohon maaf, sampai saat itu silakan gunakan buku tabungan di loket."]]},{"t":"Kontrak HP baru","s":"Kamu pergi ke toko operator seluler untuk membuat kontrak smartphone.","p":"店員さん","e":"👩","l":[["p","いらっしゃいませ。スマホを お探しですか。","いらっしゃいませ。スマホ を おさがし です か。","Selamat datang. Sedang mencari smartphone?"],["u","はい、新しく 契約したいんですが、一番 安い プランは どれですか。","はい、あたらしく けいやく したい ん です が、いちばん やすい プラン は どれ です か。","Ya, saya ingin kontrak baru. Paket yang paling murah yang mana?",[["はい、スマホが 壊れたので、捨てて ください。","Ya, HP saya rusak, jadi tolong buang."],["いいえ、スマホを 売る 店員に なりたいです。","Tidak, saya ingin jadi pegawai penjual HP."]]],["p","こちらの プランが 月 二千円で、一番 お得です。","こちら の プラン が つき にせんえん で、いちばん おとく です。","Paket ini 2.000 yen per bulan, paling hemat."],["u","データは どのぐらい 使えますか。","データ は どの ぐらい つかえます か。","Datanya bisa dipakai berapa banyak?",[["データは どのぐらい 太りましたか。","Datanya sudah gemuk seberapa?"],["データを 使った ことが ありません。","Saya belum pernah memakai data."]]],["p","毎月 三ギガです。動画を よく 見るなら、こちらの 二十ギガが いいと 思います。","まいつき さん ギガ です。どうが を よく みる なら、こちら の にじゅう ギガ が いい と おもいます。","3 GB per bulan. Kalau sering menonton video, saya rasa yang 20 GB ini lebih baik."],["u","動画は あまり 見ないので、安い ほうで いいです。","どうが は あまり みない ので、やすい ほう で いい です。","Saya jarang menonton video, jadi yang murah saja.",[["動画を よく 見るので、データは 要りません。","Karena saya sering menonton video, datanya tidak perlu."],["動画を 作って いるので、安い ほうは 高いです。","Karena saya membuat video, yang murah itu mahal."]]],["p","かしこまりました。では、お支払いの 方法は どう なさいますか。","かしこまりました。では、おしはらい の ほうほう は どう なさいます か。","Baik. Lalu, metode pembayarannya bagaimana?"],["u","銀行口座から 払いたいんですが、できますか。","ぎんこう こうざ から はらいたい ん です が、できます か。","Saya ingin bayar dari rekening bank, bisa?",[["銀行口座を 盗まれたので、払いたいです。","Rekening bank saya dicuri, jadi saya ingin bayar."],["銀行で 両替して もらえますか。","Bisakah saya menukar uang di bank?"]]],["p","はい、できます。キャッシュカードを お預かりしても よろしいですか。","はい、できます。キャッシュカード を おあずかり して も よろしい です か。","Ya, bisa. Boleh saya pegang kartu ATM Anda sebentar?"],["u","はい、どうぞ。今日から すぐ 使えますか。","はい、どうぞ。きょう から すぐ つかえます か。","Ya, silakan. Apakah HP-nya bisa langsung dipakai hari ini?",[["はい、どうぞ。昨日から もう 使えませんでした。","Ya, silakan. Sejak kemarin sudah tidak bisa dipakai."],["いいえ、結構です。カードは 差し上げます。","Tidak usah. Kartunya saya berikan untuk Anda."]]],["p","はい。一時間ほどで 設定が 終わりますので、少々 お待ちください。","はい。いちじかん ほど で せってい が おわります ので、しょうしょう おまち ください。","Ya. Pengaturannya selesai sekitar satu jam, mohon tunggu sebentar."]]},{"t":"Servis laptop rusak","s":"Laptopmu tidak mau menyala. Kamu membawanya ke pusat servis.","p":"修理センターの人","e":"👨‍🔧","l":[["p","こんにちは。修理の ご依頼ですか。","こんにちは。しゅうり の ごいらい です か。","Selamat siang. Mau minta perbaikan?"],["u","はい、パソコンが 壊れて しまったんです。電源が 入らないんです。","はい、パソコン が こわれて しまった ん です。でんげん が はいらない ん です。","Ya, laptop saya rusak. Tidak mau menyala.",[["はい、パソコンを 買いたいので、壊して ください。","Ya, saya mau beli laptop, jadi tolong rusakkan."],["いいえ、パソコンは とても 元気です。","Tidak, laptopnya sehat-sehat saja."]]],["p","いつから ですか。何か 落としたり しましたか。","いつ から です か。なにか おとしたり しました か。","Sejak kapan? Apakah pernah terjatuh atau semacamnya?"],["u","きのうの 夜からです。落としては いませんが、コーヒーを こぼして しまいました。","きのう の よる から です。おとして は いません が、コーヒー を こぼして しまいました。","Sejak kemarin malam. Tidak jatuh, tapi saya menumpahkan kopi.",[["来週からです。コーヒーを 飲みに 行きましょう。","Mulai minggu depan. Ayo pergi minum kopi."],["きのうからです。パソコンが コーヒーを 飲みました。","Sejak kemarin. Laptopnya minum kopi."]]],["p","そうですか。中を 調べて みないと わかりませんね。修理に 一週間ぐらい かかります。","そう です か。なか を しらべて みない と わかりません ね。しゅうり に いっしゅうかん ぐらい かかります。","Begitu. Harus dicek dalamnya dulu baru tahu. Perbaikannya butuh sekitar seminggu."],["u","仕事で 使うので、もう 少し 早く 直して もらえませんか。","しごと で つかう ので、もう すこし はやく なおして もらえません か。","Saya memakainya untuk kerja, bisakah diperbaiki sedikit lebih cepat?",[["仕事で 使わないので、もっと 遅く 壊して ください。","Karena tidak dipakai kerja, tolong rusakkan lebih lambat."],["仕事が 早く 終わったので、一週間 休みます。","Pekerjaan selesai cepat, jadi saya libur seminggu."]]],["p","申し訳ありませんが、部品が 必要な 場合は もっと かかるかも しれません。","もうしわけ ありません が、ぶひん が ひつよう な ばあい は もっと かかる かも しれません。","Mohon maaf, kalau perlu suku cadang mungkin akan lebih lama."],["u","わかりました。データは 消えないでしょうか。とても 大事な ファイルが あるんです。","わかりました。データ は きえない でしょう か。とても だいじ な ファイル が ある ん です。","Baik. Apakah datanya tidak akan hilang? Ada file yang sangat penting.",[["わかりました。ファイルが 大事なので、パソコンを 捨てます。","Baik. Karena filenya penting, laptopnya saya buang."],["わかりません。データは 昨日 治りました。","Saya tidak mengerti. Datanya sudah sembuh kemarin."]]],["p","できるだけ 気を つけますが、データが 消える 場合も あります。","できる だけ き を つけます が、データ が きえる ばあい も あります。","Kami akan berusaha hati-hati, tapi ada kemungkinan datanya terhapus."],["u","そうですか。じゃ、修理が 終わったら 連絡して いただけますか。","そう です か。じゃ、しゅうり が おわったら れんらく して いただけます か。","Begitu ya. Kalau perbaikannya selesai, bisa tolong kabari saya?",[["そうですか。じゃ、修理が 始まる 前に 取りに 来ました。","Begitu ya. Saya sudah datang mengambilnya sebelum perbaikan dimulai."],["そうですか。じゃ、連絡しないで いただけますか。","Begitu ya. Bisa tolong jangan menghubungi saya?"]]],["p","はい、終わったら お電話します。こちらに お名前と 電話番号を お願いします。","はい、おわったら おでんわ します。こちら に おなまえ と でんわばんごう を おねがい します。","Baik, kalau sudah selesai kami telepon. Tolong tulis nama dan nomor telepon di sini."]]},{"t":"Membeli obat di apotek","s":"Tenggorokanmu sakit dan agak demam. Kamu bertanya kepada apoteker.","p":"薬剤師さん","e":"👩‍⚕️","l":[["p","こんにちは。どう なさいましたか。","こんにちは。どう なさいました か。","Selamat siang. Ada keluhan apa?"],["u","のどが 痛くて、少し 熱が あるんです。いい 薬は ありますか。","のど が いたくて、すこし ねつ が ある ん です。いい くすり は あります か。","Tenggorokan saya sakit dan agak demam. Ada obat yang cocok?",[["のどが 渇いたので、ビールを ください。","Saya haus, jadi minta bir."],["熱が あるので、プールで 泳ぎたいです。","Karena demam, saya ingin berenang di kolam."]]],["p","いつから ですか。ほかに 飲んで いる 薬は ありますか。","いつ から です か。ほか に のんで いる くすり は あります か。","Sejak kapan? Ada obat lain yang sedang diminum?"],["u","おとといからです。ほかの 薬は 飲んで いません。","おととい から です。ほか の くすり は のんで いません。","Sejak kemarin lusa. Saya tidak minum obat lain.",[["あさってからです。薬を 飲みすぎて います。","Mulai lusa. Saya minum obat kebanyakan."],["おとといです。薬は とても おいしいです。","Kemarin lusa. Obatnya enak sekali."]]],["p","では、この 風邪薬が いいと 思います。一日 三回、食後に 飲んで ください。","では、この かぜぐすり が いい と おもいます。いちにち さんかい、しょくご に のんで ください。","Kalau begitu, saya rasa obat flu ini cocok. Diminum tiga kali sehari setelah makan."],["u","飲むと 眠く なりますか。あしたは 仕事なので。","のむ と ねむく なります か。あした は しごと な ので。","Kalau diminum, bikin mengantuk? Soalnya besok saya kerja.",[["飲むと 背が 高く なりますか。あしたは 休みなので。","Kalau diminum, apakah saya jadi tinggi? Soalnya besok libur."],["飲まなくても 治りますか。あしたは 寝坊したので。","Bisa sembuh tanpa diminum? Soalnya besok saya sudah kesiangan."]]],["p","少し 眠く なるかも しれません。車の 運転は しないで ください。","すこし ねむく なる かも しれません。くるま の うんてん は しないで ください。","Mungkin sedikit mengantuk. Jangan menyetir mobil, ya."],["u","わかりました。お酒は 飲んでも いいですか。","わかりました。おさけ は のんで も いい です か。","Baik. Bolehkah saya minum alkohol?",[["わかりました。車を 運転しなければ なりません。","Baik. Saya harus menyetir mobil."],["わかりました。お酒で 薬を 飲みます。","Baik. Obatnya saya minum dengan alkohol."]]],["p","いいえ、薬を 飲んで いる 間は やめて ください。お大事に。","いいえ、くすり を のんで いる あいだ は やめて ください。おだいじ に。","Tidak, selama minum obat tolong jangan. Semoga cepat sembuh."],["u","ありがとうございます。いくらですか。","ありがとう ございます。いくら です か。","Terima kasih. Berapa harganya?",[["どういたしまして。いくつですか。","Sama-sama. Umurnya berapa?"],["お大事に。いくらでも いいです。","Semoga cepat sembuh. Berapa pun boleh."]]],["p","千二百円です。","せん にひゃく えん です。","1.200 yen."]]},{"t":"Mencari apartemen baru","s":"Kamu pergi ke agen properti untuk mencari tempat tinggal baru.","p":"不動産屋さん","e":"👨‍💼","l":[["p","いらっしゃいませ。お部屋を お探しですか。","いらっしゃいませ。おへや を おさがし です か。","Selamat datang. Sedang mencari kamar?"],["u","はい、来月 引っ越す 予定なので、駅から 近い 部屋を 探して います。","はい、らいげつ ひっこす よてい な ので、えき から ちかい へや を さがして います。","Ya, saya berencana pindah bulan depan, jadi sedang mencari kamar yang dekat stasiun.",[["はい、先月 引っ越したので、部屋は 要りません。","Ya, saya sudah pindah bulan lalu, jadi tidak perlu kamar."],["いいえ、駅で 寝て いるので、大丈夫です。","Tidak, saya tidur di stasiun, jadi tidak apa-apa."]]],["p","ご予算は どのぐらいですか。","ごよさん は どの ぐらい です か。","Anggarannya sekitar berapa?"],["u","家賃は 六万円ぐらいまでが いいです。","やちん は ろくまん えん ぐらい まで が いい です。","Sewanya maksimal sekitar 60.000 yen.",[["家賃は 払わなくても いいです。","Sewanya tidak perlu dibayar."],["六万円ぐらい もらいたいです。","Saya ingin menerima sekitar 60.000 yen."]]],["p","それなら、この 部屋は どうですか。駅から 歩いて 五分で、とても 静かですよ。","それ なら、この へや は どう です か。えき から あるいて ごふん で、とても しずか です よ。","Kalau begitu, bagaimana dengan kamar ini? Lima menit jalan kaki dari stasiun, dan sangat tenang."],["u","いいですね。ペットを 飼っても いいですか。猫が いるんです。","いい です ね。ペット を かって も いい です か。ねこ が いる ん です。","Bagus. Boleh memelihara hewan? Saya punya kucing.",[["いいですね。猫が 部屋を 探して います。","Bagus. Kucing saya sedang mencari kamar."],["うるさいですね。駅まで 遠すぎます。","Berisik ya. Terlalu jauh ke stasiun."]]],["p","すみません、この 建物は ペットが だめなんです。でも、こちらの 部屋なら 大丈夫です。少し 古いですが。","すみません、この たてもの は ペット が だめ な ん です。でも、こちら の へや なら だいじょうぶ です。すこし ふるい です が。","Maaf, gedung ini tidak boleh ada hewan. Tapi kamar yang ini boleh. Agak tua, sih."],["u","古くても かまいません。一度 見に 行けますか。","ふるくて も かまいません。いちど み に いけます か。","Tua juga tidak masalah. Bisa pergi melihatnya?",[["古いので、二度と 来ないで ください。","Karena tua, jangan datang lagi."],["新しく ないと 住めないと 思います。","Saya rasa saya tidak bisa tinggal kalau bukan yang baru."]]],["p","はい、今から ご案内できますよ。","はい、いま から ごあんない できます よ。","Ya, saya bisa mengantar sekarang."],["n","Setelah melihat kamarnya, kamu kembali ke kantor agen."],["u","とても 気に入りました。この 部屋に 決めたいと 思います。","とても き に いりました。この へや に きめたい と おもいます。","Saya suka sekali. Saya ingin memilih kamar ini.",[["全然 気に入りませんでした。すぐ 契約します。","Saya sama sekali tidak suka. Langsung saya kontrak."],["この 部屋を 片付けて ください。","Tolong bereskan kamar ini."]]],["p","ありがとうございます。では、契約の 書類を 準備しますね。","ありがとう ございます。では、けいやく の しょるい を じゅんび します ね。","Terima kasih. Kalau begitu, saya siapkan dokumen kontraknya."]]},{"t":"Janjian ke pameran manga","s":"Teman Jepangmu, Misaki, mengajakmu pergi akhir pekan ini.","p":"美咲","e":"👧","l":[["p","ねえ、今度の 土曜日、ひま？","ねえ、こんど の どようび、ひま？","Eh, Sabtu nanti kamu kosong?"],["u","うん、特に 予定は ないよ。どうしたの？","うん、とくに よてい は ない よ。どう した の？","Iya, nggak ada rencana khusus. Kenapa?",[["うん、先週の 土曜日は ひまだったよ。","Iya, Sabtu minggu lalu aku kosong."],["ううん、ひまじゃ ないから、行こう。","Nggak, aku nggak kosong, jadi ayo pergi."]]],["p","美術館で 珍しい 漫画の 展覧会が あるんだけど、一緒に 行かない？","びじゅつかん で めずらしい まんが の てんらんかい が ある ん だ けど、いっしょ に いかない？","Ada pameran manga langka di museum seni, mau pergi bareng?"],["u","いいね！ 漫画、大好き。何時に 会う？","いい ね！まんが、だいすき。なんじ に あう？","Asyik! Aku suka banget manga. Ketemu jam berapa?",[["いいね！ でも 漫画を 見た ことが ないから、行かない。","Asyik! Tapi aku belum pernah lihat manga, jadi nggak ikut."],["いいね！ 漫画を 書いて くれる？","Asyik! Mau bikinin aku manga?"]]],["p","十時に 駅の 改札で どう？","じゅうじ に えき の かいさつ で どう？","Jam sepuluh di gerbang tiket stasiun, gimana?"],["u","十時は ちょっと 早いかな。十一時でも いい？","じゅうじ は ちょっと はやい かな。じゅういちじ でも いい？","Jam sepuluh agak kepagian deh. Jam sebelas boleh?",[["十時は ちょっと 遅いから、十一時に しよう。","Jam sepuluh agak telat, jadi jam sebelas aja."],["十時に 駅で 寝るよ。","Jam sepuluh aku tidur di stasiun."]]],["p","いいよ。じゃ、十一時に しよう。遅れたら 連絡してね。","いい よ。じゃ、じゅういちじ に しよう。おくれたら れんらく して ね。","Oke. Jam sebelas ya. Kalau telat, kabari ya."],["u","わかった。展覧会の あとで、ご飯 食べに 行こうか。","わかった。てんらんかい の あと で、ごはん たべ に いこう か。","Oke. Habis pameran, mau makan bareng?",[["わかった。展覧会の 前に、もう 帰ろうか。","Oke. Sebelum pameran, kita pulang aja yuk."],["わかった。展覧会には 行かないで おくね。","Oke. Aku nggak usah ke pamerannya deh."]]],["p","いいね！ 近くに おいしい ラーメン屋が あるよ。楽しみ！","いい ね！ちかく に おいしい ラーメンや が ある よ。たのしみ！","Asyik! Dekat sana ada kedai ramen enak. Nggak sabar!"],["u","うん、楽しみに してる。じゃ、土曜日に。","うん、たのしみ に してる。じゃ、どようび に。","Iya, aku juga nggak sabar. Sampai Sabtu.",[["うん、残念だね。じゃ、昨日に。","Iya, sayang ya. Sampai kemarin."],["ううん、心配だよ。じゃ、来年に。","Nggak, aku khawatir. Sampai tahun depan."]]],["p","またね！","また ね！","Dah!"]]},{"t":"Bertanya ke guru setelah kelas","s":"Pelajaran selesai. Kamu masih bingung dan mendekati guru bahasa Jepangmu.","p":"山本先生","e":"👩‍🏫","l":[["p","{N}さん、今日の 授業は どうでしたか。","{N} さん、きょう の じゅぎょう は どう でした か。","{N}, bagaimana pelajaran hari ini?"],["u","文法が ちょっと 難しかったです。もう 一度 説明して いただけませんか。","ぶんぽう が ちょっと むずかしかった です。もう いちど せつめい して いただけません か。","Tata bahasanya agak sulit. Bisakah Ibu menjelaskannya sekali lagi?",[["文法が 難しかったので、先生を 叱りました。","Tata bahasanya sulit, jadi saya memarahi guru."],["授業は まだ 始まって いません。","Pelajarannya belum dimulai."]]],["p","いいですよ。どこが わかりにくかったですか。","いい です よ。どこ が わかりにくかった です か。","Boleh. Bagian mana yang sulit dipahami?"],["u","条件の 言い方が よく わからないんです。","じょうけん の いいかた が よく わからない ん です。","Saya kurang paham cara mengungkapkan pengandaian.",[["条件の 言い方は 全部 わかったので、帰ります。","Cara mengungkapkan pengandaian sudah saya pahami semua, jadi saya pulang."],["先生の 言い方が 怖かったです。","Cara bicara Ibu guru menakutkan."]]],["p","なるほど。じゃ、例文を 作って みましょう。「雨が 降ったら、家に いる」。{N}さんも 「たら」で 一つ 作って ください。","なるほど。じゃ、れいぶん を つくって みましょう。あめ が ふったら、いえ に いる。{N} さん も たら で ひとつ つくって ください。","Begitu. Ayo coba buat contoh kalimat. \"Kalau hujan, aku di rumah.\" {N} juga coba buat satu dengan \"tara\"."],["u","お金が たまったら、富士山に 登りたいです。","おかね が たまったら、ふじさん に のぼりたい です。","Kalau uangnya sudah terkumpul, saya ingin mendaki Gunung Fuji.",[["お金が たまったので、富士山に 登りました。","Karena uangnya sudah terkumpul, saya mendaki Gunung Fuji."],["富士山は 日本で 一番 高い 山です。","Gunung Fuji adalah gunung tertinggi di Jepang."]]],["p","いいですね。上手ですよ。宿題は 毎日 して いますか。","いい です ね。じょうず です よ。しゅくだい は まいにち して います か。","Bagus. Pintar sekali. Apakah PR dikerjakan setiap hari?"],["u","はい、毎晩 一時間ぐらい 復習して います。","はい、まいばん いちじかん ぐらい ふくしゅう して います。","Ya, setiap malam saya mengulang pelajaran sekitar satu jam.",[["はい、毎晩 一時間ぐらい 寝坊して います。","Ya, setiap malam saya kesiangan sekitar satu jam."],["いいえ、宿題は 先生が して います。","Tidak, PR-nya dikerjakan oleh guru."]]],["p","えらいですね。来週は 試験が あるので、漢字も 予習して おいて ください。","えらい です ね。らいしゅう は しけん が ある ので、かんじ も よしゅう して おいて ください。","Hebat. Minggu depan ada ujian, jadi siapkan juga kanjinya, ya."],["u","わかりました。がんばります。ありがとうございました。","わかりました。がんばります。ありがとう ございました。","Baik. Saya akan berusaha. Terima kasih banyak.",[["わかりました。試験は 受けなくても いいです。","Baik. Ujiannya tidak perlu saya ikuti."],["すみません。がんばりませんでした。","Maaf. Saya tidak berusaha."]]]]},{"t":"Hari pertama kerja paruh waktu","s":"Hari ini hari pertamamu kerja paruh waktu di sebuah kafe.","p":"店長","e":"👨‍🍳","l":[["p","{N}さん、今日から よろしくね。カフェで 働いた ことは ある？","{N} さん、きょう から よろしく ね。カフェ で はたらいた こと は ある？","{N}, mulai hari ini mohon kerja samanya. Pernah kerja di kafe?"],["u","いいえ、ありません。でも、レストランで アルバイトを した ことが あります。","いいえ、ありません。でも、レストラン で アルバイト を した こと が あります。","Belum pernah. Tapi saya pernah kerja paruh waktu di restoran.",[["はい、カフェで コーヒーを 飲んだ ことが あります。","Ya, saya pernah minum kopi di kafe."],["いいえ、カフェで 働きたく ないです。","Tidak, saya tidak mau kerja di kafe."]]],["p","そうか。じゃ、まず レジの 使い方を 覚えて もらうね。","そう か。じゃ、まず レジ の つかいかた を おぼえて もらう ね。","Oh, begitu. Kalau begitu, pertama pelajari cara pakai mesin kasir, ya."],["u","はい。メモを 取っても いいですか。","はい。メモ を とって も いい です か。","Baik. Bolehkah saya mencatat?",[["はい。お金を 取っても いいですか。","Baik. Bolehkah saya mengambil uangnya?"],["はい。レジを 壊しても いいですか。","Baik. Bolehkah saya merusak mesin kasirnya?"]]],["p","もちろん。あと、お客さんが 来たら、大きい 声で あいさつしてね。ちょっと 言って みて。","もちろん。あと、おきゃくさん が きたら、おおきい こえ で あいさつ して ね。ちょっと いって みて。","Tentu. Lalu, kalau ada tamu datang, beri salam dengan suara keras ya. Coba ucapkan."],["u","いらっしゃいませ。ご注文は お決まりですか。","いらっしゃいませ。ごちゅうもん は おきまり です か。","Selamat datang. Sudah menentukan pesanannya?",[["ありがとうございました。また お越しください。","Terima kasih banyak. Silakan datang kembali."],["いただきます。ご注文は ありません。","Selamat makan. Tidak ada pesanan."]]],["p","うん、上手だよ。ところで、来週の シフトは いつ 入れる？","うん、じょうず だ よ。ところで、らいしゅう の シフト は いつ はいれる？","Ya, bagus. Ngomong-ngomong, minggu depan kamu bisa masuk shift kapan?"],["u","月曜日と 水曜日なら 入れます。木曜日は 授業が あるので、無理です。","げつようび と すいようび なら はいれます。もくようび は じゅぎょう が ある ので、むり です。","Kalau Senin dan Rabu bisa. Kamis ada kuliah, jadi tidak bisa.",[["月曜日と 水曜日に 休みました。木曜日は 先月です。","Saya libur hari Senin dan Rabu. Kamis itu bulan lalu."],["毎日 入れないので、毎日 来ます。","Saya tidak bisa masuk setiap hari, jadi saya datang setiap hari."]]],["p","わかった。じゃ、月曜と 水曜で シフトを 入れて おくね。","わかった。じゃ、げつよう と すいよう で シフト を いれて おく ね。","Oke. Aku masukkan shift-mu hari Senin dan Rabu, ya."],["u","ありがとうございます。早く 慣れるように がんばります。","ありがとう ございます。はやく なれる よう に がんばります。","Terima kasih. Saya akan berusaha supaya cepat terbiasa.",[["ありがとうございます。早く 辞めるように がんばります。","Terima kasih. Saya akan berusaha supaya cepat berhenti."],["どういたしまして。もう 慣れて いました。","Sama-sama. Saya sudah terbiasa dari dulu."]]],["p","うん、期待してるよ。","うん、きたい してる よ。","Ya, aku menantikan kerjamu."]]},{"t":"Pesta penyambutan kantor","s":"Kantor mengadakan pesta penyambutan untukmu. Manajer datang menghampiri.","p":"部長","e":"👔","l":[["p","{N}さん、今日は 来て くれて ありがとう。何を 飲む？","{N} さん、きょう は きて くれて ありがとう。なに を のむ？","{N}, terima kasih sudah datang hari ini. Mau minum apa?"],["u","ありがとうございます。すみませんが、お酒が 飲めないので、お茶を いただけますか。","ありがとう ございます。すみません が、おさけ が のめない ので、おちゃ を いただけます か。","Terima kasih. Maaf, saya tidak bisa minum alkohol, boleh saya minta teh?",[["ありがとうございます。お酒が 飲めないので、ビールを 三杯 ください。","Terima kasih. Saya tidak bisa minum alkohol, jadi minta tiga gelas bir."],["ありがとうございます。部長が お茶を いただいて ください。","Terima kasih. Bapak silakan \"menerima\" teh.","keigo merendah dipakai untuk atasan"]]],["p","もちろん。遠慮しないで、たくさん 食べてね。","もちろん。えんりょ しないで、たくさん たべて ね。","Tentu. Jangan sungkan, makan yang banyak, ya."],["u","はい、いただきます。部長も どうぞ 召し上がって ください。","はい、いただきます。ぶちょう も どうぞ めしあがって ください。","Baik, saya makan. Bapak juga silakan dinikmati.",[["はい、いただきます。部長も どうぞ いただいて ください。","Baik, saya makan. Bapak juga silakan \"makan\".","bahasa merendah dipakai untuk atasan"],["はい、ごちそうさまでした。部長は 食べないで ください。","Baik, terima kasih atas makanannya. Bapak jangan makan."]]],["p","ありがとう。日本の 生活には もう 慣れた？","ありがとう。にほん の せいかつ に は もう なれた？","Terima kasih. Sudah terbiasa dengan kehidupan di Jepang?"],["u","はい、だいぶ 慣れました。でも、電車が 込んで いるのには まだ 驚きます。","はい、だいぶ なれました。でも、でんしゃ が こんで いる の に は まだ おどろきます。","Ya, sudah cukup terbiasa. Tapi saya masih kaget dengan kereta yang penuh sesak.",[["はい、だいぶ 慣れました。でも、日本には まだ 来た ことが ありません。","Ya, sudah cukup terbiasa. Tapi saya belum pernah datang ke Jepang."],["いいえ、まだ 生まれて いません。","Belum, saya belum lahir."]]],["p","ははは、朝の 電車は 大変だよね。国では 何を して いたの？","ははは、あさ の でんしゃ は たいへん だ よ ね。くに で は なに を して いた の？","Hahaha, kereta pagi memang berat, ya. Di negaramu dulu kerja apa?"],["u","インドネシアで ネットワークの エンジニアを して いました。","インドネシア で ネットワーク の エンジニア を して いました。","Di Indonesia saya bekerja sebagai engineer jaringan.",[["インドネシアで ネットワークの エンジニアに 会いました。","Di Indonesia saya bertemu engineer jaringan."],["インドネシアは 島が 多いと 思います。","Saya rasa Indonesia punya banyak pulau."]]],["p","そうか。じゃ、これからも 期待して いるよ。","そう か。じゃ、これ から も きたい して いる よ。","Oh, begitu. Kalau begitu, saya berharap banyak darimu ke depannya."],["u","ありがとうございます。役に 立てるように 一生懸命 がんばります。","ありがとう ございます。やく に たてる よう に いっしょうけんめい がんばります。","Terima kasih. Saya akan berusaha sekuat tenaga agar bisa berguna.",[["ありがとうございます。役に 立たないように 休みます。","Terima kasih. Saya akan libur supaya tidak berguna."],["残念です。もう 帰っても いいですか。","Sayang sekali. Boleh saya pulang sekarang?"]]],["p","うん、頼むよ。さあ、乾杯しよう！","うん、たのむ よ。さあ、かんぱい しよう！","Ya, saya andalkan. Ayo, bersulang!"]]},{"t":"Mengirim paket ke Indonesia","s":"Kamu pergi ke kantor pos untuk mengirim oleh-oleh ke keluarga.","p":"郵便局の人","e":"👩‍💼","l":[["p","いらっしゃいませ。どうぞ こちらへ。","いらっしゃいませ。どうぞ こちら へ。","Selamat datang. Silakan ke sini."],["u","この 荷物を インドネシアに 送りたいんですが。","この にもつ を インドネシア に おくりたい ん です が。","Saya ingin mengirim paket ini ke Indonesia.",[["この 荷物を インドネシアから 盗みたいんですが。","Saya ingin mencuri paket ini dari Indonesia."],["この 荷物は インドネシアで 生まれました。","Paket ini lahir di Indonesia."]]],["p","かしこまりました。中身は 何ですか。","かしこまりました。なかみ は なん です か。","Baik. Isinya apa?"],["u","家族への お土産です。お菓子と 服が 入って います。","かぞく へ の おみやげ です。おかし と ふく が はいって います。","Oleh-oleh untuk keluarga. Isinya kue dan baju.",[["家族です。父と 母が 入って います。","Keluarga saya. Isinya ayah dan ibu."],["中身は 見えないので、わかりやすいです。","Isinya tidak kelihatan, jadi mudah dipahami."]]],["p","割れやすい ものは 入って いませんか。","われやすい もの は はいって いません か。","Tidak ada barang yang mudah pecah?"],["u","はい、入って いません。","はい、はいって いません。","Ya, tidak ada.",[["はい、割れやすいので、投げて ください。","Ya, mudah pecah, jadi tolong dilempar."],["はい、もう 割って しまいました。","Ya, sudah saya pecahkan."]]],["p","では、航空便と 船便が ありますが、どちらに しますか。","では、こうくうびん と ふなびん が あります が、どちら に します か。","Ada pos udara dan pos laut, mau pakai yang mana?"],["u","航空便だと、何日ぐらいで 届きますか。","こうくうびん だ と、なんにち ぐらい で とどきます か。","Kalau pos udara, kira-kira berapa hari sampainya?",[["航空便で、何日ぐらい 泊まりますか。","Dengan pos udara, menginap berapa hari?"],["航空便に 乗った ことが あります。","Saya pernah naik pos udara."]]],["p","一週間ぐらいです。船便だと 二か月ぐらい かかりますが、安いですよ。","いっしゅうかん ぐらい です。ふなびん だ と にかげつ ぐらい かかります が、やすい です よ。","Sekitar seminggu. Kalau pos laut sekitar dua bulan, tapi lebih murah."],["u","母の 誕生日に 間に合わせたいので、航空便で お願いします。","はは の たんじょうび に まにあわせたい ので、こうくうびん で おねがい します。","Saya ingin paketnya sampai sebelum ulang tahun ibu, jadi pakai pos udara saja.",[["母の 誕生日に 間に合わなくても いいので、急いで ください。","Tidak apa-apa tidak keburu ulang tahun ibu, jadi tolong dipercepat."],["母の 誕生日は 去年だったので、船便で 来ました。","Ulang tahun ibu tahun lalu, jadi saya datang naik kapal."]]],["p","かしこまりました。では、この 伝票に 住所を 書いて ください。","かしこまりました。では、この でんぴょう に じゅうしょ を かいて ください。","Baik. Silakan tulis alamatnya di formulir pengiriman ini."],["u","すみません、ボールペンを 借りても いいですか。","すみません、ボールペン を かりて も いい です か。","Maaf, boleh saya pinjam bolpoinnya?",[["すみません、ボールペンで 払っても いいですか。","Maaf, boleh saya bayar pakai bolpoin?"],["すみません、住所は 忘れたので、適当に 書きます。","Maaf, saya lupa alamatnya, jadi saya tulis asal saja."]]],["p","はい、どうぞ。国の 名前は 英語で 大きく 書いて くださいね。","はい、どうぞ。くに の なまえ は えいご で おおきく かいて ください ね。","Ya, silakan. Nama negaranya tolong ditulis besar dalam bahasa Inggris, ya."]]}],"n3":[{"t":"Wawancara kerja","s":"Kamu wawancara untuk posisi engineer jaringan di perusahaan Jepang.","p":"面接官","e":"🧑‍💼","l":[["p","では、自己紹介を お願いします。","では、じこしょうかい を おねがい します。","Silakan perkenalkan diri."],["u","{N}と 申します。インドネシアで 5年間 ネットワーク管理の 仕事を して まいりました。","{N} と もうします。インドネシア で ごねんかん ネットワーク かんり の しごと を して まいりました。","Nama saya {N}. Saya telah bekerja di bidang manajemen jaringan di Indonesia selama 5 tahun.",[["{N}と おっしゃいます。ネットワークの 仕事を なさいました。","(Beliau) bernama {N}. (Beliau) telah bekerja di jaringan.","salah: keigo untuk orang lain"],["{N}です。ネットワークは あまり 好きでは ありません。","Saya {N}. Saya kurang suka jaringan."]]],["p","なぜ 日本で 働きたいと 思ったんですか。","なぜ にほん で はたらきたい と おもった ん です か。","Mengapa ingin bekerja di Jepang?"],["u","日本の 技術に 興味が あり、自分の 経験を 生かして 挑戦したいと 考えたからです。","にほん の ぎじゅつ に きょうみ が あり、じぶん の けいけん を いかして ちょうせん したい と かんがえた から です。","Karena saya tertarik pada teknologi Jepang dan ingin menantang diri dengan memanfaatkan pengalaman saya.",[["日本の 給料が 安いと 聞いたからです。","Karena saya dengar gaji di Jepang murah."],["日本で 働いた ことが あるからです。もう 十分です。","Karena saya pernah bekerja di Jepang. Sudah cukup."]]],["p","日本語は どのように 勉強して いますか。","にほんご は どの よう に べんきょう して います か。","Bagaimana cara Anda belajar bahasa Jepang?"],["u","毎日 アプリで 単語を 覚えたり、日本の ニュースを 聞いたり して います。","まいにち アプリ で たんご を おぼえたり、にほん の ニュース を きいたり して います。","Setiap hari saya menghafal kosakata lewat aplikasi, mendengarkan berita Jepang, dan lain-lain.",[["日本語は 勉強しなくても いいと 思います。","Menurut saya bahasa Jepang tidak perlu dipelajari."],["毎日 アプリを 作ったり、ニュースに 出たり します。","Setiap hari saya membuat aplikasi dan tampil di berita."]]],["p","最後に、何か 質問は ありますか。","さいご に、なに か しつもん は あります か。","Terakhir, ada pertanyaan?"],["u","はい。入社後は どのような 研修が ありますか。","はい。にゅうしゃご は どの よう な けんしゅう が あります か。","Ya. Pelatihan seperti apa yang ada setelah masuk perusahaan?",[["いいえ、特に 興味が ありません。","Tidak, saya tidak terlalu tertarik."],["はい。いつ 休んでも いいですか。","Ya. Kapan saja saya boleh libur?"]]],["p","最初の 3か月は 先輩と 一緒に 仕事を しながら 学んで いただきます。","さいしょ の さんかげつ は せんぱい と いっしょ に しごと を しながら まなんで いただきます。","Tiga bulan pertama Anda akan belajar sambil bekerja bersama senior."],["u","わかりました。本日は ありがとうございました。","わかりました。ほんじつ は ありがとう ございました。","Saya mengerti. Terima kasih banyak untuk hari ini.",[["わかりました。じゃあ、またね。","Oke. Sampai jumpa ya.","terlalu santai"],["わかりました。いただきます。","Saya mengerti. Selamat makan."]]]]},{"t":"Minta izin cuti ke atasan","s":"Kamu ingin mengambil cuti untuk pulang ke Indonesia.","p":"部長","e":"👔","l":[["u","部長、今 少し お時間 よろしいでしょうか。","ぶちょう、いま すこし おじかん よろしい でしょう か。","Pak, apakah ada waktu sebentar sekarang?",[["部長、今 少し お時間を あげましょうか。","Pak, mau saya berikan sedikit waktu?"],["部長、今 少し 暇でしょう。","Pak, sekarang Anda sedang senggang, kan."]]],["p","ええ、どうぞ。","ええ、どうぞ。","Ya, silakan."],["u","来月 一週間ほど 休暇を いただきたいのですが。家族の 結婚式で 国に 帰る 予定です。","らいげつ いっしゅうかん ほど きゅうか を いただきたい の です が。かぞく の けっこんしき ["まず、パスワードを 私に 教えて ください。","Pertama, beri tahu saya kata sandi Anda."],["まず、パソコンを 家に 持って 帰って ください。","Pertama, bawa pulang PC-nya ke rumah."]]],["p","わかりました。パスワードには 何か 条件が ありますか。","わかりました。パスワード に は なに か じょうけん が あります か。","Baik. Apakah ada syarat untuk kata sandinya?"],["u","12文字以上で、数字と 記号を 必ず 入れる ことに なって います。","じゅうに もじ いじょう で、すうじ と きごう を かならず いれる こと に なって います。","Aturannya minimal 12 karakter, dan wajib memakai angka serta simbol.",[["条件は ありませんから、「1234」でも 構いません。","Tidak ada syarat, jadi \"1234\" pun tidak apa-apa."],["12時以降に、数字を 削除する ことに なって います。","Aturannya angka dihapus setelah jam 12."]]],["p","結構 厳しいですね。","けっこう きびしい です ね。","Cukup ketat, ya."],["u","ええ、去年 不正アクセスが あってから、ルールが 厳しく なったんです。","ええ、きょねん ふせい アクセス が あって から、ルール が きびしく なった ん です。","Iya, sejak ada akses ilegal tahun lalu, aturannya jadi lebih ketat.",[["ええ、去年から ルールが 緩く なって、誰でも 使えるんです。","Iya, sejak tahun lalu aturannya jadi longgar, siapa pun bisa pakai."],["ええ、厳しいので、守らなくても いいんです。","Iya, karena ketat, tidak perlu dipatuhi."]]],["p","なるほど。ほかに 気を つける ことは ありますか。","なるほど。ほか に き を つける こと は あります か。","Begitu. Ada hal lain yang perlu diperhatikan?"],["u","怪しい メールが 届いたら、開かないで すぐ 情報システム部に 連絡して ください。","あやしい メール が とどいたら、ひらかないで すぐ じょうほう システム ぶ に れんらく して ください。","Kalau ada email mencurigakan, jangan dibuka, langsung hubungi divisi sistem informasi.",[["怪しい メールが 届いたら、添付ファイルを すぐ 開いて ください。","Kalau ada email mencurigakan, segera buka lampirannya."],["怪しい メールは 友達に 転送して あげて ください。","Email mencurigakan teruskan saja ke teman-teman."]]],["p","はい、気を つけます。いろいろ ありがとうございます。","はい、き を つけます。いろいろ ありがとう ございます。","Baik, saya akan berhati-hati. Terima kasih atas semuanya."],["u","わからない ことが あったら、遠慮しないで 聞いて くださいね。","わからない こと が あったら、えんりょ しないで きいて ください ね。","Kalau ada yang tidak dimengerti, jangan sungkan bertanya, ya.",[["わからない ことが あっても、絶対に 聞かないで くださいね。","Meskipun ada yang tidak dimengerti, jangan pernah bertanya, ya."],["わからない ことは、遠慮して 忘れて くださいね。","Yang tidak dimengerti, sungkan saja lalu lupakan, ya."]]],["p","ありがとうございます。頼りに して います。","ありがとう ございます。たより に して います。","Terima kasih. Saya mengandalkan Anda."]]},{"t":"Minta saran karier ke senior","s":"Kamu ingin pindah ke bidang keamanan siber dan meminta saran ke senior.","p":"森さん","e":"🧔","l":[["u","森さん、キャリアの ことで ちょっと 相談したい ことが あるんですが、今 よろしいですか。","もり さん、キャリア の こと で ちょっと そうだん したい こと が ある ん です が、いま よろしい です か。","Mori-san, ada yang ingin saya konsultasikan soal karier. Apakah sekarang boleh?",[["森さん、キャリアの ことで 相談に 乗って あげましょうか。","Mori-san, mau saya bantu konsultasi soal karier Anda?"],["森さん、キャリアの ことは もう 決めたので、話さないで ください。","Mori-san, soal karier sudah saya putuskan, jadi jangan bicara."]]],["p","いいよ。どうしたの？","いい よ。どう した の？","Boleh. Ada apa?"],["u","将来 セキュリティの 仕事を 目指して いるんですが、何から 始めれば いいか 迷って いるんです。","しょうらい セキュリティ の しごと を めざして いる ん です が、なに から はじめれば いい か まよって いる ん です。","Ke depannya saya mengincar pekerjaan di bidang keamanan, tapi bingung harus mulai dari mana.",[["セキュリティの 仕事は 嫌いなので、絶対に したくないんです。","Saya benci pekerjaan keamanan, jadi sama sekali tidak mau."],["何から 始めれば いいか、もう 全部 わかって いるんです。","Saya sudah tahu semuanya harus mulai dari mana."]]],["p","そうか。まずは ネットワークの 基本を しっかり 理解する ことが 大事だよ。","そう か。まず は ネットワーク の きほん を しっかり りかい する こと が だいじ だ よ。","Begitu. Pertama, penting untuk benar-benar memahami dasar jaringan."],["u","ネットワークは 毎日 仕事で 扱って いるので、ある程度 わかります。","ネットワーク は まいにち しごと で あつかって いる ので、ある ていど わかります。","Jaringan saya tangani setiap hari di kerja, jadi saya cukup paham.",[["ネットワークは 一度も 見た ことが ないので、得意です。","Saya belum pernah melihat jaringan sekali pun, jadi saya jago."],["ネットワークは 毎日 扱って いるので、全然 わかりません。","Jaringan saya tangani setiap hari, jadi sama sekali tidak paham."]]],["p","それなら、資格に 挑戦して みたら？ 実力の 証明に なるし。","それ なら、しかく に ちょうせん して みたら？ じつりょく の しょうめい に なる し。","Kalau begitu, coba tantang sertifikasi? Bisa jadi bukti kemampuan juga."],["u","そうですね。でも、仕事が 忙しくて、勉強する 時間が なかなか 取れないんです。","そう です ね。でも、しごと が いそがしくて、べんきょう する じかん が なかなか とれない ん です。","Benar juga. Tapi pekerjaan sibuk, jadi susah mendapat waktu untuk belajar.",[["そうですね。でも、資格は 誰でも もらえるので、勉強は いらないんです。","Benar juga. Tapi sertifikasi bisa didapat siapa saja, jadi tidak perlu belajar."],["そうですね。仕事が 忙しいので、毎日 遊んで ばかり います。","Benar juga. Karena kerja sibuk, setiap hari saya main melulu."]]],["p","毎日 三十分でも いいから、続ける ように すると いいよ。","まいにち さんじゅっぷん でも いい から、つづける よう に する と いい よ。","Walau cuma 30 menit sehari, sebaiknya usahakan tetap konsisten."],["u","わかりました。朝 少し 早く 起きて、勉強する ように します。","わかりました。あさ すこし はやく おきて、べんきょう する よう に します。","Baik. Saya akan usahakan bangun sedikit lebih pagi untuk belajar.",[["わかりました。朝 遅く 起きて、勉強しない ように します。","Baik. Saya akan usahakan bangun siang dan tidak belajar."],["わかりました。三十分だけ 勉強した ことが あります。","Baik. Saya pernah belajar cuma 30 menit."]]],["p","応援してるよ。わからない ところが あったら、いつでも 聞いてね。","おうえん してる よ。わからない ところ が あったら、いつ でも きいて ね。","Aku dukung. Kalau ada yang tidak paham, tanya kapan saja, ya."],["u","ありがとうございます。森さんに 相談して よかったです。","ありがとう ございます。もり さん に そうだん して よかった です。","Terima kasih. Untung saya berkonsultasi dengan Mori-san.",[["ありがとうございます。森さんに 相談しなければ よかったです。","Terima kasih. Seharusnya saya tidak berkonsultasi dengan Mori-san."],["どういたしまして。また 相談に 来て ください。","Sama-sama. Silakan datang konsultasi lagi."]]]]},{"t":"Hasil pemeriksaan kesehatan","s":"Kamu mendengarkan penjelasan dokter tentang hasil medical check-up kantor.","p":"佐々木先生","e":"👩‍⚕️","l":[["p","健康診断の 結果ですが、血圧が 少し 高いですね。","けんこう しんだん の けっか です が、けつあつ が すこし たかい です ね。","Soal hasil pemeriksaan kesehatan Anda, tekanan darahnya agak tinggi, ya."],["u","そうですか。最近、仕事が 忙しくて、よく 眠れて いないんです。","そう です か。さいきん、しごと が いそがしくて、よく ねむれて いない ん です。","Begitu ya. Akhir-akhir ini kerja sibuk, jadi saya kurang bisa tidur nyenyak.",[["そうですか。じゃあ、もう 二度と 病院に 来ません。","Begitu ya. Kalau begitu, saya tidak akan datang ke rumah sakit lagi."],["いいえ、血圧は 私の 趣味です。","Tidak, tekanan darah adalah hobi saya."]]],["p","睡眠不足や ストレスも 影響して いるかも しれませんね。お酒は 飲みますか。","すいみん ぶそく や ストレス も えいきょう して いる かも しれません ね。おさけ は のみます か。","Kurang tidur dan stres mungkin juga berpengaruh. Apakah Anda minum alkohol?"],["u","週に 一、二回 飲む 程度です。たばこは 吸いません。","しゅう に いち、にかい のむ ていど です。たばこ は すいません。","Hanya sekitar satu-dua kali seminggu. Saya tidak merokok.",[["週に 一、二回 病院で 飲んで います。","Saya minum satu-dua kali seminggu di rumah sakit."],["お酒は 飲みませんが、毎日 たくさん 飲みます。","Saya tidak minum alkohol, tapi setiap hari minum banyak."]]],["p","わかりました。念のため、来月 もう 一度 検査を しましょう。","わかりました。ねん の ため、らいげつ もう いちど けんさ を しましょう。","Baik. Untuk berjaga-jaga, bulan depan kita periksa sekali lagi."],["u","何か 深刻な 病気の 可能性が あるんでしょうか。","なに か しんこく な びょうき の かのうせい が ある ん でしょう か。","Apakah ada kemungkinan penyakit yang serius?",[["深刻な 病気だったので、もう 治りました。","Karena penyakitnya serius, sudah sembuh."],["来月の 検査は 先生が 受けて ください。","Pemeriksaan bulan depan dokter saja yang menjalani."]]],["p","いえ、今の ところ 心配する 必要は ありません。ただ、生活習慣を 見直した ほうが いいですね。","いえ、いま の ところ しんぱい する ひつよう は ありません。ただ、せいかつ しゅうかん を みなおした ほう が いい です ね。","Tidak, untuk saat ini tidak perlu khawatir. Hanya saja, sebaiknya Anda memperbaiki pola hidup."],["u","具体的に どんな ことに 気を つければ いいですか。","ぐたいてき に どんな こと に き を つければ いい です か。","Secara konkret, hal apa saja yang perlu saya perhatikan?",[["具体的に どんな 病気に なれば いいですか。","Secara konkret, sebaiknya saya kena penyakit apa?"],["生活習慣は 見直さない ように します。","Saya akan usahakan tidak memperbaiki pola hidup."]]],["p","塩分を 控えて、軽い 運動を 毎日 する ように して ください。","えんぶん を ひかえて、かるい うんどう を まいにち する よう に して ください。","Kurangi garam, dan usahakan olahraga ringan setiap hari."],["u","わかりました。ラーメンの スープは 飲まない ように します。","わかりました。ラーメン の スープ は のまない よう に します。","Baik. Saya akan usahakan tidak meminum kuah ramen.",[["わかりました。毎日 ラーメンの スープを 全部 飲む ように します。","Baik. Saya akan usahakan setiap hari menghabiskan kuah ramen."],["わかりました。運動は 体に 悪いので、やめます。","Baik. Olahraga buruk untuk tubuh, jadi saya berhenti."]]],["p","ええ、それが いいですね。では、お大事に。","ええ、それ が いい です ね。では、おだいじ に。","Ya, itu bagus. Semoga sehat selalu."]]},{"t":"Menelepon helpdesk soal PC lambat","s":"PC-mu sangat lambat sejak pagi, kamu menelepon helpdesk kantor.","p":"加藤さん","e":"👩‍💼","l":[["p","はい、ヘルプデスクの 加藤です。","はい、ヘルプデスク の かとう です。","Ya, helpdesk, dengan Kato."],["u","営業部の {N}です。朝から パソコンの 動きが 異常に 遅いんですが。","えいぎょうぶ の {N} です。あさ から パソコン の うごき が いじょう に おそい ん です が。","Saya {N} dari divisi penjualan. Sejak pagi PC saya lambat sekali, tidak normal.",[["営業部の {N}です。パソコンを 新しく 買いに 来ました。","Saya {N} dari divisi penjualan. Saya datang untuk membeli PC baru."],["ヘルプデスクの {N}です。何か お困りですか。","Helpdesk, dengan {N}. Ada yang bisa dibantu?"]]],["p","そうですか。何か エラーメッセージは 表示されて いますか。","そう です か。なに か エラー メッセージ は ひょうじ されて います か。","Begitu. Apakah ada pesan error yang muncul?"],["u","いいえ、エラーは 出て いません。ただ、ファンの 音が ずっと うるさいんです。","いいえ、エラー は でて いません。ただ、ファン の おと が ずっと うるさい ん です。","Tidak, tidak ada error. Hanya saja suara kipasnya terus berisik.",[["いいえ、エラーメッセージを 自分で 作りました。","Tidak, pesan error-nya saya buat sendiri."],["はい、パソコンに 叱られました。","Ya, saya dimarahi oleh PC."]]],["p","タスクマネージャーを 開いて、CPUの 使用率を 確認して いただけますか。","タスク マネージャー を ひらいて、シーピーユー の しようりつ を かくにん して いただけます か。","Bisa tolong buka Task Manager dan cek penggunaan CPU?"],["u","ええと、CPUが 九十パーセント 以上に なって います。","ええと、シーピーユー が きゅうじゅう パーセント いじょう に なって います。","Ehm, CPU-nya di atas 90 persen.",[["ええと、タスクマネージャーは 食べられません。","Ehm, Task Manager tidak bisa dimakan."],["ええと、CPUの 使用率は 確認しない ことに しました。","Ehm, saya memutuskan tidak mengecek penggunaan CPU."]]],["p","原因が はっきり しないので、リモートで 確認させて いただいても よろしいですか。","げんいん が はっきり しない ので、リモート で かくにん させて いただいて も よろしい です か。","Penyebabnya belum jelas, bolehkah saya mengeceknya secara remote?"],["u","はい、お願いします。ただ、十一時から 会議が あるので、それまでに 終わると 助かります。","はい、おねがい します。ただ、じゅういちじ から かいぎ が ある ので、それ まで に おわる と たすかります。","Ya, silakan. Hanya saja jam 11 ada rapat, jadi akan sangat membantu kalau selesai sebelum itu.",[["いいえ、確認しないで ください。でも、今すぐ 直して ください。","Tidak, jangan dicek. Tapi tolong perbaiki sekarang juga."],["はい、十一時から 会議を させて いただきます。","Ya, izinkan saya mengadakan rapat mulai jam 11."]]],["p","かしこまりました。…確認しました。古い 更新プログラムが 途中で 止まって いたようです。","かしこまりました。…かくにん しました。ふるい こうしん プログラム が とちゅう で とまって いた よう です。","Baik. ...Sudah saya cek. Sepertinya program update lama terhenti di tengah jalan."],["u","そうだったんですか。再起動すれば 直りますか。","そう だった ん です か。さいきどう すれば なおります か。","Oh, begitu rupanya. Kalau di-restart, apakah akan normal lagi?",[["そうだったんですか。じゃあ、パソコンを 捨てても いいですか。","Oh, begitu rupanya. Kalau begitu, boleh saya buang PC-nya?"],["そうだったんですか。更新は 私が 止めて あげました。","Oh, begitu rupanya. Update-nya sudah saya hentikan untuk Anda."]]],["p","はい、更新が 終わったら 再起動して ください。それでも 遅い 場合は、もう 一度 ご連絡ください。","はい、こうしん が おわったら さいきどう して ください。それ でも おそい ばあい は、もう いちど ごれんらく ください。","Ya, setelah update selesai silakan restart. Kalau masih lambat, tolong hubungi kami lagi."],["u","わかりました。助かりました。ありがとうございました。","わかりました。たすかりました。ありがとう ございました。","Baik. Sangat membantu. Terima kasih banyak.",[["わかりました。お大事に。","Baik. Semoga lekas sembuh."],["わかりました。では、いただきます。","Baik. Kalau begitu, selamat makan."]]]]},{"t":"Curhat soal stres kerja","s":"Teman Jepangmu melihatmu lesu dan mengajak ngobrol.","p":"拓也","e":"🧑","l":[["p","最近 元気 ないね。何か あった？","さいきん げんき ない ね。なに か あった？","Akhir-akhir ini kamu kelihatan lesu. Ada apa?"],["u","うん、仕事が 忙しくて、毎日 残業ばかり なんだ。","うん、しごと が いそがしくて、まいにち ざんぎょう ばかり な ん だ。","Iya, kerjaan lagi sibuk, tiap hari lembur terus.",[["うん、仕事が 暇で、毎日 早く 帰れて 最高なんだ。","Iya, kerjaan santai, tiap hari bisa pulang cepat, mantap banget."],["うん、仕事が 忙しいので、毎日 遊んで ばかり いるんだ。","Iya, karena kerjaan sibuk, tiap hari aku main melulu."]]],["p","そっか。上司に 相談して みた？","そっか。じょうし に そうだん して みた？","Oh gitu. Sudah coba ngomong ke atasan?"],["u","うん、でも 人が 足りないから、しかたが ないって 言われた。","うん、でも ひと が たりない から、しかた が ない って いわれた。","Sudah, tapi katanya karena orangnya kurang, ya mau gimana lagi.",[["うん、人が 多すぎるから、仕事が ないって 言われた。","Sudah, katanya orangnya kebanyakan, jadi nggak ada kerjaan."],["ううん、上司は 私の 上司じゃないから。","Belum, soalnya atasan itu bukan atasanku."]]],["p","それは 大変だね。ちゃんと 寝てる？","それ は たいへん だ ね。ちゃんと ねてる？","Berat juga ya. Kamu tidur cukup?"],["u","あんまり。夜中に 仕事の ことを 考えて しまって、眠れない ことが 多いんだ。","あんまり。よなか に しごと の こと を かんがえて しまって、ねむれない こと が おおい ん だ。","Nggak juga. Tengah malam suka kepikiran kerjaan, jadi sering nggak bisa tidur.",[["あんまり。夜中に 寝るのは 法律違反なんだ。","Nggak juga. Tidur tengah malam itu melanggar hukum."],["寝てるよ。会社で 寝る ように 言われたんだ。","Tidur kok. Aku disuruh tidur di kantor."]]],["p","無理しすぎないでよ。週末、気分転換に 山でも 行かない？","むり しすぎないで よ。しゅうまつ、きぶん てんかん に やま でも いかない？","Jangan terlalu memaksakan diri. Akhir pekan, mau ke gunung buat refreshing?"],["u","いいね。たまには 思い切り 体を 動かしたいな。","いい ね。たま に は おもいきり からだ を うごかしたい な。","Boleh tuh. Sesekali aku pengin gerak sepuasnya.",[["いいね。でも、山には 絶対 行きたく ないな。","Boleh tuh. Tapi aku sama sekali nggak mau ke gunung."],["いいね。先週末に 山に 行かない？","Boleh tuh. Akhir pekan lalu mau ke gunung?"]]],["p","じゃあ、土曜の 朝 七時に 駅で 待ち合わせよう。","じゃあ、どよう の あさ しちじ に えき で まちあわせよう。","Oke, Sabtu pagi jam 7 ketemuan di stasiun."],["u","了解。誘って くれて ありがとう。少し 気が 楽に なったよ。","りょうかい。さそって くれて ありがとう。すこし き が らく に なった よ。","Siap. Makasih sudah ngajak. Hatiku jadi agak lega.",[["了解。誘って あげて ありがとう。","Siap. Makasih sudah aku ajak."],["了解。少し 気が 重く なったよ。","Siap. Hatiku jadi agak berat."]]],["p","当たり前だよ。友達なんだから。","あたりまえ だ よ。ともだち な ん だ から。","Itu wajar dong. Kita kan teman."]]},{"t":"Ngobrol soal berita lingkungan","s":"Saat istirahat, rekan kerjamu membahas berita cuaca ekstrem pagi ini.","p":"鈴木さん","e":"👩","l":[["p","今朝の ニュース、見ました？ 今年の 夏は 過去 最高の 暑さだったらしいですよ。","けさ の ニュース、みました？ ことし の なつ は かこ さいこう の あつさ だった らしい です よ。","Sudah lihat berita tadi pagi? Katanya musim panas tahun ini yang terpanas sepanjang sejarah."],["u","ええ、見ました。地球温暖化の 影響が どんどん 深刻に なって いるそうですね。","ええ、みました。ちきゅう おんだんか の えいきょう が どんどん しんこく に なって いる そう です ね。","Ya, sudah. Katanya dampak pemanasan global makin lama makin serius, ya.",[["ええ、見ました。今年の 夏は とても 涼しかったですね。","Ya, sudah. Musim panas tahun ini sejuk sekali, ya."],["ええ、ニュースに 出演した ことが あります。","Ya, saya pernah tampil di berita."]]],["p","インドネシアでも 影響は ありますか。","インドネシア でも えいきょう は あります か。","Di Indonesia juga ada dampaknya?"],["u","はい。地域に よっては、雨が 増えて 洪水が 起きやすく なって います。","はい。ちいき に よって は、あめ が ふえて こうずい が おきやすく なって います。","Ya. Di beberapa daerah, curah hujan bertambah dan banjir jadi lebih mudah terjadi.",[["はい。インドネシアには 雨が 全然 存在しません。","Ya. Di Indonesia hujan sama sekali tidak ada."],["いいえ、地域に よって 洪水を 作って います。","Tidak, banjirnya dibuat tergantung daerah."]]],["p","大変ですね。私たちに できる ことって 何でしょうね。","たいへん です ね。わたしたち に できる こと って なん でしょう ね。","Berat, ya. Kira-kira apa yang bisa kita lakukan?"],["u","小さな ことですが、エアコンの 温度を 適切に 設定して、電気を 節約する ように して います。","ちいさな こと です が、エアコン の おんど を てきせつ に せってい して、でんき を せつやく する よう に して います。","Hal kecil sih, tapi saya membiasakan mengatur suhu AC dengan tepat dan menghemat listrik.",[["小さな ことですが、エアコンを 一日中 つけっぱなしに して います。","Hal kecil sih, tapi saya membiarkan AC menyala seharian."],["何も できないので、電気を たくさん 使う ように して います。","Karena tidak bisa apa-apa, saya membiasakan memakai listrik banyak-banyak."]]],["p","いいですね。会社でも、来月から ペーパーレス化を 進める ことに なったそうですよ。","いい です ね。かいしゃ でも、らいげつ から ペーパーレス か を すすめる こと に なった そう です よ。","Bagus. Katanya di kantor juga sudah diputuskan untuk menggalakkan paperless mulai bulan depan."],["u","そうなんですか。紙の 資料が 減れば、効率も 上がる はずですね。","そう な ん です か。かみ の しりょう が へれば、こうりつ も あがる はず です ね。","Oh, begitu. Kalau dokumen kertas berkurang, efisiensinya mestinya juga naik, ya.",[["そうなんですか。紙の 資料が 増えるので、効率が 下がる はずですね。","Oh, begitu. Karena dokumen kertas bertambah, efisiensinya mestinya turun, ya."],["そうなんですか。じゃあ、もっと 印刷して おきます。","Oh, begitu. Kalau begitu, saya cetak lebih banyak dulu."]]],["p","ただ、慣れるまでは ちょっと 大変かも しれませんね。","ただ、なれる まで は ちょっと たいへん かも しれません ね。","Tapi sampai terbiasa mungkin agak repot, ya."],["u","そうですね。でも、環境の ためなら、少し 我慢する 価値は あると 思います。","そう です ね。でも、かんきょう の ため なら、すこし がまん する かち は ある と おもいます。","Benar. Tapi demi lingkungan, saya rasa layak untuk sedikit bersabar.",[["そうですね。だから、紙を もっと 使いましょう。","Benar. Makanya, ayo pakai kertas lebih banyak."],["そうですね。環境の ためなら、何も 我慢しない ほうが いいと 思います。","Benar. Demi lingkungan, saya rasa lebih baik tidak menahan diri sama sekali."]]],["p","確かに。お互い 頑張りましょう。","たしか に。おたがい がんばりましょう。","Betul. Ayo sama-sama berusaha."]]},{"t":"Menyiapkan pesta penyambutan","s":"Kamu jadi panitia pesta penyambutan karyawan baru dan berkonsultasi dengan manajer.","p":"小林部長","e":"👴","l":[["u","部長、来月の 新入社員の 歓迎会ですが、私が 幹事を 担当する ことに なりました。","ぶちょう、らいげつ の しんにゅう しゃいん の かんげいかい です が、わたし が かんじ を たんとう する こと に なりました。","Pak, untuk pesta penyambutan karyawan baru bulan depan, saya ditugaskan jadi panitianya.",[["部長、私の 歓迎会を 開いて ください。","Pak, tolong adakan pesta penyambutan untuk saya."],["部長、歓迎会は 来年 担当して ください。","Pak, tolong urus pesta penyambutannya tahun depan."]]],["p","そうか、ご苦労さま。日程は もう 決まった？","そう か、ごくろうさま。にってい は もう きまった？","Begitu, terima kasih sudah repot-repot. Jadwalnya sudah ditentukan?"],["u","二十日の 金曜日を 考えて いるんですが、部長の ご都合は いかがでしょうか。","はつか の きんようび を かんがえて いる ん です が、ぶちょう の ごつごう は いかが でしょう か。","Saya mempertimbangkan Jumat tanggal 20. Bagaimana dengan jadwal Bapak?",[["二十日の 金曜日に 決めましたから、部長は 来なくても いいです。","Sudah saya tetapkan Jumat tanggal 20, jadi Bapak tidak usah datang."],["二十日の 金曜日は 私の ご都合が いかがでしょうか。","Jumat tanggal 20, bagaimana dengan jadwal saya?"]]],["p","その 日は 出張が 入って いるんだ。翌週なら 大丈夫だけど。","その ひ は しゅっちょう が はいって いる ん だ。よくしゅう なら だいじょうぶ だ けど。","Hari itu saya ada dinas luar. Kalau minggu berikutnya bisa."],["u","承知しました。では、二十七日に 延期する ように 調整します。","しょうち しました。では、にじゅうしちにち に えんき する よう に ちょうせい します。","Baik. Kalau begitu, saya atur supaya diundur ke tanggal 27.",[["承知しました。では、部長の 出張を 延期させて ください。","Baik. Kalau begitu, izinkan saya menunda dinas luar Bapak."],["承知しました。では、先週に 変更します。","Baik. Kalau begitu, saya ganti ke minggu lalu."]]],["p","悪いね。場所は どこに する 予定？","わるい ね。ばしょ は どこ に する よてい？","Maaf ya. Tempatnya rencananya di mana?"],["u","駅前の 居酒屋を 予約しようと 思って います。予算は 一人 五千円 程度です。","えきまえ の いざかや を よやく しよう と おもって います。よさん は ひとり ごせんえん ていど です。","Saya berencana memesan izakaya depan stasiun. Anggarannya sekitar 5.000 yen per orang.",[["駅前の 居酒屋に 住もうと 思って います。","Saya berencana tinggal di izakaya depan stasiun."],["予算は ありませんので、部長が 全部 払う ことに なって います。","Tidak ada anggaran, jadi sudah diatur Bapak yang bayar semuanya."]]],["p","いいね。新人の 中には お酒を 飲まない 人も いるから、気を つけてね。","いい ね。しんじん の なか に は おさけ を のまない ひと も いる から、き を つけて ね。","Bagus. Di antara karyawan baru ada juga yang tidak minum alkohol, jadi perhatikan, ya."],["u","はい。ソフトドリンクや ハラールの 料理も 用意して もらえるか、お店に 確認して みます。","はい。ソフト ドリンク や ハラール の りょうり も ようい して もらえる か、おみせ に
