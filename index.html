<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0"><title>Hafalan Nihongo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: satu kolom seperti aplikasi HP; navbar tetap di bawah, layar soal memakai bilah jawaban di bawah */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --ink:#1B2440; --muted:#5F6782; --line:#D5DAE6;
  --accent:#D9452B; --accent-ink:#FFFFFF; --good:#23895A; --good-bg:#DDF2E7; --bad:#C43A2A; --bad-bg:#FBE3DF;
  --chip:#E3E7F0;
  --n5:#2F9E62; --n4:#1E88B8; --n3:#7356C9; --n2:#C98A12; --n1:#C2364F;
  --f-ui:"M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
  --f-jp:"Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1320; --surface:#191F31; --ink:#E8EBF4; --muted:#9AA2BC; --line:#2B3350;
  --accent:#F0644A; --accent-ink:#1A0E0B; --good:#4CC48A; --good-bg:#14301F; --bad:#F07562; --bad-bg:#3A1A16; --chip:#242B42;
  --n5:#4CC48A; --n4:#4FB3E3; --n3:#A08BF0; --n2:#F0B43C; --n1:#F06A82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1320; --surface:#191F31; --ink:#E8EBF4; --muted:#9AA2BC; --line:#2B3350;
  --accent:#F0644A; --accent-ink:#1A0E0B; --good:#4CC48A; --good-bg:#14301F; --bad:#F07562; --bad-bg:#3A1A16; --chip:#242B42;
  --n5:#4CC48A; --n4:#4FB3E3; --n3:#A08BF0; --n2:#F0B43C; --n1:#F06A82; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 140px;display:flex;flex-direction:column;gap:16px;min-height:100%}
h1{font-size:1.6rem;margin:0;font-weight:800;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:.8rem;margin:6px 0 0;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.sub{color:var(--muted);margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
label.lbl{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.04em}
select{width:100%;font:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{font:inherit;font-size:.9rem;padding:12px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;text-align:left;line-height:1.3}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--surface);box-shadow:inset 0 0 0 1px var(--accent)}
.seg button small{display:block;color:var(--muted);font-size:.75rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toggle{display:flex;align-items:center;gap:8px;font-size:.9rem;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.btn{font:inherit;font-weight:800;font-size:1rem;letter-spacing:.04em;border:0;border-radius:14px;padding:15px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 65%,#000);width:100%;text-transform:uppercase}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 65%,#000)}
.btn.ghost{background:var(--chip);color:var(--ink);box-shadow:0 4px 0 var(--line)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{height:10px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .4s}
.num{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted)}
.back{font:inherit;font-weight:700;background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 0;align-self:flex-start}

/* beranda */
.hero{display:flex;flex-direction:column;gap:4px}
.decks{display:flex;flex-direction:column;gap:10px}
.deck{font:inherit;color:var(--ink);text-align:left;background:var(--surface);border:1.5px solid var(--line);border-bottom-width:4px;border-radius:18px;padding:14px;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;cursor:pointer}
.deck:active{transform:translateY(2px);border-bottom-width:2px}
.badge{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:1.15rem;color:var(--surface);background:var(--c);box-shadow:0 3px 0 color-mix(in srgb,var(--c) 60%,#000)}
.badge.jp{font-family:var(--f-jp);font-size:1.6rem}
.deck b{display:block;font-size:1.02rem;line-height:1.25}
.deck .meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.deck .bar{height:8px}
.deck .bar>i{background:var(--c)}
.chev{color:var(--muted);font-size:1.3rem}

/* huruf */
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--line)}
.tabs button{font:inherit;font-weight:800;letter-spacing:.08em;background:none;border:0;color:var(--muted);padding:12px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--n4);border-color:var(--n4)}
.kgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.kgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kcell{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:0}
.kcell .k{font-family:var(--f-jp);font-size:1.5rem;font-weight:700;line-height:1.2}
.kcell .r{font-size:.75rem;color:var(--muted)}
.kcell .bar{height:6px;width:80%;margin-top:4px}
.kcell .bar>i{background:var(--n2)}
.kcell.empty{visibility:hidden}
.kcell.say{border-color:var(--n4)}

/* navbar */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1.5px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom, 0px));z-index:5}
.nav .in{max-width:528px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nav button{font:inherit;background:none;border:2px solid transparent;border-radius:14px;padding:6px 4px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:700}
.nav button .ic{width:28px;height:28px;display:grid;place-items:center;font-family:var(--f-jp);font-size:1.35rem;font-weight:700;line-height:1}
.nav button svg{width:26px;height:26px}
.nav button[aria-current="page"]{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 8%,transparent)}

/* game */
.top{display:flex;align-items:center;gap:12px}
.x{font:inherit;font-size:1.4rem;line-height:1;background:none;border:0;color:var(--muted);cursor:pointer;padding:6px}
.top .bar{flex:1;height:16px}
.top .bar>i{background:var(--accent)}
.streak{font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent);min-width:3ch;text-align:right}
.prompt{font-size:1.15rem;font-weight:800;margin:0}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative;min-height:170px;justify-content:center}
.card .big{font-family:var(--f-jp);font-size:2.6rem;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.card .big.kana{font-size:4.2rem}
.card .big.id{font-family:var(--f-ui);font-size:1.9rem}
.card .big.sit{font-family:var(--f-ui);font-size:1.3rem;line-height:1.45}
.card .reading{font-family:var(--f-jp);font-size:1.15rem;color:var(--muted)}
.card .rom{font-size:.9rem;color:var(--muted);font-style:italic}
.speak{position:absolute;top:10px;right:10px;font:inherit;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:6px 10px;cursor:pointer;font-size:.8rem;font-weight:700}
.bigplay{font:inherit;font-weight:800;border:0;border-radius:50%;width:96px;height:96px;background:var(--n4);color:var(--surface);font-size:2rem;cursor:pointer;box-shadow:0 5px 0 color-mix(in srgb,var(--n4) 60%,#000)}
.tag{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{font:inherit;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:14px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:84px;justify-content:center;text-align:center;min-width:0}
.opt .j{font-family:var(--f-jp);font-size:1.35rem;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.opt .j.kana{font-size:2rem}
.opt .k{font-family:var(--f-jp);font-size:.85rem;color:var(--muted)}
.opt .r{font-size:.75rem;color:var(--muted);font-style:italic}
.opt .t{font-size:1rem;font-weight:500;overflow-wrap:anywhere}
.opt .t.rom{font-size:1.4rem;font-weight:700}
.opt.sel{border-color:var(--accent)}
.opt.good{border-color:var(--good);background:var(--good-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.typebox input{width:100%;font:inherit;font-size:1.2rem;padding:16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.typebox p{margin:6px 0 0;color:var(--muted);font-size:.8rem}
.mic{font:inherit;font-weight:800;font-size:1.05rem;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:22px;border-radius:20px;border:2px dashed var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface));color:var(--ink);cursor:pointer}
.mic .dot{width:22px;height:22px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 25%,transparent)}
.mic.on{border-style:solid}
.mic.on .dot{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--accent) 10%,transparent)}}
.heard{margin:0;font-family:var(--f-jp);color:var(--muted);text-align:center}

.foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1.5px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom, 0px));z-index:6}
.foot .in{max-width:528px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.foot.good{background:var(--good-bg);border-color:var(--good)}
.foot.bad{background:var(--bad-bg);border-color:var(--bad)}
.verdict{display:flex;gap:12px;align-items:center}
.stamp{flex:none;width:52px;height:52px;border-radius:50%;border:3px solid currentColor;display:grid;place-items:center;font-family:var(--f-jp);font-weight:700;font-size:1rem;transform:rotate(-12deg);animation:pop .35s ease-out}
.foot.good .verdict{color:var(--good)}
.foot.bad .verdict{color:var(--bad)}
.verdict b{display:block;font-size:1.1rem}
.verdict span{color:var(--ink);font-size:.95rem}
.verdict .jp{font-family:var(--f-jp);font-weight:700}
.foot.good .btn{background:var(--good);box-shadow:0 4px 0 color-mix(in srgb,var(--good) 60%,#000);color:var(--surface)}
.foot.bad .btn{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,#000);color:var(--surface)}
@keyframes pop{0%{transform:scale(.4) rotate(-30deg);opacity:0}70%{transform:scale(1.15) rotate(-8deg)}100%{transform:scale(1) rotate(-12deg)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s 2}

/* hasil & progres */
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.score div{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.score b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.score span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.review li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.review li:last-child{border-bottom:0}
.review .jp{font-family:var(--f-jp);font-weight:700}
.review .meta{color:var(--muted);font-size:.8rem}
.empty{color:var(--muted);margin:0}
.statrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.statrow .bar{grid-column:1/-1}
.statrow .bar>i{background:var(--c)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app"></div>
<nav class="nav" id="nav" aria-label="Menu utama"><div class="in">
  <button type="button" data-tab="home"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>Beranda</button>
  <button type="button" data-tab="kana"><span class="ic">あ</span>Huruf</button>

</div></nav>

const H_DAKU = 'がga ぎgi ぐgu げge ごgo ざza じji ずzu ぜze ぞzo だda ぢji づzu でde どdo ばba びbi ぶbu べbe ぼbo ぱpa ぴpi ぷpu ぺpe ぽpo';
const H_YOON = 'きゃkya きゅkyu きょkyo しゃsha しゅshu しょsho ちゃcha ちゅchu ちょcho にゃnya にゅnyu にょnyo ひゃhya ひゅhyu ひょhyo みゃmya みゅmyu みょmyo りゃrya りゅryu りょryo ぎゃgya ぎゅgyu ぎょgyo じゃja じゅju じょjo びゃbya びゅbyu びょbyo ぴゃpya ぴゅpyu ぴょpyo';
const toKata = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0)+0x60));
const KGROUPS = ['Dasar','Dakuten & Handakuten','Kombinasi (Yōon)'];
function kanaWords(kata){
  const out=[];
  [H_BASIC,H_DAKU,H_YOON].forEach((src,g)=>src.split(' ').forEach(t=>{
    const m=t.match(/^([^a-z]+)([a-z]+)$/); const k=kata?toKata(m[1]):m[1];
    out.push(['',k,m[2],m[2],g]);
  }));
  return out;
}
RAW.push({id:'hira',title:'Tebak Hiragana',short:'あ',color:'n4',kind:'kana',secs:KGROUPS,words:kanaWords(false)});

const app=document.getElementById('app'), nav=document.getElementById('nav'), foot=document.getElementById('foot'), verdict=document.getElementById('verdict'), nextBtn=document.getElementById('next');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

const jpMain = w => clean(w.kanji || w.kana);
const pct = (a,b) => b? (a/b*100).toFixed(1) : 0;
function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(clean(text)); u.lang='ja-JP'; u.rate=.85;
    const v=speechSynthesis.getVoices().find(v=>/ja/i.test(v.lang)); if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

    <div class="hero"><div class="eyebrow">Progres</div><h1>${tot} kata & huruf dikuasai</h1>
      <p class="sub">Dihitung dikuasai setelah 2× benar berturut-turut. Salah sekali, hitungannya mulai lagi.</p></div>
    <div class="panel">${DECKS.map(d=>{const m=mastered(d),n=d.items.length;return `<div class="statrow" style="--c:var(--${d.color})"><b>${esc(d.title)}</b><span class="num">${m} / ${n}</span><span class="bar"><i style="width:${pct(m,n)}%"></i></span></div>`}).join('')}</div>
    <span class="num">Total ${tot} / ${all}. Progres tersimpan di browser HP ini.</span>`;
}

/* ---------- pengaturan ronde ---------- */
let CUR=null, S=null;
function setup(d){
  stopRec(); CUR=d; S=settingsFor(d); VIEW='setup'; setNav(false); foot.hidden=true;
  const save=()=>store.set('set:'+d.id,S);
  const secOpts = d.secs.length>1 ? d.secs.map((s,i)=>`<option value="${i}" ${String(S.sec)===String(i)?'selected':''}>${d.kind==='vocab'?(i+1)+'. ':''}${esc(s)} (${d.items.filter(w=>w.sec===i).length})</option>`).join('') : '';
  const m=mastered(d);
  app.innerHTML = `
    <button class="back" id="back">‹ Kembali</button>
    <div style="display:flex;gap:14px;align-items:center;--c:var(--${d.color})"><span class="badge ${/^N\d$/.test(d.short)?'':'jp'}">${esc(d.short)}</span>
      <div><h1>${esc(d.title)}</h1><span class="num">${m} / ${d.items.length} dikuasai</span></div></div>
    <div class="panel">
      <label class="lbl" for="sec">${d.kind==='kana'?'KELOMPOK HURUF':'TEMA'}</label>
      <select id="sec">
        <option value="all" ${S.sec==='all'?'selected':''}>Semua (${d.items.length})</option>
        <option value="weak" ${S.sec==='weak'?'selected':''}>Belum dikuasai saja</option>
        ${secOpts}
      </select>
      <label class="lbl">JENIS SOAL</label>
      <div class="seg">${modesFor(d).map(([k,t,s])=>`<button type="button" data-mode="${k}" aria-pressed="${S.mode===k}">${t}<small>${s}</small></button>`).join('')}</div>
      <label class="lbl">JUMLAH SOAL</label>
      <div class="seg" style="grid-template-columns:repeat(3,1fr)">${[20,35,50].map(n=>`<button type="button" data-len="${n}" aria-pressed="${S.len===n}" style="text-align:center">${n} soal</button>`).join('')}</div>
      <div class="row">
        ${d.kind==='vocab'?`<label class="toggle"><input type="checkbox" id="rom" ${S.romaji?'checked':''}> Tampilkan romaji</label>`:''}
        <label class="toggle"><input type="checkbox" id="voice" ${S.voice?'checked':''}> Bacakan suara</label>
      </div>
    </div>
    <button class="btn" id="start">Mulai</button>`;
  app.querySelector('#back').onclick=()=>go(d.kind==='kana'?'kana':'home');
  app.querySelector('#sec').onchange=e=>{S.sec=e.target.value;save()};
  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;save();setup(d)});
  app.querySelectorAll('[data-len]').forEach(b=>b.onclick=()=>{S.len=+b.dataset.len;save();setup(d)});
  const rom=app.querySelector('#rom'); if(rom) rom.onchange=e=>{S.romaji=e.target.checked;save()};
  app.querySelector('#voice').onchange=e=>{S.voice=e.target.checked;save()};
  app.querySelector('#start').onclick=()=>startRound();
  window.scrollTo(0,0);
}

/* ---------- ronde ---------- */
let R=null, cur=null, answered=false;
function poolFor(){
  const d=CUR, mm=M(d.id);
  if(S.sec==='all') return d.items;
  if(S.sec==='weak'){const p=d.items.filter(w=>(mm[w.id]||0)<2); return p.length?p:d.items;}
  return d.items.filter(w=>w.sec===+S.sec);
}
function pickType(w){
  const modes = modesFor(CUR).map(m=>m[0]).filter(m=>m!=='mix');
  let t = S.mode==='mix' ? modes[Math.random()*modes.length|0] : S.mode;
  if(t==='sit' && !w.sit) t='id2jp';
  return t;
}
function startRound(list){
  const d=CUR, mm=M(d.id), pool=list||poolFor();
  let picked;
  if(list) picked=shuffle(list);
  else{
    const sorted=shuffle(pool).sort((a,b)=>(mm[a.id]||0)-(mm[b.id]||0));
    picked=[];
    const first=shuffle(sorted.slice(0,Math.min(S.len,pool.length)));
    picked.push(...first);
    while(picked.length<S.len){
      const batch=shuffle(pool);
      if(batch[0].id===picked[picked.length-1].id) batch.push(batch.shift());
      picked.push(...batch);
    }
    picked=picked.slice(0,S.len);
  }
  R={queue:picked.map(w=>({w,type:pickType(w)})), total:picked.length, done:0, firstTry:0, streak:0, best:0, wrong:new Map(), missed:new Set()};
  VIEW='game'; setNav(false); ask();
}
function distractors(w,n,key){
  const d=CUR, kana=d.kind==='kana';
  const ok = x => x.id!==w.id && !(kana && x.rom===w.rom);
  const same=d.items.filter(x=>x.sec===w.sec && ok(x)), any=d.items.filter(ok);
  const out=[], seen=new Set([key(w)]);
  for(const x of shuffle(same).concat(shuffle(any))){ const k=key(x); if(seen.has(k)) continue; seen.add(k); out.push(x); if(out.length===n) break; }
  return out;
}
function header(){
  return `<div class="top"><button class="x" id="quit" aria-label="Keluar">✕</button><div class="bar"><i style="width:${R.done/R.total*100}%"></i></div><span class="streak">${R.streak?R.streak+'🔥':''}</span></div>`;
}
function jpBlock(w){
  return `${w.kanji?`<span class="j">${esc(clean(w.kanji))}</span><span class="k">${esc(clean(w.kana))}</span>`:`<span class="j">${esc(clean(w.kana))}</span>`}${S.romaji?`<span class="r">${esc(w.rom)}</span>`:''}`;
}
function ask(){
  stopRec(); foot.hidden=true; answered=false;
  if(!R.queue.length) return result();
  cur=R.queue[0]; const w=cur.w, t=cur.type;
  let body='';
  const optsJp = () => shuffle([w,...distractors(w,3,x=>jpMain(x))]).map(o=>`<button class="opt" data-id="${o.id}">${jpBlock(o)}</button>`).join('');
  if(t==='id2jp'){
    body=`<p class="prompt">Pilih kata Jepang yang benar</p><div class="card"><span class="tag">bahasa Indonesia</span><span class="big id">${esc(w.arti)}</span></div><div class="opts">${optsJp()}</div>`;
  } else if(t==='sit'){
    body=`<p class="prompt">Apa yang kamu ucapkan?</p><div class="card"><span class="tag">situasi</span><span class="big sit">${esc(w.sit)}</span></div><div class="opts">${optsJp()}</div>`;
  } else if(t==='jp2id'){
    const opts=shuffle([w,...distractors(w,3,x=>x.arti)]);
    body=`<p class="prompt">Apa artinya?</p><div class="card"><button class="speak" id="say">▶ Dengar</button><span class="big">${esc(jpMain(w))}</span>${w.kanji?`<span class="reading">${esc(clean(w.kana))}</span>`:''}${S.romaji?`<span class="rom">${esc(w.rom)}</span>`:''}</div>
      <div class="opts">${opts.map(o=>`<button class="opt" data-id="${o.id}"><span class="t">${esc(o.arti)}</span></button>`).join('')}</div>`;
    if(S.voice) setTimeout(()=>speak(w.kana),150);
  } else if(t==='k2r'){
    const opts=shuffle([w,...distractors(w,3,x=>x.rom)]);
    body=`<p class="prompt">Bagaimana cara membacanya?</p><div class="card"><button class="speak" id="say">▶ Dengar</button><span class="big kana">${esc(w.kana)}</span></div>
      <div class="opts">${opts.map(o=>`<button class="opt" data-id="${o.id}"><span class="t rom">${esc(o.rom)}</span></button>`).join('')}</div>`;
  } else if(t==='r2k' || t==='listen'){
    const opts=shuffle([w,...distractors(w,3,x=>x.kana)]);
    body = t==='r2k'
      ? `<p class="prompt">Pilih huruf yang dibaca</p><div class="card"><span class="tag">romaji</span><span class="big id" style="font-size:2.6rem">${esc(w.rom)}</span></div>`
      : `<p class="prompt">Dengarkan, lalu pilih hurufnya</p><div class="card"><button class="bigplay" id="say" aria-label="Putar suara">▶</button><span class="tag">ketuk untuk mengulang</span></div>`;
    body += `<div class="opts">${opts.map(o=>`<button class="opt" data-id="${o.id}"><span class="j kana">${esc(o.kana)}</span></button>`).join('')}</div>`;
    if(t==='listen') setTimeout(()=>speak(w.kana),200);
  } else if(t==='voice'){
    const useSit = w.sit && Math.random()<.5;
    body=`<p class="prompt">Ucapkan dalam bahasa Jepang</p>
      <div class="card"><span class="tag">${useSit?'situasi':'bahasa Indonesia'}</span><span class="big ${useSit?'sit':'id'}">${esc(useSit?w.sit:w.arti)}</span></div>
      ${SR&&!micBlocked?`<button type="button" class="mic" id="mic"><span class="dot"></span><span id="micTxt">Tekan lalu bicara</span></button>`:''}
      <p class="heard" id="heard" hidden></p>
      <form class="typebox voicebox" id="tf" autocomplete="off" ${SR&&!micBlocked?'hidden':''}><input id="typed" lang="ja" placeholder="ketik / pakai mic keyboard" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Jawaban">
      <p id="vnote">Mikrofon tidak bisa dipakai di sini. Pakai ikon mikrofon di keyboard HP (bahasa Jepang).</p></form>`;
  } else {
    body=`<p class="prompt">Tulis dalam bahasa Jepang</p><div class="card"><span class="tag">bahasa Indonesia</span><span class="big id">${esc(w.arti)}</span></div>
      <form class="typebox" id="tf" autocomplete="off"><input id="typed" placeholder="contoh: mizu / みず" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Jawaban"><p>Boleh pakai romaji atau hiragana/katakana. Huruf panjang (ou/oo) dianggap sama.</p></form>`;
  }
  app.innerHTML = header()+body;
  app.querySelector('#quit').onclick=()=>setup(CUR);
  const say=app.querySelector('#say'); if(say) say.onclick=()=>speak(w.kana);
  if(t==='type'||t==='voice'){
    const inp=app.querySelector('#typed');
    app.querySelector('#tf').onsubmit=e=>{e.preventDefault(); if(!answered && inp.value.trim()) check(matchTyped(inp.value,w));};
    showFoot('check');
    if(t==='voice'){
      inp.addEventListener('input',()=>{ if(!answered && matchTyped(inp.value,w)) check(true); });
      const mic=app.querySelector('#mic');
      if(mic){ mic.onclick=()=>listen(w); voiceFoot(); } else setTimeout(()=>inp.focus(),50);
    } else setTimeout(()=>inp.focus(),50);
  } else {
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(answered) return; b.classList.add('sel'); check(+b.dataset.id===w.id,b); });
  }
  window.scrollTo(0,0);
}

/* ---------- pencocokan jawaban ---------- */
const ALT = {
  'おはようございます':['お早うございます'],'こんにちは':['今日は','こんにちわ'],'こんばんは':['今晩は','こんばんわ'],
  'さようなら':['左様なら','さよなら'],'おやすみなさい':['お休みなさい'],'ありがとうございます':['有難うございます','有り難うございます'],
  'どういたしまして':['どう致しまして'],'すみません':['済みません','すいません'],'ごめんなさい':['御免なさい'],
  'はじめまして':['初めまして','始めまして'],'よろしくおねがいします':['宜しくお願いします','よろしくお願いします','よろしくお願い致します','宜しくお願い致します'],
  'いただきます':['頂きます','戴きます'],'ごちそうさまでした':['ご馳走様でした','御馳走様でした'],'いってきます':['行ってきます','行って来ます'],
  'いってらっしゃい':['行ってらっしゃい'],'ただいま':['ただ今','只今'],'おかえりなさい':['お帰りなさい'],'おねがいします':['お願いします','お願い致します']
};
function norm(s){
  return s.toLowerCase().normalize('NFKC').replace(/[\s'’\-～~.]/g,'')
    .replace(/ou/g,'o').replace(/oo/g,'o').replace(/uu/g,'u').replace(/aa/g,'a').replace(/ii/g,'i').replace(/ee/g,'e').replace(/ei/g,'e');
}
function toHira(s){return s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60))}
function matchTyped(v,w){
  const t=v.trim().replace(/[。、！!？?．，,\s　]/g,'');
  if(!t) return false;
  if((ALT[w.kana]||[]).includes(t)) return true;
  if(/[぀-ヿ一-龯]/.test(t)){
    const a=toHira(t), b=toHira(clean(w.kana));
    return a===b || t===clean(w.kanji) || a.replace(/ー/g,'')===b.replace(/ー/g,'');
  }
  return norm(t)===norm(w.rom);
}

/* ---------- mikrofon ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, micBlocked=false;
function stopRec(){ if(rec){ try{rec.abort()}catch(e){} rec=null; } }
function listen(w){
  const mic=app.querySelector('#mic'), txt=app.querySelector('#micTxt'), heard=app.querySelector('#heard');
  if(rec){ try{rec.stop()}catch(e){} return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  let r; try{ r=new SR(); }catch(e){ return micFail(); }
  rec=r; r.lang='ja-JP'; r.interimResults=true; r.maxAlternatives=5; r.continuous=false;
  mic.classList.add('on'); txt.textContent='Mendengarkan…';
  let last='';
  r.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      const res=e.results[i];
      for(let j=0;j<res.length;j++){
        if(!answered && matchTyped(res[j].transcript,w)){ heard.hidden=false; heard.textContent='Terdengar: '+res[j].transcript; try{r.stop()}catch(_){} check(true); return; }
      }
      last=res[0].transcript;
    }
    heard.hidden=false; heard.textContent='Terdengar: '+last;
  };
  r.onerror=e=>{ if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)) micFail(); else if(e.error==='no-speech'){ heard.hidden=false; heard.textContent='Tidak terdengar suara. Coba lagi.'; } };
  r.onend=()=>{ rec=null; if(micBlocked || !app.contains(mic)) return; mic.classList.remove('on'); txt.textContent='Tekan lalu bicara';
    if(!answered && last){ heard.textContent='Terdengar: '+last+' · belum tepat, coba lagi'; const vb=app.querySelector('.card'); vb.classList.add('shake'); setTimeout(()=>vb.classList.remove('shake'),600); } };
  try{ r.start(); }catch(e){ rec=null; micFail(); }
}
function voiceFoot(){
  nextBtn.textContent='Tidak tahu, lihat jawaban';
  nextBtn.onclick=()=>{ stopRec(); if(!answered) check(false); };
}
function micFail(){
  rec=null; micBlocked=true;
  const mic=app.querySelector('#mic'); if(mic) mic.hidden=true;
  const f=app.querySelector('#tf'); if(f) f.hidden=false;
  showFoot('check');
  const inp=app.querySelector('#typed'); if(inp) setTimeout(()=>inp.focus(),50);
}

/* ---------- cek jawaban ---------- */
function check(ok,btn){
  answered=true; stopRec();
  const w=cur.w, d=CUR, mm=M(d.id);
  R.queue.shift();
  if(ok){
    R.streak++; R.best=Math.max(R.best,R.streak);
    if(!R.missed.has(w.id)){ R.firstTry++; mm[w.id]=(mm[w.id]||0)+1; }
    R.done++;
  } else {
    R.streak=0; R.missed.add(w.id); R.wrong.set(w.id,w); mm[w.id]=0;
    R.queue.push({w,type:cur.type});
  }
  saveM(d.id);
  if(btn){
    app.querySelectorAll('.opt').forEach(b=>{b.disabled=true; if(+b.dataset.id===w.id) b.classList.add('good');});
    if(!ok){ btn.classList.add('bad','shake'); }
  } else {
    const inp=app.querySelector('#typed'); if(inp){ inp.disabled=true; if(!ok) inp.classList.add('shake'); }
  }
  const bar=app.querySelector('.top .bar>i'); if(bar) bar.style.width=(R.done/R.total*100)+'%';
  const st=app.querySelector('.streak'); if(st) st.textContent=R.streak?R.streak+'🔥':'';
  if(S.voice && !['jp2id','listen'].includes(cur.type)) speak(w.kana);
  const ans = d.kind==='kana'
    ? `<span class="jp">${esc(w.kana)}</span> = ${esc(w.rom)}`
    : `<span class="jp">${esc(jpMain(w))}</span>${w.kanji?` (${esc(clean(w.kana))})`:''} · ${esc(w.rom)} = ${esc(w.arti)}`;
  verdict.innerHTML = ok
    ? `<div class="stamp">正解</div><div><b>Benar!</b><span>${ans}</span></div>`
    : `<div class="stamp">残念</div><div><b>Jawaban yang benar:</b><span>${ans}</span></div>`;
  showFoot(ok?'good':'bad');
}
function showFoot(state){
  foot.hidden=false; foot.className='foot'+(state==='good'?' good':state==='bad'?' bad':'');
  if(state==='check'){
    verdict.innerHTML=''; verdict.hidden=true; nextBtn.textContent='Periksa';
    nextBtn.onclick=()=>{ const inp=app.querySelector('#typed'); if(inp && inp.value.trim()) check(matchTyped(inp.value,cur.w)); else if(inp) inp.focus(); };
  } else {
    verdict.hidden=false; nextBtn.textContent='Lanjut';
    nextBtn.onclick=()=>ask(); setTimeout(()=>nextBtn.focus(),30);
  }
}
document.addEventListener('keydown',e=>{ if(R && !foot.hidden && answered && e.key==='Enter'){ e.preventDefault(); ask(); } });

/* ---------- hasil ---------- */
function result(){
  foot.hidden=true; VIEW='result';
  const d=CUR, acc=Math.round(R.firstTry/R.total*100), wrong=[...R.wrong.values()];
  const msg = acc===100?'Sempurna! すごい！':acc>=80?'Bagus sekali! よくできました':acc>=50?'Lumayan, ulangi yang salah ya':'Pelan-pelan saja, がんばって！';
  const unit = d.kind==='kana'?'huruf':'kata';
  app.innerHTML = `
    <div><div class="eyebrow">${esc(d.title)} · ronde selesai</div><h1>${msg}</h1></div>
    <div class="score">
      <div><b>${acc}%</b><span>Benar sekali jawab</span></div>
      <div><b>${R.total}</b><span>Soal</span></div>
      <div><b>${R.best}</b><span>Beruntun terbaik</span></div>
    </div>
    <div class="panel">
      <label class="lbl">PERLU DIULANG (${wrong.length})</label>
      ${wrong.length?`<ul class="review">${wrong.map(w=>`<li><div><span class="jp">${esc(jpMain(w))}</span>${w.kanji?`<div class="meta">${esc(clean(w.kana))}</div>`:''}${d.kind==='vocab'?`<div class="meta">${esc(w.rom)}</div>`:''}</div><div>${esc(d.kind==='kana'?w.rom:w.arti)}</div></li>`).join('')}</ul>`:`<p class="empty">Tidak ada. Semua dijawab benar pada percobaan pertama.</p>`}
    </div>
    ${wrong.length?`<button class="btn" id="again-wrong">Latih ${wrong.length} ${unit} yang salah</button>`:''}
    <button class="btn ${wrong.length?'ghost':''}" id="again">Ronde baru</button>
    <button class="btn ghost" id="home">Kembali ke ${d.kind==='kana'?'Huruf':'Beranda'}</button>`;
  const aw=app.querySelector('#again-wrong'); if(aw) aw.onclick=()=>startRound(wrong);
  app.querySelector('#again').onclick=()=>startRound();
  app.querySelector('#home').onclick=()=>go(d.kind==='kana'?'kana':'home');
  window.scrollTo(0,0);
}

try{speechSynthesis.getVoices()}catch(e){}
go('home');
</script>
</body></html>
