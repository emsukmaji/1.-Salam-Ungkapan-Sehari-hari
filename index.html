 いたしました。おへんじ を おまち して おります。","Baik. Kami tunggu jawabannya.",[["承知いたしました。お返事は不要でございます。","Baik. Tidak perlu dibalas."],["承知いたしました。では、契約は本日をもって終了ですね。","Baik. Kalau begitu, kontraknya berakhir per hari ini, ya."]]],["p","本日はありがとうございました。","ほんじつ は ありがとう ございました。","Terima kasih untuk hari ini."]]},{"t":"Pidato perpisahan untuk atasan","s":"Di acara perpisahan untuk atasan yang dimutasi ke kantor Osaka, kamu diminta memberi sambutan singkat.","p":"吉田さん","e":"👩‍💼","l":[["p","それでは、{N}さんから、送別のご挨拶をお願いいたします。","それ では、{N} さん から、そうべつ の ごあいさつ を おねがい いたします。","Selanjutnya, sambutan perpisahan dari {N}-san."],["u","ご紹介にあずかりました{N}です。僭越ながら、一言ご挨拶申し上げます。","ごしょうかい に あずかりました {N} です。せんえつ ながら、ひとこと ごあいさつ もうしあげます。","Saya {N}, yang baru saja diperkenalkan. Dengan segala kerendahan hati, izinkan saya menyampaikan sepatah kata.",[["ご紹介にあずかりました{N}です。本日は、心よりお悔やみ申し上げます。","Saya {N}, yang baru saja diperkenalkan. Hari ini saya turut berduka cita sedalam-dalamnya."],["えー、僕、こういうの苦手なんで、パスでいいっすか。","Eh, aku nggak jago beginian, boleh skip nggak?"]]],["n","Kamu memulai sambutan sambil menoleh ke arah Ogawa-buchō yang akan pindah tugas."],["u","小川部長には、入社以来、公私にわたり大変お世話になりました。","おがわ ぶちょう に は、にゅうしゃ いらい、こうし に わたり たいへん おせわ に なりました。","Sejak saya masuk perusahaan, Ogawa-buchō sangat banyak membantu saya, baik dalam urusan kerja maupun pribadi.",[["小川部長には、入社以来、大変お世話をしてまいりました。","Sejak masuk perusahaan, sayalah yang banyak mengurus Ogawa-buchō."],["小川部長には、入社以来、一度もお会いしたことがございません。","Sejak masuk perusahaan, saya belum pernah sekali pun bertemu Ogawa-buchō."]]],["n","Kamu menceritakan kenangan bersama beliau."],["u","周囲の心配をよそに、部長は入社間もない私に大きな仕事を任せてくださいました。","しゅうい の しんぱい を よそに、ぶちょう は にゅうしゃ まもない わたし に おおきな しごと を まかせて くださいました。","Tanpa menghiraukan kekhawatiran orang-orang, Bapak memercayakan pekerjaan besar kepada saya yang saat itu baru masuk.",[["周囲の心配をよそに、部長は私の仕事をすべて取り上げてくださいました。","Tanpa menghiraukan kekhawatiran orang, Bapak (dengan baik hati) mengambil semua pekerjaan saya."],["周囲の心配どおり、部長は大きな失敗をなさいました。","Sesuai kekhawatiran orang-orang, Bapak melakukan kesalahan besar."]]],["u","あの時のご恩を思うと、感謝せずにはいられません。","あの とき の ごおん を おもう と、かんしゃ せず に は いられません。","Mengingat kebaikan Bapak waktu itu, saya tidak bisa tidak berterima kasih.",[["あの時のご恩を思うと、怒らずにはいられません。","Mengingat kebaikan Bapak waktu itu, saya tidak bisa menahan marah."],["あの時のご恩は、もうすっかり忘れてしまいました。","Kebaikan Bapak waktu itu sudah saya lupakan sama sekali."]]],["n","Sambutanmu mendekati akhir."],["u","大阪へご赴任後も、ますますのご活躍とご健康をお祈り申し上げます。","おおさか へ ごふにん ご も、ますます の ごかつやく と ごけんこう を おいのり もうしあげます。","Setelah bertugas di Osaka pun, saya doakan Bapak makin sukses dan selalu sehat.",[["大阪へご赴任後も、ますますのご失敗をお祈り申し上げます。","Setelah bertugas di Osaka, saya doakan Bapak makin sering gagal."],["大阪へご赴任後も、ご冥福をお祈り申し上げます。","Setelah bertugas di Osaka, semoga arwah Bapak tenang di sisi-Nya."]]],["u","以上をもちまして、私の挨拶とさせていただきます。ありがとうございました。","いじょう を もちまして、わたし の あいさつ と させて いただきます。ありがとう ございました。","Demikian sambutan dari saya. Terima kasih.",[["以上をもちまして、開会の挨拶とさせていただきます。","Demikian sambutan pembukaan acara ini."],["以上をもちまして、部長の挨拶とさせていただきます。","Demikian sambutan dari Pak Kepala."]]],["p","{N}さん、心のこもったご挨拶、ありがとうございました。では、小川部長からも一言お願いいたします。","{N} さん、こころ の こもった ごあいさつ、ありがとう ございました。では、おがわ ぶちょう から も ひとこと おねがい いたします。","{N}-san, terima kasih atas sambutannya yang tulus. Selanjutnya, sepatah kata dari Ogawa-buchō."]]},{"t":"Diskusi isu sosial dengan kolega","s":"Saat makan siang, rekan kerja mengajakmu membahas berita tentang kekurangan tenaga kerja di Jepang.","p":"鈴木さん","e":"👩","l":[["p","ねえ、今朝のニュース見た？介護の人手不足、ますます深刻なんだって。","ねえ、けさ の にゅーす みた？かいご の ひとで ぶそく、ますます しんこく なん だって。","Eh, lihat berita tadi pagi? Katanya kekurangan tenaga perawat lansia makin parah."],["u","見ました。少子高齢化を考慮すれば、外国人材の受け入れは避けて通れないでしょうね。","みました。しょうし こうれいか を こうりょ すれば、がいこく じんざい の うけいれ は さけて とおれない でしょう ね。","Lihat. Kalau mempertimbangkan angka kelahiran rendah dan penuaan penduduk, menerima tenaga kerja asing memang tak terhindarkan, ya.",[["見ました。人手が余っているなんて、うらやましいですね。","Lihat. Kelebihan tenaga kerja, enak sekali ya."],["見ました。少子高齢化のおかげで、人手は増える一方ですね。","Lihat. Berkat penuaan penduduk, tenaga kerja terus bertambah ya."]]],["p","でも、受け入れ側の体制が乏しいって批判もあるよね。","でも、うけいれ がわ の たいせい が とぼしい って ひはん も ある よね。","Tapi ada juga kritik bahwa sistem di pihak penerima masih minim, kan."],["u","ええ。言葉の支援や住居の確保など、制度面での包括的な対策が必要だと思います。","ええ。ことば の しえん や じゅうきょ の かくほ など、せいど めん で の ほうかつてき な たいさく が ひつよう だ と おもいます。","Iya. Menurut saya perlu langkah menyeluruh dari sisi kebijakan, seperti dukungan bahasa dan penyediaan tempat tinggal.",[["ええ。体制が乏しいので、とても充実していると思います。","Iya. Karena sistemnya minim, menurut saya sudah sangat memadai."],["ええ。昨日の晩ご飯はカレーでした。","Iya. Makan malam saya kemarin kari."]]],["p","{N}さん自身は、日本に来て偏見を感じたことある？","{N} さん じしん は、にほん に きて へんけん を かんじた こと ある？","Kalau {N}-san sendiri, pernah merasakan prasangka sejak datang ke Jepang?"],["u","たまにありますが、露骨な差別はほとんどありません。むしろ親切な人のほうが多いですよ。","たま に あります が、ろこつ な さべつ は ほとんど ありません。むしろ しんせつ な ひと の ほう が おおい です よ。","Sesekali ada, tapi diskriminasi terang-terangan hampir tidak ada. Malah lebih banyak orang yang baik.",[["たまにありますが、露骨な差別ばかりです。むしろ親切な人のほうが多いですよ。","Sesekali ada, tapi isinya diskriminasi terang-terangan semua. Malah lebih banyak orang yang baik."],["はい、私は日本人に偏見を持ったことがあります。","Ya, saya pernah berprasangka terhadap orang Jepang."]]],["p","そっか、それならよかった。でも、地方に至っては外国人が一人もいない町もあるらしいよ。","そっか、それ なら よかった。でも、ちほう に いたって は がいこくじん が ひとり も いない まち も ある らしい よ。","Oh gitu, syukurlah. Tapi kalau di daerah, katanya bahkan ada kota yang tidak punya satu pun orang asing."],["u","そういう地域こそ、互いを知る機会を増やすことが大事ですね。","そう いう ちいき こそ、たがい を しる きかい を ふやす こと が だいじ です ね。","Justru di daerah seperti itulah penting memperbanyak kesempatan untuk saling mengenal.",[["そういう地域こそ、外国人が一番多いところですね。","Justru daerah seperti itulah yang paling banyak orang asingnya."],["そういう地域には、二度と行きたくないですね。","Daerah seperti itu, saya tidak mau ke sana lagi."]]],["p","ほんと、そうだね。悲観ばかりしてないで、私たちにできることから始めないとね。","ほんと、そう だ ね。ひかん ばかり して ないで、わたしたち に できる こと から はじめない と ね。","Benar juga. Jangan cuma pesimis, kita harus mulai dari yang bisa kita lakukan."],["u","そうですね。まずは地域の国際交流イベントに参加してみませんか。","そう です ね。まず は ちいき の こくさい こうりゅう いべんと に さんか して みません か。","Betul. Bagaimana kalau kita coba ikut acara pertukaran budaya di lingkungan sekitar dulu?",[["そうですね。まずは何もしないことから始めましょう。","Betul. Mari mulai dengan tidak melakukan apa-apa."],["そうですね。悲観こそ、私たちにできる唯一のことですから。","Betul. Pesimis adalah satu-satunya yang bisa kita lakukan."]]],["p","いいね！今度一緒に行こう。","いい ね！こんど いっしょ に いこう。","Boleh tuh! Lain kali kita pergi bareng."]]},{"t":"Rapat darurat insiden keamanan","s":"Ada dugaan akses tidak sah ke server. Direktur utama memanggilmu ke rapat darurat.","p":"社長","e":"👨‍🦳","l":[["p","不正アクセスがあったというのは本当かね。","ふせい あくせす が あった と いう の は ほんとう か ね。","Benarkah ada akses tidak sah?"],["u","はい。昨夜二時頃、外部から管理サーバーへの侵入が確認されました。","はい。さくや にじ ごろ、がいぶ から かんり さーばー へ の しんにゅう が かくにん されました。","Benar. Sekitar pukul dua tadi malam, terdeteksi penyusupan dari luar ke server manajemen.",[["いいえ、そんな噂は誰かの陰謀でございます。","Tidak, rumor itu konspirasi seseorang."],["はい。ですが、私は昨夜寝ておりましたので、存じません。","Ya. Tapi tadi malam saya tidur, jadi saya tidak tahu."]]],["p","被害の範囲は？","ひがい の はんい は？","Seberapa luas kerusakannya?"],["u","現時点では、顧客情報の流出は確認されておりません。ただ、調査はまだ継続中です。","げんじてん で は、こきゃく じょうほう の りゅうしゅつ は かくにん されて おりません。ただ、ちょうさ は まだ けいぞく ちゅう です。","Sampai saat ini, kebocoran data pelanggan belum terdeteksi. Namun, investigasi masih berlanjut.",[["現時点では、顧客情報はすべて流出しておりますので、ご安心ください。","Saat ini seluruh data pelanggan sudah bocor, jadi Bapak tenang saja."],["被害の範囲は、調べるのが煩雑なので見ておりません。","Luas kerusakannya merepotkan untuk diperiksa, jadi tidak saya lihat."]]],["p","原因は分かっているのか。","げんいん は わかって いる の か。","Penyebabnya sudah diketahui?"],["u","更新を怠っていたVPN機器の脆弱性を突かれたものと推測されます。","こうしん を おこたって いた ぶいぴーえぬ きき の ぜいじゃくせい を つかれた もの と すいそく されます。","Diduga celah keamanan pada perangkat VPN yang lalai diperbarui telah dimanfaatkan.",[["更新を徹底していたおかげで、侵入されたものと推測されます。","Diduga berkat pembaruan yang tuntas, kita jadi disusupi."],["原因は全く分かりませんし、調べる予定もございません。","Penyebabnya sama sekali tidak diketahui, dan tidak ada rencana untuk menyelidikinya."]]],["p","対応はどうなっている。","たいおう は どう なって いる。","Bagaimana penanganannya?"],["u","該当機器を遮断し、被害の拡大を阻止すべく、全社員のパスワードを強制変更いたしました。","がいとう きき を しゃだん し、ひがい の かくだい を そし すべく、ぜん しゃいん の ぱすわーど を きょうせい へんこう いたしました。","Perangkat terkait sudah diputus, dan untuk mencegah kerusakan meluas, kata sandi seluruh karyawan sudah kami ganti paksa.",[["該当機器はそのままにして、様子を見ております。","Perangkat terkait kami biarkan saja sambil memantau keadaan."],["被害の拡大を促すべく、パスワードを全員同じにいたしました。","Untuk mendorong kerusakan meluas, kata sandi semua orang kami samakan."]]],["p","公表はどうすべきだと思う。","こうひょう は どう すべき だ と おもう。","Menurutmu, bagaimana sebaiknya soal pengumuman ke publik?"],["u","隠蔽は信用を著しく損ないます。事実関係を確認したうえで、速やかに公表すべきかと存じます。","いんぺい は しんよう を いちじるしく そこないます。じじつ かんけい を かくにん した うえ で、すみやか に こうひょう すべき か と ぞんじます。","Menutup-nutupi akan sangat merusak kepercayaan. Saya rasa setelah fakta dikonfirmasi, sebaiknya segera diumumkan.",[["隠蔽は信用を著しく損ないます。ですので、絶対に公表せずに隠しましょう。","Menutup-nutupi sangat merusak kepercayaan. Karena itu, mari kita sembunyikan dan jangan diumumkan."],["公表すると面倒なので、なかったことにいたしましょう。","Kalau diumumkan repot, jadi anggap saja tidak pernah terjadi."]]],["p","分かった。今日中に記者会見の準備を進めてくれ。","わかった。きょう じゅう に きしゃ かいけん の じゅんび を すすめて くれ。","Baik. Siapkan konferensi pers hari ini juga."],["u","かしこまりました。広報部と連携し、直ちに取りかかります。","かしこまりました。こうほうぶ と れんけい し、ただちに とりかかります。","Baik, Pak. Saya akan berkoordinasi dengan divisi humas dan segera mengerjakannya.",[["かしこまりました。では、来月あたりから取りかかります。","Baik. Kalau begitu, saya mulai sekitar bulan depan."],["かしこまりました。記者会見は面倒なので、欠席いたします。","Baik. Konferensi pers merepotkan, jadi saya tidak akan hadir."]]],["p","頼んだぞ。","たのんだ ぞ。","Saya andalkan kamu."]]},{"t":"Menegur bawahan dengan halus","s":"Seorang junior di timmu sering melewatkan prosedur pengecekan. Kamu mengajaknya bicara di ruang rapat kecil.","p":"小林さん","e":"👦","l":[["u","小林さん、少し時間いいですか。最近の作業について、話しておきたいことがあって。","こばやし さん、すこし じかん いい です か。さいきん の さぎょう に ついて、はなして おきたい こと が あって。","Kobayashi-san, ada waktu sebentar? Ada yang ingin saya bicarakan soal pekerjaanmu belakangan ini.",[["小林さん、今すぐ会議室に来なさい。お説教です。","Kobayashi-san, ke ruang rapat sekarang juga. Kamu akan saya ceramahi."],["小林さん、少し時間いいですか。今日の天気について話したくて。","Kobayashi-san, ada waktu sebentar? Saya ingin membahas cuaca hari ini."]]],["p","はい……何か問題がありましたか。","はい……なに か もんだい が ありました か。","Iya... Apakah ada masalah?"],["u","責めるつもりはないんですが、変更前のチェックリストが抜けていることが何度かありました。","せめる つもり は ない ん です が、へんこう まえ の ちぇっくりすと が ぬけて いる こと が なんど か ありました。","Saya tidak bermaksud menyalahkan, tapi beberapa kali checklist sebelum perubahan terlewat.",[["責めるつもりですが、チェックリストはいつも完璧でしたね。","Saya memang mau menyalahkanmu, tapi checklist-mu selalu sempurna, ya."],["責めるつもりはないんですが、小林さんは本当に怠慢ですね。","Saya tidak bermaksud menyalahkan, tapi Kobayashi-san benar-benar lalai, ya."]]],["p","すみません……。急ぎの案件が多くて、つい省略してしまいました。","すみません……。いそぎ の あんけん が おおくて、つい しょうりゃく して しまいました。","Maaf... Banyak kerjaan mendesak, jadi tanpa sadar saya lewati."],["u","忙しいのは分かります。でも、手順を飛ばすと大きな障害につながりかねないんです。","いそがしい の は わかります。でも、てじゅん を とばす と おおきな しょうがい に つながり かねない ん です。","Saya mengerti kamu sibuk. Tapi melewatkan prosedur bisa berujung pada gangguan besar.",[["忙しいのは分かります。だから、手順はどんどん飛ばしてください。","Saya mengerti kamu sibuk. Jadi, lewati saja prosedurnya sebanyak mungkin."],["忙しいなんて、ただの言い訳ですよね。","Sibuk itu cuma alasan, kan?"]]],["p","はい……気をつけます。","はい……き を つけます。","Baik... Saya akan lebih hati-hati."],["u","業務量が過剰なら、遠慮なく相談してください。仕事の割り振りを見直しますから。","ぎょうむりょう が かじょう なら、えんりょ なく そうだん して ください。しごと の わりふり を みなおします から。","Kalau beban kerjamu berlebihan, jangan sungkan bicara. Pembagian tugasnya akan saya tinjau ulang.",[["業務量が過剰でも、絶対に相談しないでください。","Meskipun beban kerjamu berlebihan, jangan pernah minta saran ke saya."],["業務量が過剰なら、もっと仕事を増やしましょう。","Kalau beban kerjamu berlebihan, mari kita tambah lagi pekerjaannya."]]],["p","ありがとうございます。正直、一人で抱え込んでいました。","ありがとう ございます。しょうじき、ひとり で かかえこんで いました。","Terima kasih. Jujur, selama ini saya memendamnya sendirian."],["u","話してくれてよかったです。小林さんの丁寧な仕事ぶりには、いつも期待していますよ。","はなして くれて よかった です。こばやし さん の ていねい な しごとぶり に は、いつも きたい して います よ。","Syukurlah kamu mau cerita. Saya selalu berharap banyak pada cara kerjamu yang teliti.",[["話してくれてよかったです。でも、小林さんには何も期待していません。","Syukurlah kamu mau cerita. Tapi saya tidak berharap apa-apa darimu."],["話してくれなくてよかったです。","Untung kamu tidak cerita."]]],["p","はい、これからは徹底します！","はい、これ から は てってい します！","Baik, mulai sekarang akan saya lakukan dengan tuntas!"]]},{"t":"Upacara penandatanganan kemitraan","s":"Di acara penandatanganan kemitraan dengan perusahaan Singapura, kamu menyambut direktur mitra dan memandu acara.","p":"林社長","e":"👵","l":[["p","本日はお招きいただき、ありがとうございます。","ほんじつ は おまねき いただき、ありがとう ございます。","Terima kasih atas undangannya hari ini."],["u","遠路はるばるお越しいただき、誠にありがとうございます。社員一同、心より歓迎いたします。","えんろ はるばる おこし いただき、まこと に ありがとう ございます。しゃいん いちどう、こころ より かんげい いたします。","Terima kasih banyak telah datang dari jauh. Kami seluruh karyawan menyambut Ibu dengan sepenuh hati.",[["遠路はるばるお越しいただき、誠に申し訳ございません。お帰りはあちらです。","Mohon maaf sekali Ibu sudah datang jauh-jauh. Pintu keluar di sebelah sana."],["遠路はるばる、お疲れちゃん！","Jauh-jauh datang, capek ya, say!"]]],["p","素晴らしいオフィスですね。御社の躍進ぶりがうかがえます。","すばらしい おふぃす です ね。おんしゃ の やくしん ぶり が うかがえます。","Kantornya luar biasa. Terlihat betapa pesatnya kemajuan perusahaan Anda."],["u","恐れ入ります。これも皆様のご支援のたまものでございます。","おそれいります。これ も みなさま の ごしえん の たまもの で ございます。","Terima kasih atas pujiannya. Ini semua berkat dukungan Bapak-Ibu sekalian.",[["恐れ入ります。これも皆様のご支援をよそに、弊社だけで成し遂げたものでございます。","Terima kasih. Ini kami capai sendiri tanpa memedulikan dukungan Bapak-Ibu."],["ええ、まあ、御社よりはずっと立派ですね。","Ya, yah, jauh lebih bagus daripada kantor Ibu."]]],["p","今回の提携には、大きな期待を寄せております。","こんかい の ていけい に は、おおきな きたい を よせて おります。","Kami menaruh harapan besar pada kemitraan ini."],["u","弊社といたしましても、両社の技術を駆使し、アジア市場での新たな可能性を切り開いてまいる所存です。","へいしゃ と いたしまして も、りょうしゃ の ぎじゅつ を くし し、あじあ しじょう で の あらた な かのうせい を きりひらいて まいる しょぞん です。","Kami pun bertekad memanfaatkan sepenuhnya teknologi kedua perusahaan untuk membuka peluang baru di pasar Asia.",[["弊社といたしましては、提携には特に期待しておりません。","Kami sendiri tidak terlalu berharap pada kemitraan ini."],["弊社といたしましても、御社の技術を巧妙に盗んでまいる所存です。","Kami pun bertekad mencuri teknologi perusahaan Ibu dengan lihai."]]],["p","ところで、調印式は何時からでしょうか。","ところ で、ちょういんしき は なんじ から でしょう か。","Ngomong-ngomong, upacara penandatanganannya mulai jam berapa?"],["u","午後二時からでございます。それまで、控室にてお休みいただけますでしょうか。","ごご にじ から で ございます。それ まで、ひかえしつ にて おやすみ いただけます でしょう か。","Mulai pukul dua siang. Sambil menunggu, silakan beristirahat di ruang tunggu.",[["午後二時からでございます。それまで、廊下に立ってお待ちください。","Mulai pukul dua. Sambil menunggu, silakan berdiri di lorong."],["調印式は昨日終わりましたので、どうぞお帰りください。","Upacaranya sudah selesai kemarin, jadi silakan pulang."]]],["n","Penandatanganan selesai. Kamu menutup acara."],["u","以上をもちまして、調印式を終了いたします。皆様、盛大な拍手をお願いいたします。","いじょう を もちまして、ちょういんしき を しゅうりょう いたします。みなさま、せいだい な はくしゅ を おねがい いたします。","Dengan ini upacara penandatanganan selesai. Hadirin sekalian, mohon tepuk tangan yang meriah.",[["以上をもちまして、調印式を開始いたします。皆様、ご静粛にお願いいたします。","Dengan ini upacara penandatanganan dimulai. Hadirin, mohon tenang."],["以上をもちまして、提携を解消いたします。皆様、盛大な拍手をお願いいたします。","Dengan ini kemitraan dibatalkan. Hadirin, mohon tepuk tangan yang meriah."]]],["p","素晴らしい式をありがとうございました。今後ともよろしくお願いいたします。","すばらしい しき を ありがとう ございました。こんご とも よろしく おねがい いたします。","Terima kasih atas upacara yang luar biasa. Mohon kerja samanya ke depan."]]},{"t":"Menolak permintaan atasan secara halus","s":"Atasan memintamu membantu migrasi server di akhir pekan, padahal kamu ada acara keluarga.","p":"石井課長","e":"👨","l":[["p","悪いんだけど、今週末のサーバー移行、手伝ってもらえないかな。","わるい ん だ けど、こんしゅうまつ の さーばー いこう、てつだって もらえない か な。","Maaf nih, bisa bantu migrasi server akhir pekan ini?"],["u","お声がけいただきありがとうございます。ただ、あいにく週末は家族の行事がございまして……。","おこえがけ いただき ありがとう ございます。ただ、あいにく しゅうまつ は かぞく の ぎょうじ が ございまして……。","Terima kasih sudah mengajak saya. Hanya saja, sayangnya akhir pekan ini ada acara keluarga...",[["嫌です。週末は働かない主義なので。","Tidak mau. Prinsip saya tidak kerja di akhir pekan."],["お声がけいただきありがとうございます。週末は暇なので、残念ながらお手伝いできません。","Terima kasih sudah mengajak. Akhir pekan saya senggang, jadi sayangnya tidak bisa membantu."]]],["p","そうか……。どうしても人が足りなくてね。","そう か……。どうしても ひと が たりなくて ね。","Begitu ya... Orangnya benar-benar kurang, sih."],["u","お力になれず心苦しいのですが、金曜の夜まででしたら、事前準備を担当できます。","おちから に なれず こころぐるしい の です が、きんよう の よる まで でしたら、じぜん じゅんび を たんとう できます。","Saya merasa tidak enak tidak bisa membantu, tapi kalau sampai Jumat malam, saya bisa menangani persiapannya.",[["お力になれず心苦しいので、移行作業は中止しましょう。","Saya tidak enak tidak bisa membantu, jadi batalkan saja migrasinya."],["人が足りないのは、課長の戦略が陳腐だからではないでしょうか。","Bukankah kurang orang itu karena strategi Bapak sudah basi?"]]],["p","それは助かる。手順書の作成もお願いできる？","それ は たすかる。てじゅんしょ の さくせい も おねがい できる？","Itu sangat membantu. Bisa sekalian buatkan dokumen prosedurnya?"],["u","はい、承知いたしました。当日、誰が見ても迷わないよう、細かく記載しておきます。","はい、しょうち いたしました。とうじつ、だれ が みて も まよわない よう、こまかく きさい して おきます。","Baik, siap. Akan saya tulis dengan rinci supaya pada hari-H siapa pun yang membaca tidak bingung.",[["はい、承知いたしました。当日、誰も読めないよう、紛らわしく書いておきます。","Baik. Akan saya tulis dengan membingungkan supaya pada hari-H tidak ada yang bisa membacanya."],["手順書なら、当日の朝に適当に書けば十分ですよね。","Dokumen prosedur sih cukup ditulis asal-asalan pagi harinya, kan?"]]],["p","ありがとう。週末は何かあったら電話してもいいかな。","ありがとう。しゅうまつ は なに か あったら でんわ して も いい か な。","Makasih. Kalau ada apa-apa di akhir pekan, boleh saya telepon?"],["u","はい、緊急の場合はいつでもご連絡ください。可能な範囲で対応いたします。","はい、きんきゅう の ばあい は いつ で も ごれんらく ください。かのう な はんい で たいおう いたします。","Ya, kalau darurat silakan hubungi kapan saja. Akan saya bantu sebisanya.",[["はい、緊急の場合でも、絶対に電話には出ません。","Ya, tapi meski darurat, saya tidak akan mengangkat telepon."],["はい、緊急でない場合だけご連絡ください。","Ya, hubungi saya hanya kalau tidak darurat."]]],["p","本当に助かるよ。家族との時間、楽しんできてね。","ほんとう に たすかる よ。かぞく と の じかん、たのしんで きて ね。","Sangat membantu. Nikmati waktumu bersama keluarga, ya."]]}]};
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const clean = s => s.replace(/^～/,'');
const jpMain = w => clean(w.kanji || w.kana);
const pct = (a,b) => b? (a/b*100).toFixed(1) : 0;
function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(clean(text)); u.lang='ja-JP'; u.rate=.85;
    const v=speechSynthesis.getVoices().find(v=>/ja/i.test(v.lang)); if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

function deckCard(d){
  const m=mastered(d), n=d.items.length, dd=dueItems(d).length;
  return `<button type="button" class="deck" data-deck="${d.id}" style="--c:var(--${d.color})">
    <span class="badge ${/^N\d$/.test(d.short)?'':'jp'}">${esc(d.short)}</span>
    <span class="meta"><b>${esc(d.title)}</b><span class="num">${m} / ${n} dikuasai${dd?` · <span class="due">${dd} ulasan</span>`:''}</span><span class="bar"><i style="width:${pct(m,n)}%"></i></span></span>
    <span class="chev" aria-hidden="true">›</span></button>`;
}
function home(){
  const vocab=DECKS.filter(d=>d.kind==='vocab'), kana=DECKS.filter(d=>d.kind==='kana');

let R=null, cur=null, answered=false;
function poolFor(){
  const d=CUR;
  if(S.sec==='all') return d.items;
  if(S.sec==='weak'){const p=d.items.filter(w=>lvOf(d,w)<3); return p.length?p:d.items;}
  if(S.sec==='new'){const p=d.items.filter(w=>!SRS(d.id)[w.id]); return p.length?p:d.items;}
  return d.items.filter(w=>w.sec===+S.sec);
}
/* pilih petunjuk situasi secara acak, tidak sama dengan yang terakhir dilihat */
let SITLAST=null;
function sitFor(d,w){
  const s=w.sits; if(!s||!s.length) return '';
  if(s.length===1) return s[0];
  if(!SITLAST) SITLAST=store.get('sitlast',{});
  const key=d.id+':'+w.id, last=SITLAST[key];
  let k; do{ k=Math.random()*s.length|0; }while(k===last);
  SITLAST[key]=k; store.set('sitlast',SITLAST);
  return s[k];
}
function pickType(w,d=CUR,review=false){
  const modes = review ? (d.kind==='kana'?['k2r','r2k','listen']:['id2jp','jp2id','sit']) : modesFor(d).map(m=>m[0]).filter(m=>m!=='mix');
  let t = (review || S.mode==='mix') ? modes[Math.random()*modes.length|0] : S.mode;
  if(t==='sit' && !w.sit) t='id2jp';
  return t;
}
function startRound(){
  const d=CUR, pool=poolFor();
  let picked;
  {
    const sorted=shuffle(pool).sort((a,b)=>lvOf(d,a)-lvOf(d,b));
    picked=[];
    const first=shuffle(sorted.slice(0,Math.min(S.len,pool.length)));
    picked.push(...first);
    while(picked.length<S.len){
      const batch=shuffle(pool);
      if(batch[0].id===picked[picked.length-1].id) batch.push(batch.shift());
      picked.push(...batch);
    }
    picked=picked.slice(0,S.len);
  }
  R=newRound(picked.map(w=>({w,d,type:pickType(w,d)})), false);
  if(R.queue.some(q=>q.type==='voice')) warmMic();
  VIEW='game'; setNav(false); ask();
}
function newRound(queue,review){ return {queue, review, total:queue.length, done:0, firstTry:0, streak:0, best:0, wrong:new Map(), missed:new Set()}; }
function startReview(only){
  stopRec(); const t=today(); let items=[];
  for(const d of (only?[only]:DECKS)) for(const w of d.items) if(isDue(d,w,t)) items.push({w,d,due:SRS(d.id)[w.id].due});
  if(!items.length) return go('home');
  items.sort((a,b)=>a.due-b.due);
  items=shuffle(items.slice(0,REVIEW_MAX));
  S=Object.assign({romaji:true,voice:true}, only?settingsFor(only):store.get('set:review',{}));
  R=newRound(items.map(x=>({w:x.w,d:x.d,type:pickType(x.w,x.d,true)})), true);
  R.only=only||null; CUR=items[0].d;
  VIEW='game'; setNav(false); ask();
}
function distractors(w,n,key){
  const d=CUR, kana=d.kind==='kana';
  const ok = x => x.id!==w.id && !(kana && x.rom===w.rom);
  const same=d.items.filter(x=>x.sec===w.sec && ok(x)), any=d.items.filter(ok);
  const out=[], seen=new Set([key(w)]);
  for(const x of shuffle(same).concat(shuffle(any))){ const k=key(x); if(seen.has(k)) continue; seen.add(k); out.push(x); if(out.length===n) break; }
  return out;
}

/* ---------- pencocokan jawaban ---------- */
const ALT = {
  'おはようございます':['お早うございます'],'こんにちは':['今日は','こんにちわ'],'こんばんは':['今晩は','こんばんわ'],
  'さようなら':['左様なら','さよなら'],'おやすみなさい':['お休みなさい'],'ありがとうございます':['有難うございます','有り難うございます'],
  'どういたしまして':['どう致しまして'],'すみません':['済みません','すいません'],'ごめんなさい':['御免なさい'],
  'はじめまして':['初めまして','始めまして'],'よろしくおねがいします':['宜しくお願いします','よろしくお願いします','よろしくお願い致します','宜しくお願い致します'],
  'いただきます':['頂きます','戴きます'],'ごちそうさまでした':['ご馳走様でした','御馳走様でした'],'いってきます':['行ってきます','行って来ます'],
  'いってらっしゃい':['行ってらっしゃい'],'ただいま':['ただ今','只今'],'おかえりなさい':['お帰りなさい'],'おねがいします':['お願いします','お願い致します'],'ええ':['えー','ええー'],'いいえ':['いえ','いーえ'],'そうです':['そうですね','そうだ'],'おげんきですか':['お元気ですか','元気ですか'],'しつれいします':['失礼します','失礼いたします']
};
function norm(s){
  return s.toLowerCase().normalize('NFKC').replace(/[\s'’\-～~.]/g,'')
    .replace(/ou/g,'o').replace(/oo/g,'o').replace(/uu/g,'u').replace(/aa/g,'a').replace(/ii/g,'i').replace(/ee/g,'e').replace(/ei/g,'e');
}
function toHira(s){return s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60))}
let HOMO=null; // kanji → set kana, dari semua kosakata
function homoMap(){ if(HOMO) return HOMO; HOMO={}; DECKS.forEach(d=>d.items.forEach(x=>{ if(x.kanji){ const k=clean(x.kanji); (HOMO[k]=HOMO[k]||new Set()).add(toHira(clean(x.kana))); } })); return HOMO; }
function matchTyped(v,w){
  let t=v.trim().replace(/[。、！!？?．，,\s　]/g,'');
  if(!t) return false;
  if(matchOne(t,w)) return true;
  const cut=t.replace(/(です|でした|だ|ですね|ですよ|ね|よ)$/,''); if(cut!==t && cut && matchOne(cut,w)) return true;
  return false;
}
function matchOne(t,w){
  const hm=homoMap()[t]; if(hm && hm.has(toHira(clean(w.kana)))) return true;
  if((ALT[w.kana]||[]).includes(t)) return true;
  if(/[぀-ヿ一-龯]/.test(t)){
    const a=toHira(t), b=toHira(clean(w.kana));
    return a===b || t===clean(w.kanji) || a.replace(/ー/g,'')===b.replace(/ー/g,'');
  }
  return norm(t)===norm(w.rom);
}

/* ---------- mikrofon ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const IOS_APP = !!(window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) && /iPhone|iPad|iPod/.test(navigator.userAgent);
let rec=null, micBlocked=false;
function stopRec(){ if(rec){ try{rec.abort()}catch(e){} rec=null; } }
function listen(w, retry=0){
  const mic=app.querySelector('#mic'), txt=app.querySelector('#micTxt'), heard=app.querySelector('#heard');
  if(rec){ try{rec.stop()}catch(e){} return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  let r; try{ r=new SR(); }catch(e){ return micFail(); }
  rec=r; r.lang='ja-JP'; r.interimResults=true; r.maxAlternatives=5; r.continuous=true;
  mic.classList.add('on'); txt.textContent='Menyiapkan mic…';
  const say = s => { heard.hidden=false; heard.textContent=s; };
  let last='', gotAudio=false, err=null; const t0=Date.now();
  const timer=setTimeout(()=>{ try{r.stop()}catch(_){} }, 8000);
  r.onaudiostart=()=>{ gotAudio=true; txt.textContent='Mendengarkan… bicara sekarang'; };
  r.onspeechstart=()=>{ txt.textContent='Suara terdeteksi…'; };
  r.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      const res=e.results[i];
      for(let k=0;k<res.length;k++){
        if(!answered && matchTyped(res[k].transcript,w)){ say('Terdengar: '+res[k].transcript); clearTimeout(timer); try{r.stop()}catch(_){} check(true); return; }
      }
      last=res[0].transcript;
    }
    say('Terdengar: '+last);
  };
  r.onerror=e=>{ err=e.error;
    if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)) { clearTimeout(timer); micFail(e.error); }
    else if(e.error==='no-speech') say('Tidak terdengar suara. Tekan tombol lalu langsung bicara.');
    else if(e.error==='network') say('Pengenal suara butuh koneksi internet. Cek sinyal lalu coba lagi.');
    else if(e.error!=='aborted') say('Mic error ('+e.error+'). Coba tekan lagi.'); };
  r.onend=()=>{ clearTimeout(timer); rec=null; if(micBlocked || !app.contains(mic) || answered) return;
    mic.classList.remove('on'); txt.textContent='Tekan lalu bicara';
    // iOS (terutama mode Web App) kadang langsung berhenti setelah izin mic diminta: coba sekali lagi otomatis
    if(!last && !err && retry<1 && Date.now()-t0<2500){ say('Menyalakan ulang mic…'); setTimeout(()=>listen(w,retry+1),300); return; }
    if(last){ say('Terdengar: '+last+' · belum tepat, coba lagi'); const vb=app.querySelector('.card'); vb.classList.add('shake'); setTimeout(()=>vb.classList.remove('shake'),600); }
    else if(!err) say(gotAudio ? 'Tidak ada kata yang tertangkap. Tekan lalu bicara lebih jelas.' : 'Mic berhenti sebelum sempat mendengar. Tekan tombolnya lagi.'); };
  try{ r.start(); }catch(e){ rec=null; clearTimeout(timer); micFail(); }
}
/* minta izin mic sekali di awal ronde (iOS Web App sering meminta ulang tiap kali) */
let micWarm=false;
function warmMic(){
  if(micWarm || !SR || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  micWarm=true;
  navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{ setTimeout(()=>s.getTracks().forEach(t=>t.stop()),300); }).catch(()=>{ micWarm=false; });
}

function voiceFoot(){
  nextBtn.textContent='Tidak tahu, lihat jawaban';
  nextBtn.onclick=()=>{ stopRec(); if(!answered) check(false); };
}
function micFail(code){
  rec=null; micBlocked=true;
  const mic=app.querySelector('#mic'); if(mic) mic.hidden=true;
  const note=app.querySelector('#vnote');
  if(note){ const box=document.createElement('div'); box.className='micnote'; box.id='micnote'; note.parentNode.parentNode.insertBefore(box, note.parentNode); box.appendChild(note); }
  if(note){ note.innerHTML = IOS_APP && code!=='service-not-allowed' ? 'Izin mikrofon belum diberikan. Di mode <b>Web App</b>, iPhone bisa menanyakan izin mic lagi: pilih <b>Allow</b>, lalu tekan tombol di bawah. Kalau tetap gagal, tutup aplikasinya (geser ke atas dari app switcher) lalu buka lagi.<br><button type="button" class="btn ghost sm" id="micretry" style="margin-top:8px">🎤 Coba mikrofon lagi</button>'
    : code==='unsupported' ? 'Browser ini tidak punya pengenal suara. Buka game di Safari (iPhone) atau Chrome (Android/laptop), atau pilih jenis soal lain.<br><button type="button" class="btn ghost sm" id="micretry" style="margin-top:8px">🎤 Coba lagi</button>'
    : (code==='service-not-allowed'
      ? 'Pengenal suara tidak aktif di perangkat ini. Di iPhone: <b>Pengaturan → Siri & Pencarian</b> dan <b>Papan Ketik → Aktifkan Dikte</b> harus menyala.'
      : 'Mikrofon tidak diizinkan untuk halaman ini. Di Safari: ketuk <b>aA</b> di bilah alamat → <b>Pengaturan Situs Web</b> → <b>Mikrofon → Izinkan</b>, lalu tekan tombol di bawah. Di aplikasi Claude, mic memang selalu diblokir — buka link GitHub di Safari.')
      + '<br><button type="button" class="btn ghost sm" id="micretry" style="margin-top:8px">🎤 Coba mikrofon lagi</button>';
    note.querySelector('#micretry').onclick=()=>{ micBlocked=false; ask(); }; }
  voiceFoot();
}

/* ---------- cek jawaban ---------- */
function check(ok,btn){
  answered=true; stopRec();
  const w=cur.w, d=cur.d, key=d.id+':'+w.id;
  R.queue.shift();
  if(ok){
    R.streak++; R.best=Math.max(R.best,R.streak);
    if(!R.missed.has(key)){ R.firstTry++; grade(d,w,true); }
    R.done++;
  } else {
    R.streak=0;
    if(!R.missed.has(key)) grade(d,w,false);
    R.missed.add(key); R.wrong.set(key,{w,d});
    R.queue.push({w,d,type:cur.type});
  }
  if(btn){
    app.querySelectorAll('.opt').forEach(b=>{b.disabled=true; if(+b.dataset.id===w.id) b.classList.add('good');});
    if(!ok){ btn.classList.add('bad','shake'); }
  } else {
    const inp=app.querySelector('#typed'); if(inp){ inp.disabled=true; if(!ok) inp.classList.add('shake'); }
  }
  const bar=app.querySelector('.top .bar>i'); if(bar) bar.style.width=(R.done/R.total*100)+'%';
  const st=app.querySelector('.streak'); if(st) st.textContent=R.streak?R.streak+'🔥':'';
  if(S.voice && !['jp2id','listen'].includes(cur.type)) speak(w.kana);
  const ans = d.kind==='kana'
    ? `<span class="jp">${esc(w.kana)}</span> = ${esc(w.rom)}`
    : `<span class="jp">${esc(jpMain(w))}</span>${w.kanji?` (${esc(clean(w.kana))})`:''} · ${esc(w.rom)} = ${esc(w.arti)}`;
  verdict.innerHTML = ok
    ? `<div class="stamp">正解</div><div><b>Benar!</b><span>${ans}</span></div>`
    : `<div class="stamp">残念</div><div><b>Jawaban yang benar:</b><span>${ans}</span></div>`;
  showFoot(ok?'good':'bad');
}
function showFoot(state){
  foot.hidden=false; foot.className='foot'+(state==='good'?' good':state==='bad'?' bad':'');
  if(state==='check'){
    verdict.innerHTML=''; verdict.hidden=true; nextBtn.textContent='Periksa';
    nextBtn.onclick=()=>{ const inp=app.querySelector('#typed'); if(inp && inp.value.trim()) check(matchTyped(inp.value,cur.w)); else if(inp) inp.focus(); };
  } else {
    verdict.hidden=false; nextBtn.textContent='Lanjut';
    nextBtn.onclick=()=>ask(); setTimeout(()=>nextBtn.focus(),30);
  }
}
document.addEventListener('keydown',e=>{ if(R && !foot.hidden && answered && e.key==='Enter'){ e.preventDefault(); ask(); } });

/* ---------- hasil ---------- */
function result(){
  foot.hidden=true; VIEW='result';
  const rv=R.review, base=rv?(R.only||null):CUR, acc=Math.round(R.firstTry/R.total*100), wrong=[...R.wrong.values()];
  const msg = acc===100?'Sempurna! すごい！':acc>=80?'Bagus sekali! よくできました':acc>=50?'Lumayan, ulangi yang salah ya':'Pelan-pelan saja, がんばって！';
  const left = R.only ? dueItems(R.only).length : dueAll();
  const backKana = base && base.kind==='kana';
  app.innerHTML = `
    <div><div class="eyebrow">${rv?'Ulasan':esc(base.title)} · selesai</div><h1>${msg}</h1></div>
    <div class="score">
      <div><b>${acc}%</b><span>Benar sekali jawab</span></div>
      <div><b>${R.total}</b><span>Soal</span></div>
      <div><b>${left}</b><span>Ulasan tersisa hari ini</span></div>
    </div>
    <p class="sub">Yang benar dijadwalkan muncul lagi beberapa hari lagi. Yang salah dijadwalkan ulang besok.</p>
    <div class="panel">
      <label class="lbl">PERLU DIULANG (${wrong.length})</label>
      ${wrong.length?`<ul class="review">${wrong.map(({w,d})=>`<li><div><span class="jp">${esc(jpMain(w))}</span>${w.kanji?`<div class="meta">${esc(clean(w.kana))}</div>`:''}${d.kind==='vocab'?`<div class="meta">${esc(w.rom)}</div>`:''}</div><div>${esc(d.kind==='kana'?w.rom:w.arti)}${rv?`<div class="meta">${esc(d.title)}</div>`:''}</div></li>`).join('')}</ul>`:`<p class="empty">Tidak ada. Semua dijawab benar pada percobaan pertama.</p>`}
    </div>
    ${wrong.length?`<button class="btn" id="again-wrong">Latih lagi ${wrong.length} yang salah</button>`:''}
    ${rv && left?`<button class="btn ${wrong.length?'ghost':''}" id="more">Lanjut ulasan (${left})</button>`:''}
    ${!rv?`<button class="btn ${wrong.length?'ghost':''}" id="again">Ronde baru</button>`:''}
    <button class="btn ghost" id="home">Kembali ke ${backKana?'Huruf':'Beranda'}</button>`;
  const prev=R;
  const aw=app.querySelector('#again-wrong'); if(aw) aw.onclick=()=>{ R=newRound(shuffle(wrong).map(x=>({w:x.w,d:x.d,type:pickType(x.w,x.d,prev.review)})), false); R.only=prev.only; VIEW='game'; setNav(false); ask(); };
  const mo=app.querySelector('#more'); if(mo) mo.onclick=()=>startReview(prev.only||undefined);
  const ag=app.querySelector('#again'); if(ag) ag.onclick=()=>startRound();
  app.querySelector('#home').onclick=()=>go(backKana?'kana':'home');
  window.scrollTo(0,0);
}


/* ---------- simulasi JLPT N5–N1 ---------- */
const DAKU={'か':'が','き':'ぎ','く':'ぐ','け':'げ','こ':'ご','さ':'ざ','し':'じ','す':'ず','せ':'ぜ','そ':'ぞ','た':'だ','ち':'ぢ','つ':'づ','て':'で','と':'ど','は':'ば','ひ':'び','ふ':'ぶ','へ':'べ','ほ':'ぼ'};
const GOJU=['あいうえお','かきくけこ','がぎぐげご','さしすせそ','ざじずぜぞ','たちつてと','だぢづでど','なにぬねの','はひふへほ','ばびぶべぼ','ぱぴぷぺぽ','まみむめも','や・ゆ・よ','らりるれろ'];
const UNDAKU=Object.fromEntries(Object.entries(DAKU).map(([a,b])=>[b,a]));
const LOOK={'毎':'海母','朝':'期','山':'出','右':'石左','先':'生光','週':'過','白':'百自日','午':'牛年','後':'役','北':'化比','雨':'両','父':'交','来':'米未','年':'午','下':'不上','水':'氷木','電':'雷','話':'語読','安':'女案','日':'目白','外':'夕','名':'各','前':'茄','車':'東','六':'穴','千':'干十','円':'丹','東':'車束','新':'親','会':'合今','社':'祉','高':'京','開':'閉間','母':'毎','大':'太犬','学':'字','中':'申','休':'体','川':'州','花':'化','九':'丸力','時':'持','天':'夫','気':'汽','飲':'飯','書':'昼','校':'交','魚':'角','長':'張','読':'続','百':'白','左':'右在','今':'会','月':'目','少':'小','入':'人八','空':'究','古':'右','四':'西','半':'羊','金':'全','南':'内','聞':'間問','小':'少','二':'三','人':'入','何':'可','駅':'験','銀':'鉄','国':'固','分':'今'};
const KSIM={'シ':'ツ','ツ':'シ','ソ':'ン','ン':'ソ','ク':'ワ','ワ':'ク','ヌ':'ス','ス':'ヌ','ル':'レ','レ':'ル','チ':'テ','テ':'チ','メ':'ナ','ナ':'メ','ホ':'ネ','コ':'ユ'};
const uniq3 = (ans, cands, fill) => {
  const out=[], seen=new Set([ans]);
  for(const c of shuffle(cands)) if(c && !seen.has(c)){ seen.add(c); out.push(c); if(out.length===3) return out; }
  for(const c of shuffle(fill)) if(c && !seen.has(c)){ seen.add(c); out.push(c); if(out.length===3) break; }
  return out;
};
function kanaVariants(r){
  const ch=[...r], out=new Set(), put=(i,del,ins)=>out.add(ch.slice(0,i).join('')+ins+ch.slice(i+del).join(''));
  ch.forEach((c,i)=>{
    if(DAKU[c]) put(i,1,DAKU[c]);
    if(UNDAKU[c]) put(i,1,UNDAKU[c]);
    if(c==='っ') put(i,1,'');
    if(c==='う' && i>0 && /[おこそとのほもよろごぞどぼぽょゅうくすつぬふむゆるぐずづぶぷ]/.test(ch[i-1])) put(i,1,'');
    if(c==='い' && i>0 && /[えけせてねへめれげぜでべ]/.test(ch[i-1])) put(i,1,'');
    if(c==='ょ') put(i,1,'よ'); if(c==='ゅ') put(i,1,'ゆ'); if(c==='ゃ') put(i,1,'や');
    if(/[おこそとのほもよろごぞどぼょ]/.test(c) && ch[i+1]!=='う') put(i+1,0,'う');
    if(i>0 && /[かきくけこさしすせそたちつてとぱぴぷぺぽ]/.test(c) && !/[っんー]/.test(ch[i-1])) put(i,0,'っ');
  });
  if(out.size<6) ch.forEach((c,i)=>{ const row=GOJU.find(x=>x.includes(c)); if(row) for(const y of row) if(y!==c && y!=='・' && Math.random()<.5) put(i,1,y); });
  out.delete(r); return [...out];
}
function kanjiVariants(k){
  const ch=[...k], out=new Set();
  ch.forEach((c,i)=>{ for(const x of (LOOK[c]||'')) out.add(ch.slice(0,i).join('')+x+ch.slice(i+1).join('')); });
  out.delete(k); return [...out];
}
function kataVariants(k){
  const ch=[...k], out=new Set(), put=(i,del,ins)=>out.add(ch.slice(0,i).join('')+ins+ch.slice(i+del).join(''));
  ch.forEach((c,i)=>{
    if(KSIM[c]) put(i,1,KSIM[c]);
    const h=toHira(c); if(DAKU[h]) put(i,1,toKata(DAKU[h])); if(UNDAKU[h]) put(i,1,toKata(UNDAKU[h]));
    if(c==='ー') put(i,1,''); if(c==='ッ') put(i,1,'');
    if(i>0 && i<ch.length && /[ア-ン]/.test(c) && ch[i-1]!=='ー' && ch[i-1]!=='ッ' && Math.random()<.5) put(i,0,'ー');
  });
  out.delete(k); return [...out];
}
const uline = s => esc(s).replace(/【(.+?)】/g,'<u>$1</u>');
const hideU = (s,rep) => esc(s).replace(/【(.+?)】/, `<u>${esc(rep)}</u>`);


const fmtTime = ms => { const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };

function playAudio(lines){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const v=speechSynthesis.getVoices().filter(v=>/ja/i.test(v.lang));
    for(const [s,t] of lines){
      const u=new SpeechSynthesisUtterance(t); u.lang='ja-JP'; u.rate=.9;
      u.pitch = s==='m'?0.75 : s==='f'?1.3 : s==='g'?1.6 : 1;
      if(v.length) u.voice = v[s==='m'&&v.length>1?1:0];
      speechSynthesis.speak(u);
    }
  }catch(e){}
}

function exConfirm(kind){
  const box=app.querySelector('#exconfirm'), n=EX.items.length, done=EX.answers.filter(a=>a!=null).length;
  box.hidden=false;
  box.innerHTML = kind==='quit'
    ? `<b>Keluar dari simulasi?</b><span>Jawabanmu tidak akan disimpan.</span><div class="row"><button class="btn ghost sm" id="cno">Lanjut mengerjakan</button><button class="btn sm" id="cyes">Keluar</button></div>`
    : `<b>Selesaikan simulasi?</b><span>${done<n?`Masih ada ${n-done} soal yang belum dijawab (dihitung salah).`:'Semua soal sudah dijawab.'}</span>
       ${done<n?`<div class="exgrid">${EX.items.map((_,i)=>`<button class="${EX.answers[i]==null?'':'ok'}" data-go="${i}">${i+1}</button>`).join('')}</div>`:''}
       <div class="row"><button class="btn ghost sm" id="cno">Periksa lagi</button><button class="btn sm" id="cyes">Selesai & lihat nilai</button></div>`;
  box.querySelector('#cno').onclick=()=>{ box.hidden=true; };
  box.querySelector('#cyes').onclick=()=> kind==='quit' ? exHome() : exResult();
  box.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ EX.idx=+b.dataset.go; exQ(); });
  box.scrollIntoView({block:'center'});
